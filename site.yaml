# ============ Site configuration (single source of truth) ============
site:
  title: "FormulaFix"
  tagline: "Excel & Google Sheets formulas, explained with real examples"
  description: "Copy-ready Excel and Google Sheets formulas with worked examples, step-by-step explanations and fixes for common errors."
  language: "en"
  # GitHub Pages project site. CI overrides this with the URL reported by actions/configure-pages,
  # so the /sheets-formulas base path is handled automatically; this value is used for local builds.
  base_url: "https://mggg83336-bit.github.io/sheets-formulas"
  author: "FormulaFix"
  repo: "mggg83336-bit/sheets-formulas"

# Active niche (directory under niches/)
niche: "sheets-formulas"

# Daily routine: max new pages published from the keyword queue per run.
# Only keywords whose content passes the quality gate are published; the rest are skipped.
generate_per_run: 6

# Content generator: template (default, free). Structured niches render from niches/<niche>/pages/*.yaml.
provider: "template"

# Ad slots: paste ad network code here (empty = not shown)
ads:
  head: ""
  in_article: ""
  sidebar: ""

# Products shown in the CTA box on every formula page.
# A product URL that still contains REPLACE_ME is shown as "Coming soon" without a link.
products:
  - name: "Formula Template Pack"
    description: "15 ready-to-use Excel & Google Sheets templates: lookups, SUMIFS reports, date calculators, loan & CAGR models and more. Sample data and plain-English notes on every sheet."
    url: "https://maggot5.gumroad.com/l/formula-template-pack"
    button_text: "Get the template pack"
    price: "$12"
    bullets:
      - "15 working templates, one per sheet"
      - "Works in Excel 365/2021 and Google Sheets"
      - "Every formula explained next to the data"
affiliate_links: []

analytics:
  head: ""

health:
  check_external_links: false
  live_url_retries: 3
  build_retries: 2
