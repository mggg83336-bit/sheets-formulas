# Financial & percentages
- id: percentage-change
  category: financial
  launch: true
  slugs: {excel: percentage-change-excel, sheets: percentage-change-google-sheets}
  title: How to Calculate Percentage Change
  summary: >-
    Percentage change is (new - old) / old. This guide shows the formula, how to format the
    result as a percentage, how to handle a starting value of zero, and the common mix-up
    between percentage change and percentage points.
  problem: >-
    You have last year's and this year's sales per product and want the growth or decline in
    percent.
  excel:
    formula: '=(C2-B2)/B2'
    explain: >-
      Subtract the old value from the new one and divide by the old value. Format the cell as a
      percentage (Ctrl+Shift+%).
    notes: >-
      The parentheses matter: =C2-B2/B2 divides first and gives a wrong answer. The equivalent
      form `=C2/B2-1` is shorter. When the old value is 0 the change is mathematically undefined,
      so handle it explicitly instead of letting #DIV/0! appear in a report. For a percentage
      that should always be shown with a sign, use a custom format such as +0.0%;-0.0%;0.0%.
    alternatives:
      - label: Shorter equivalent
        formula: '=C2/B2-1'
      - label: Handle a zero starting value
        formula: '=IF(B2=0, "n/a", (C2-B2)/B2)'
    diff: >-
      Excel uses the identical formula; Ctrl+Shift+% applies the percentage format.
  sheets:
    formula: '=(C2-B2)/B2'
    explain: >-
      Same formula in Google Sheets; format with Format > Number > Percent.
    notes: >-
      Google Sheets has a dedicated function, `=TO_PERCENT((C2-B2)/B2)`, that applies percent
      formatting as part of the formula, which is useful when the formula output is copied
      elsewhere. Sheets also includes the operator function MINUS and DIVIDE if you prefer
      function syntax: `=DIVIDE(MINUS(C2, B2), B2)`. Neither changes the result; they only change
      formatting or readability.
    alternatives:
      - label: Formatted as a percentage by the formula
        formula: '=TO_PERCENT((C2-B2)/B2)'
    diff: >-
      The same formula works in Google Sheets (format with Format > Number > Percent).
  example:
    intro: Sales per product in two years. Results are formatted as percentages.
    grid:
      - [Product, '2025', '2026', Change, Safe change]
      - [Mice, 1200, 1500]
      - [Hubs, 800, 680]
      - [Stands, 0, 150]
    checks:
      - cell: D2
        label: filled down
        excel: '=(C2-B2)/B2'
        fill: [D2, D3, D4]
        results: ['25%', '-15%', '#DIV/0!']
      - cell: E2
        label: filled down
        excel: '=IF(B2=0, "n/a", (C2-B2)/B2)'
        fill: [E2, E3, E4]
        results: ['25%', '-15%', n/a]
  steps:
    - '`C2-B2` is the absolute change: 1500 - 1200 = 300.'
    - 'Dividing by the old value gives the relative change: 300 / 1200 = 0.25.'
    - Formatting 0.25 as a percentage shows 25%. Negative results are declines (Hubs fell 15%).
    - 'When the old value is 0 (Stands), there is no meaningful percentage, so the safe version shows "n/a".'
  errors:
    - error: '#DIV/0!'
      cause: The old value is 0 or empty.
      fix: Test it with IF(B2=0, ..., ...).
    - error: Result like 2500%
      cause: The result was multiplied by 100 and then formatted as a percentage.
      fix: Do not multiply by 100 when using percentage formatting.
    - error: Wrong result
      cause: Missing parentheses, e.g. =C2-B2/B2.
      fix: Write =(C2-B2)/B2.
  faq:
    - q: What is the difference between percentage change and percentage points?
      a: If a rate goes from 10% to 12%, it rose 2 percentage points, but the percentage change is (12-10)/10 = 20%.
    - q: How do I calculate a percentage of a total instead?
      a: Divide the part by the total, e.g. =B2/SUM($B$2:$B$10), and lock the total with $.
    - q: How do I apply a percentage increase to a number?
      a: 'Multiply by 1 plus the percentage: =B2*(1+10%) increases B2 by 10%, and =B2*(1-10%) decreases it by 10%. Note that a 10% increase followed by a 10% decrease does not return to the original value.'
    - q: How do I calculate the change between two percentages?
      a: Subtract them for the change in percentage points (=C2-B2 shows 12% - 10% = 2%), or use the same (new-old)/old formula for the relative change (20%). Say which one you mean in reports, because both are often called "percent change".
  related: [cagr, compound-interest, div0-error, weighted-average]

- id: compound-interest
  category: financial
  launch: true
  slugs: {excel: compound-interest-excel, sheets: compound-interest-google-sheets}
  title: Compound Interest Formula
  summary: >-
    Calculate how an investment grows with compound interest, using the math formula
    P*(1+r/n)^(n*t) or the built-in FV function. Includes monthly compounding, the sign
    convention that confuses FV users, and regular monthly contributions.
  problem: >-
    You invest 10,000 at 5% per year, compounded monthly, for 10 years, and want the final balance
    and the interest earned.
  excel:
    formula: '=B2*(1+B3/B4)^(B4*B5)'
    explain: >-
      Principal times (1 + rate per period) raised to the number of periods. B3/B4 is the
      monthly rate and B4*B5 the number of months.
    notes: >-
      FV gives the same result and also handles regular deposits. Its sign convention follows cash
      flow: money you pay out (the initial deposit) is negative and money you receive is positive,
      which is why the formula uses -B2. To add a monthly contribution of 200, put -200 in the
      third argument: `=FV(B3/B4, B4*B5, -200, -B2)`. Use the rate and the number of periods in
      the same unit: monthly rate with months, annual rate with years.
    alternatives:
      - label: FV function
        formula: '=FV(B3/B4, B4*B5, 0, -B2)'
      - label: With a monthly contribution of 200
        formula: '=FV(B3/B4, B4*B5, -200, -B2)'
    diff: >-
      Excel uses the same formula and the same FV function with the same sign convention.
  sheets:
    formula: '=B2*(1+B3/B4)^(B4*B5)'
    explain: >-
      Same formula in Google Sheets.
    diff: >-
      The same formula and FV function work in Google Sheets.
  example:
    intro: Inputs in B2:B5, results in B6:B8.
    grid:
      - [Input, Value]
      - [Principal, 10000]
      - [Annual rate, '5%']
      - [Compounds per year, 12]
      - [Years, 10]
      - [Future value (formula)]
      - [Future value (FV)]
      - [Interest earned]
    checks:
      - cell: B6
        excel: '=B2*(1+B3/B4)^(B4*B5)'
        result: '16,470.09'
        expect: 16470.0949769
      - cell: B7
        excel: '=FV(B3/B4, B4*B5, 0, -B2)'
        result: '16,470.09'
        expect: 16470.0949769
      - cell: B8
        excel: '=B6-B2'
        result: '6,470.09'
        expect: 6470.0949769
  steps:
    - '`B3/B4` converts the annual rate into a rate per period: 5% / 12 = 0.4167% per month.'
    - '`B4*B5` is the number of compounding periods: 12 x 10 = 120 months.'
    - '`(1+B3/B4)^(B4*B5)` is the growth factor, about 1.647.'
    - Multiplying by the principal gives the balance, 16,470.09. Subtracting the principal gives the interest earned.
    - Increase the compounding frequency (e.g. 365) to see that it matters far less than the rate and the number of years.
  errors:
    - error: Negative result from FV
      cause: The present value was entered as a positive number.
      fix: Enter the deposit as negative (-B2), or put a minus in front of FV.
    - error: Result far too large
      cause: The rate was entered as 5 instead of 5% (0.05).
      fix: Enter the rate as a percentage or decimal.
    - error: Mixed units
      cause: Annual rate used with months (or monthly rate with years).
      fix: Divide the rate and multiply the periods by the same number of periods per year.
  faq:
    - q: What is the formula for continuous compounding?
      a: =B2*EXP(B3*B5), i.e. principal times e raised to rate times years.
    - q: How do I show the balance for every year?
      a: Put years 1 to 10 in a column and use =$B$2*(1+$B$3/$B$4)^($B$4*A12), where A12 is the year.
  related: [pmt, cagr, percentage-change]

- id: pmt
  category: financial
  launch: true
  slugs: {excel: pmt-excel, sheets: pmt-google-sheets}
  title: Loan Payment Formula with PMT
  summary: >-
    PMT calculates the fixed periodic payment for a loan or mortgage from the interest rate,
    number of payments and loan amount. Worked example for a 30-year mortgage, plus total
    interest and the sign convention.
  problem: >-
    You want the monthly payment for a 250,000 loan at 6.5% annual interest over 30 years, and the
    total interest paid over the life of the loan.
  excel:
    formula: '=PMT(B3/12, B4*12, -B2)'
    explain: >-
      Syntax: `PMT(rate, nper, pv, [fv], [type])`. Monthly rate = annual rate / 12, number of
      payments = years x 12, pv = loan amount (negative so the payment shows as positive).
    notes: >-
      PMT returns a negative number when the loan amount is positive, because the payment is money
      going out; entering the amount as -B2 (or writing =-PMT(...)) gives a positive payment. The
      result covers principal and interest only, not taxes, insurance or fees. Use IPMT and PPMT
      to split a specific payment into interest and principal, and type = 1 if payments are made
      at the start of each period.
    alternatives:
      - label: Interest part of the first payment
        formula: '=IPMT(B3/12, 1, B4*12, -B2)'
    diff: >-
      Excel uses the same PMT, IPMT and PPMT functions with the same sign convention.
  sheets:
    formula: '=PMT(B3/12, B4*12, -B2)'
    explain: >-
      Same function in Google Sheets.
    diff: >-
      The same PMT, IPMT and PPMT functions work in Google Sheets.
  example:
    intro: A 30-year fixed-rate loan.
    grid:
      - [Input, Value]
      - [Loan amount, 250000]
      - [Annual rate, '6.5%']
      - [Years, 30]
      - [Monthly payment]
      - [Total interest]
      - [Interest in month 1]
    checks:
      - cell: B5
        excel: '=PMT(B3/12, B4*12, -B2)'
        result: '1,580.17'
        expect: 1580.1700587
      - cell: B6
        excel: '=B5*B4*12-B2'
        result: '318,861.22'
        expect: 318861.2211437
      - cell: B7
        excel: '=IPMT(B3/12, 1, B4*12, -B2)'
        result: '1,354.17'
        expect: 1354.1666667
  steps:
    - '`B3/12` is the monthly interest rate (0.5417%).'
    - '`B4*12` is the number of monthly payments, 360.'
    - '`-B2` is the loan amount, negative because it is money you receive; the payment then comes out positive.'
    - 'Total interest = payment x number of payments - loan amount: 1,580.17 x 360 - 250,000 = 318,861.22.'
    - 'In month 1 almost all of the payment is interest: 250,000 x 0.5417% = 1,354.17.'
  errors:
    - error: Payment is negative
      cause: The loan amount was entered as a positive pv.
      fix: Use -B2 or put a minus sign in front of PMT.
    - error: Payment is far too high
      cause: The annual rate was used without dividing by 12, or years were used instead of months.
      fix: Use rate/12 and years*12 for monthly payments.
    - error: '#NUM!'
      cause: The number of periods is 0 or the inputs are inconsistent.
      fix: Check that nper is positive and the rate is a reasonable decimal.
  faq:
    - q: Does PMT include property tax and insurance?
      a: No. PMT covers principal and interest only. Add escrow items separately.
    - q: How do I calculate how much I can borrow for a given payment?
      a: Use PV, e.g. =PV(B3/12, B4*12, -1500) returns the loan amount a 1,500 monthly payment supports.
    - q: How do I build an amortization schedule?
      a: List payment numbers 1 to 360 in a column, then use =IPMT($B$3/12, A10, $B$4*12, -$B$2) for the interest part and =PPMT($B$3/12, A10, $B$4*12, -$B$2) for the principal part of each payment. The two always add up to the PMT result.
  related: [compound-interest, cagr, percentage-change]

- id: cagr
  category: financial
  launch: true
  slugs: {excel: cagr-excel, sheets: cagr-google-sheets}
  title: How to Calculate CAGR
  summary: >-
    The compound annual growth rate (CAGR) is the constant yearly rate that takes a starting
    value to an ending value over a number of years. Use (end/start)^(1/years)-1 or the RRI
    function. Worked example included.
  problem: >-
    Revenue grew from 50,000 in 2020 to 84,000 in 2025. You want a single annual growth rate to
    compare with other businesses.
  excel:
    formula: '=(B3/B2)^(1/B4)-1'
    explain: >-
      Ending value divided by starting value, raised to the power of 1/years, minus 1. Format the
      result as a percentage.
    notes: >-
      RRI(nper, pv, fv) returns the same rate and is available from Excel 2013. The number of
      years is the number of periods between the two values, not the number of data points: from
      2020 to 2025 is 5 years even though there are six yearly figures. CAGR cannot be calculated
      when the starting value is zero or when the two values have different signs.
    alternatives:
      - label: RRI function
        formula: '=RRI(B4, B2, B3)'
    diff: >-
      Excel uses the same formula and the same RRI function (Excel 2013 and later).
  sheets:
    formula: '=(B3/B2)^(1/B4)-1'
    explain: >-
      Same formula in Google Sheets.
    diff: >-
      The same formula and RRI function work in Google Sheets.
  example:
    intro: Growth between 2020 and 2025.
    grid:
      - [Input, Value]
      - [Start value (2020), 50000]
      - [End value (2025), 84000]
      - [Years, 5]
      - [CAGR (formula)]
      - [CAGR (RRI)]
    checks:
      - cell: B5
        excel: '=(B3/B2)^(1/B4)-1'
        result: '10.93%'
        expect: 0.1093328057
      - cell: B6
        excel: '=RRI(B4, B2, B3)'
        result: '10.93%'
        expect: 0.1093328057
  steps:
    - '`B3/B2` is the total growth factor: 84,000 / 50,000 = 1.68.'
    - '`^(1/B4)` takes the 5th root, the factor that applied five times gives 1.68: about 1.1093.'
    - '`-1` turns the factor into a rate: 10.93% per year.'
    - 'Check: 50,000 x 1.1093^5 is approximately 84,000.'
  errors:
    - error: '#NUM!'
      cause: The start value is negative and the end value positive (or vice versa).
      fix: CAGR is not defined in that case; report the absolute change instead.
    - error: '#DIV/0!'
      cause: The start value is 0.
      fix: Use the first non-zero year as the start.
    - error: Rate too low
      cause: The number of data points (6) was used instead of the number of years between them (5).
      fix: Use end year - start year.
  faq:
    - q: How is CAGR different from the average growth rate?
      a: The simple average of yearly growth rates ignores compounding and overstates growth when rates vary. CAGR gives the single rate that reproduces the actual start and end values.
    - q: Can I calculate CAGR for months?
      a: Yes. Use the number of months as the period, then annualize with =(1+monthly_rate)^12-1.
    - q: How do I project a future value from a CAGR?
      a: 'Multiply the latest value by (1 + CAGR) raised to the number of years ahead, e.g. =B3*(1+B5)^3 for three years after 2025. Treat it as a trend line, not a forecast: CAGR smooths out every up and down year between the start and end.'
    - q: Should I use CAGR or XIRR for investments with deposits?
      a: CAGR only looks at the first and last value, so it ignores money added or withdrawn in between. For a portfolio with contributions, use XIRR with the dated cash flows instead; it works in both Excel and Google Sheets.
  related: [compound-interest, percentage-change, pmt]

- id: weighted-average
  category: financial
  launch: true
  slugs: {excel: weighted-average-excel, sheets: weighted-average-google-sheets}
  title: How to Calculate a Weighted Average
  summary: >-
    A weighted average gives some values more influence than others, like exams that count more
    than homework or prices weighted by quantity. Use SUMPRODUCT divided by SUM; Google Sheets
    also has AVERAGE.WEIGHTED.
  problem: >-
    A course grade is made of homework (20%), midterm (30%), project (20%) and final (30%). A
    plain average of the four scores would treat them all as equally important.
  excel:
    formula: '=SUMPRODUCT(B2:B5, C2:C5)/SUM(C2:C5)'
    explain: >-
      SUMPRODUCT multiplies each score by its weight and adds the products; dividing by the sum of
      weights gives the weighted average.
    notes: >-
      Dividing by SUM(C2:C5) means the weights do not have to add up to 100%: you can use 2, 3, 2,
      3 or quantities instead of percentages. Excel has no dedicated weighted-average function, so
      SUMPRODUCT/SUM is the standard. For a weighted average with a condition, multiply in the
      condition: `=SUMPRODUCT((A2:A5="Final")*B2:B5*C2:C5)/SUMIFS(C2:C5, A2:A5, "Final")`.
    alternatives:
      - label: Plain average for comparison
        formula: '=AVERAGE(B2:B5)'
    diff: >-
      Excel has no AVERAGE.WEIGHTED function, so SUMPRODUCT divided by SUM is the standard there.
  sheets:
    formula: '=AVERAGE.WEIGHTED(B2:B5, C2:C5)'
    explain: >-
      Syntax: `AVERAGE.WEIGHTED(values, weights, [additional values, additional weights])`.
    notes: >-
      Google Sheets has a built-in AVERAGE.WEIGHTED function, which is easier to read than
      SUMPRODUCT and divides by the sum of weights automatically. It requires the values and
      weights ranges to be the same size and the weights to be non-negative. The SUMPRODUCT/SUM
      formula also works in Sheets and is the better choice if the file will be opened in Excel,
      where AVERAGE.WEIGHTED does not exist.
    alternatives:
      - label: Excel-compatible version
        formula: '=SUMPRODUCT(B2:B5, C2:C5)/SUM(C2:C5)'
    diff: >-
      Google Sheets also has a built-in AVERAGE.WEIGHTED function that gives the same result.
  example:
    intro: Scores and their weights.
    grid:
      - [Assessment, Score, Weight, null, Result]
      - [Homework, 92, '20%']
      - [Midterm, 78, '30%']
      - [Project, 88, '20%']
      - [Final, 84, '30%']
    checks:
      - cell: E2
        label: weighted average
        excel: '=SUMPRODUCT(B2:B5, C2:C5)/SUM(C2:C5)'
        sheets: '=AVERAGE.WEIGHTED(B2:B5, C2:C5)'
        result: 84.6
      - cell: E3
        label: plain average (ignores weights)
        excel: '=AVERAGE(B2:B5)'
        result: 85.5
  steps:
    - 'SUMPRODUCT multiplies row by row: 92 x 20% + 78 x 30% + 88 x 20% + 84 x 30% = 18.4 + 23.4 + 17.6 + 25.2 = 84.6.'
    - SUM(C2:C5) is 100%, so the division leaves 84.6.
    - The plain average is 85.5 because it lets the weak midterm count as much as the homework.
    - If the weights were 2, 3, 2, 3 instead of percentages, the division by their sum (10) would give the same 84.6.
  errors:
    - error: Result far too large
      cause: The formula was not divided by the sum of weights, and the weights do not add up to 1.
      fix: Always divide by SUM(weights).
    - error: '#VALUE!'
      cause: The two ranges have different sizes.
      fix: Use ranges covering the same rows.
    - error: '#NAME? in Excel'
      cause: AVERAGE.WEIGHTED is Google Sheets only.
      fix: Use SUMPRODUCT/SUM.
  faq:
    - q: Do the weights have to add up to 100%?
      a: No, as long as you divide by their sum. The result is the same.
    - q: How do I calculate a weighted average price?
      a: Use quantities as weights, e.g. =SUMPRODUCT(price, qty)/SUM(qty).
    - q: How do I handle a missing score?
      a: 'Leave the score cell empty and exclude its weight from the denominator: =SUMPRODUCT(B2:B5, C2:C5)/SUMIFS(C2:C5, B2:B5, "<>"). Otherwise the empty score counts as 0 and drags the average down.'
    - q: Can SUMPRODUCT weight by a condition?
      a: Yes. Multiply in a test, e.g. =SUMPRODUCT((A2:A5<>"Homework")*B2:B5*C2:C5)/SUMIFS(C2:C5, A2:A5, "<>Homework") averages everything except homework with the remaining weights.
  related: [percentage-change, sumifs, maxifs-minifs, cagr]

- id: round
  category: financial
  slugs: {excel: round-excel, sheets: round-google-sheets}
  title: How to Use ROUND, ROUNDUP, and ROUNDDOWN
  summary: >-
    ROUND sends a number to a chosen digit with half-away-from-zero rules, ROUNDUP always moves
    away from zero, and ROUNDDOWN always moves toward zero. Negative digit values round to tens,
    hundreds, and beyond — useful for currency, estimates, and clean reports.
  problem: >-
    A pricing sheet shows long decimals from tax and FX formulas. Stakeholders want two decimal
    places for money, whole numbers for headcount, and rounded hundreds for rough forecasts, but
    plain cell formatting only changes the display while downstream formulas still see the full
    precision.
  excel:
    formula: '=ROUND(A2, 2)'
    explain: >-
      Syntax: `ROUND(number, num_digits)`. With 2, values round to hundredths (currency style).
      Positive num_digits keep that many digits after the decimal; 0 rounds to an integer;
      negative values round to the left of the decimal (tens, hundreds).
    notes: >-
      Excel's ROUND uses half away from zero: 2.5 → 3 and -2.5 → -3 when num_digits is 0. That
      differs from banker's rounding in some programming languages. ROUNDUP always moves away from
      zero (3.141 with 2 → 3.15; -1.567 with 2 → -1.57). ROUNDDOWN always moves toward zero
      (3.141 → 3.14; -1.567 → -1.56). Use ROUND for typical reporting, ROUNDUP when you must not
      understate a charge or a safety stock, and ROUNDDOWN when you must not overstate. Negative
      digits are handy for forecasts: `=ROUND(A2, -2)` turns 1234.567 into 1200. MROUND rounds to
      a chosen multiple (`=MROUND(17, 5)` → 15). Remember that number formats alone do not change
      the stored value — wrap the formula in ROUND when later cells should inherit the rounded
      figure. Pair with currency formats after rounding to two places.
    alternatives:
      - label: Always round away from zero
        formula: '=ROUNDUP(A2, 2)'
      - label: Always round toward zero
        formula: '=ROUNDDOWN(A2, 2)'
      - label: Round to nearest hundred
        formula: '=ROUND(A2, -2)'
      - label: Round to a multiple of 5
        formula: '=MROUND(A2, 5)'
    diff: >-
      Google Sheets supports the same ROUND, ROUNDUP, ROUNDDOWN, and MROUND functions. Use
      ARRAYFORMULA to round an entire column in one step.
  sheets:
    formula: '=ROUND(A2, 2)'
    explain: >-
      Same ROUND syntax in Google Sheets: choose the number of digits, including negative digits
      for tens and hundreds.
    notes: >-
      Whole-column rounding: `=ARRAYFORMULA(IF(A2:A="", "", ROUND(A2:A, 2)))`. Sheets follows the
      same half-away-from-zero rule for ROUND, and the same away-from-zero / toward-zero rules for
      ROUNDUP and ROUNDDOWN. MROUND is available for nearest-multiple rounding (price points,
      packing sizes). Locale settings change how decimals display, not how ROUND computes. When
      sharing files with Excel users, stick to ROUND/ROUNDUP/ROUNDDOWN/MROUND — they are portable.
      If you only need a prettier display and later formulas must keep full precision, use Format >
      Number instead of wrapping ROUND. For currency that must match bank statements, round to 2
      before summing so the total matches the visible line items.
    alternatives:
      - label: Whole column rounded to 2 places
        formula: '=ARRAYFORMULA(IF(A2:A="", "", ROUND(A2:A, 2)))'
      - label: ROUNDUP away from zero
        formula: '=ROUNDUP(A2, 2)'
      - label: ROUNDDOWN toward zero
        formula: '=ROUNDDOWN(A2, 2)'
      - label: Nearest multiple of 5
        formula: '=MROUND(A2, 5)'
    diff: >-
      Excel uses the same functions; fill down or spill instead of ARRAYFORMULA.
  example:
    intro: >-
      Five numbers covering two-decimal currency rounding, integer rounding of 2.5, negative
      values, and rounding to hundreds. Extra columns compare ROUNDUP, ROUNDDOWN, and MROUND.
    grid:
      - [Value, Digits, ROUND, ROUNDUP, ROUNDDOWN, MROUND to 5]
      - [2.345, 2]
      - [3.14159, 2]
      - [-1.567, 2]
      - [2.5, 0]
      - [1234.567, -2]
      - [17, 0]
    checks:
      - cell: C2
        label: ROUND with per-row digits
        excel: '=ROUND(A2, B2)'
        fill: [C2, C3, C4, C5, C6]
        results: [2.35, 3.14, -1.57, 3, 1200]
      - cell: D2
        label: ROUNDUP with per-row digits
        excel: '=ROUNDUP(A2, B2)'
        fill: [D2, D3, D4, D5, D6]
        results: [2.35, 3.15, -1.57, 3, 1300]
      - cell: E2
        label: ROUNDDOWN with per-row digits
        excel: '=ROUNDDOWN(A2, B2)'
        fill: [E2, E3, E4, E5, E6]
        results: [2.34, 3.14, -1.56, 2, 1200]
      - cell: F7
        label: MROUND to nearest 5
        excel: '=MROUND(A7, 5)'
        result: 15
  steps:
    - List the raw values in column A and the num_digits argument in column B (2, 0, or -2).
    - 'Type `=ROUND(A2, B2)` and fill down for standard half-away-from-zero rounding.'
    - 'Add ROUNDUP and ROUNDDOWN columns when you need always-up or always-down behaviour.'
    - 'Use a negative digit such as -2 to round to hundreds for rough forecasts.'
    - 'Reach for MROUND when the target is a multiple (5, 0.05, 100) rather than a decimal place.'
  errors:
    - error: Display shows 2.35 but another formula still uses 2.345
      cause: Only the cell format was changed; the stored value stayed full precision.
      fix: Wrap the source formula in ROUND (or ROUNDUP/ROUNDDOWN) so dependents see the rounded value.
    - error: Negative number rounded the "wrong" way
      cause: ROUNDUP moves away from zero and ROUNDDOWN toward zero, which feels opposite to "up on the number line" for negatives.
      fix: Check the sign rule, or use ABS tricks only when you truly want number-line direction.
    - error: "#NUM! or unexpected MROUND result with uneven multiples"
      cause: MROUND expects the multiple and the value to allow a valid nearest multiple (and non-zero multiple).
      fix: Use a non-zero multiple; for banker's or custom rules, build an explicit formula instead.
    - error: Totals off by a cent after rounding each line
      cause: Summing pre-rounded lines differs from rounding the unrounded sum once.
      fix: Decide a policy (round lines then sum, or sum then round) and apply it consistently.
  faq:
    - q: What is the difference between ROUND, ROUNDUP, and ROUNDDOWN?
      a: ROUND uses half away from zero. ROUNDUP always moves away from zero. ROUNDDOWN always moves toward zero. Pick based on whether understating or overstating is worse for the report.
    - q: What do negative num_digits mean?
      a: They round to the left of the decimal point. -1 rounds to tens, -2 to hundreds, -3 to thousands.
    - q: How do I round to the nearest nickel or 5 minutes?
      a: Use MROUND with the step size, for example =MROUND(A2, 0.05) for nickels or =MROUND(A2, 5) for multiples of 5.
  related: [percentage-change, weighted-average, pmt, cagr]

- id: percentage
  category: financial
  slugs: {excel: percentage-excel, sheets: percentage-google-sheets}
  title: How to Calculate a Percentage
  summary: >-
    A percentage is part divided by total. Format the result as Percent, lock the total with $,
    and use (1+rate) or (1-rate) when you need to increase or decrease a number by a percent.
    This page covers share-of-total, "what percent is X of Y", and percent markups — not period
    over period change (see percentage-change).
  problem: >-
    A budget sheet needs each category as a percent of the grand total, a score of 45 out of 180
    as a percent, and a price increased by 10%. People multiply by 100 by hand, forget absolute
    references on the total, or confuse this with percentage change between two periods.
  excel:
    formula: '=B2/SUM($B$2:$B$5)'
    explain: >-
      Divide the part (B2) by the locked total. Format the cell as a percentage (Ctrl+Shift+%).
      The $ anchors keep every row dividing by the same grand total when you fill down.
    notes: >-
      Do not multiply by 100 when the cell uses Percentage format — Excel already shows 0.25 as
      25%. For "what percent is X of Y" use `=A2/B2` with Y nonzero. To increase a value by a
      percent, multiply by one plus the rate: `=A2*(1+10%)` or `=A2*(1+C2)` when C2 holds 10%.
      To decrease, use `=A2*(1-10%)`. Percentage formatting is display only; the stored value
      remains a fraction. When the total can be blank or zero, wrap with IF to avoid #DIV/0!
      (see the div0-error guide). For growth or decline between two periods, use the
      percentage-change page instead — that is (new-old)/old, not part/total.
    alternatives:
      - label: What percent is X of Y
        formula: '=A2/B2'
      - label: Increase by a percent
        formula: '=A2*(1+C2)'
      - label: Decrease by a percent
        formula: '=A2*(1-C2)'
      - label: Safe share of total
        formula: '=IF(SUM($B$2:$B$5)=0, 0, B2/SUM($B$2:$B$5))'
    diff: >-
      Google Sheets uses the same part/total arithmetic. Format > Number > Percent, and
      TO_PERCENT can apply percent formatting inside the formula.
  sheets:
    formula: '=B2/SUM($B$2:$B$5)'
    explain: >-
      Same share-of-total formula in Google Sheets. Format with Format > Number > Percent, and
      keep $ on the total range when filling down.
    notes: >-
      Whole-column shares: `=ARRAYFORMULA(IF(B2:B5="", "", B2:B5/SUM($B$2:$B$5)))`. Sheets also
      offers `=TO_PERCENT(B2/SUM($B$2:$B$5))` to force percent formatting in the formula output,
      which helps when values are copied into documents. Increase and decrease patterns are
      identical: `=A2*(1+C2)` and `=A2*(1-C2)`. Locale changes the decimal and percent symbols on
      screen, not the underlying fraction. Prefer IF or IFERROR around divisions when totals can
      be empty. Keep this page for part/total and markups; use the percentage-change guide for
      period-over-period growth so reports do not mix the two meanings of "percent".
    alternatives:
      - label: Whole column share of total
        formula: '=ARRAYFORMULA(IF(B2:B5="", "", B2:B5/SUM($B$2:$B$5)))'
      - label: TO_PERCENT wrapper
        formula: '=TO_PERCENT(B2/SUM($B$2:$B$5))'
      - label: What percent is X of Y
        formula: '=A2/B2'
      - label: Increase by a percent
        formula: '=A2*(1+C2)'
    diff: >-
      Excel uses the same formulas; fill down instead of ARRAYFORMULA, and use Ctrl+Shift+% or a
      Percent format instead of TO_PERCENT.
  example:
    intro: >-
      Four budget lines as a share of total, a score as a percent of max points, and a price
      increased then decreased by a stored rate.
    grid:
      - [Category, Amount, Share of total, null, Score, Max, Score %, null, Price, Rate, After increase, After decrease]
      - [Rent, 1200]
      - [Payroll, 2500]
      - [Software, 400]
      - [Travel, 400]
      - [null, null, null, null, 45, 180]
      - [null, null, null, null, null, null, null, null, 200, '10%']
    checks:
      - cell: C2
        label: share of total filled down
        excel: '=B2/SUM($B$2:$B$5)'
        fill: [C2, C3, C4, C5]
        results: ['26.6667%', '55.5556%', '8.8889%', '8.8889%']
      - cell: G6
        label: score as percent of max
        excel: '=E6/F6'
        result: '25%'
      - cell: K7
        label: price increased by rate
        excel: '=I7*(1+J7)'
        result: 220
      - cell: L7
        label: price decreased by rate
        excel: '=I7*(1-J7)'
        result: 180
  steps:
    - Enter category amounts in column B and total them with SUM.
    - 'Type `=B2/SUM($B$2:$B$5)`, lock the total with $, format as Percent, and fill down.'
    - 'For a score or quota, divide part by max with `=E6/F6` and format as Percent.'
    - 'To apply a markup or discount, multiply by `(1+rate)` or `(1-rate)`.'
    - Use IF around divisions when the total can be zero, and use percentage-change for period growth.
  errors:
    - error: Shares show 2667% or similar
      cause: The formula multiplied by 100 and the cell was also formatted as Percent.
      fix: Divide only; let Percentage format scale the display.
    - error: Every row divides by a different total after fill-down
      cause: The SUM range was relative (B2:B5) without $ anchors.
      fix: Write SUM($B$2:$B$5) so each row uses the same grand total.
    - error: '#DIV/0!'
      cause: The total or denominator is 0 or blank.
      fix: Guard with IF(total=0, 0, part/total) or see the div0-error guide.
    - error: Mixed up with percentage change
      cause: Used (new-old)/old when the question was share of total, or the reverse.
      fix: Part/total for this page; (new-old)/old on the percentage-change page.
  faq:
    - q: How is this different from percentage change?
      a: Percentage (this page) is part divided by total, or a markup on a single value. Percentage change compares two periods with (new-old)/old.
    - q: Do I multiply by 100?
      a: Not when the cell uses Percentage format. Store 0.25 and let the format show 25%.
    - q: How do I show one decimal place in the percent?
      a: After applying Percent format, increase or decrease decimal places on the Home ribbon (Excel) or the toolbar (Sheets), for example 26.7%.
  related: [percentage-change, div0-error, weighted-average, cagr]

- id: average
  category: financial
  slugs: {excel: average-excel, sheets: average-google-sheets}
  title: How to Calculate an Average
  summary: >-
    AVERAGE returns the arithmetic mean of numbers and skips blank cells and text. Pair it with
    AVERAGEIF or AVERAGEIFS when you need a mean for one region, status, or threshold, and use
    IF to ignore zeros when a blank should stay blank instead of counting as zero.
  problem: >-
    A score sheet needs the class mean, the mean of scores above 80, and the East-region mean.
    People use SUM/COUNT by hand, forget that zeros pull the average down, or mix AVERAGE with
    a weighted average when some assessments count more than others.
  excel:
    formula: '=AVERAGE(B2:B8)'
    explain: >-
      Syntax: `AVERAGE(number1, [number2], …)`. Pass a range or individual numbers. Blank cells
      and text are ignored; logical values typed directly are counted, but logicals inside a
      cell range are ignored.
    notes: >-
      AVERAGE is the plain arithmetic mean. Empty cells do not shrink the denominator, but a
      typed 0 does — clear the cell if the student was absent rather than scoring zero. For a
      conditional mean use `=AVERAGEIF(A2:A8, "East", B2:B8)` or
      `=AVERAGEIF(B2:B8, ">80")` when the criteria sit on the same range as the values.
      AVERAGEIFS handles multiple conditions (`=AVERAGEIFS(B2:B8, A2:A8, "East", B2:B8, ">80")`).
      To ignore zeros without deleting them, use
      `=AVERAGEIF(B2:B8, "<>0")` or an array-style
      `=AVERAGE(IF(B2:B8<>0, B2:B8))` entered normally in Excel 365. Do not confuse this with a
      weighted average — when homework and exams have different weights, use SUMPRODUCT/SUM (see
      weighted-average). ROUND the result only when reporting requires a fixed number of decimals.
    alternatives:
      - label: Mean of values above 80
        formula: '=AVERAGEIF(B2:B8, ">80")'
      - label: Mean for one region
        formula: '=AVERAGEIF(A2:A8, "East", B2:B8)'
      - label: Ignore zeros
        formula: '=AVERAGEIF(B2:B8, "<>0")'
      - label: Mean of numbers only via SUBTOTAL on a filtered list
        formula: '=SUBTOTAL(1, B2:B8)'
    diff: >-
      Google Sheets supports the same AVERAGE, AVERAGEIF, and AVERAGEIFS functions. Use
      ARRAYFORMULA when you want a column of per-row rolling means.
  sheets:
    formula: '=AVERAGE(B2:B8)'
    explain: >-
      Same AVERAGE syntax in Google Sheets. Blank cells and text inside the range are skipped.
    notes: >-
      Whole-column mean that expands as rows are added: `=AVERAGE(B2:B)` — trailing blanks stay
      ignored. Conditional means use the same AVERAGEIF / AVERAGEIFS signatures as Excel.
      Wrap a growing column with
      `=ARRAYFORMULA(IF(B2:B="", "", AVERAGEIF(...)))` only when you need a per-row helper, not
      for a single class mean. Sheets treats typed TRUE/FALSE inside ranges like Excel (ignored
      in AVERAGE). Locale settings change decimal commas on screen, not the mean itself. Prefer
      AVERAGEIF `"<>0"` over deleting zeros when a zero means “not yet scored”. When the file
      must open in Excel, avoid Sheets-only helpers and stick to AVERAGE / AVERAGEIF /
      AVERAGEIFS. For weights that differ by assessment, switch to AVERAGE.WEIGHTED or
      SUMPRODUCT/SUM on the weighted-average page instead of forcing a plain AVERAGE.
    alternatives:
      - label: Growing column average
        formula: '=AVERAGE(B2:B)'
      - label: Mean of values above 80
        formula: '=AVERAGEIF(B2:B8, ">80")'
      - label: Mean for one region
        formula: '=AVERAGEIF(A2:A8, "East", B2:B8)'
      - label: Ignore zeros
        formula: '=AVERAGEIF(B2:B8, "<>0")'
    diff: >-
      Excel uses the same AVERAGE family; fill down or use Excel 365 dynamic arrays instead of
      open-ended B2:B ranges when you need per-row helpers.
  example:
    intro: >-
      Seven student scores with a region column. Checks cover the class mean, the mean above 80,
      the East-only mean, and how a typed zero changes the result versus a blank.
    grid:
      - [Region, Score, null, Metric, Value]
      - [East, 72]
      - [West, 88]
      - [East, 95]
      - [East, 88]
      - [West, 64]
      - [West, 91]
      - [East, 88]
      - [null, 0]
    checks:
      - cell: E2
        label: class average (B2:B8)
        excel: '=AVERAGE(B2:B8)'
        result: 83.7142857142857
      - cell: E3
        label: average of scores above 80
        excel: '=AVERAGEIF(B2:B8, ">80")'
        result: 90
      - cell: E4
        label: East region average
        excel: '=AVERAGEIF(A2:A8, "East", B2:B8)'
        result: 85.75
      - cell: E5
        label: average including the typed zero in B9
        excel: '=AVERAGE(B2:B9)'
        result: 73.25
  steps:
    - Enter the numbers to average in a single column (and optional criteria columns beside them).
    - 'Type `=AVERAGE(B2:B8)` for the plain mean; blanks and text are skipped automatically.'
    - 'Add `=AVERAGEIF(B2:B8, ">80")` or `=AVERAGEIF(A2:A8, "East", B2:B8)` for conditional means.'
    - Clear cells instead of typing 0 when a value is missing, or use AVERAGEIF `"<>0"` to skip zeros.
    - Use the weighted-average page when some inputs must count more than others.
  errors:
    - error: Average looks too low
      cause: Zeros for missing scores were typed into the range, so they count in the denominator.
      fix: Clear the cells, or use =AVERAGEIF(range, "<>0").
    - error: '#DIV/0!'
      cause: The range has no numeric values (all blank/text), or AVERAGEIF matched nothing.
      fix: Confirm the criteria and that at least one number is present.
    - error: Conditional average includes the wrong rows
      cause: Criteria range and average range are misaligned or different heights.
      fix: Use matching row spans in AVERAGEIF / AVERAGEIFS.
    - error: Result differs from a hand SUM/COUNT
      cause: COUNT counted text or blanks differently than AVERAGE's skip rules.
      fix: Prefer AVERAGE itself; or use COUNT on the same numeric range only.
  faq:
    - q: Does AVERAGE ignore blank cells?
      a: Yes. Blanks and text in the range are skipped. A typed 0 is a number and is included.
    - q: How do I average only values above a threshold?
      a: Use =AVERAGEIF(range, ">80") or AVERAGEIFS with extra conditions on other columns.
    - q: When should I use a weighted average instead?
      a: When inputs have different importance (exam weights, quantity-weighted price). See the weighted-average guide.
    - q: Can I average a filtered list only?
      a: Yes. Use =SUBTOTAL(1, B2:B8) (or 101 to ignore hidden rows) so filtered-out rows drop out of the mean.
  related: [weighted-average, averageif, median-mode, round, percentage]

- id: median-mode
  category: financial
  slugs: {excel: median-mode-excel, sheets: median-mode-google-sheets}
  title: How to Use MEDIAN and MODE
  summary: >-
    MEDIAN returns the middle value after sorting, so outliers hurt it less than AVERAGE. MODE
    (MODE.SNGL in modern Excel) returns the value that appears most often. Use both beside the
    mean when you describe a skewed score or price distribution.
  problem: >-
    A class has many mid-80s scores and one very low outlier. The mean drops, stakeholders ask
    for the “typical” score, and nobody remembers whether to reach for MEDIAN or MODE — or how
    ties work when several values share the highest frequency.
  excel:
    formula: '=MEDIAN(B2:B8)'
    explain: >-
      Syntax: `MEDIAN(number1, [number2], …)`. With an odd count it returns the middle value after
      sorting; with an even count it averages the two central values. `MODE(range)` or
      `MODE.SNGL(range)` returns the most frequent number.
    notes: >-
      MEDIAN ignores text and blanks the same way AVERAGE does. For an even-sized list such as
      four prices, MEDIAN averages the 2nd and 3rd sorted values. MODE and MODE.SNGL return the
      first most-frequent value when several numbers tie for top frequency; MODE.MULT spills every
      modal value in Excel 365. Prefer MEDIAN over AVERAGE when a single outlier would distort the
      story (salaries, home prices, latency). Prefer MODE when you care about the most common
      size, rating, or SKU, not the centre. Combine with AVERAGE on the same sheet so readers see
      mean, median, and mode together. ROUND the median only for display — keep full precision in
      helper cells that feed charts. LibreOffice and older workbooks recognise MODE; new Excel
      docs push MODE.SNGL with the same single-mode behaviour.
    alternatives:
      - label: Most frequent value (classic MODE)
        formula: '=MODE(B2:B8)'
      - label: Most frequent value (Excel 2010+)
        formula: '=MODE.SNGL(B2:B8)'
      - label: Mean for comparison
        formula: '=AVERAGE(B2:B8)'
      - label: Trim extremes then average
        formula: '=TRIMMEAN(B2:B8, 0.2)'
    diff: >-
      Google Sheets supports MEDIAN and MODE. It does not use MODE.SNGL / MODE.MULT names — MODE
      covers the single most-frequent value.
  sheets:
    formula: '=MEDIAN(B2:B8)'
    explain: >-
      Same MEDIAN behaviour in Google Sheets. Use MODE for the most common numeric value.
    notes: >-
      Open-ended ranges work: `=MEDIAN(B2:B)` and `=MODE(B2:B)` grow with new rows while blanks
      stay ignored. Sheets has no MODE.SNGL or MODE.MULT; stick to MODE for the primary modal
      value, or build a FREQUENCY / QUERY helper if you need every tied mode listed. ARRAYFORMULA
      is unnecessary for a single median or mode summary cell. When sharing with Excel users,
      MEDIAN and MODE are portable; avoid Sheets-only QUERY wrappers if the file must round-trip.
      Put AVERAGE, MEDIAN, and MODE in neighbouring cells so a skewed class distribution is
      obvious at a glance. Locale decimal separators affect display only. If MODE returns
      #N/A, every value appears once — there is no repeated number to report as a mode.
    alternatives:
      - label: Most frequent value
        formula: '=MODE(B2:B8)'
      - label: Growing column median
        formula: '=MEDIAN(B2:B)'
      - label: Mean for comparison
        formula: '=AVERAGE(B2:B8)'
      - label: Trim extremes then average
        formula: '=TRIMMEAN(B2:B8, 0.2)'
    diff: >-
      Excel also offers MODE.SNGL and spilling MODE.MULT; Sheets uses MODE for the single mode.
  example:
    intro: >-
      Seven scores with a repeated 88. MEDIAN and MODE both land on 88 while AVERAGE is pulled
      by the low 64. A second even-sized list shows MEDIAN averaging the two central values.
    grid:
      - [Student, Score, null, Stat, Result]
      - [Ava, 72]
      - [Ben, 88]
      - [Cara, 95]
      - [Drew, 88]
      - [Eve, 64]
      - [Finn, 91]
      - [Gia, 88]
      - [null, null, null, null, null]
      - [Hana, 70]
      - [Ian, 80]
      - [Jade, 90]
      - [Kai, 100]
    checks:
      - cell: E2
        label: median of class scores
        excel: '=MEDIAN(B2:B8)'
        result: 88
      - cell: E3
        label: mode of class scores
        excel: '=MODE(B2:B8)'
        result: 88
      - cell: E4
        label: average for comparison
        excel: '=AVERAGE(B2:B8)'
        result: 83.7142857142857
      - cell: E5
        label: median of even-sized list (four scores)
        excel: '=MEDIAN(B10:B13)'
        result: 85
  steps:
    - List the numeric sample in one column (scores, prices, ratings).
    - 'Type `=MEDIAN(B2:B8)` for the middle value after sorting.'
    - 'Type `=MODE(B2:B8)` (or MODE.SNGL in modern Excel) for the most frequent value.'
    - Place AVERAGE beside them so skew from outliers is visible.
    - If MODE returns #N/A, every number appears once — there is no mode to report.
  errors:
    - error: "#N/A from MODE"
      cause: No value repeats in the range.
      fix: Expected when all values are unique; widen the sample or report “no mode”.
    - error: Median looks like an average of two scores
      cause: The list has an even count, so MEDIAN averages the two central values.
      fix: That is correct behaviour; add or remove a point if you need a single observed value.
    - error: Mode picks the “wrong” tied value
      cause: Several numbers share the top frequency; MODE returns one of them (typically the first).
      fix: Use MODE.MULT in Excel 365 to list every modal value, or inspect with COUNTIF.
    - error: Text or errors in the range
      cause: Non-numeric cells mixed into the sample.
      fix: Keep the range numeric-only, or clean with VALUE / IFERROR first.
  faq:
    - q: When should I use MEDIAN instead of AVERAGE?
      a: When outliers would pull the mean (income, house prices, a single failed exam). The median stays on the middle of the sorted list.
    - q: What is the difference between MODE and MODE.SNGL?
      a: In current Excel they both return one most-frequent value. MODE.MULT returns every mode as a spill. Google Sheets only has MODE.
    - q: What does MEDIAN do with an even number of values?
      a: "It averages the two middle numbers after sorting. Example: MEDIAN of 1, 2, 3, 4 is 2.5."
    - q: Can MEDIAN or MODE ignore zeros?
      a: Not automatically. Filter zeros with AVERAGEIF-style helpers, or use IF inside an array-capable median formula in Excel 365 / Sheets.
  related: [average, weighted-average, rank, round, large-small]

- id: rank
  category: financial
  slugs: {excel: rank-excel, sheets: rank-google-sheets}
  title: How to Use the RANK Function
  summary: >-
    RANK returns a value’s position in a list. Order 0 (or omitted) ranks largest first; order 1
    ranks smallest first. Tied values receive the same rank, and the next rank skips ahead
    (competition ranking). Excel also offers RANK.EQ and RANK.AVG.
  problem: >-
    A leaderboard needs each score’s place among the class. People sort the sheet manually, break
    formulas when rows move, or expect dense ranks (1,2,3) when ties should share a place and skip
    the next number.
  excel:
    formula: '=RANK(B2, $B$2:$B$8, 0)'
    explain: >-
      Syntax: `RANK(number, ref, [order])`. `number` is the value to rank, `ref` is the full list
      (lock it with $ when filling down). Order 0 or omitted = descending (best/largest = 1);
      order 1 = ascending (smallest = 1).
    notes: >-
      RANK and RANK.EQ use competition ranking: if two scores tie for 2nd, both get 2 and the next
      score gets 4. RANK.AVG would assign 2.5 to those ties instead. Absolute-reference the list
      (`$B$2:$B$8`) so each row ranks against the same set when you fill down. RANK ignores text
      and blanks inside ref. For a filtered visible-only rank, helper columns or more advanced
      constructs are needed — plain RANK always sees the full ref. Pair RANK with COUNTIF when you
      want a dense rank (1,2,3 with no gaps):
      `=COUNTIF($B$2:$B$8, ">"&B2)+1` for descending dense ranks. Keep RANK for classic
      leaderboards; switch to LARGE/SMALL when you need the nth value itself rather than a place.
    alternatives:
      - label: Ascending rank (smallest = 1)
        formula: '=RANK(B2, $B$2:$B$8, 1)'
      - label: Excel RANK.EQ (same as RANK)
        formula: '=RANK.EQ(B2, $B$2:$B$8, 0)'
      - label: Dense descending rank via COUNTIF
        formula: '=COUNTIF($B$2:$B$8, ">"&B2)+1'
      - label: Value of the top score
        formula: '=LARGE($B$2:$B$8, 1)'
    diff: >-
      Google Sheets supports RANK with the same order argument. Prefer RANK over Excel-only
      RANK.EQ / RANK.AVG names when the file must stay portable.
  sheets:
    formula: '=RANK(B2, $B$2:$B$8, 0)'
    explain: >-
      Same RANK syntax in Google Sheets. Lock the ref with $ before filling the rank column down.
    notes: >-
      Competition ties work the same as Excel: shared place, skipped next rank. Sheets does not
      document RANK.EQ / RANK.AVG as separate functions — use RANK, or emulate RANK.AVG with
      `=AVERAGE(COUNTIF($B$2:$B$8, ">"&B2)+1, COUNTIF($B$2:$B$8, ">="&B2))` when you need the
      mid-tie average. Open-ended refs such as `$B$2:$B` work if you accept ranks shifting as new
      scores arrive. ARRAYFORMULA can spill an entire rank column:
      `=ARRAYFORMULA(IF(B2:B8="", "", RANK(B2:B8, $B$2:$B$8, 0)))`. When collaborating with Excel
      users, RANK with order 0/1 is the safest portable choice. Use COUNTIF dense-rank patterns
      when a dashboard must show 1,2,3 with no gaps after ties.
    alternatives:
      - label: Whole column ranks
        formula: '=ARRAYFORMULA(IF(B2:B8="", "", RANK(B2:B8, $B$2:$B$8, 0)))'
      - label: Ascending rank
        formula: '=RANK(B2, $B$2:$B$8, 1)'
      - label: Dense descending rank
        formula: '=COUNTIF($B$2:$B$8, ">"&B2)+1'
      - label: Average-style tie rank
        formula: '=AVERAGE(COUNTIF($B$2:$B$8, ">"&B2)+1, COUNTIF($B$2:$B$8, ">="&B2))'
    diff: >-
      Excel adds RANK.EQ and RANK.AVG aliases; fill down instead of ARRAYFORMULA for a rank column.
  example:
    intro: >-
      Seven scores with a three-way tie at 88. Descending RANK gives 1 for 95, 2 for 91, 3 for
      each 88, then 6 and 7. Ascending RANK gives 1 to the lowest score.
    grid:
      - [Student, Score, Rank desc, Rank asc]
      - [Ava, 72]
      - [Ben, 88]
      - [Cara, 95]
      - [Drew, 88]
      - [Eve, 64]
      - [Finn, 91]
      - [Gia, 88]
    checks:
      - cell: C2
        label: descending rank filled down
        excel: '=RANK(B2, $B$2:$B$8, 0)'
        fill: [C2, C3, C4, C5, C6, C7, C8]
        results: [6, 3, 1, 3, 7, 2, 3]
      - cell: D2
        label: ascending rank filled down
        excel: '=RANK(B2, $B$2:$B$8, 1)'
        fill: [D2, D3, D4, D5, D6, D7, D8]
        results: [2, 3, 7, 3, 1, 6, 3]
      - cell: C10
        label: rank of the top score against the list
        excel: '=RANK(95, B2:B8, 0)'
        result: 1
      - cell: C11
        label: dense descending rank for Ben (88)
        excel: '=COUNTIF($B$2:$B$8, ">"&B3)+1'
        result: 3
  steps:
    - Put every comparable score in one locked range (for example $B$2:$B$8).
    - 'In the first rank cell type `=RANK(B2, $B$2:$B$8, 0)` for largest-first leaderboards.'
    - Fill the formula down so each row keeps the same absolute ref.
    - 'Use order 1 when the smallest value should be rank 1 (race times, golf scores).'
    - Switch to a COUNTIF dense-rank formula when ties must not create gaps.
  errors:
    - error: Every row ranks only against itself after fill-down
      cause: The ref was relative (B2:B8) and shifted with each row.
      fix: Lock the list with $B$2:$B$8 before filling.
    - error: Ties show ranks 3,3,4 instead of 3,3,5
      cause: Expecting ordinal labels differently, or mixing dense-rank logic with RANK.
      fix: RANK uses competition ranking (skip after ties). Use COUNTIF for dense ranks.
    - error: "#N/A or unexpected rank"
      cause: The number is not in ref, or ref includes errors/text that break the list.
      fix: Ensure the value exists in a clean numeric ref.
    - error: Ranking looks reversed
      cause: Order argument wrong (0 vs 1) for the sport or metric.
      fix: Use 0 when higher is better; use 1 when lower is better.
  faq:
    - q: What is the difference between RANK, RANK.EQ, and RANK.AVG?
      a: RANK and RANK.EQ are competition ranks (ties share a place, next place skips). RANK.AVG gives tied values the average of the places they span. Google Sheets focuses on RANK.
    - q: How do I rank with no gaps after ties?
      a: Use a dense-rank pattern such as =COUNTIF($B$2:$B$8, ">"&B2)+1 for descending places.
    - q: Does RANK change when I sort the sheet?
      a: No. RANK looks at values in ref, not at visual row order, so sorting alone does not change each score’s rank.
    - q: How do I get the 2nd-highest value instead of its rank?
      a: Use =LARGE(range, 2) or =SMALL(range, 2). RANK answers “what place?”, LARGE/SMALL answer “what value?”.
  related: [average, median-mode, large-small, sort, sortby]

- id: large-small
  category: financial
  slugs: {excel: large-small-excel, sheets: large-small-google-sheets}
  title: How to Use LARGE and SMALL
  summary: >-
    LARGE returns the nth largest value in a list; SMALL returns the nth smallest. Use them when
    you need the value itself (top score, second-lowest cost) rather than a rank place. Pair with
    MAX/MIN for the extremes and RANK when you need position numbers instead of the underlying
    amounts.
  problem: >-
    A scoreboard or sales list needs the top three amounts and the two lowest values for review.
    Sorting the sheet breaks other formulas, MAX/MIN only give the single extreme, and RANK
    answers “what place?” when the real question is “what number sits in that place?”.
  excel:
    formula: '=LARGE(B2:B8, 2)'
    explain: >-
      Syntax: `LARGE(array, k)` and `SMALL(array, k)`. `array` is the numeric list; `k` is the
      place from the top (LARGE) or bottom (SMALL). `LARGE(range, 1)` matches MAX; `SMALL(range, 1)`
      matches MIN.
    notes: >-
      LARGE and SMALL ignore text and blanks inside the array. If two values tie, both occupy a
      place in the ordered list — LARGE(k) and LARGE(k+1) can return the same number when duplicates
      exist. Keep k between 1 and the count of numbers; otherwise you get #NUM!. Absolute-reference
      the list when you build a top-N table (`=LARGE($B$2:$B$8, ROW(A1))` filled down). RANK tells
      you a value’s place; LARGE/SMALL pull the value at that place — use INDEX/MATCH with LARGE
      when you also need the matching name:
      `=INDEX($A$2:$A$8, MATCH(LARGE($B$2:$B$8, 1), $B$2:$B$8, 0))`. Prefer MAXIFS/MINIFS when the
      nth extreme must respect a condition (one region only). ROUND is for display; leave helper
      cells at full precision when they feed charts or further formulas.
    alternatives:
      - label: Highest value (same as MAX)
        formula: '=LARGE(B2:B8, 1)'
      - label: Lowest value (same as MIN)
        formula: '=SMALL(B2:B8, 1)'
      - label: Third-largest value
        formula: '=LARGE(B2:B8, 3)'
      - label: Name of the top score
        formula: '=INDEX($A$2:$A$8, MATCH(LARGE($B$2:$B$8, 1), $B$2:$B$8, 0))'
    diff: >-
      Google Sheets supports the same LARGE and SMALL functions with identical k behaviour.
  sheets:
    formula: '=LARGE(B2:B8, 2)'
    explain: >-
      Same LARGE/SMALL syntax in Google Sheets. k=1 is the extreme; higher k walks inward from
      that end of the sorted list.
    notes: >-
      Open-ended ranges such as `=LARGE(B2:B, 2)` grow as new scores are entered while blanks stay
      ignored. Build a live top-N spill with
      `=ARRAYFORMULA(LARGE(B2:B8, SEQUENCE(3)))` for the three largest values in one formula —
      useful on dashboards that should not rely on fill-down. SORTN is another Sheets-friendly way
      to return the top rows with names attached:
      `=SORTN(A2:B8, 3, 0, 2, FALSE)`. When the workbook must open in Excel, stick to LARGE/SMALL
      and INDEX/MATCH; avoid SORTN if collaborators use desktop Excel. Locale settings change how
      decimals display, not which value LARGE selects. If k exceeds the numeric count, Sheets
      returns #NUM! just like Excel — guard with IF or MIN(k, COUNT(range)).
    alternatives:
      - label: Top three values spilled
        formula: '=ARRAYFORMULA(LARGE(B2:B8, SEQUENCE(3)))'
      - label: Top three rows with names (SORTN)
        formula: '=SORTN(A2:B8, 3, 0, 2, FALSE)'
      - label: Lowest value
        formula: '=SMALL(B2:B8, 1)'
      - label: Growing-column second largest
        formula: '=LARGE(B2:B, 2)'
    diff: >-
      Excel uses fill-down or SEQUENCE spills for top-N; Sheets can also use SORTN for whole rows.
  example:
    intro: >-
      Seven student scores. LARGE pulls the top places; SMALL pulls the bottom. MAX/MIN match
      LARGE/SMALL with k=1. A three-way pattern at 88 shows ties returning the same value twice.
    grid:
      - [Student, Score, null, Metric, Value]
      - [Ava, 72]
      - [Ben, 88]
      - [Cara, 95]
      - [Drew, 88]
      - [Eve, 64]
      - [Finn, 91]
      - [Gia, 80]
    checks:
      - cell: E2
        label: largest score
        excel: '=LARGE(B2:B8, 1)'
        result: 95
      - cell: E3
        label: second-largest score
        excel: '=LARGE(B2:B8, 2)'
        result: 91
      - cell: E4
        label: third-largest score
        excel: '=LARGE(B2:B8, 3)'
        result: 88
      - cell: E5
        label: smallest score
        excel: '=SMALL(B2:B8, 1)'
        result: 64
      - cell: E6
        label: second-smallest score
        excel: '=SMALL(B2:B8, 2)'
        result: 72
      - cell: E7
        label: MAX matches LARGE k=1
        excel: '=MAX(B2:B8)'
        result: 95
      - cell: E8
        label: MIN matches SMALL k=1
        excel: '=MIN(B2:B8)'
        result: 64
  steps:
    - Put the comparable numbers in one column (scores, sales, costs).
    - 'Type `=LARGE(B2:B8, 1)` for the highest value or `=SMALL(B2:B8, 1)` for the lowest.'
    - 'Raise k to walk down the leaderboard: `=LARGE(B2:B8, 2)` is second place by value.'
    - Lock the range with $ if you fill a top-N column that must always read the same list.
    - Use RANK when you need each row’s place number instead of the nth value itself.
  errors:
    - error: '#NUM!'
      cause: k is less than 1, or larger than the count of numeric values in the array.
      fix: Use a k between 1 and COUNT(range), or wrap with IF to show a blank when k is out of range.
    - error: Top-N table shifts after fill-down
      cause: The array reference was relative and moved with each row.
      fix: Absolute-reference the list ($B$2:$B$8) and put 1,2,3 in a helper column for k.
    - error: Wrong name next to a LARGE value
      cause: MATCH finds the first tie, so duplicate scores can attach the wrong label.
      fix: Deduplicate carefully, or use a more advanced INDEX/FILTER pattern for nth match.
    - error: Result differs from a sorted view
      cause: Hidden rows or filtered lists — LARGE still sees the full array, not only visible cells.
      fix: Copy visible cells to a clean range, or use SUBTOTAL-based helpers for visible-only work.
  faq:
    - q: What is the difference between LARGE and RANK?
      a: RANK returns a place number for a known value. LARGE/SMALL return the value that sits at place k. Use both when a dashboard needs the amount and its rank.
    - q: Does LARGE(range, 1) equal MAX(range)?
      a: Yes for a plain numeric list. Prefer MAX/MIN when you only need the single extreme; use LARGE/SMALL when k may be 2, 3, or more.
    - q: How do ties work?
      a: Duplicate values each take a slot in the ordered list. If two scores equal 88, LARGE(...,3) and LARGE(...,4) can both return 88.
    - q: Can I get the largest value that meets a condition?
      a: Use MAXIFS for the single conditional maximum. For the nth conditional value, filter the list first (FILTER in Excel 365 / Sheets) then apply LARGE.
  related: [rank, average, median-mode, maxifs-minifs, weighted-average]
