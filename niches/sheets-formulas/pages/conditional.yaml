# Conditional sums & counts
- id: sumif
  category: conditional
  launch: true
  slugs: {excel: sumif-excel, sheets: sumif-google-sheets}
  title: How to Use SUMIF
  summary: >-
    SUMIF adds the numbers that meet one condition: all expenses in a category, all amounts over
    a threshold, or all items whose name starts with certain letters. Below are the syntax, three
    worked examples, and the mistakes that make SUMIF return 0.
  problem: >-
    You keep an expense list with a category for every line and want a total per category
    without filtering or adding cells by hand.
  excel:
    formula: '=SUMIF(A2:A7, E2, C2:C7)'
    explain: >-
      Syntax: `SUMIF(range, criteria, [sum_range])`. Check A2:A7 against the value in E2 and add
      the matching amounts from C2:C7.
    notes: >-
      Criteria with an operator are written as text: `">40"`, `"<>Travel"`. To compare with a
      cell, join the operator and the cell: `">"&G1`. SUMIF is not case-sensitive and accepts
      wildcards: `*` for any number of characters and `?` for exactly one; put a tilde in front
      to search for a literal asterisk (`"~*"`). If you need two or more conditions, use SUMIFS,
      whose argument order is different (the sum range comes first).
    diff: >-
      Excel uses the identical syntax and wildcards.
  sheets:
    formula: '=SUMIF(A2:A7, E2, C2:C7)'
    explain: >-
      Same syntax in Google Sheets: `SUMIF(range, criterion, [sum_range])`.
    notes: >-
      SUMIF behaves the same in Google Sheets, including wildcards. A Sheets-specific option is to
      build a full summary table with one formula: `=QUERY(A2:C7, "select A, sum(C) group by A
      label sum(C) 'Total'", 0)` returns each category with its total and updates when new
      categories appear, which is handy when you do not know the categories in advance.
    alternatives:
      - label: Totals for every category at once
        formula: '=QUERY(A2:C7, "select A, sum(C) group by A label sum(C) ''Total''", 0)'
    diff: >-
      Google Sheets uses the same syntax. QUERY can also build a total for every category in one
      formula.
  example:
    intro: An expense list with three totals.
    grid:
      - [Category, Item, Amount, null, Criteria, Total]
      - [Office, Paper, 45, null, Office]
      - [Travel, Taxi, 32.5, null, '>40']
      - [Office, Toner, 89, null, 'T*']
      - [Meals, Lunch, 18.75]
      - [Travel, Train, 64]
      - [Office, Pens, 12]
    checks:
      - cell: F2
        label: total for the category in E2
        excel: '=SUMIF(A2:A7, E2, C2:C7)'
        result: 146
      - cell: F3
        label: amounts greater than 40 (no sum_range needed)
        excel: '=SUMIF(C2:C7, ">40")'
        result: 198
      - cell: F4
        label: items starting with T
        excel: '=SUMIF(B2:B7, "T*", C2:C7)'
        result: 185.5
  steps:
    - 'The first argument is the range to test (Category).'
    - 'The second is the condition: a value, a cell, or text such as ">40" or "T*".'
    - 'The third is the range to add. It must line up row by row with the test range.'
    - 'If the test range and the numbers are the same column, leave the third argument out, as in `=SUMIF(C2:C7, ">40")`.'
  errors:
    - error: Returns 0
      cause: The amounts are stored as text (often after an import), or the criterion has an extra space.
      fix: Convert the column to numbers (Data > Text to Columns > Finish in Excel, Format > Number in Sheets) and check the criterion with LEN.
    - error: Wrong total
      cause: The sum range has a different size or starts on a different row than the test range.
      fix: Make both ranges the same size, e.g. A2:A7 and C2:C7.
    - error: Operator criterion ignored
      cause: The operator was not quoted, e.g. =SUMIF(C2:C7, >40).
      fix: Put operators in quotes and join cell references with &, e.g. ">"&G1.
  faq:
    - q: What is the difference between SUMIF and SUMIFS?
      a: SUMIF supports one condition; SUMIFS supports one or more. SUMIFS puts the sum range first, SUMIF puts it last.
    - q: Can SUMIF use a date as the criteria?
      a: Yes, e.g. =SUMIF(A2:A100, ">="&DATE(2026,1,1), B2:B100). For a date range use SUMIFS with two conditions.
    - q: How do I sum cells that are not equal to something?
      a: Use "<>" in front of the value, e.g. =SUMIF(A2:A7, "<>Travel", C2:C7).
  related: [sumifs, countif, sumifs-between-dates, sum-by-month, maxifs-minifs]

- id: sumifs
  category: conditional
  launch: true
  slugs: {excel: sumifs-excel, sheets: sumifs-google-sheets}
  title: SUMIFS with Multiple Criteria
  summary: >-
    SUMIFS adds numbers that meet several conditions at the same time, for example sales for one
    region AND one product. This page covers AND logic, number thresholds, and the trick for OR
    logic across several values.
  problem: >-
    Your sales log has Region, Rep, Product and Sales columns. You need totals such as "East
    region laptops" or "Monitors sold in East or West" for a report.
  excel:
    formula: '=SUMIFS(D2:D8, A2:A8, F2, C2:C8, G2)'
    explain: >-
      Syntax: `SUMIFS(sum_range, criteria_range1, criteria1, [criteria_range2, criteria2], ...)`.
      Add D2:D8 where A2:A8 equals F2 AND C2:C8 equals G2. For a start and end date, use
      [SUMIFS between two dates](../{sumifs-between-dates}/).
    notes: >-
      All conditions in SUMIFS are combined with AND. For OR logic on one column, pass an array
      constant and wrap the result in SUM: `=SUM(SUMIFS(D2:D8, A2:A8, {"East","West"}, C2:C8,
      "Monitor"))`; Excel evaluates it once per value and adds the results. You can use up to
      127 range/criteria pairs, and every criteria range must be the same size as the sum range,
      otherwise Excel returns #VALUE!.
    diff: >-
      Excel uses the same syntax, and SUM(SUMIFS(..., {"East","West"}, ...)) works without
      ARRAYFORMULA.
  sheets:
    formula: '=SUMIFS(D2:D8, A2:A8, F2, C2:C8, G2)'
    explain: >-
      Same syntax in Google Sheets: `SUMIFS(sum_range, criteria_range1, criterion1, ...)`.
      For a start and end date, use [SUMIFS between two dates](../{sumifs-between-dates}/).
    notes: >-
      In Google Sheets the OR trick with an array constant needs ARRAYFORMULA, otherwise SUMIFS
      only uses the first value in the braces and the total is too low:
      `=ARRAYFORMULA(SUM(SUMIFS(D2:D8, A2:A8, {"East","West"}, C2:C8, "Monitor")))`. As an
      alternative you can add up a FILTER result with a regular expression on the region:
      `=SUM(FILTER(D2:D8, REGEXMATCH(A2:A8, "^(East|West)$"), C2:C8="Monitor"))`.
    alternatives:
      - label: OR logic in Google Sheets
        formula: '=ARRAYFORMULA(SUM(SUMIFS(D2:D8, A2:A8, {"East","West"}, C2:C8, "Monitor")))'
      - label: Same result with FILTER and REGEXMATCH
        formula: '=SUM(FILTER(D2:D8, REGEXMATCH(A2:A8, "^(East|West)$"), C2:C8="Monitor"))'
    diff: >-
      Google Sheets uses the same syntax, but OR logic with an array constant must be wrapped in
      ARRAYFORMULA.
  example:
    intro: Three totals from the same sales log.
    grid:
      - [Region, Rep, Product, Sales, null, Region, Product, Total]
      - [East, Kim, Laptop, 1200, null, East, Laptop]
      - [West, Ruiz, Laptop, 950]
      - [East, Patel, Monitor, 300]
      - [East, Kim, Monitor, 280]
      - [West, Ruiz, Monitor, 410]
      - [East, Patel, Laptop, 1100]
      - [North, Lee, Laptop, 870]
    checks:
      - cell: H2
        label: East AND Laptop
        excel: '=SUMIFS(D2:D8, A2:A8, F2, C2:C8, G2)'
        result: 2300
      - cell: H3
        label: East AND sales of at least 300
        excel: '=SUMIFS(D2:D8, A2:A8, "East", D2:D8, ">=300")'
        result: 2600
      - cell: H4
        label: Monitors in East OR West
        excel: '=SUM(SUMIFS(D2:D8, A2:A8, {"East","West"}, C2:C8, "Monitor"))'
        sheets: '=ARRAYFORMULA(SUM(SUMIFS(D2:D8, A2:A8, {"East","West"}, C2:C8, "Monitor")))'
        result: 990
  steps:
    - '`D2:D8` is the column to add. In SUMIFS it always comes first.'
    - 'Then come pairs: a range to test and the condition for it. `A2:A8, F2` keeps rows where Region is East.'
    - '`C2:C8, G2` additionally keeps rows where Product is Laptop. Only rows meeting every pair are added: 1200 + 1100 = 2300.'
    - 'The sum range can also be a criteria range, as in `D2:D8, ">=300"`.'
    - 'For OR, the array constant makes SUMIFS return one total per region, {580, 410} (East monitors and West monitors), and SUM adds them: 990.'
  errors:
    - error: '#VALUE!'
      cause: A criteria range is a different size than the sum range (e.g. A2:A8 vs D2:D9).
      fix: Make every range cover the same rows.
    - error: Returns 0
      cause: Numbers stored as text, a trailing space in a criterion, or the arguments are in SUMIF order (sum range last).
      fix: Put the sum range first and clean the data.
    - error: OR total is too low in Google Sheets
      cause: The {"East","West"} array was used without ARRAYFORMULA, so only East was counted.
      fix: Wrap the formula in ARRAYFORMULA.
  faq:
    - q: Can SUMIFS use OR logic?
      a: Not directly; all conditions are AND. Use SUM(SUMIFS(...)) with an array constant, or add two SUMIFS together.
    - q: How do I sum between two dates with SUMIFS?
      a: |
        Use the date column twice: `=SUMIFS(B:B, A:A, ">="&D2, A:A, "<="&E2)`. The worked version, including dates that contain a time, is on [SUMIFS between two dates](../{sumifs-between-dates}/).
    - q: Is SUMIFS case-sensitive?
      a: No. Use SUMPRODUCT with EXACT if you need a case-sensitive sum.
  cta: hub
  sections:
    - after: quick
      title: SUMIFS not working / returns 0
      body: |
        SUMIFS returns 0 when no row matches, and also when the rows you expect are stored in a way the criteria cannot see. Check these before you rewrite the formula.

        - **Text that looks like a date or a number.** A date typed as text is often left-aligned, and `=ISNUMBER(A2)` is FALSE. A date criterion then matches nothing and the total is 0. Convert with DATEVALUE or Text to Columns in Excel, or Format > Number in Google Sheets.
        - **The operator and the cell were not joined.** `">=A1"` looks for the text >=A1. It does not read the date in A1. Join them: `">="&A1`. The same pattern is `">="&start` and `"<="&end` when you test a date column twice.
        - **Sum range last.** SUMIFS wants the numbers first. SUMIF wants them last. Swapping the arguments often returns 0 with no error.
        - **Range lengths.** Every criteria range must cover the same rows as the sum range. A mismatch returns #VALUE! rather than a quiet 0.
        - **Spaces.** `"East "` does not equal East. TRIM the column or the criterion.

        The full date-window pattern, including a time on the last day, is on [SUMIFS between two dates](../{sumifs-between-dates}/). Counting those rows is [COUNTIFS](../{countifs}/). A calendar month is [sum by month](../{sum-by-month}/).
  related: [sumifs-between-dates, countifs, sum-by-month, sumif, vlookup-multiple-criteria]

- id: sumifs-between-dates
  category: conditional
  launch: true
  slugs: {excel: sumifs-between-dates-excel, sheets: sumifs-between-dates-google-sheets}
  title: SUMIFS Between Two Dates
  summary: >-
    To add values that fall within a date range, use SUMIFS with the date column twice: once
    with ">=" the start date and once with "<=" the end date. This page shows the cell-based
    version, the hard-coded version and how to avoid losing rows that contain a time.
  problem: >-
    You have dated transactions and need the total for February, or for any start and end date
    typed into two input cells.
  excel:
    formula: '=SUMIFS(B2:B7, A2:A7, ">="&D2, A2:A7, "<="&E2)'
    explain: >-
      The date column A2:A7 is tested twice: on or after the start date in D2 and on or before
      the end date in E2. Only rows meeting both are added.
    notes: >-
      Write fixed dates with the DATE function (`">="&DATE(2026,2,1)`) rather than as text such
      as ">=2/1/2026", because text dates are interpreted using the computer's regional settings
      and can silently flip day and month. If the dates include a time (exports from forms or
      systems often do), use `"<"&E2+1` as the upper bound so the whole end day is included.
    alternatives:
      - label: Fixed dates without input cells
        formula: '=SUMIFS(B2:B7, A2:A7, ">="&DATE(2026,2,1), A2:A7, "<"&DATE(2026,3,1))'
      - label: Dates that include times
        formula: '=SUMIFS(B2:B7, A2:A7, ">="&D2, A2:A7, "<"&E2+1)'
    diff: >-
      Excel uses the identical SUMIFS formula; write fixed dates with DATE() to avoid regional
      format problems.
  sheets:
    formula: '=SUMIFS(B2:B7, A2:A7, ">="&D2, A2:A7, "<="&E2)'
    explain: >-
      Identical in Google Sheets. The comparison works on the underlying date serial numbers.
    notes: >-
      Google Sheets also lets you do this with QUERY, which uses ISO date literals and is not
      affected by the spreadsheet's locale: `=QUERY(A2:B7, "select sum(B) where A >= date
      '2026-02-01' and A <= date '2026-02-28' label sum(B) ''", 0)`. Check File > Settings >
      Locale if typed dates are interpreted with day and month swapped; the formula is right,
      but the dates in the cells may not be real dates.
    alternatives:
      - label: QUERY with ISO date literals
        formula: '=QUERY(A2:B7, "select sum(B) where A >= date ''2026-02-01'' and A <= date ''2026-02-28'' label sum(B) ''''", 0)'
    diff: >-
      The same formula works in Google Sheets; QUERY with ISO date literals is an alternative there.
  example:
    intro: Total of transactions between the start date in D2 and the end date in E2.
    grid:
      - [Date, Amount, null, Start, End, Total]
      - [2026-01-28, 400, null, 2026-02-01, 2026-02-28]
      - [2026-02-03, 250]
      - [2026-02-14, 600]
      - [2026-02-28, 150]
      - [2026-03-01, 300]
      - [2026-03-15, 200]
    checks:
      - cell: F2
        label: from input cells
        excel: '=SUMIFS(B2:B7, A2:A7, ">="&D2, A2:A7, "<="&E2)'
        result: 1000
      - cell: F3
        label: fixed dates for February
        excel: '=SUMIFS(B2:B7, A2:A7, ">="&DATE(2026,2,1), A2:A7, "<"&DATE(2026,3,1))'
        result: 1000
  steps:
    - '`">="&D2` builds the text ">=46054" (the serial number of Feb 1, 2026). SUMIFS compares it with the dates in A2:A7.'
    - '`"<="&E2` adds the upper limit. Both conditions must be true, so only Feb 3, Feb 14 and Feb 28 are included.'
    - 'The amounts on those rows are added: 250 + 600 + 150 = 1000.'
    - 'Using `<` with the first day of the next month is a safe way to include the entire last day.'
  errors:
    - error: Returns 0
      cause: The dates in column A are text, not real dates (they are often left-aligned).
      fix: Convert them with DATEVALUE or Text to Columns; =ISNUMBER(A2) should return TRUE.
    - error: Last day missing
      cause: The dates contain times, so 2026-02-28 15:30 is greater than 2026-02-28.
      fix: Use "<"&E2+1 as the upper bound.
    - error: '#VALUE!'
      cause: The sum range and the date ranges have different sizes.
      fix: Use ranges covering the same rows.
  faq:
    - q: Why does the operator go in quotes?
      a: SUMIFS criteria are text. The & joins the operator with the date's serial number to form a condition such as ">=46054".
    - q: Why does ">=L1" return 0 when the dates are right?
      a: |
        `">=L1"` is the characters >=L1. SUMIFS looks for that text and does not read the date in L1, so the total is 0. `">="&L1` joins the operator to the date serial in L1, which is what SUMIFS compares. The same join is how you write any threshold on [SUMIFS](../{sumifs}/), and how you count the rows with [COUNTIFS](../{countifs}/).
    - q: How do I count rows between two dates instead?
      a: |
        Use [COUNTIFS](../{countifs}/) with the same two conditions: `=COUNTIFS(A2:A7, ">="&D2, A2:A7, "<="&E2)`.
  cta: hub
  related: [sumifs, countifs, sum-by-month, days-between-dates, eomonth]

- id: countif
  category: conditional
  launch: true
  slugs: {excel: countif-excel, sheets: countif-google-sheets}
  title: How to Use COUNTIF
  summary: >-
    COUNTIF counts the cells in a range that meet one condition: a specific word, numbers above a
    threshold, blanks, or anything except a value. Four worked examples show exactly which
    criteria to type, including the surprising way blank cells are treated.
  problem: >-
    In a class results sheet you want to know how many students passed, how many scored 70 or
    more, and how many results are still missing.
  excel:
    formula: '=COUNTIF(C2:C8, "Pass")'
    explain: >-
      Syntax: `COUNTIF(range, criteria)`. Count the cells in C2:C8 equal to "Pass" (not
      case-sensitive).
    notes: >-
      Criteria follow the same rules as SUMIF: operators go in quotes (`">=70"`), cell references
      are joined with & (`">="&E1`), and wildcards are supported (`"*pass*"` counts cells that
      contain "pass"). Note that "<>Pass" also counts empty cells, which surprises many people.
      COUNTIF only accepts ranges, not arrays, so you cannot pass it the result of another
      calculation such as `LEFT(A2:A8,1)`; use SUMPRODUCT for that.
    diff: >-
      Excel uses the identical syntax, and "<>Pass" also counts blank cells there.
  sheets:
    formula: '=COUNTIF(C2:C8, "Pass")'
    explain: >-
      Same syntax in Google Sheets: `COUNTIF(range, criterion)`. Criteria are not case-sensitive,
      wildcards work the same way, and a blank criterion `""` still counts empty result cells.
    notes: >-
      COUNTIF works the same way in Google Sheets. For patterns that wildcards cannot express,
      Sheets users can combine REGEXMATCH with SUMPRODUCT, for example counting codes that start
      with two letters followed by digits: `=SUMPRODUCT(REGEXMATCH(A2:A8, "^[A-Z]{2}\d+$"))`.
      COUNTUNIQUE is another Sheets-only helper when you need distinct values instead of matches.
      Open-ended ranges such as C2:C are fine inside ARRAYFORMULA when you want a live count that
      grows with new rows: `=ARRAYFORMULA(COUNTIF(C2:C, "Pass"))` is not valid, so keep COUNTIF on
      a fixed range or wrap criteria checks with SUMPRODUCT instead.
    alternatives:
      - label: Count cells matching a regular expression
        formula: '=SUMPRODUCT(REGEXMATCH(A2:A8, "^[A-Z]{2}\d+$"))'
      - label: Count unique values in the column
        formula: '=COUNTUNIQUE(C2:C8)'
    diff: >-
      Excel uses the same COUNTIF syntax; for regex-style patterns use helper columns or FILTER
      rather than REGEXMATCH, and use UNIQUE+COUNTA instead of COUNTUNIQUE.
  example:
    intro: Ivy's result has not been entered yet.
    grid:
      - [Student, Score, Result, null, Question, Count]
      - [Ava, 88, Pass, null, Passed]
      - [Liam, 54, Fail, null, Scored 70+]
      - [Mia, 92, Pass, null, Missing result]
      - [Noah, 67, Pass, null, Not "Pass"]
      - [Zoe, 45, Fail]
      - [Eli, 73, Pass]
      - [Ivy, null, null]
    checks:
      - cell: F2
        excel: '=COUNTIF(C2:C8, "Pass")'
        result: 4
      - cell: F3
        excel: '=COUNTIF(B2:B8, ">=70")'
        result: 3
      - cell: F4
        excel: '=COUNTIF(C2:C8, "")'
        result: 1
      - cell: F5
        label: includes the blank cell
        excel: '=COUNTIF(C2:C8, "<>Pass")'
        result: 3
  steps:
    - '`C2:C8` is the range to check; it can be a column or a block of cells.'
    - '`"Pass"` counts exact matches, ignoring case.'
    - '`">=70"` applies a comparison to numbers. Text and empty cells are ignored, so Ivy is not counted.'
    - '`""` counts empty cells (and cells containing an empty string from a formula).'
    - '`"<>Pass"` counts everything that is not Pass, including the empty cell: Liam, Zoe and Ivy.'
  errors:
    - error: Count is 0
      cause: Leading or trailing spaces in the data, or numbers stored as text when counting with ">".
      fix: Clean the data with TRIM and convert text numbers to real numbers.
    - error: Count includes blanks
      cause: '"<>value" counts empty cells too.'
      fix: 'Use COUNTIFS to exclude blanks: =COUNTIFS(C2:C8, "<>Pass", C2:C8, "<>").'
    - error: Wrong count for long numbers
      cause: COUNTIF converts text that looks like a number, so IDs longer than 15 digits are compared as rounded numbers.
      fix: 'Use =SUMPRODUCT(--(A2:A8=E2)) for long numeric IDs.'
  faq:
    - q: How do I count cells that contain a word?
      a: Use wildcards, e.g. =COUNTIF(A2:A100, "*mouse*").
    - q: How do I count with two conditions?
      a: Use COUNTIFS, which takes several range/criteria pairs.
    - q: How do I count non-blank cells?
      a: Use =COUNTIF(A2:A100, "<>") or =COUNTA(A2:A100).
  related: [countifs, sumif, count-unique, contains-text]

- id: countifs
  category: conditional
  launch: true
  slugs: {excel: countifs-excel, sheets: countifs-google-sheets}
  title: COUNTIFS with Multiple Criteria
  summary: >-
    COUNTIFS counts rows that meet several conditions at once, such as deals that are both won
    and above a certain size, or values between two numbers. Includes a worked pipeline example
    and how to do OR logic.
  problem: >-
    In a sales pipeline you want to count won deals in the East, won deals worth at least
    10,000, and deals between 5,000 and 10,000.
  excel:
    formula: '=COUNTIFS(B2:B8, "East", D2:D8, "Won")'
    explain: >-
      Syntax: `COUNTIFS(criteria_range1, criteria1, [criteria_range2, criteria2], ...)`. A row
      is counted only if every condition is true.
    notes: >-
      To count values between two numbers, use the same column twice with two conditions. For
      OR logic (Won OR Lost in East), use an array constant and SUM: `=SUM(COUNTIFS(B2:B8,
      "East", D2:D8, {"Won","Lost"}))`. All ranges must be the same shape; unlike SUMIFS there is
      no separate range to add.
    diff: >-
      Excel uses the same syntax; SUM(COUNTIFS(..., {"Won","Lost"})) works there without
      ARRAYFORMULA.
  sheets:
    formula: '=COUNTIFS(B2:B8, "East", D2:D8, "Won")'
    explain: >-
      Same syntax in Google Sheets.
    notes: >-
      COUNTIFS behaves the same in Google Sheets, but array constants for OR logic must be
      wrapped in ARRAYFORMULA: `=ARRAYFORMULA(SUM(COUNTIFS(B2:B8, "East", D2:D8,
      {"Won","Lost"})))`. Alternatively, count the rows of a FILTER result with
      `=ROWS(FILTER(A2:A8, B2:B8="East", C2:C8>=10000))`, which also lets you use conditions that
      COUNTIFS cannot express, such as comparisons between two columns.
    alternatives:
      - label: OR logic in Google Sheets
        formula: '=ARRAYFORMULA(SUM(COUNTIFS(B2:B8, "East", D2:D8, {"Won","Lost"})))'
    diff: >-
      Google Sheets uses the same syntax, but array constants for OR logic need ARRAYFORMULA.
  example:
    intro: A small sales pipeline.
    grid:
      - [Rep, Region, Deal size, Stage, null, Question, Count]
      - [Kim, East, 12000, Won, null, East and Won]
      - [Ruiz, West, 8000, Lost, null, 'Won and >= 10,000']
      - [Patel, East, 15000, Won, null, '5,000 to 10,000']
      - [Lee, North, 11000, Won]
      - [Kim, East, 3000, Lost]
      - [Ruiz, West, 22000, Won]
      - [Patel, East, 9000, Won]
    checks:
      - cell: G2
        excel: '=COUNTIFS(B2:B8, "East", D2:D8, "Won")'
        result: 3
      - cell: G3
        excel: '=COUNTIFS(D2:D8, "Won", C2:C8, ">=10000")'
        result: 4
      - cell: G4
        excel: '=COUNTIFS(C2:C8, ">=5000", C2:C8, "<=10000")'
        result: 2
  steps:
    - 'Each pair is a range and a condition. `B2:B8, "East"` keeps East rows.'
    - '`D2:D8, "Won"` keeps only won deals among those. Kim (12,000), Patel (15,000) and Patel (9,000) remain: 3.'
    - 'Conditions on numbers use quoted operators: `">=10000"`.'
    - 'Using the same column twice creates a range: at least 5,000 and at most 10,000 matches 8,000 and 9,000.'
  errors:
    - error: '#VALUE!'
      cause: The criteria ranges are different sizes.
      fix: Make every range cover the same rows.
    - error: Count too high with "<>"
      cause: '"<>Won" also counts blank cells.'
      fix: 'Add another condition that excludes blanks: D2:D8, "<>".'
    - error: Count is 0
      cause: Numbers stored as text or trailing spaces.
      fix: Clean and convert the data, then re-check each condition separately with COUNTIF.
  faq:
    - q: Is there a limit to the number of conditions?
      a: COUNTIFS accepts up to 127 range/criteria pairs in Excel; you will rarely need more than a few.
    - q: How do I count rows where two columns are equal?
      a: COUNTIFS cannot compare columns to each other. Use =SUMPRODUCT(--(B2:B8=C2:C8)).
    - q: How do I count rows between two dates?
      a: 'Use the date column twice: =COUNTIFS(A2:A100, ">="&E1, A2:A100, "<="&E2), where E1 and E2 hold the start and end dates. Join the operator and the cell with &, exactly as with numbers.'
    - q: Can COUNTIFS use wildcards?
      a: Yes. =COUNTIFS(A2:A8, "K*", D2:D8, "Won") counts won deals for reps whose name starts with K. Use * for any number of characters and ? for exactly one character.
  cta: hub
  sections:
    - after: quick
      title: COUNTIFS between two dates
      body: |
        Count rows whose date falls on or between two dates by testing the date column twice. Put the start date in L1 and the end date in L2, and join each operator with `&`:

        ```excel
        =COUNTIFS($A$2:$A$100, ">="&L1, $A$2:$A$100, "<="&L2)
        ```

        `">="&L1` becomes a criterion such as `>=46054` (the serial number of the date in L1). The quoted string `">=L1"` does not read L1, so the count stays 0. Both ranges must cover the same rows. If the dates include a time, use `"<"&L2+1` as the upper bound so the whole end day is included.

        Adding the amounts on those rows, instead of counting them, is [SUMIFS between two dates](../{sumifs-between-dates}/). The number of days from one date to the other, ignoring which rows fall in between, is [days between two dates](../{days-between-dates}/). The same AND logic for a total is [SUMIFS](../{sumifs}/).
  related: [sumifs-between-dates, days-between-dates, sumifs, countif, count-unique, maxifs-minifs]

- id: maxifs-minifs
  category: conditional
  launch: true
  slugs: {excel: maxifs-minifs-excel, sheets: maxifs-minifs-google-sheets}
  title: MAX and MIN with Criteria (MAXIFS / MINIFS)
  summary: >-
    MAXIFS and MINIFS return the largest or smallest number that meets one or more conditions,
    such as the best month for one store. This page shows both functions and the array formula to
    use in Excel versions that do not have them.
  problem: >-
    You track monthly revenue for several stores and want the highest and lowest month for a
    chosen store, and the best result of any store in February.
  excel:
    formula: '=MAXIFS(C2:C7, A2:A7, E2)'
    explain: >-
      Syntax: `MAXIFS(max_range, criteria_range1, criteria1, ...)`. MINIFS uses the same
      arguments. The value range comes first, like SUMIFS.
    notes: >-
      MAXIFS and MINIFS exist in Excel 2019, 2021, 2024 and Microsoft 365. In Excel 2016 and
      older they return #NAME?; use `=MAX(IF(A2:A7=E2, C2:C7))` confirmed with Ctrl+Shift+Enter
      instead. When no row meets the conditions, MAXIFS returns 0 rather than an error, which can
      be misleading for negative numbers; check with COUNTIFS first if that matters.
    alternatives:
      - label: Excel 2016 and older (array formula)
        formula: '=MAX(IF(A2:A7=E2, C2:C7))'
    diff: >-
      MAXIFS/MINIFS have the same syntax in Excel 2019 and later; Excel 2016 needs MAX(IF(...)).
  sheets:
    formula: '=MAXIFS(C2:C7, A2:A7, E2)'
    explain: >-
      Same syntax in Google Sheets.
    notes: >-
      Google Sheets supports MAXIFS and MINIFS with the same arguments. An equally common Sheets
      pattern is to take the MAX of a FILTER, which reads naturally and can be reused for other
      statistics such as MEDIAN or AVERAGE on the same subset: `=MAX(FILTER(C2:C7, A2:A7=E2))`.
      Unlike MAXIFS, the FILTER version returns #N/A when nothing matches instead of 0.
    alternatives:
      - label: MAX of a FILTER
        formula: '=MAX(FILTER(C2:C7, A2:A7=E2))'
    diff: >-
      Google Sheets uses the same MAXIFS / MINIFS syntax.
  example:
    intro: Revenue by store and month.
    grid:
      - [Store, Month, Revenue, null, Store, Result]
      - [Downtown, Jan, 18200, null, Downtown]
      - [Airport, Jan, 9400]
      - [Downtown, Feb, 16900]
      - [Airport, Feb, 11250]
      - [Mall, Jan, 13700]
      - [Mall, Feb, 12100]
    checks:
      - cell: F2
        label: best month for Downtown
        excel: '=MAXIFS(C2:C7, A2:A7, E2)'
        result: 18200
      - cell: F3
        label: weakest month for Downtown
        excel: '=MINIFS(C2:C7, A2:A7, E2)'
        result: 16900
      - cell: F4
        label: best store result in February
        excel: '=MAXIFS(C2:C7, B2:B7, "Feb")'
        result: 16900
  steps:
    - '`C2:C7` holds the numbers to compare.'
    - '`A2:A7, E2` keeps only rows for the store in E2 (Downtown): 18,200 and 16,900.'
    - MAXIFS returns the larger of those, MINIFS the smaller.
    - Add more pairs for more conditions, e.g. `B2:B7, "Feb"`.
  errors:
    - error: '#NAME?'
      cause: Excel 2016 or older does not have MAXIFS / MINIFS.
      fix: Use =MAX(IF(...)) entered with Ctrl+Shift+Enter, or AGGREGATE.
    - error: Returns 0
      cause: No row meets the conditions (or the numbers are text).
      fix: Check with COUNTIFS; wrap in IF(COUNTIFS(...)=0, "None", MAXIFS(...)).
    - error: '#VALUE!'
      cause: The criteria range and max range are different sizes.
      fix: Use ranges covering the same rows.
  faq:
    - q: How do I get the name that goes with the maximum?
      a: Combine with a lookup, e.g. =XLOOKUP(MAXIFS(C2:C7,A2:A7,E2), C2:C7, B2:B7) returns the month of the best result (first match if there is a tie).
    - q: Is there an AVERAGEIFS too?
      a: Yes, AVERAGEIFS uses the same argument order and works in Excel 2007+ and Google Sheets.
    - q: How do I find the second-highest value with a condition?
      a: MAXIFS only returns the top value. Use LARGE with FILTER in Excel 365 or Google Sheets, e.g. =LARGE(FILTER(C2:C7, A2:A7=E2), 2), or the array formula =LARGE(IF(A2:A7=E2, C2:C7), 2) in older Excel.
  related: [sumifs, countifs, xlookup, weighted-average]

- id: sum-by-month
  category: conditional
  launch: true
  slugs: {excel: sum-by-month-excel, sheets: sum-by-month-google-sheets}
  title: How to Sum by Month
  summary: >-
    To total daily transactions by month, use SUMIFS with a start date and EOMONTH as the end
    date. This guide builds a monthly summary that you can fill down, plus a SUMPRODUCT version
    and a one-formula QUERY report for Google Sheets.
  problem: >-
    Transactions are listed with their dates. You want a summary with one row per month and the
    total for that month.
  excel:
    formula: '=SUMIFS($B$2:$B$7, $A$2:$A$7, ">="&D2, $A$2:$A$7, "<="&EOMONTH(D2, 0))'
    explain: >-
      D2 holds the first day of the month. EOMONTH(D2, 0) returns the last day of the same
      month, so SUMIFS adds every transaction between the two.
    notes: >-
      Put real dates (the 1st of each month) in the month column and format them as "mmm yyyy";
      typing text like "Jan" will not work with the comparison. In Microsoft 365 you can build the
      month list automatically with `=UNIQUE(EOMONTH(A2:A7, -1)+1)`. A PivotTable grouped by
      month is the no-formula alternative when you only need a one-off report.
    alternatives:
      - label: SUMPRODUCT by month number and year
        formula: '=SUMPRODUCT((MONTH($A$2:$A$7)=MONTH(D2))*(YEAR($A$2:$A$7)=YEAR(D2))*$B$2:$B$7)'
    diff: >-
      Excel uses the identical SUMIFS + EOMONTH formula. A PivotTable grouped by month is the
      no-formula alternative.
  sheets:
    formula: '=SUMIFS($B$2:$B$7, $A$2:$A$7, ">="&D2, $A$2:$A$7, "<="&EOMONTH(D2, 0))'
    explain: >-
      Identical SUMIFS + EOMONTH pattern in Google Sheets. Put the first day of each month in
      column D, format it as month and year, and fill the total formula down the summary rows.
    notes: >-
      Google Sheets can produce the whole month-by-month summary with one QUERY formula, no
      helper column needed: `=QUERY(A2:B7, "select year(A), month(A)+1, sum(B) where A is not
      null group by year(A), month(A)+1 label year(A) 'Year', month(A)+1 'Month', sum(B)
      'Total'", 0)`. QUERY's month() is zero-based (January = 0), which is why the formula adds 1.
      Keep transaction dates as real dates (Format > Number > Date); text months break both
      SUMIFS comparisons and QUERY's year/month grouping.
    alternatives:
      - label: One-formula monthly report with QUERY
        formula: '=QUERY(A2:B7, "select year(A), month(A)+1, sum(B) where A is not null group by year(A), month(A)+1 label year(A) ''Year'', month(A)+1 ''Month'', sum(B) ''Total''", 0)'
      - label: SUMPRODUCT by month and year
        formula: '=SUMPRODUCT((MONTH($A$2:$A$7)=MONTH(D2))*(YEAR($A$2:$A$7)=YEAR(D2))*$B$2:$B$7)'
    diff: >-
      Excel uses the same SUMIFS + EOMONTH formula; build the month list with UNIQUE or a
      PivotTable instead of QUERY when you want a no-SQL summary.
  example:
    intro: D2:D4 contain the first day of each month (formatted as month and year).
    grid:
      - [Date, Amount, null, Month, Total]
      - [2026-01-05, 120, null, 2026-01-01]
      - [2026-01-19, 80, null, 2026-02-01]
      - [2026-02-02, 200, null, 2026-03-01]
      - [2026-02-20, 50]
      - [2026-03-11, 75]
      - [2026-03-30, 25]
    checks:
      - cell: E2
        label: filled down to E4
        excel: '=SUMIFS($B$2:$B$7, $A$2:$A$7, ">="&D2, $A$2:$A$7, "<="&EOMONTH(D2, 0))'
        fill: [E2, E3, E4]
        results: [200, 250, 100]
      - cell: F2
        label: SUMPRODUCT version, filled down to F4
        excel: '=SUMPRODUCT((MONTH($A$2:$A$7)=MONTH(D2))*(YEAR($A$2:$A$7)=YEAR(D2))*$B$2:$B$7)'
        fill: [F2, F3, F4]
        results: [200, 250, 100]
  steps:
    - '`">="&D2` keeps dates on or after the 1st of the month.'
    - '`EOMONTH(D2, 0)` returns the last day of that month (Jan 31, Feb 28, Mar 31), and `"<="&` turns it into an upper limit.'
    - 'The absolute references ($) keep the data ranges fixed while D2 changes to D3 and D4 as you fill down.'
    - The SUMPRODUCT version compares the month and year of every date with the month and year in column D and multiplies by the amounts.
  errors:
    - error: All totals are 0
      cause: The month column contains text ("Jan") or the transaction dates are text.
      fix: Use real dates such as 2026-01-01 formatted as "mmm yyyy", and check the data with ISNUMBER.
    - error: Last day of the month missing
      cause: Dates include times, so the 31st at 14:00 is after EOMONTH's midnight.
      fix: Use "<"&EOMONTH(D2,0)+1 as the upper limit.
    - error: January of two years added together
      cause: The SUMPRODUCT version only checks MONTH.
      fix: Also compare YEAR, as in the formula above.
  faq:
    - q: How do I sum by week instead?
      a: Put the start date of each week in the summary column and use "<"&D2+7 as the upper limit.
    - q: Can I sum by month without a summary table?
      a: Use a PivotTable grouped by months (Excel), or the QUERY formula above (Google Sheets).
  related: [sumifs-between-dates, sumifs, eomonth, sumif]

- id: count-unique
  category: conditional
  launch: true
  slugs: {excel: count-unique-excel, sheets: count-unique-google-sheets}
  title: How to Count Unique Values
  summary: >-
    Count how many different values appear in a list, for example how many distinct customers
    placed orders. This page covers the modern UNIQUE approach, the classic SUMPRODUCT/COUNTIF
    formula for older Excel, and counting values that appear only once.
  problem: >-
    Your order log repeats customer names. You want the number of distinct customers, not the
    number of orders.
  excel:
    formula: '=COUNTA(UNIQUE(A2:A8))'
    explain: >-
      UNIQUE returns each distinct customer once; COUNTA counts them.
    notes: >-
      UNIQUE needs Microsoft 365 or Excel 2021+. If the range may contain blank cells, filter
      them out first, otherwise the blank counts as one value: `=COUNTA(UNIQUE(FILTER(A2:A100,
      A2:A100<>"")))`. For older Excel use the SUMPRODUCT/COUNTIF formula below; it gets slow
      above a few thousand rows because it counts every value against every other value.
    alternatives:
      - label: Older Excel versions
        formula: '=SUMPRODUCT(1/COUNTIF(A2:A8, A2:A8))'
      - label: Older Excel, range with blanks
        formula: '=SUMPRODUCT((A2:A8<>"")/COUNTIF(A2:A8, A2:A8&""))'
    diff: >-
      In Excel, use COUNTA(UNIQUE(...)) in Microsoft 365, or SUMPRODUCT(1/COUNTIF(...)) in older
      versions; Excel has no COUNTUNIQUE.
  sheets:
    formula: '=COUNTUNIQUE(A2:A8)'
    explain: >-
      COUNTUNIQUE is a Google Sheets function that counts distinct values directly and ignores
      empty cells.
    notes: >-
      Google Sheets has a dedicated COUNTUNIQUE function, which is the simplest choice. For
      distinct values that meet a condition, use COUNTUNIQUEIFS (for example distinct customers
      in one region: `=COUNTUNIQUEIFS(A2:A8, B2:B8, "East")`). The UNIQUE function in Sheets also
      supports the exactly_once argument, so `=COUNTA(UNIQUE(A2:A8, FALSE, TRUE))` counts values
      that appear only once.
    alternatives:
      - label: Values that appear exactly once
        formula: '=COUNTA(UNIQUE(A2:A8, FALSE, TRUE))'
    diff: >-
      Google Sheets has a dedicated COUNTUNIQUE function, which ignores blank cells, and COUNTUNIQUEIFS for counting with conditions.
  example:
    intro: Seven orders from four different customers.
    grid:
      - [Customer, null, Question, Count]
      - [Acme, null, Distinct customers]
      - [Globex, null, Classic formula]
      - [Acme, null, Ordered exactly once]
      - [Initech]
      - [Globex]
      - [Acme]
      - [Umbrella]
    checks:
      - cell: D2
        excel: '=COUNTA(UNIQUE(A2:A8))'
        sheets: '=COUNTUNIQUE(A2:A8)'
        array: true
        result: 4
      - cell: D3
        excel: '=SUMPRODUCT(1/COUNTIF(A2:A8, A2:A8))'
        result: 4
      - cell: D4
        label: Initech and Umbrella
        excel: '=COUNTA(UNIQUE(A2:A8, FALSE, TRUE))'
        array: true
        result: 2
  steps:
    - '`UNIQUE(A2:A8)` returns {Acme; Globex; Initech; Umbrella}.'
    - '`COUNTA` counts the four items.'
    - 'In the classic formula, `COUNTIF(A2:A8, A2:A8)` returns how often each value occurs: {3;2;3;1;2;3;1}.'
    - '`1/` turns those into fractions (each Acme contributes 1/3), so each customer adds up to exactly 1. SUMPRODUCT adds them: 4.'
    - 'UNIQUE''s third argument (exactly_once = TRUE) returns only values that occur once.'
  errors:
    - error: '#DIV/0! in the classic formula'
      cause: The range contains blank cells, and COUNTIF of a blank returns 0.
      fix: 'Use the blank-safe version: =SUMPRODUCT((A2:A8<>"")/COUNTIF(A2:A8, A2:A8&"")).'
    - error: Count is one too high
      cause: A blank cell inside the range was counted as a unique value by UNIQUE.
      fix: Wrap the range in FILTER(..., range<>"") before UNIQUE.
    - error: '"Acme" and "Acme " counted separately'
      cause: Trailing spaces make the values different.
      fix: Clean the column with TRIM first.
  faq:
    - q: Is UNIQUE case-sensitive?
      a: No. "acme" and "Acme" are treated as the same value in both Excel and Google Sheets.
    - q: How do I count unique values with a condition?
      a: In Excel 365 use =COUNTA(UNIQUE(FILTER(A2:A8, B2:B8="East"))); in Google Sheets use COUNTUNIQUEIFS.
    - q: How do I list the unique values instead of counting them?
      a: Use =UNIQUE(A2:A8) in Excel 365 or Google Sheets; it spills the distinct values down the column. Wrap it in SORT for an alphabetical list, e.g. =SORT(UNIQUE(A2:A8)).
  related: [countif, countifs, lookup-multiple-values, textjoin]

- id: averageif
  category: conditional
  slugs: {excel: averageif-excel, sheets: averageif-google-sheets}
  title: How to Use AVERAGEIF
  summary: >-
    AVERAGEIF returns the average of the numbers that meet one condition, such as the average
    sale in one region or the average of all values above a threshold. This page walks through
    four worked examples, explains how blanks and zeros are treated, and shows how to stop the
    #DIV/0! error when nothing matches.
  problem: >-
    Your sales list has a Region and an amount for every deal. You want the average deal size per
    region, the average of large deals only, and a safe result for regions that have no deals yet,
    without filtering the list or building a helper column.
  excel:
    formula: '=AVERAGEIF(A2:A7, E2, C2:C7)'
    explain: >-
      Syntax: `AVERAGEIF(range, criteria, [average_range])`. Check A2:A7 against the value in E2
      and average the matching amounts in C2:C7.
    notes: >-
      Criteria follow the same rules as SUMIF and COUNTIF: operators go in quotes (`">500"`),
      cell references are joined with & (`">"&G1`), and wildcards work (`"E*"`). Empty cells in
      the average range are ignored, but zeros are included, so a 0 entered for "no sale" pulls
      the average down. When no cell matches, AVERAGEIF divides by zero and returns #DIV/0!; wrap
      it in IFERROR to show 0 or a dash instead. For two or more conditions use AVERAGEIFS, which,
      like SUMIFS, puts the average range first.
    alternatives:
      - label: Two conditions with AVERAGEIFS
        formula: '=AVERAGEIFS(C2:C7, A2:A7, "East", C2:C7, ">500")'
      - label: Hide #DIV/0! when nothing matches
        formula: '=IFERROR(AVERAGEIF(A2:A7, "South", C2:C7), 0)'
    diff: >-
      Excel uses the identical syntax and the same handling of blanks, zeros and #DIV/0!.
  sheets:
    formula: '=AVERAGEIF(A2:A7, E2, C2:C7)'
    explain: >-
      Same syntax in Google Sheets: `AVERAGEIF(criteria_range, criterion, [average_range])`.
    notes: >-
      AVERAGEIF works the same way in Google Sheets, including wildcards and the #DIV/0! result
      when nothing matches. If you need the average for every region at once, a single QUERY
      builds the whole summary table and adds new regions automatically:
      `=QUERY(A2:C7, "select A, avg(C) group by A label avg(C) 'Average'", 0)`. For conditions
      that criteria strings cannot express, average a FILTER result instead, for example
      `=AVERAGE(FILTER(C2:C7, REGEXMATCH(A2:A7, "^(East|West)$")))`.
    alternatives:
      - label: Average for every region in one formula
        formula: '=QUERY(A2:C7, "select A, avg(C) group by A label avg(C) ''Average''", 0)'
      - label: Average with a regular-expression condition
        formula: '=AVERAGE(FILTER(C2:C7, REGEXMATCH(A2:A7, "^(East|West)$")))'
    diff: >-
      Google Sheets uses the same syntax. QUERY can also return the average for every category in
      one formula.
  example:
    intro: Six deals in three regions; there are no deals in South yet.
    grid:
      - [Region, Rep, Sales, null, Criteria, Average]
      - [East, Kim, 1200, null, East]
      - [West, Ruiz, 950, null, '>500']
      - [East, Patel, 300, null, '<>East']
      - [North, Lee, 870, null, South]
      - [West, Diaz, 410]
      - [East, Cho, 600]
    checks:
      - cell: F2
        label: average for the region in E2
        excel: '=AVERAGEIF(A2:A7, E2, C2:C7)'
        result: 700
      - cell: F3
        label: average of deals over 500 (no average_range needed)
        excel: '=AVERAGEIF(C2:C7, ">500")'
        result: 905
      - cell: F4
        label: every region except East, rounded to 2 decimals
        excel: '=ROUND(AVERAGEIF(A2:A7, "<>East", C2:C7), 2)'
        result: 743.33
      - cell: F5
        label: no matching rows, so IFERROR returns 0
        excel: '=IFERROR(AVERAGEIF(A2:A7, E5, C2:C7), 0)'
        result: 0
  steps:
    - '`A2:A7` is the range tested against the condition; here, the Region column.'
    - '`E2` holds the condition, East. It could also be typed directly as `"East"`, or be an operator such as `">500"`.'
    - '`C2:C7` is the range to average. Only rows where the region is East are used: (1200 + 300 + 600) / 3 = 700.'
    - 'When the tested range and the numbers are the same column, leave the third argument out: `=AVERAGEIF(C2:C7, ">500")` averages 1200, 950, 870 and 600 to get 905.'
    - '`"<>East"` averages every other region: (950 + 870 + 410) / 3 = 743.333…, which ROUND turns into 743.33.'
    - 'South has no deals, so AVERAGEIF would return #DIV/0!. IFERROR replaces it with 0.'
  errors:
    - error: '#DIV/0!'
      cause: No cell meets the condition, or every matching cell in the average range is blank or text.
      fix: Check the criterion for typos and extra spaces, then wrap the formula in IFERROR, e.g. =IFERROR(AVERAGEIF(...), 0).
    - error: Average is too low
      cause: Zeros were entered for missing values, and zeros are included in the average while blanks are not.
      fix: Leave missing values blank, or exclude zeros with AVERAGEIFS, e.g. =AVERAGEIFS(C2:C7, A2:A7, "East", C2:C7, "<>0").
    - error: Wrong average
      cause: The average range has a different size or starts on a different row than the criteria range.
      fix: Make both ranges cover the same rows, such as A2:A7 and C2:C7.
  faq:
    - q: What is the difference between AVERAGEIF and AVERAGEIFS?
      a: AVERAGEIF takes one condition and puts the average range last; AVERAGEIFS takes one or more conditions and puts the average range first.
    - q: Does AVERAGEIF ignore blank cells?
      a: Yes, blank cells in the average range are skipped, but cells containing 0 are counted.
    - q: How do I average values between two numbers?
      a: Use AVERAGEIFS with the same column twice, e.g. =AVERAGEIFS(C2:C7, C2:C7, ">=400", C2:C7, "<=1000").
  related: [sumif, countif, sumifs, weighted-average, div0-error]

- id: remove-duplicates-formula
  category: conditional
  slugs: {excel: remove-duplicates-formula-excel, sheets: remove-duplicates-formula-google-sheets}
  title: Remove Duplicates with a Formula
  summary: >-
    List each distinct value from a column without using the Remove Duplicates button, so the
    unique list updates when the source data changes. This page covers UNIQUE in modern Excel,
    the same function in Google Sheets, sorting the result, and pulling values that appear only
    once.
  problem: >-
    A city column repeats names across many rows. You need a clean list of cities for a dropdown
    or summary, and you want it to stay correct when new rows are added, without running Data >
    Remove Duplicates by hand each time.
  excel:
    formula: '=UNIQUE(A2:A9)'
    explain: >-
      UNIQUE returns each distinct value from A2:A9 once, in the order first seen, and spills the
      list down the column.
    notes: >-
      UNIQUE needs Microsoft 365 or Excel 2021. Blanks inside the range count as one unique value,
      so filter them out when needed: `=UNIQUE(FILTER(A2:A100, A2:A100<>""))`. The second argument
      `by_col` is rarely needed for a single column; the third, `exactly_once`, keeps only values
      that appear one time. Wrap with SORT for an alphabetical list:
      `=SORT(UNIQUE(A2:A9))`. Older Excel has no UNIQUE; use a helper column with COUNTIF, or the
      Data > Remove Duplicates command for a one-off static list. UNIQUE of several columns returns
      distinct row combinations, which is useful for unique city/region pairs.
    alternatives:
      - label: Alphabetical unique list
        formula: '=SORT(UNIQUE(A2:A9))'
      - label: Values that appear exactly once
        formula: '=UNIQUE(A2:A9, FALSE, TRUE)'
      - label: Skip blanks
        formula: '=UNIQUE(FILTER(A2:A9, A2:A9<>""))'
    diff: >-
      In Excel, UNIQUE is available in Microsoft 365 and Excel 2021. Older versions need a helper
      column or the Remove Duplicates command on the Data tab.
  sheets:
    formula: '=UNIQUE(FILTER(A2:A9, A2:A9<>""))'
    explain: >-
      FILTER drops blank cells first, then UNIQUE returns each remaining city once in first-seen
      order.
    notes: >-
      Google Sheets has had UNIQUE for a long time and accepts open-ended ranges such as A2:A, so
      new rows are included automatically when you use `=UNIQUE(FILTER(A2:A, A2:A<>""))`. The
      arguments match Excel: `UNIQUE(range, [by_col], [exactly_once])`. For a sorted distinct list
      you can also use QUERY: `=QUERY(A2:A9, "select A where A is not null group by A order by A", 0)`.
      QUERY is handy when you want distinct values plus a count in one step. Data > Data cleanup >
      Remove duplicates still exists for a one-time static cleanup, but a formula stays live.
    alternatives:
      - label: Open-ended range for growing lists
        formula: '=UNIQUE(FILTER(A2:A, A2:A<>""))'
      - label: Distinct cities sorted with QUERY
        formula: '=QUERY(A2:A9, "select A where A is not null group by A order by A", 0)'
      - label: Values that appear exactly once
        formula: '=UNIQUE(A2:A9, FALSE, TRUE)'
    diff: >-
      Google Sheets uses UNIQUE the same way and also supports QUERY for distinct values. Open-ended
      ranges inside FILTER keep the list up to date as rows are added.
  example:
    intro: Eight city rows with repeats; the unique list should keep first-seen order.
    grid:
      - [City, null, Unique, Sorted, Once only]
      - [Seattle]
      - [Portland]
      - [Seattle]
      - [Denver]
      - [Portland]
      - [Austin]
      - [Seattle]
      - [Denver]
    checks:
      - cell: C2
        label: unique list in first-seen order
        excel: '=UNIQUE(A2:A9)'
        array: true
        spill_cells: [C2, C3, C4, C5]
        spill_results: [Seattle, Portland, Denver, Austin]
      - cell: D2
        label: alphabetical unique list
        excel: '=SORT(UNIQUE(A2:A9))'
        array: true
        spill_cells: [D2, D3, D4, D5]
        spill_results: [Austin, Denver, Portland, Seattle]
      - cell: E2
        label: cities that appear exactly once
        excel: '=UNIQUE(A2:A9, FALSE, TRUE)'
        array: true
        spill_cells: [E2]
        spill_results: [Austin]
  steps:
    - '`UNIQUE(A2:A9)` scans the city column and keeps the first occurrence of each name: Seattle, Portland, Denver, Austin.'
    - 'Later repeats of Seattle, Portland and Denver are dropped. The result spills into C2:C5; only C2 holds the formula.'
    - '`SORT(UNIQUE(A2:A9))` returns the same four cities in alphabetical order: Austin, Denver, Portland, Seattle.'
    - 'The third argument TRUE means exactly_once. Only Austin appears once in the source, so E2 shows Austin alone.'
    - 'When the source gains a new city, the spilled list grows automatically. Clear cells below the formula so the spill is not blocked.'
  errors:
    - error: '#SPILL!'
      cause: A cell in the spill range already has a value, or the formula sits inside an Excel Table column that cannot spill.
      fix: Clear the blocking cells, or move the formula outside the table.
    - error: Extra blank in the unique list
      cause: The source range includes empty cells, and UNIQUE treats blank as a value.
      fix: Wrap the range in FILTER(..., range<>"") before UNIQUE.
    - error: '#NAME?'
      cause: Excel 2019 or older does not have UNIQUE.
      fix: Use Microsoft 365 / Excel 2021, or build a static list with Data > Remove Duplicates.
  faq:
    - q: Does UNIQUE remove duplicate rows across several columns?
      a: Yes. Give it a multi-column range such as A2:B20 and it returns distinct combinations of those columns.
    - q: How is this different from Data > Remove Duplicates?
      a: The button permanently deletes rows from the sheet. UNIQUE leaves the source alone and builds a live list elsewhere.
    - q: How do I count duplicates instead of removing them?
      a: Use COUNTIF, e.g. =COUNTIF(A:A, A2) in a helper column, or see the count-unique page for distinct counts.
  related: [count-unique, textjoin, lookup-multiple-values, countif]

- id: running-total
  category: conditional
  slugs: {excel: running-total-excel, sheets: running-total-google-sheets}
  title: How to Calculate a Running Total
  summary: >-
    A running total (cumulative sum) adds each new row to everything above it. The portable pattern
    is an expanding SUM with a locked start cell — `=SUM($B$2:B2)` filled down — so each row shows
    year-to-date sales, spend, or inventory movement without a pivot table.
  problem: >-
    A daily sales log needs a cumulative column that updates when amounts change. People retype
    totals by hand, use a plain SUM of the whole column on every row (so every row shows the grand
    total), or forget to lock the starting cell and break the fill-down.
  excel:
    formula: '=SUM($B$2:B2)'
    explain: >-
      Lock the first amount with `$B$2` and leave the end reference relative (`B2`). Fill down so
      row 3 becomes `=SUM($B$2:B3)`, row 4 becomes `=SUM($B$2:B4)`, and so on.
    notes: >-
      The expanding-range pattern works in every Excel version and in LibreOffice. Put the formula
      beside the first data row, then double-click the fill handle. Absolute-relative mix is the
      whole trick: `$B$2` never moves; `B2` grows. An equivalent row-math form is
      `=N(C1)+B2` when C is the running-total column and C1 is a header (N turns text into 0) —
      useful when you want each row to add only the prior total plus this row’s amount. Tables
      (`=SUM(INDEX([Sales],1):[@Sales])`) keep the range correct as the table grows in modern
      Excel. Do not put `=SUM($B$2:$B$6)` on every row — that repeats the grand total. For a
      running total that resets each month, add a helper that checks the month and restarts the
      sum, or use SUMIFS with a “date ≤ this row and same month” pattern. SCAN in Excel 365 can
      spill a cumulative column in one formula, but the expanding SUM remains the most portable
      teaching pattern for mixed Excel / Sheets files.
    alternatives:
      - label: Prior total plus this row
        formula: '=N(C1)+B2'
      - label: Excel 365 SCAN spill
        formula: '=SCAN(0, B2:B6, LAMBDA(a,b, a+b))'
      - label: Grand total (not running — contrast)
        formula: '=SUM($B$2:$B$6)'
    diff: >-
      Google Sheets uses the same expanding SUM. It also offers SCAN and ARRAYFORMULA patterns for
      a single spilled cumulative column.
  sheets:
    formula: '=SUM($B$2:B2)'
    explain: >-
      Same expanding SUM in Google Sheets. Lock the start, keep the end relative, then fill down.
    notes: >-
      Sheets users often prefer one spilled formula instead of fill-down. SCAN is clear and
      Excel-365-familiar:
      `=SCAN(0, B2:B6, LAMBDA(a, b, a+b))`. ARRAYFORMULA with a running MMULT trick also works but
      is harder to read — prefer SCAN or the classic expanding SUM when teammates edit the file.
      Open-ended sources pair well with SCAN over `B2:B` only when you wrap blanks, otherwise
      trailing zeros appear. When the sheet must round-trip to desktop Excel without LAMBDA, keep
      `=SUM($B$2:B2)` as the primary column and treat SCAN as an optional Sheets-side upgrade.
      Freeze the cumulative column’s first formula row so inserts above the block do not shift the
      locked start unexpectedly. Format as Number or Accounting so long cumulatives stay readable.
    alternatives:
      - label: Spilled running total with SCAN
        formula: '=SCAN(0, B2:B6, LAMBDA(a, b, a+b))'
      - label: Prior total plus this row
        formula: '=N(C1)+B2'
      - label: ARRAYFORMULA cumulative (advanced)
        formula: '=ARRAYFORMULA(IF(B2:B6="",,MMULT(TRANSPOSE((ROW(B2:B6)<=TRANSPOSE(ROW(B2:B6)))*B2:B6), SIGN(B2:B6)^0)))'
    diff: >-
      Excel fill-down with expanding SUM is the shared baseline; Excel 365 also has SCAN like Sheets.
  example:
    intro: >-
      Five weekdays of sales. The running-total column starts at 100 and grows to the week total
      of 650. Each check uses the expanding SUM filled down.
    grid:
      - [Day, Sales, Running total]
      - [Mon, 100]
      - [Tue, 150]
      - [Wed, 80]
      - [Thu, 200]
      - [Fri, 120]
    checks:
      - cell: C2
        label: running total filled down
        excel: '=SUM($B$2:B2)'
        fill: [C2, C3, C4, C5, C6]
        results: [100, 250, 330, 530, 650]
      - cell: C8
        label: week grand total for contrast
        excel: '=SUM(B2:B6)'
        result: 650
      - cell: C9
        label: prior-plus-this-row style on first data row
        excel: '=N(C1)+B2'
        result: 100
  steps:
    - Enter dates or labels in column A and the amounts to accumulate in column B.
    - 'In C2 type `=SUM($B$2:B2)` — note the $ on the starting cell only.'
    - Fill the formula down beside every amount row; each end reference expands automatically.
    - Confirm the last running total equals `=SUM(B2:B6)` for the same block.
    - "Optional: switch power users to SCAN for a single spilled cumulative column."
  errors:
    - error: Every row shows the same grand total
      cause: Both ends of the SUM were absolute (`$B$2:$B$6`) or the formula summed the whole column.
      fix: Use `=SUM($B$2:B2)` so only the start stays locked.
    - error: Totals break after inserting a row at the top
      cause: The locked start no longer points at the first amount.
      fix: Point $ at the real first data cell again, or use a Table structured reference.
    - error: First running-total cell shows an error or wrong number
      cause: The formula referenced a header without N(), or pointed one row too high.
      fix: Start on the first amount row; use =N(C1)+B2 only when C1 is a text header.
    - error: Cumulative includes future rows
      cause: The end reference was the full column (B:B) instead of the current row.
      fix: Keep a relative end cell that matches the formula’s row.
  faq:
    - q: How is a running total different from a regular SUM?
      a: SUM of the whole block repeats the same grand total on every row. A running total grows row by row so you can see progress through the period.
    - q: Does this work inside an Excel Table?
      a: Yes. Use a structured expanding reference such as =SUM(INDEX([Sales],1):[@Sales]) so new table rows keep the pattern.
    - q: Can I reset the total each month?
      a: Add a month helper column and restart when the month changes, or use SUMIFS with “date ≤ this row” and “same month” criteria.
    - q: What about Google Sheets SCAN?
      a: SCAN spills the whole cumulative column from one cell. Use it when everyone stays in Sheets or Excel 365; keep expanding SUM for maximum portability.
  related: [sumif, sumifs, sum-by-month, averageif, countif]

- id: sumproduct
  category: conditional
  slugs: {excel: sumproduct-excel, sheets: sumproduct-google-sheets}
  title: How to Use SUMPRODUCT
  summary: >-
    SUMPRODUCT multiplies aligned arrays and adds the products. Use it for weighted totals
    (quantity × price) and for conditional sums with boolean tests — a portable pattern that works
    when SUMIFS is awkward or you need several conditions expressed as array logic.
  problem: >-
    A line-item list has quantity and unit price, or region flags beside amounts. People multiply
    in a helper column then SUM, forget that TRUE/FALSE must coerce to 1/0, or paste an array
    formula that needs Ctrl+Shift+Enter in older Excel when SUMPRODUCT would have done it alone.
  excel:
    formula: '=SUMPRODUCT(B2:B6, C2:C6)'
    explain: >-
      Syntax: `SUMPRODUCT(array1, [array2], …)`. Matching positions are multiplied, then those
      products are added. With one array it behaves like SUM of that array.
    notes: >-
      Classic weighted total: `=SUMPRODUCT(Qty, Price)` avoids a helper column. Conditional sum
      multiplies a boolean test by the values:
      `=SUMPRODUCT((Region="East")*(Qty)*(Price))`. In Excel, the `*` operator coerces TRUE/FALSE
      to 1/0; writing `=SUMPRODUCT((Region="East"), Amount)` with a comma does **not** treat the
      boolean the same way — prefer `*` for conditions. Arrays must be the same height; a
      mismatched range returns #VALUE!. SUMPRODUCT is slower than SUMIFS on huge sheets, so prefer
      SUMIFS for simple criteria and keep SUMPRODUCT for weighted products, OR-style logic, or
      criteria that SUMIFS cannot express cleanly. Double unary `--` also coerces booleans:
      `=SUMPRODUCT(--(Region="East"), Amount)`. Do not include header rows inside the arrays.
      Empty numeric cells count as 0 in multiplication.
    alternatives:
      - label: East revenue (qty × price)
        formula: '=SUMPRODUCT((A2:A6="East")*(B2:B6)*(C2:C6))'
      - label: Conditional sum with double unary
        formula: '=SUMPRODUCT(--(A2:A6="East"), B2:B6*C2:C6)'
      - label: Plain SUMIF for amount-only condition
        formula: '=SUMIF(A2:A6, "East", D2:D6)'
    diff: >-
      Google Sheets supports SUMPRODUCT the same way. Array formulas are native there, so FILTER
      or QUERY can replace some conditional SUMPRODUCT patterns.
  sheets:
    formula: '=SUMPRODUCT(B2:B6, C2:C6)'
    explain: >-
      Same SUMPRODUCT behaviour in Google Sheets for weighted totals and boolean conditional
      products.
    notes: >-
      Sheets evaluates array expressions naturally, so
      `=SUMPRODUCT((A2:A6="East")*(B2:B6)*(C2:C6))` works without special keystrokes. For readable
      conditional totals many Sheets users switch to
      `=SUM(FILTER(B2:B6*C2:C6, A2:A6="East"))` or a QUERY pivot. Keep SUMPRODUCT when the file
      must stay Excel-compatible or when you are teaching the classic weighted-sum pattern.
      Open-ended ranges (`B2:B`) inside SUMPRODUCT can drag in thousands of empty rows and slow
      the sheet — bound the range to real data or use a mixed open FILTER. Locale decimal
      separators affect display only. If a condition returns unexpected zeros, check for trailing
      spaces in region labels (`TRIM`) before comparing.
    alternatives:
      - label: East revenue with FILTER
        formula: '=SUM(FILTER(B2:B6*C2:C6, A2:A6="East"))'
      - label: East revenue with SUMPRODUCT
        formula: '=SUMPRODUCT((A2:A6="East")*(B2:B6)*(C2:C6))'
      - label: Weighted total growing column (bounded)
        formula: '=SUMPRODUCT(B2:B6, C2:C6)'
      - label: QUERY summary by region
        formula: '=QUERY(A1:C6, "select A, sum(B*C) where A is not null group by A", 1)'
    diff: >-
      Excel relies on SUMPRODUCT or SUMIFS; Sheets can also use FILTER/QUERY for the same totals.
  example:
    intro: >-
      Five line items with region, quantity, and unit price. SUMPRODUCT builds the weighted total
      and the East-only revenue without a helper column.
    grid:
      - [Region, Qty, Price, null, Metric, Value]
      - [East, 3, 10]
      - [West, 5, 8]
      - [East, 2, 12]
      - [East, 4, 7]
      - [West, 6, 9]
    checks:
      - cell: F2
        label: weighted total qty × price
        excel: '=SUMPRODUCT(B2:B6, C2:C6)'
        result: 176
      - cell: F3
        label: East revenue via boolean SUMPRODUCT
        excel: '=SUMPRODUCT((A2:A6="East")*(B2:B6)*(C2:C6))'
        result: 82
      - cell: F4
        label: West revenue via boolean SUMPRODUCT
        excel: '=SUMPRODUCT((A2:A6="West")*(B2:B6)*(C2:C6))'
        result: 94
      - cell: F5
        label: East quantity only (compare with SUMIF)
        excel: '=SUMIF(A2:A6, "East", B2:B6)'
        result: 9
  steps:
    - Lay out matching columns for factors you will multiply (Qty beside Price, or Region beside Amount).
    - 'For a weighted total type `=SUMPRODUCT(B2:B6, C2:C6)` — no helper column required.'
    - 'For a conditional total multiply by a test: `=SUMPRODUCT((A2:A6="East")*(B2:B6)*(C2:C6))`.'
    - Confirm array heights match; include only data rows, not headers.
    - Prefer SUMIFS for simple single-column conditions on very large sheets.
  errors:
    - error: '#VALUE!'
      cause: The arrays have different dimensions, or text that cannot coerce sat inside a product.
      fix: Use equal-sized ranges and keep factors numeric (or coerce with VALUE / N).
    - error: Conditional SUMPRODUCT returns 0 unexpectedly
      cause: Used a comma between the boolean and the amounts instead of `*`, or region text does not match exactly.
      fix: Write (condition)*(values) or --(condition), and trim criteria text.
    - error: Result doubles after adding a helper column
      cause: Both the helper products and SUMPRODUCT are included in a downstream SUM.
      fix: Use either helper×SUM or SUMPRODUCT, not both on the same numbers.
    - error: Slow workbook
      cause: SUMPRODUCT over entire columns (B:B) on tens of thousands of rows.
      fix: Limit ranges to the used block, or switch simple cases to SUMIFS.
  faq:
    - q: When should I use SUMPRODUCT instead of SUMIFS?
      a: Use SUMIFS for ordinary conditional sums on large data. Use SUMPRODUCT when you need to multiply columns (weighted totals) or express OR / array logic that SUMIFS cannot.
    - q: Why multiply by (Region="East")?
      a: The comparison returns TRUE/FALSE. Multiplying coerces TRUE to 1 and FALSE to 0 so only matching rows contribute to the total.
    - q: Does SUMPRODUCT need Ctrl+Shift+Enter?
      a: No. SUMPRODUCT is designed to accept array calculations in normal Enter mode in classic Excel.
    - q: Can SUMPRODUCT do a weighted average?
      a: Yes. Divide SUMPRODUCT(values, weights) by SUM(weights). See the weighted-average page for a full walkthrough.
  related: [sumif, sumifs, weighted-average, averageif, countif]

- id: counta
  category: conditional
  slugs:
    excel: counta-excel
    sheets: counta-google-sheets
  title: How to Count Non-Blank Cells with COUNTA
  summary: >-
    COUNTA counts every cell that is not empty: text, numbers, dates, TRUE or FALSE, error
    values, and even a formula that looks blank because it returned an empty string ("").
    That last case is the usual surprise. COUNT, by contrast, counts only numbers (including
    dates). Use COUNTA when you need how many cells in a list actually have something in
    them — filled names, submitted replies, or a column that mixes text and numbers. To
    treat "" as empty, count with `SUMPRODUCT(--(A2:A6<>""))` or `COUNTIF(A2:A6,"<>")`
    instead. The function is the same in Excel and Google Sheets; Excel can limit the count
    to visible rows with SUBTOTAL, and Sheets must not confuse COUNTA with an unchecked
    checkbox, which stores FALSE and therefore counts as filled.
  problem: >-
    You have a short score list with a missing score, a genuine zero, and a comment hidden
    by a formula that returns "". You want the number of names entered, the number of
    scores that were actually recorded (including zero), and you need to understand why
    COUNTA still counts that hidden comment.
  excel:
    formula: '=COUNTA(B2:B6)'
    explain: >-
      Syntax: `COUNTA(value1, [value2], ...)`. `=COUNTA(B2:B6)` counts the scores that
      are not empty. Ben's score is blank and is skipped; Cara's 0 is a real number, so it
      is counted. The result is 4. COUNT on the same range also returns 4 here, because
      every non-empty score happens to be numeric — the two functions diverge as soon as
      a cell holds text, a boolean, an error, or `""`.
    notes: >-
      COUNTA is available in every Excel version. It counts cells, not unique values and
      not rows that merely look filled. A formula that returns `""` still lives in the
      cell, so COUNTA includes it; a truly empty cell is omitted. A cell that contains
      only a space or an apostrophe is also counted, because that is text — TRIM the
      column first if an import added padding. Zero is never empty, so a recorded 0
      increments COUNTA and COUNT alike. Error values such as `#N/A` or `#DIV/0!` are
      also counted. When you want to ignore hidden or filtered-out rows, use
      `=SUBTOTAL(3, B2:B6)` or `=AGGREGATE(3, 5, B2:B6)` instead of a plain COUNTA
      (function number 3 is COUNTA; 2 is COUNT). `=SUMPRODUCT(--(B2:B6<>""))` is the
      usual way to count non-empty cells while treating `""` as empty, which is the
      opposite of COUNTA. In an Excel Table you can write `=COUNTA(Table1[Score])` and
      the range will grow with the table. The status bar "Count" is COUNTA; "Numerical
      Count" is COUNT. Bound the range to the data — `COUNTA(B:B)` also counts the
      header. To count distinct filled values, use UNIQUE or the [count unique](../{count-unique}/)
      pattern rather than COUNTA alone.
    alternatives:
      - label: Visible non-blank cells only (filtered list)
        formula: '=SUBTOTAL(3, B2:B6)'
      - label: Treat "" as empty
        formula: '=SUMPRODUCT(--(B2:B6<>""))'
      - label: Count filled comments, including ""
        formula: '=COUNTA(C2:C6)'
      - label: Count numbers only
        formula: '=COUNT(B2:B6)'
    diff: >-
      Google Sheets uses the same COUNTA rule, including counting `""` and 0. Sheets has
      no SUBTOTAL-style visible-row count in everyday use; it typically uses open-ended
      ranges such as B2:B (safe for COUNTA, because unused rows are empty) and must treat
      an unchecked checkbox as FALSE, which COUNTA counts as filled.
  sheets:
    formula: '=COUNTA(B2:B6)'
    explain: >-
      Identical syntax in Google Sheets: `COUNTA(value1, [value2], ...)` counts the
      non-empty scores in B2:B6 and returns 4, including Cara's 0 and skipping Ben's
      blank cell.
    notes: >-
      Sheets COUNTA matches Excel for text, numbers, dates, errors, zero, and the
      empty-string gotcha: a formula that returns `""` is counted. An open-ended range
      such as `=COUNTA(B2:B)` is the usual Sheets pattern and is safe here, because
      unused rows at the bottom are empty and do not increment the count — the opposite
      of COUNTBLANK, which would add every unused row. A Sheets checkbox stores TRUE or
      FALSE, never a blank, so COUNTA on a checkbox column equals the number of rows,
      not the number of ticks; count checks with `=COUNTIF(B2:B, TRUE)` instead. To
      count non-blank cells in each row of a block, use
      `=BYROW(B2:D, LAMBDA(r, COUNTA(r)))`, or an ARRAYFORMULA of `(B2:B<>"")+(C2:C<>"")`
      when you also want `""` treated as empty. FILTER plus COUNTA is handy when only
      some rows should be included, for example `=COUNTA(FILTER(B2:B6, A2:A6<>""))`.
      If the file must open in Excel, keep the bounded form `=COUNTA(B2:B6)` and skip
      BYROW and checkbox assumptions.
    alternatives:
      - label: Whole column, unused rows are safely ignored
        formula: '=COUNTA(B2:B)'
      - label: Count checked checkboxes only
        formula: '=COUNTIF(B2:B6, TRUE)'
      - label: Non-blank count for each row
        formula: '=BYROW(B2:D6, LAMBDA(r, COUNTA(r)))'
      - label: Count numbers only
        formula: '=COUNT(B2:B6)'
    diff: >-
      Excel uses the same COUNTA formula. For visible rows in a filtered list, Excel
      uses SUBTOTAL(3, …) or AGGREGATE; Sheets uses a bounded or open column range and
      has to handle checkboxes and BYROW separately. The empty-string gotcha is the same
      on both platforms.
  example:
    intro: >-
      Five people with scores and comments. Ben has no score. Cara's score is 0, which
      still counts. C5 holds a formula that returns an empty string, so the comment looks
      blank but COUNTA still includes it. D2 counts names, D3 counts scores with COUNTA,
      D4 counts scores with COUNT, D5 counts comments, and D6 shows that COUNT ignores
      the text comments entirely.
    grid:
      - [Name, Score, Comment, Result]
      - [Ann, 85, good]
      - [Ben]
      - [Cara, 0]
      - [Dan, 90]
      - [Eve, 70]
    checks:
      - cell: C5
        label: a comment formula that displays as blank
        excel: '=""'
        result: ""
      - cell: D2
        label: how many names were entered
        excel: '=COUNTA(A2:A6)'
        result: 5
      - cell: D3
        label: how many scores were recorded, including zero
        excel: '=COUNTA(B2:B6)'
        result: 4
      - cell: D4
        label: COUNT on the same scores, numbers only
        excel: '=COUNT(B2:B6)'
        result: 4
      - cell: D5
        label: comments including the hidden ""
        excel: '=COUNTA(C2:C6)'
        result: 2
      - cell: D6
        label: COUNT ignores text comments
        excel: '=COUNT(C2:C6)'
        result: 0
  steps:
    - 'Click the result cell and type `=COUNTA(`.'
    - 'Select the range you want to count, for example B2:B6, and close the parenthesis. Press Enter.'
    - '`=COUNTA(B2:B6)` returns 4. Ben''s score is skipped because the cell is empty; Cara''s 0 is counted because zero is a value.'
    - '`=COUNTA(C2:C6)` returns 2: Ann''s "good" and the formula in C5 that returned `""`. The hidden comment is the gotcha — the cell looks empty, but COUNTA still counts it.'
    - '`=COUNT(B2:B6)` also returns 4 here, because every filled score is numeric, but `=COUNT(C2:C6)` returns 0, because COUNT ignores text. Use COUNT when you only want numbers; use COUNTA when any filled cell should count. To treat `""` as empty, use `=SUMPRODUCT(--(C2:C6<>""))` instead.'
  errors:
    - error: COUNTA is one too high on a column that looks partly empty
      cause: A formula that returned `""`, a space, a non-breaking space, or an apostrophe still lives in the cell. COUNTA counts those as filled.
      fix: Clear the cells completely, TRIM padding, or count with `=SUMPRODUCT(--(A2:A6<>""))` when a hidden formula should not count.
    - error: A recorded 0 was left out of a manual tally but COUNTA includes it
      cause: Zero is a number, not a blank. COUNTA and COUNT both include it.
      fix: This is correct. To count scores above zero, use [COUNTIF](../{countif}/) with `">0"` rather than COUNTA.
    - error: The count includes the header or hundreds of extra rows
      cause: The range is a whole column (B:B) or starts on the header row.
      fix: Bound the range to the data (B2:B6), or use an Excel Table column such as `Table1[Score]`.
    - error: Filtered-out rows are still in the total
      cause: COUNTA always counts hidden and filtered rows.
      fix: In Excel use `=SUBTOTAL(3, B2:B6)` or `=AGGREGATE(3, 5, B2:B6)`. In Sheets, filter first with FILTER and then COUNTA the result.
  faq:
    - q: What is the difference between COUNTA and COUNT?
      a: COUNT counts only numbers (and dates, which are numbers). COUNTA counts every non-empty cell — text, numbers, booleans, errors, and formulas that return `""`. In the worked example both return 4 on the Score column, but only COUNTA sees the comments.
    - q: Does COUNTA count a formula that returns ""?
      a: Yes. The cell is not empty; it contains a formula. [ISBLANK](../{isblank}/) is also FALSE for that cell. Use `SUMPRODUCT(--(A2:A6<>""))` or [COUNTBLANK](../{countblank}/) when you want `""` treated as empty.
    - q: Does a zero or a space count?
      a: Yes. 0 is a number, and a space is text, so both increment COUNTA. A space does not increment COUNT. TRIM imported data if padding should not count as filled.
    - q: How do I count non-blank cells in a filtered list or a whole column?
      a: In Excel, `=SUBTOTAL(3, B2:B6)` ignores rows hidden by a filter. In Google Sheets, `=COUNTA(B2:B)` on an open-ended range is safe because unused rows are empty; do not switch that pattern to COUNTBLANK, which would count every unused row.
  related: [countblank, countif, countifs, count-unique, isblank]

- id: countblank
  category: conditional
  slugs:
    excel: countblank-excel
    sheets: countblank-google-sheets
  title: How to Count Blank Cells with COUNTBLANK
  summary: >-
    COUNTBLANK counts cells that are truly empty and cells that only look empty because a
    formula returned an empty string (""). It does not count a space, a zero, text, a date,
    or TRUE/FALSE — those are values, even when the cell looks sparse. That makes COUNTBLANK
    the opposite of [ISBLANK](../{isblank}/) on `""` (ISBLANK is FALSE for a hidden formula)
    and a counterpart to [COUNTA](../{counta}/), which counts `""` as filled. Use it to find
    missing replies, incomplete rows, or how many cells in a range still need input. The
    function is the same in Excel and Google Sheets; the Sheets trap is an open-ended range
    such as B2:B, which counts every unused row to the bottom of the sheet.
  problem: >-
    You have a five-day reply list. Tuesday was never filled in, Thursday is hidden by a
    formula that returns "", and one note cell holds only a space. You want a count of
    replies that are still missing, and you need to see why COUNTBLANK and ISBLANK disagree
    on Thursday, and why the space is not treated as blank.
  excel:
    formula: '=COUNTBLANK(B2:B6)'
    explain: >-
      Syntax: `COUNTBLANK(range)`. `=COUNTBLANK(B2:B6)` counts the reply cells that are
      empty or that contain `""`. Tuesday is a true blank and Thursday's formula returned
      `""`, so the result is 2. Monday, Wednesday and Friday have text and are not counted.
    notes: >-
      COUNTBLANK is available in every Excel version and takes a single range (it does
      not accept a list of separate areas the way COUNTA does). It counts both truly
      empty cells and formulas that return `""`, which is why it often matches what you
      see on the screen better than ISBLANK. A cell that contains only a space, a
      non-breaking space, or an apostrophe is not blank — COUNTBLANK skips it and COUNTA
      includes it; TRIM the column first if an import added padding. Zero is a number, so
      a recorded 0 is not blank. Error values are not blank either. `=COUNTIF(B2:B6, "")`
      and `=SUMPRODUCT(--(B2:B6=""))` return the same count as COUNTBLANK, including `""`.
      There is no SUBTOTAL function number for COUNTBLANK, so a filtered list needs a
      helper column or `=SUMPRODUCT((B2:B6="")*(SUBTOTAL(3, OFFSET(B2, ROW(B2:B6)-ROW(B2), 0))))`
      when you must ignore hidden rows; for a simple visible non-blank count, SUBTOTAL 3
      (COUNTA) is usually easier. Bound the range to the data. `COUNTBLANK(B:B)` counts
      every unused cell in the column, which is almost never the number you want. Use
      [COUNTA](../{counta}/) when you want filled cells, and [COUNTIF](../{countif}/) when
      the missing value should match a specific label rather than a blank.
    alternatives:
      - label: Same count with COUNTIF
        formula: '=COUNTIF(B2:B6, "")'
      - label: Same count with SUMPRODUCT
        formula: '=SUMPRODUCT(--(B2:B6=""))'
      - label: How many replies were actually filled, including ""
        formula: '=COUNTA(B2:B6)'
      - label: Truly empty only (ISBLANK)
        formula: '=ISBLANK(B3)'
    diff: >-
      Google Sheets uses the same COUNTBLANK rule, including `""` and excluding spaces.
      The important Sheets difference is range style: `=COUNTBLANK(B2:B)` on an open
      column counts every unused row to the bottom of the sheet, so you must bound the
      range or count blanks only on rows that already have a key value.
  sheets:
    formula: '=COUNTBLANK(B2:B6)'
    explain: >-
      Identical syntax in Google Sheets: `COUNTBLANK(range)` counts truly empty replies
      and cells that hold `""`. On this list that is Tuesday and Thursday, so the result
      is 2.
    notes: >-
      Sheets COUNTBLANK matches Excel for true blanks, for `""`, and for the space
      gotcha: a cell that contains only a space is not blank. The usual Sheets habit of
      writing open-ended ranges is dangerous here. `=COUNTBLANK(B2:B)` adds every unused
      row from the last reply to the bottom of the sheet, so a five-row list can return
      a count in the hundreds or thousands. Always bound the range (`B2:B6`), or count
      blanks only on rows that already have an entry in another column, for example
      `=ARRAYFORMULA(SUM(N((A2:A6<>"")*(B2:B6=""))))` to count missing replies on named
      rows. An unchecked checkbox stores FALSE, not a blank, so COUNTBLANK will not see
      it as missing; test `=COUNTIF(B2:B6, FALSE)` instead. To flag each blank reply in
      a helper column, use
      `=ARRAYFORMULA(IF(A2:A="", "", IF(B2:B="", "Missing", "")))`. If the file must
      open in Excel, keep the bounded `=COUNTBLANK(B2:B6)` and skip ARRAYFORMULA.
    alternatives:
      - label: Missing replies only on rows that have a day name
        formula: '=ARRAYFORMULA(SUM(N((A2:A6<>"")*(B2:B6=""))))'
      - label: Flag each blank reply
        formula: '=ARRAYFORMULA(IF(A2:A="", "", IF(B2:B="", "Missing", "")))'
      - label: Same count with COUNTIF
        formula: '=COUNTIF(B2:B6, "")'
      - label: How many replies were actually filled, including ""
        formula: '=COUNTA(B2:B6)'
    diff: >-
      Excel uses the same COUNTBLANK formula on a bounded range. Excel does not use
      ARRAYFORMULA; it fills a flag column down, or uses COUNTIF / SUMPRODUCT for the
      same count. Never copy a Sheets open range such as B2:B into COUNTBLANK, on either
      platform, unless you really want unused rows included.
  example:
    intro: >-
      Five weekdays of replies. Tuesday was never filled in. B5 holds a formula that
      returns "", so Thursday looks blank. C2 holds a single space. D2 counts blank
      replies with COUNTBLANK, D3 counts filled replies with COUNTA, D4 and D5 compare
      ISBLANK on Tuesday versus Thursday, and D6 shows that COUNTBLANK does not treat
      the space in C2 as blank.
    grid:
      - [Day, Reply, Note, Result]
      - [Mon, Yes, ' ']
      - [Tue]
      - [Wed, No]
      - [Thu]
      - [Fri, Yes]
    checks:
      - cell: B5
        label: a reply formula that displays as blank
        excel: '=""'
        result: ""
      - cell: D2
        label: blank replies, including ""
        excel: '=COUNTBLANK(B2:B6)'
        result: 2
      - cell: D3
        label: filled replies, including ""
        excel: '=COUNTA(B2:B6)'
        result: 4
      - cell: D4
        label: Tuesday is truly empty
        excel: '=ISBLANK(B3)'
        result: true
      - cell: D5
        label: Thursday's "" is not ISBLANK
        excel: '=ISBLANK(B5)'
        result: false
      - cell: D6
        label: a space is not a blank
        excel: '=COUNTBLANK(C2:C6)'
        result: 4
  steps:
    - 'Click the result cell and type `=COUNTBLANK(`.'
    - 'Select the range of cells that should be filled, for example B2:B6, and close the parenthesis. Press Enter.'
    - '`=COUNTBLANK(B2:B6)` returns 2: Tuesday is a true blank, and Thursday''s formula returned `""`. Monday, Wednesday and Friday have text and are not counted.'
    - '`=COUNTA(B2:B6)` returns 4 on the same range, because COUNTA includes the hidden `""` in B5. The two functions disagree by one whenever a formula has hidden its result. `=ISBLANK(B3)` is TRUE, but `=ISBLANK(B5)` is FALSE for the same reason.'
    - 'C2 holds a single space. `=COUNTBLANK(C2:C6)` returns 4, not 5: the space is text, so it is not blank, and the other four Note cells are empty. TRIM imported notes if padding should not hide a missing value. Always bound the range; a whole-column COUNTBLANK will count every unused row below the data.'
  errors:
    - error: COUNTBLANK is huge, often in the hundreds or thousands
      cause: The range is open-ended (B:B or B2:B) and every unused row under the data is genuinely blank.
      fix: Bound the range to the data (B2:B6), or count blanks only on rows that already have a value in another column.
    - error: COUNTBLANK and ISBLANK disagree on the same cell
      cause: The cell contains a formula that returned `""`. COUNTBLANK counts it as blank; ISBLANK does not.
      fix: Use COUNTBLANK (or `B5=""`) when a hidden formula should count as empty. Use ISBLANK when you need the cell to be truly empty.
    - error: A cell that looks empty was not counted
      cause: The cell holds a space, a non-breaking space, an apostrophe, a zero, or the text "NULL" from an export.
      fix: Inspect the formula bar. Use `=LEN(C2)` to confirm a space, then TRIM the column, or count with `=COUNTIF(C2:C6, "")` only after cleaning.
    - error: '#VALUE! or a count of 0 when you expected blanks'
      cause: COUNTBLANK was given several loose arguments, or the range pointed at the wrong column.
      fix: COUNTBLANK takes one range only. Recheck the address, and use COUNTA or COUNTIF if you meant to count filled cells or a specific label.
  faq:
    - q: Does COUNTBLANK count a formula that returns ""?
      a: Yes. That is the main difference from [ISBLANK](../{isblank}/), which is FALSE for the same cell. In the worked example Thursday is included in COUNTBLANK and excluded from ISBLANK.
    - q: What is the difference between COUNTBLANK and COUNTA?
      a: COUNTA counts filled cells and treats `""` as filled. COUNTBLANK counts empty-looking cells and treats `""` as empty. On the reply column they sum to 6, not 5, because B5 is counted by both. A range of five cells can therefore fail a "COUNTA + COUNTBLANK = ROWS" sanity check when `""` is present.
    - q: Does a zero or a space count as blank?
      a: No. 0 is a number, and a space is text. COUNTBLANK skips both. TRIM the cell, or test `LEN(TRIM(A2))=0`, if imported data may contain padding.
    - q: Can I use COUNTBLANK on a whole column in Google Sheets?
      a: Avoid it. `=COUNTBLANK(B2:B)` counts every unused row to the bottom of the sheet. Bound the range, or use an ARRAYFORMULA that tests blanks only on rows that already have a key value, as in the Sheets alternatives.
  related: [counta, isblank, countif, countifs, if]
