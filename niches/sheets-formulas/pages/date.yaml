# Dates & times
- id: days-between-dates
  category: date
  launch: true
  slugs: {excel: days-between-dates-excel, sheets: days-between-dates-google-sheets}
  title: How to Calculate Days Between Two Dates
  summary: >-
    Dates are stored as serial numbers, so subtracting one date from another gives the number of
    days between them. This page covers simple subtraction, the DAYS function, counting both the
    start and end day, and why the answer sometimes appears as a date.
  problem: >-
    For each project you know the start and end date and need the duration in days, both
    exclusive (difference) and inclusive (counting both days).
  excel:
    formula: '=B2-A2'
    explain: >-
      Excel stores each date as the number of days since January 1, 1900, so the difference of two
      dates is a number of days.
    notes: >-
      If the result looks like a date (e.g. 1/15/1900), the cell inherited a date format; set it to
      General or Number. DAYS(end, start) gives the same result and makes the order of arguments
      explicit. For whole months or years between dates use DATEDIF, and for working days use
      NETWORKDAYS. If either date includes a time, wrap them in INT to count calendar days only.
    alternatives:
      - label: DAYS function
        formula: '=DAYS(B2, A2)'
      - label: Calendar days when the values include times
        formula: '=INT(B2)-INT(A2)'
    diff: >-
      Excel uses the same subtraction; set the result cell to General if it shows a date.
  sheets:
    formula: '=B2-A2'
    explain: >-
      Google Sheets also stores dates as serial numbers (days since December 30, 1899), so
      subtraction works the same way.
    notes: >-
      In Google Sheets, a result that shows as a date can be fixed with Format > Number > Number.
      Sheets is stricter about dates typed as text: if your dates are left-aligned they are text,
      and subtraction returns #VALUE!. Convert them with DATEVALUE, or check File > Settings >
      Locale, because 03/04/2026 means March 4 in the United States locale and April 3 in the
      United Kingdom locale. DAYS and DATEDIF work as in Excel.
    diff: >-
      The same subtraction works in Google Sheets; if the result shows as a date, use Format >
      Number > Number.
  example:
    intro: Duration of three periods.
    grid:
      - [Start, End, Days (B-A), DAYS, Inclusive]
      - [2026-01-15, 2026-03-02]
      - [2026-02-01, 2026-02-28]
      - [2025-12-20, 2026-01-05]
    checks:
      - cell: C2
        excel: '=B2-A2'
        fill: [C2, C3, C4]
        results: [46, 27, 16]
      - cell: D2
        excel: '=DAYS(B2, A2)'
        fill: [D2, D3, D4]
        results: [46, 27, 16]
      - cell: E2
        label: counts both the start and end day
        excel: '=B2-A2+1'
        fill: [E2, E3, E4]
        results: [47, 28, 17]
  steps:
    - Each date is a whole number behind the scenes (2026-01-15 is 46037).
    - Subtracting gives the gap in days. January 15 to March 2, 2026 is 16 days left in January + 28 in February + 2 in March = 46.
    - Add 1 when both the first and the last day should count, for example for hotel nights vs. days of a trip.
    - DAYS(end, start) does the same subtraction; note that the end date comes first.
  errors:
    - error: Result shows as a date
      cause: The result cell is formatted as a date.
      fix: Format it as General / Number.
    - error: '#VALUE!'
      cause: One of the dates is text, not a real date.
      fix: Convert with DATEVALUE or re-enter it; =ISNUMBER(A2) should be TRUE.
    - error: Negative number
      cause: The start and end dates are reversed.
      fix: Swap the references, or use =ABS(B2-A2).
  faq:
    - q: How do I count only weekdays?
      a: Use NETWORKDAYS(start, end), which excludes Saturdays, Sundays and optional holidays.
    - q: How do I calculate days from a date until today?
      a: Use =TODAY()-A2. The result updates every day.
    - q: How do I calculate the difference in years or months?
      a: 'Use DATEDIF: =DATEDIF(A2, B2, "M") returns complete months and =DATEDIF(A2, B2, "Y") complete years. For a decimal number of years, use =YEARFRAC(A2, B2).'
  related: [networkdays, datedif-age, eomonth, sumifs-between-dates]

- id: datedif-age
  category: date
  launch: true
  slugs: {excel: datedif-age-excel, sheets: datedif-age-google-sheets}
  title: How to Calculate Age with DATEDIF
  summary: >-
    DATEDIF returns the number of complete years, months or days between two dates, which makes
    it the standard way to calculate age from a birth date. This page shows age in years, years
    plus months, and the quirks of this partly hidden function.
  problem: >-
    You have employees' birth dates and need their current age in complete years, plus a "35
    years, 11 months" style label for an HR report.
  excel:
    formula: '=DATEDIF(B2, TODAY(), "Y")'
    explain: >-
      Syntax: `DATEDIF(start_date, end_date, unit)`. "Y" returns complete years between the birth
      date and today.
    notes: >-
      DATEDIF is a legacy function kept for Lotus compatibility: it works in all Excel versions but
      does not appear in autocomplete or the Insert Function dialog, so you have to type it in
      full. Microsoft documents that the "MD" unit can return wrong results, so avoid it and use
      "YM" for months. YEARFRAC is an alternative (`=INT(YEARFRAC(B2, TODAY(), 1))`), but its
      day-count basis can make it off by one around birthdays in leap years.
    alternatives:
      - label: Years and months
        formula: '=DATEDIF(B2, TODAY(), "Y")&" years, "&DATEDIF(B2, TODAY(), "YM")&" months"'
    diff: >-
      Excel supports DATEDIF too, but it is hidden from autocomplete and its "MD" unit is
      documented as unreliable.
  sheets:
    formula: '=DATEDIF(B2, TODAY(), "Y")'
    explain: >-
      Same function and units in Google Sheets.
    notes: >-
      Unlike Excel, Google Sheets lists DATEDIF in autocomplete and documents all units ("Y", "M",
      "D", "MD", "YM", "YD"). To calculate ages for a whole column at once, combine it with
      ARRAYFORMULA and skip empty rows: `=ARRAYFORMULA(IF(B2:B="", "", DATEDIF(B2:B, TODAY(),
      "Y")))`. TODAY() recalculates when the sheet is opened or edited, and you can set
      File > Settings > Calculation to also refresh every hour.
    alternatives:
      - label: Ages for a whole column
        formula: '=ARRAYFORMULA(IF(B2:B="", "", DATEDIF(B2:B, TODAY(), "Y")))'
    diff: >-
      Google Sheets has the same DATEDIF function and shows it in autocomplete.
  example:
    intro: >-
      To make the example reproducible, ages are calculated as of the date in F2 (June 30, 2026).
      In a live sheet use TODAY() instead of $F$2.
    grid:
      - [Name, Birth date, Age, Years and months, null, As of]
      - [Ana, 1990-07-14, null, null, null, 2026-06-30]
      - [Ben, 1985-12-03]
      - [Chloe, 2001-02-28]
    checks:
      - cell: C2
        label: filled down
        excel: '=DATEDIF(B2, $F$2, "Y")'
        fill: [C2, C3, C4]
        results: [35, 40, 25]
      - cell: D2
        label: filled down
        excel: '=DATEDIF(B2, $F$2, "Y")&" years, "&DATEDIF(B2, $F$2, "YM")&" months"'
        fill: [D2, D3, D4]
        results: ['35 years, 11 months', '40 years, 6 months', '25 years, 4 months']
  steps:
    - '"Y" counts complete years. Ana turns 36 on July 14, 2026, so on June 30 she is still 35.'
    - '"YM" counts the complete months after the last full year: from July 14, 2025 to June 30, 2026 is 11 months.'
    - The start date must be earlier than the end date; otherwise DATEDIF returns #NUM!.
    - Replace $F$2 with TODAY() for an age that updates automatically.
  errors:
    - error: '#NUM!'
      cause: The birth date is after the end date (often a typo in the year, or swapped arguments).
      fix: 'Check the order: DATEDIF(earlier date, later date, unit).'
    - error: '#NAME? / formula not suggested (Excel)'
      cause: Excel hides DATEDIF from autocomplete, so it is easy to misspell.
      fix: Type =DATEDIF( in full; it still works.
    - error: '#VALUE!'
      cause: The birth date is text, not a real date.
      fix: Convert with DATEVALUE or re-enter the date.
  faq:
    - q: Why not just use (TODAY()-B2)/365?
      a: Leap years make that slightly wrong around birthdays. DATEDIF counts real calendar years.
    - q: How do I get the age on a specific date?
      a: Put that date in a cell and use it as the second argument, as in the example.
  related: [days-between-dates, eomonth, networkdays]

- id: networkdays
  category: date
  launch: true
  slugs: {excel: networkdays-excel, sheets: networkdays-google-sheets}
  title: How to Count Working Days with NETWORKDAYS
  summary: >-
    NETWORKDAYS counts the working days (Monday to Friday) between two dates, including both
    ends, and can subtract a list of holidays. NETWORKDAYS.INTL handles other weekends. Worked
    example with a real holiday list.
  problem: >-
    For project planning you need the number of business days between start and end dates, minus
    public holidays.
  excel:
    formula: '=NETWORKDAYS(B2, C2, $G$2:$G$4)'
    explain: >-
      Syntax: `NETWORKDAYS(start_date, end_date, [holidays])`. Counts Monday to Friday between B2
      and C2 inclusive, excluding any dates listed in G2:G4.
    notes: >-
      Keep holidays in a separate range or table and lock the reference with $ so you can fill the
      formula down. For a different weekend use NETWORKDAYS.INTL: weekend code 7 means Friday and
      Saturday, 11 means Sunday only, or pass a 7-character string such as "0000011" where 1 marks
      a day off (Monday first). WORKDAY does the reverse calculation: it returns the date that is
      a given number of working days after a start date.
    alternatives:
      - label: Friday-Saturday weekend
        formula: '=NETWORKDAYS.INTL(B2, C2, 7, $G$2:$G$4)'
      - label: Due date 10 working days after the start
        formula: '=WORKDAY(B2, 10, $G$2:$G$4)'
    diff: >-
      Excel has the same NETWORKDAYS, NETWORKDAYS.INTL and WORKDAY functions.
  sheets:
    formula: '=NETWORKDAYS(B2, C2, $G$2:$G$4)'
    explain: >-
      Same function in Google Sheets.
    diff: >-
      Google Sheets has the same NETWORKDAYS, NETWORKDAYS.INTL and WORKDAY functions.
  example:
    intro: Holidays are listed in G2:G4.
    grid:
      - [Project, Start, End, Workdays, Minus holidays, null, Holidays]
      - [Website, 2026-03-02, 2026-03-27, null, null, null, 2026-04-03]
      - [Audit, 2026-04-01, 2026-04-30, null, null, null, 2026-12-25]
      - [Launch, 2026-12-21, 2027-01-08, null, null, null, 2027-01-01]
    checks:
      - cell: D2
        label: filled down
        excel: '=NETWORKDAYS(B2, C2)'
        fill: [D2, D3, D4]
        results: [20, 22, 15]
      - cell: E2
        label: filled down
        excel: '=NETWORKDAYS(B2, C2, $G$2:$G$4)'
        fill: [E2, E3, E4]
        results: [20, 21, 13]
  steps:
    - NETWORKDAYS counts every Monday to Friday from the start date to the end date, including both.
    - March 2 to March 27, 2026 is exactly four Monday-to-Friday weeks, so 20 days.
    - The holiday list removes dates that fall on weekdays inside the period. April 3 removes one day from the Audit; December 25 and January 1 remove two from the Launch.
    - Holidays that fall on a weekend are ignored automatically, so they are never subtracted twice.
  errors:
    - error: '#VALUE!'
      cause: A start, end or holiday value is text instead of a date.
      fix: Convert the cells to real dates.
    - error: Result one day too high or low
      cause: NETWORKDAYS counts both the start and end day.
      fix: Subtract 1 if the start day should not count.
    - error: Holidays not subtracted after filling down
      cause: The holiday range was not locked, so it moved down with each row.
      fix: Use $G$2:$G$4.
  faq:
    - q: Does NETWORKDAYS count the start date?
      a: Yes, both the start and the end date are included if they are working days.
    - q: How do I count working hours?
      a: Multiply the working days by the hours per day, and adjust the first and last day if they are partial.
    - q: How do I count only Mondays, or only weekend days?
      a: 'Use NETWORKDAYS.INTL with a 7-character weekend string where 1 means excluded: =NETWORKDAYS.INTL(B2, C2, "0111111") counts only Mondays, and "1111100" counts only Saturdays and Sundays.'
  related: [days-between-dates, eomonth, datedif-age, sum-hours]

- id: eomonth
  category: date
  launch: true
  slugs: {excel: eomonth-excel, sheets: eomonth-google-sheets}
  title: How to Use EOMONTH (End of Month)
  summary: >-
    EOMONTH returns the last day of a month a given number of months before or after a date. It
    is the easiest way to get month-end dates, end-of-next-month due dates and the first day of
    a month.
  problem: >-
    Invoices are due at the end of the month after they are issued, and a report needs the first
    and last day of each invoice's month.
  excel:
    formula: '=EOMONTH(A2, 0)'
    explain: >-
      Syntax: `EOMONTH(start_date, months)`. 0 returns the last day of the same month, 1 the last
      day of the next month, -1 the last day of the previous month.
    notes: >-
      EOMONTH returns a serial number, so format the cell as a date (Ctrl+1 > Date). The first day
      of a month is the end of the previous month plus one: `=EOMONTH(A2, -1)+1`. To add calendar
      months while keeping the day, use EDATE instead; EDATE(Jan 31, 1) returns Feb 28 because
      February has no 31st. Both functions ignore any time part of the start date.
    alternatives:
      - label: Same day next month
        formula: '=EDATE(A2, 1)'
    diff: >-
      Excel uses the same EOMONTH function; format the result as a date with Ctrl+1.
  sheets:
    formula: '=EOMONTH(A2, 0)'
    explain: >-
      Same function in Google Sheets.
    diff: >-
      Google Sheets uses the same EOMONTH and EDATE functions.
  example:
    intro: Month boundaries and due dates for three invoices.
    grid:
      - [Invoice date, End of month, Due (end of next month), First of month]
      - [2026-01-15]
      - [2026-02-10]
      - [2026-11-30]
    checks:
      - cell: B2
        excel: '=EOMONTH(A2, 0)'
        fill: [B2, B3, B4]
        results: [2026-01-31, 2026-02-28, 2026-11-30]
      - cell: C2
        excel: '=EOMONTH(A2, 1)'
        fill: [C2, C3, C4]
        results: [2026-02-28, 2026-03-31, 2026-12-31]
      - cell: D2
        excel: '=EOMONTH(A2, -1)+1'
        fill: [D2, D3, D4]
        results: [2026-01-01, 2026-02-01, 2026-11-01]
  steps:
    - EOMONTH moves the given number of months from the start date and returns the last day of that month.
    - 'With 0 it stays in the same month: January 15 becomes January 31.'
    - With 1 it moves to the next month and handles month lengths automatically, including February.
    - Going back one month and adding one day gives the first day of the original month.
  errors:
    - error: Result shows a number like 46053
      cause: The cell is not formatted as a date.
      fix: Format it as a date.
    - error: '#VALUE!'
      cause: The start date is text.
      fix: Convert it to a real date.
    - error: Decimal months ignored
      cause: EOMONTH truncates the months argument, so 1.9 is treated as 1.
      fix: Pass whole numbers.
  faq:
    - q: How do I get the number of days in a month?
      a: Use =DAY(EOMONTH(A2, 0)).
    - q: What is the difference between EOMONTH and EDATE?
      a: EOMONTH always returns a month-end date; EDATE keeps the same day number (or the last day if that day does not exist).
    - q: How do I get the last working day of the month?
      a: 'Combine EOMONTH with WORKDAY: =WORKDAY(EOMONTH(A2, 0)+1, -1) starts from the first day of the next month and steps back one working day, skipping weekends. Add a holiday range as the third argument if needed.'
  related: [sum-by-month, days-between-dates, networkdays, sumifs-between-dates]

- id: sum-hours
  category: date
  launch: true
  slugs: {excel: sum-hours-excel, sheets: sum-hours-google-sheets}
  title: How to Sum Hours Over 24
  summary: >-
    When you add up time values, the total resets after 24 hours unless the cell uses an elapsed
    time format. This page shows the [h]:mm format, the duration format in Google Sheets, and
    how to convert the total to decimal hours for pay calculations.
  problem: >-
    Your timesheet adds up a week of daily hours, but the total shows 18:00 instead of 42:00.
  excel:
    formula: '=SUM(B2:B6)'
    explain: >-
      The SUM is correct; the display is the problem. Format the total cell with the custom
      format [h]:mm so hours above 24 are shown.
    notes: >-
      Excel stores time as a fraction of a day (12:00 is 0.5), so 42 hours is 1.75. The regular
      h:mm format shows only the part after the full days, which is why 42 hours appears as 18:00.
      Select the cell, press Ctrl+1, choose Custom and enter [h]:mm. To pay by the hour, convert
      the total to a decimal number with *24 and format that cell as a number, not a time.
    alternatives:
      - label: Display total as text in [h]:mm form
        formula: '=TEXT(SUM(B2:B6), "[h]:mm")'
    diff: >-
      Excel uses the same SUM; apply the custom format [h]:mm (Ctrl+1 > Custom) to the total.
  sheets:
    formula: '=SUM(B2:B6)'
    explain: >-
      In Google Sheets, format the total cell as Format > Number > Duration to show 42:00:00.
    notes: >-
      Google Sheets has a ready-made Duration format (Format > Number > Duration) that shows hours
      beyond 24, so no custom code is needed. If you prefer hours and minutes only, use Format >
      Number > Custom number format and enter [h]:mm. Typing 8:30 into a cell creates a time of
      day, which works for summing; if you need entries above 24 hours, type them as 25:30:00 and
      apply Duration first.
    diff: >-
      In Google Sheets use the same SUM and apply Format > Number > Duration to the total.
  example:
    intro: A week of daily hours. B7 uses the [h]:mm format; C7 converts to decimal hours.
    grid:
      - [Day, Hours, Decimal hours]
      - [Mon, '8:30']
      - [Tue, '9:15']
      - [Wed, '7:45']
      - [Thu, '10:00']
      - [Fri, '6:30']
      - [Total]
    checks:
      - cell: B7
        label: formatted as [h]:mm (shows 18:00 with plain h:mm)
        excel: '=SUM(B2:B6)'
        result: '42:00'
        expect: 1.75
      - cell: C7
        label: decimal hours for pay calculations
        excel: '=SUM(B2:B6)*24'
        result: 42
  steps:
    - Each time is a fraction of a day; 8:30 is 0.354166...
    - 'SUM adds the fractions: 1.75 days, which is 42 hours.'
    - The [h] in the format tells the spreadsheet to show total elapsed hours instead of the hour of the day.
    - Multiplying by 24 converts days to hours, giving 42 for pay and overtime calculations.
  errors:
    - error: Total shows 18:00
      cause: The total cell uses h:mm, which wraps every 24 hours.
      fix: Use [h]:mm (Excel) or Duration (Google Sheets).
    - error: Decimal result shows as a time
      cause: The *24 cell inherited a time format.
      fix: Format it as Number.
    - error: Total is 0
      cause: The hours were typed as text (e.g. "8.30" or "8h30").
      fix: Re-enter them as h:mm, or convert with TIMEVALUE.
  faq:
    - q: How do I calculate pay from hours?
      a: Multiply the decimal hours by the rate, e.g. =SUM(B2:B6)*24*C1.
    - q: How do I show minutes only?
      a: Use the custom format [m] to display the total in minutes.
    - q: How do I calculate hours for a shift that passes midnight?
      a: 'If the end time is smaller than the start time, add 1 day: =MOD(C2-B2, 1) returns the correct duration for both normal and overnight shifts, for example 22:00 to 06:00 gives 8:00.'
  related: [networkdays, days-between-dates, percentage-change]

- id: text-function
  category: date
  slugs: {excel: text-function-excel, sheets: text-function-google-sheets}
  title: How to Format Dates with the TEXT Function
  summary: >-
    TEXT turns a real date into a text string in exactly the layout you choose, such as
    2026-03-05, March 5, 2026 or Thursday. It is the standard way to put a nicely formatted
    date inside a sentence, a file name or a label. Excel and Google Sheets share the TEXT
    syntax, but Excel's format codes depend on the language of your Excel installation, while
    Google Sheets always reads English codes.
  problem: >-
    You join a date to some text with & and get a meaningless serial number like 46086 instead
    of a readable date, or you need a date in one fixed layout (ISO, month name, weekday) for
    an export, a report title or a lookup key, regardless of how the cell itself is formatted.
  excel:
    formula: '=TEXT(A2, "yyyy-mm-dd")'
    explain: >-
      Syntax: `TEXT(value, format_text)`. A2 holds a real date (a serial number behind the
      scenes); the format code "yyyy-mm-dd" returns it as the text 2026-03-05. The result is
      text, so it no longer sorts or calculates like a date.
    notes: >-
      The most useful date codes are yyyy (four-digit year), yy (two-digit year), m or mm
      (month number), mmm (Jan), mmmm (January), d or dd (day number), ddd (Thu) and dddd
      (Thursday). In Excel the codes are localised: a German Excel expects "JJJJ-MM-TT" and a
      French Excel "aaaa-mm-jj", so a workbook built with English codes can show the wrong
      result when it is opened in another language version. If you only want the cell to look
      different, use Format Cells > Number > Custom instead of TEXT, because cell formatting
      keeps the value a real date. In Microsoft 365, TEXT spills over a range:
      `=TEXT(A2:A10, "mmm yyyy")` returns one label per row.
    alternatives:
      - label: Readable date inside a sentence
        formula: '="Due on "&TEXT(A2, "mmmm d, yyyy")'
      - label: Weekday name
        formula: '=TEXT(A2, "dddd")'
      - label: Spill labels for a range (Excel 365)
        formula: '=TEXT(A2:A10, "mmm yyyy")'
    diff: >-
      Google Sheets uses the same TEXT function and the same English codes in every locale; it
      fills a column with ARRAYFORMULA instead of spilling.
  sheets:
    formula: '=TEXT(A2, "yyyy-mm-dd")'
    explain: >-
      The same TEXT syntax works in Google Sheets: A2 must be a real date, and the format code
      decides how the returned text looks.
    notes: >-
      Google Sheets always reads the English format codes (yyyy, mm, mmmm, dddd), whatever the
      spreadsheet locale is, so the formula is portable between accounts. The locale (File >
      Settings) only changes the language of month and weekday names in the result, for example
      "jeudi" instead of "Thursday" for a French locale. To format a whole column at once use
      `=ARRAYFORMULA(IF(A2:A="", "", TEXT(A2:A, "yyyy-mm-dd")))`. When you only want a
      different look, use Format > Number > Custom date and time, which keeps the value a real
      date. If TEXT returns the input unchanged, the cell holds text that only looks like a date;
      convert it with DATEVALUE first.
    alternatives:
      - label: Whole column of ISO dates
        formula: '=ARRAYFORMULA(IF(A2:A="", "", TEXT(A2:A, "yyyy-mm-dd")))'
      - label: Readable date inside a sentence
        formula: '="Due on "&TEXT(A2, "mmmm d, yyyy")'
      - label: Convert a text date first, then format
        formula: '=TEXT(DATEVALUE(A2), "dd mmm yyyy")'
    diff: >-
      Excel expects format codes in the language of the Excel installation and spills over
      ranges; Sheets always uses English codes and needs ARRAYFORMULA for a column.
  example:
    intro: Three real dates in column A turned into four common text layouts.
    grid:
      - [Date, ISO text, Long date, Weekday, Label]
      - [2026-03-05]
      - [2026-12-25]
      - [2026-07-01]
    checks:
      - cell: B2
        label: ISO 8601 layout
        excel: '=TEXT(A2, "yyyy-mm-dd")'
        fill: [B2, B3, B4]
        results: ['2026-03-05', '2026-12-25', '2026-07-01']
      - cell: C2
        label: full month name
        excel: '=TEXT(A2, "mmmm d, yyyy")'
        fill: [C2, C3, C4]
        results: ['March 5, 2026', 'December 25, 2026', 'July 1, 2026']
      - cell: D2
        label: weekday name
        excel: '=TEXT(A2, "dddd")'
        fill: [D2, D3, D4]
        results: [Thursday, Friday, Wednesday]
      - cell: E2
        label: date joined to text
        excel: '="Due "&TEXT(A2, "mmm yyyy")'
        fill: [E2, E3, E4]
        results: [Due Mar 2026, Due Dec 2026, Due Jul 2026]
  steps:
    - Make sure column A holds real dates. =ISNUMBER(A2) should return TRUE.
    - 'In the result cell type `=TEXT(A2, "yyyy-mm-dd")` and press Enter.'
    - 'Swap the format code for the layout you need: "mmmm d, yyyy" for March 5, 2026, "dddd" for the weekday, "mmm yyyy" for Mar 2026.'
    - 'To use the date inside a sentence, join it with &: `="Due "&TEXT(A2, "mmm yyyy")`.'
    - Fill the formula down (or spill it in Excel 365, or wrap it in ARRAYFORMULA in Google Sheets).
  errors:
    - error: Result shows a number like 46086
      cause: The date was joined with & without TEXT, so its serial number was used.
      fix: 'Wrap the date in TEXT: `="Due "&TEXT(A2, "mmm yyyy")`.'
    - error: Wrong or literal letters in the result (for example YYYY-03-05)
      cause: In Excel the format codes follow the installation language, or the code uses a letter Excel does not know.
      fix: Use the codes of your Excel language (for example JJJJ in German Excel), or keep the formatting in Format Cells instead of TEXT.
    - error: TEXT returns the value unchanged
      cause: The cell holds text that looks like a date, not a real date.
      fix: Convert it first with DATEVALUE, for example =TEXT(DATEVALUE(A2), "yyyy-mm-dd").
    - error: Sorting by the result is wrong
      cause: TEXT returns text, so "April" sorts before "March".
      fix: Sort by the original date column, or use the ISO layout yyyy-mm-dd, which sorts correctly as text.
  faq:
    - q: Why does my date turn into a number when I combine it with text?
      a: Dates are stored as serial numbers, and & uses the stored value. Wrap the date in TEXT with a format code to keep it readable.
    - q: Is TEXT the same as changing the cell format?
      a: No. Cell formatting changes only how the value looks and keeps it a real date. TEXT returns a new text value that no longer calculates like a date.
    - q: How do I show the month name only?
      a: 'Use `=TEXT(A2, "mmmm")` for the full name or `=TEXT(A2, "mmm")` for the three-letter abbreviation.'
  related: [days-between-dates, eomonth, datedif-age, networkdays]

- id: date-function
  category: date
  slugs: {excel: date-excel, sheets: date-google-sheets}
  title: How to Use the DATE Function
  summary: >-
    DATE builds a real date from a year, a month and a day number. It is the safest way to put a
    date inside a formula, to rebuild dates from separate columns or from text codes such as
    20260704, and to move a date by whole months or years. Works the same in Excel and Google
    Sheets, with a few Sheets-only helpers.
  problem: >-
    Your export has the year, month and day in three separate columns, or a date written as a code
    like 20260704, and you need a real date that sorts, filters and works with other date
    functions. Typing a date as text inside a formula also breaks when someone opens the file with
    different regional settings.
  excel:
    formula: '=DATE(A2, B2, C2)'
    explain: >-
      Syntax: `DATE(year, month, day)`. It returns the serial number of that date, so format the
      cell as a date (Ctrl+1 > Date). DATE(2026, 3, 15) is March 15, 2026 on every computer,
      whatever the regional date order.
    notes: >-
      DATE rolls over automatically: month 14 becomes February of the next year, and day 0 is the
      last day of the previous month, so `=DATE(A2, B2+1, 0)` returns the month end and
      `=DAY(DATE(A2, B2+1, 0))` the number of days in that month. Always type four-digit years,
      because Excel adds 1900 to any year from 0 to 1899, so DATE(26, 1, 1) means 1926. Excel
      cannot show dates before January 1, 1900. Inside other formulas, prefer DATE over a typed
      date string, for example `=COUNTIFS(A:A, ">="&DATE(2026, 1, 1))`.
    alternatives:
      - label: Same day next month
        formula: '=DATE(YEAR(D2), MONTH(D2)+1, DAY(D2))'
      - label: From a text code like 20260704
        formula: '=DATE(LEFT(F2, 4), MID(F2, 5, 2), RIGHT(F2, 2))'
      - label: Days in the month
        formula: '=DAY(DATE(A2, B2+1, 0))'
    diff: >-
      Google Sheets has the same DATE function and the same roll-over rules, plus TO_DATE and
      ARRAYFORMULA for whole columns.
  sheets:
    formula: '=DATE(A2, B2, C2)'
    explain: >-
      DATE works the same way in Google Sheets: year, month and day become a real date, and month
      or day numbers outside the normal range roll over into the next or previous month.
    notes: >-
      Google Sheets usually formats the result as a date automatically; if you see a number such
      as 46096, use Format > Number > Date. To build a whole column at once, wrap the formula in
      ARRAYFORMULA and leave empty rows blank with IF. TO_DATE turns a serial number back into a
      date without changing the cell format, which is handy after math on dates. Sheets also
      adds 1900 to two-digit years, so type four digits. Unlike Excel, a Google Sheets cell can
      hold dates before 1900, but DATE itself still treats years below 1900 as offsets.
    alternatives:
      - label: Whole column with ARRAYFORMULA
        formula: '=ARRAYFORMULA(IF(A2:A="", "", DATE(A2:A, B2:B, C2:C)))'
      - label: Serial number to date
        formula: '=TO_DATE(46096)'
      - label: From a text code like 20260704
        formula: '=DATE(LEFT(F2, 4), MID(F2, 5, 2), RIGHT(F2, 2))'
    diff: >-
      Excel has no TO_DATE; format the cell as a date instead, and in Microsoft 365 the column
      version spills without ARRAYFORMULA.
  example:
    intro: >-
      Year, month and day numbers in columns A to C, and text date codes in column F. Row 3 uses
      month 14 and row 4 uses day 0 to show how DATE rolls over.
    grid:
      - [Year, Month, Day, Date, Next month, Text code, From code, Days in month]
      - [2026, 3, 15, null, null, '20260704']
      - [2026, 14, 1, null, null, '20261231']
      - [2026, 3, 0, null, null, '20270115']
    checks:
      - cell: D2
        label: filled down
        excel: '=DATE(A2, B2, C2)'
        fill: [D2, D3, D4]
        results: [2026-03-15, 2027-02-01, 2026-02-28]
      - cell: E2
        label: same day one month later
        excel: '=DATE(YEAR(D2), MONTH(D2)+1, DAY(D2))'
        result: 2026-04-15
      - cell: G2
        label: text code to date, filled down
        excel: '=DATE(LEFT(F2, 4), MID(F2, 5, 2), RIGHT(F2, 2))'
        fill: [G2, G3, G4]
        results: [2026-07-04, 2026-12-31, 2027-01-15]
      - cell: H2
        label: days in March 2026
        excel: '=DAY(DATE(A2, B2+1, 0))'
        result: 31
  steps:
    - Put the year, month and day in separate cells, or point DATE at the columns you already have.
    - 'Type `=DATE(A2, B2, C2)` in the first result cell and press Enter.'
    - If the result shows a number, format the cell as a date.
    - Fill the formula down. Month 14 in row 3 rolls into February 2027, and day 0 in row 4 returns the last day of February 2026.
    - 'For text codes, cut the code into pieces with LEFT, MID and RIGHT and pass them to DATE: 20260704 becomes July 4, 2026.'
  errors:
    - error: Result shows a number like 46096
      cause: The cell is formatted as a number, and dates are stored as serial numbers.
      fix: Format the cell as a date.
    - error: The year comes out as 1926
      cause: A two-digit year was used, and years from 0 to 1899 are added to 1900.
      fix: Always pass a four-digit year, for example 2026.
    - error: '#VALUE!'
      cause: One of the arguments is text that cannot be read as a number, such as "March".
      fix: Use the month number, or convert the text first, for example with MONTH(DATEVALUE("1 "&B2&" 2026")).
    - error: '#NUM!'
      cause: The resulting date is before 1900 in Excel, for example a negative year.
      fix: Check the year column for empty or wrong values.
  faq:
    - q: How do I get the first day of the month with DATE?
      a: 'Use day 1: =DATE(YEAR(A2), MONTH(A2), 1).'
    - q: How do I add years to a date?
      a: 'Add to the year part: =DATE(YEAR(A2)+1, MONTH(A2), DAY(A2)). February 29 then rolls to March 1 in a non-leap year.'
    - q: Why use DATE instead of typing "3/15/2026" in a formula?
      a: A typed date string is read according to the regional settings, so it can mean a different date or an error on another computer. DATE always means the same day.
  related: [eomonth, days-between-dates, text-to-date, today-now, sum-by-month]

- id: today-now
  category: date
  slugs: {excel: today-now-excel, sheets: today-now-google-sheets}
  title: How to Use TODAY and NOW
  summary: >-
    TODAY returns the current date and NOW the current date and time. Both update automatically,
    which makes them perfect for countdowns, overdue flags and ages, but useless as a fixed time
    stamp. This page shows both functions, how to freeze the date, and how Excel and Google Sheets
    decide when to update them.
  problem: >-
    You want a task list that shows how many days are left until each deadline and flags overdue
    items, without retyping today's date every morning. You also need a fixed time stamp for
    when a row was entered, which TODAY and NOW cannot give you.
  excel:
    formula: '=TODAY()'
    explain: >-
      TODAY and NOW take no arguments. `=TODAY()` returns today's date with no time part, and
      `=NOW()` returns the date plus the current time, for example 2026-10-31 14:30.
    notes: >-
      Both functions are volatile: Excel recalculates them every time the workbook is opened or
      anything is edited, and when you press F9. Put =TODAY() in one cell and refer to that cell,
      so every formula uses the same date. For a fixed value that never changes, press Ctrl+; to
      type today's date or Ctrl+Shift+; for the current time. NOW uses the clock and time zone of
      your computer. The time part of NOW is `=NOW()-TODAY()`, and `=INT(NOW())` equals TODAY.
    alternatives:
      - label: Days until a due date
        formula: '=B2-TODAY()'
      - label: Current time only
        formula: '=NOW()-TODAY()'
      - label: Date and time as text
        formula: '=TEXT(NOW(), "yyyy-mm-dd hh:mm")'
    diff: >-
      Google Sheets has the same TODAY and NOW, but uses the spreadsheet time zone and lets you
      choose how often they recalculate.
  sheets:
    formula: '=TODAY()'
    explain: >-
      TODAY and NOW work the same way in Google Sheets: TODAY gives the date and NOW the date and
      time, and both update on their own.
    notes: >-
      Google Sheets takes the time from the spreadsheet time zone in File > Settings, not from
      your computer, so check it if NOW looks hours off. In the same Settings dialog, the
      Calculation tab lets you recalculate on change, every minute or every hour, which keeps a
      NOW clock moving even when nobody edits the sheet. Ctrl+; and Ctrl+Shift+; insert a fixed
      date and time, just like in Excel. To compute days left for a whole column at once, use
      ARRAYFORMULA, and TO_DATE turns the result of INT(NOW()) back into a date format.
    alternatives:
      - label: Days left for the whole column
        formula: '=ARRAYFORMULA(IF(B2:B="", "", B2:B-TODAY()))'
      - label: Date part of NOW as a date
        formula: '=TO_DATE(INT(NOW()))'
      - label: Date and time as text
        formula: '=TEXT(NOW(), "yyyy-mm-dd hh:mm")'
    diff: >-
      Excel uses the computer clock and recalculates on every edit or F9; there is no
      every-minute setting and no TO_DATE.
  example:
    intro: >-
      A deadline list. On a live sheet F2 holds =TODAY(); here it is frozen at Saturday,
      October 31, 2026 so the results are reproducible. Column G shows checks that are true on
      any day.
    grid:
      - [Task, Due date, Days left, Status, null, Today, Check]
      - [Invoice, 2026-11-10, null, null, null, 2026-10-31]
      - [Report, 2026-10-25]
      - [Review, 2026-10-31]
    checks:
      - cell: C2
        label: days left, filled down
        excel: '=B2-$F$2'
        fill: [C2, C3, C4]
        results: [10, -6, 0]
      - cell: D2
        label: status, filled down
        excel: '=IF(B2<$F$2, "Overdue", IF(B2=$F$2, "Due today", "Open"))'
        fill: [D2, D3, D4]
        results: [Open, Overdue, Due today]
      - cell: G2
        label: TODAY is a whole number of days
        excel: '=TODAY()=INT(TODAY())'
        result: true
      - cell: G3
        label: the date part of NOW is TODAY
        excel: '=INT(NOW())=TODAY()'
        result: true
      - cell: G4
        label: NOW minus TODAY is the time of day, always under 1
        excel: '=NOW()-TODAY()<1'
        result: true
  steps:
    - Type `=TODAY()` in a spare cell such as F2, so every formula refers to the same date.
    - 'Subtract it from each due date: `=B2-$F$2` gives 10 days left for the invoice, -6 for the overdue report and 0 for the review.'
    - 'Turn the number into a label with IF: past dates are Overdue, today is Due today, later dates are Open.'
    - Use NOW instead of TODAY when the time matters, for example to count hours until a deadline with (B2-NOW())*24.
    - For a time stamp that must never change, type it with Ctrl+; (date) or Ctrl+Shift+; (time) instead of a formula.
  errors:
    - error: The time stamp changes every day
      cause: TODAY and NOW are volatile and always show the current date and time.
      fix: Insert a fixed value with Ctrl+; or copy the cell and paste it as values.
    - error: Days left shows a date like 1/10/1900
      cause: The result cell inherited a date format from the due date.
      fix: Format the days-left cell as Number.
    - error: Comparing a date with NOW() never matches
      cause: NOW includes the time, so it is never equal to a date at midnight.
      fix: Compare with TODAY(), or use INT(NOW()).
    - error: NOW is a few hours off in Google Sheets
      cause: The spreadsheet time zone differs from your own.
      fix: Change it in File > Settings > Time zone.
  faq:
    - q: How do I calculate someone's age from a birth date?
      a: 'Use DATEDIF with TODAY: =DATEDIF(A2, TODAY(), "y") returns full years.'
    - q: Does TODAY update if the file is closed?
      a: No. It updates the next time the file is opened or recalculated, so a printed or exported copy keeps the old date.
    - q: How do I show today's date inside a sentence?
      a: 'Format it with TEXT: ="Report date: "&TEXT(TODAY(), "mmmm d, yyyy").'
  related: [date-function, days-between-dates, datedif-age, workday]

- id: workday
  category: date
  slugs: {excel: workday-excel, sheets: workday-google-sheets}
  title: How to Add Business Days with WORKDAY
  summary: >-
    WORKDAY returns the date that is a given number of working days after (or before) a start
    date, skipping weekends and an optional list of holidays. It is the standard way to compute
    due dates, delivery dates and SLA deadlines. WORKDAY.INTL does the same for other weekends.
  problem: >-
    Orders ship 5 business days after they are placed, and contracts are due 10 working days
    after signing. Adding 5 to the date counts weekends and public holidays, so the due date
    comes out too early.
  excel:
    formula: '=WORKDAY(A2, B2, $F$2:$F$4)'
    explain: >-
      Syntax: `WORKDAY(start_date, days, [holidays])`. It moves forward from A2 by B2 working
      days (Monday to Friday), skipping any dates listed in F2:F4. The start date itself is not
      counted. A negative number of days moves backward.
    notes: >-
      Format the result as a date, because WORKDAY returns a serial number. Keep holidays in their
      own range and lock it with $ so the formula can be filled down. For another weekend use
      WORKDAY.INTL: weekend code 7 means Friday and Saturday, 11 means Sunday only, and a
      7-character string such as "0000011" marks days off with 1, starting on Monday. To count
      the working days between two dates instead, use NETWORKDAYS. If the start date falls on a
      weekend, WORKDAY still counts from it, so a Saturday plus 1 working day is Monday.
    alternatives:
      - label: Friday-Saturday weekend
        formula: '=WORKDAY.INTL(A2, B2, 7, $F$2:$F$4)'
      - label: Three working days before a date
        formula: '=WORKDAY(A2, -3, $F$2:$F$4)'
      - label: Next working day if the date is on a weekend
        formula: '=WORKDAY(A2-1, 1, $F$2:$F$4)'
    diff: >-
      Google Sheets has the same WORKDAY and WORKDAY.INTL functions and can read the holiday list
      from an open-ended range on another sheet.
  sheets:
    formula: '=WORKDAY(A2, B2, $F$2:$F$4)'
    explain: >-
      WORKDAY works the same way in Google Sheets: it skips Saturdays, Sundays and the listed
      holidays, and does not count the start date.
    notes: >-
      In Google Sheets it is convenient to keep public holidays on their own tab and point to an
      open-ended range such as Holidays!A2:A, so new holidays are picked up without editing the
      formula. Empty cells in that range are ignored. WORKDAY.INTL accepts the same weekend codes
      and 7-character strings as in Excel. If the result appears as a number, choose Format >
      Number > Date. Holidays typed as text, for example "Dec 25", are not skipped, so make sure
      the list contains real dates.
    alternatives:
      - label: Holidays on a separate tab
        formula: '=WORKDAY(A2, B2, Holidays!A2:A)'
      - label: Sunday-only weekend with a weekend string
        formula: '=WORKDAY.INTL(A2, B2, "0000001", Holidays!A2:A)'
      - label: Next working day if the date is on a weekend
        formula: '=WORKDAY(A2-1, 1, Holidays!A2:A)'
    diff: >-
      Excel uses the same functions; point the holidays argument at a fixed range or a table
      column instead of an open-ended range.
  example:
    intro: >-
      Start dates and working days to add, with three public holidays in F2:F4 (November 26 and
      December 25, 2026, and January 1, 2027).
    grid:
      - [Start, Days, Due (weekends only), Due (with holidays), null, Holidays]
      - [2026-11-02, 10, null, null, null, 2026-11-26]
      - [2026-11-20, 5, null, null, null, 2026-12-25]
      - [2026-12-18, 7, null, null, null, 2027-01-01]
      - [2026-12-31, -3]
    checks:
      - cell: C2
        label: weekends skipped, filled down
        excel: '=WORKDAY(A2, B2)'
        fill: [C2, C3, C4, C5]
        results: [2026-11-16, 2026-11-27, 2026-12-29, 2026-12-28]
      - cell: D2
        label: weekends and holidays skipped, filled down
        excel: '=WORKDAY(A2, B2, $F$2:$F$4)'
        fill: [D2, D3, D4, D5]
        results: [2026-11-16, 2026-11-30, 2026-12-30, 2026-12-28]
      - cell: E4
        label: Friday-Saturday weekend
        excel: '=WORKDAY.INTL(A4, B4, 7, $F$2:$F$4)'
        result: 2026-12-28
  steps:
    - List the start dates in column A and the number of working days in column B.
    - Put the public holidays in their own range, here F2:F4, as real dates.
    - 'Type `=WORKDAY(A2, B2, $F$2:$F$4)` and fill it down.'
    - Monday, November 2 plus 10 working days is Monday, November 16. Friday, November 20 plus 5 is Friday, November 27, but Thanksgiving on November 26 pushes it to Monday, November 30.
    - A negative number counts backwards, so 3 working days before Thursday, December 31 is Monday, December 28.
  errors:
    - error: The due date ignores a holiday
      cause: The holiday is typed as text, or the holiday range moved when the formula was filled down.
      fix: Enter holidays as real dates and lock the range with $.
    - error: Result shows a number like 46342
      cause: The cell is formatted as a number.
      fix: Format it as a date.
    - error: '#NUM!'
      cause: The weekend code in WORKDAY.INTL is invalid, for example "1111111" with no working days.
      fix: Use a valid code from 1 to 7 or 11 to 17, or a string with at least one 0.
    - error: Due date one day later than expected
      cause: You expected the start date to count as day 1.
      fix: WORKDAY never counts the start date; use B2-1 days if your rule counts it.
  faq:
    - q: What is the difference between WORKDAY and NETWORKDAYS?
      a: WORKDAY returns a date a number of working days away; NETWORKDAYS counts the working days between two dates.
    - q: How do I add working hours instead of days?
      a: Divide the hours by the hours in a working day and pass the whole days to WORKDAY, then add the remaining hours to the start time.
    - q: How do I get the last working day of a month?
      a: '=WORKDAY(EOMONTH(A2, 0)+1, -1) goes to the first day of the next month and steps back one working day.'
  related: [networkdays, eomonth, days-between-dates, today-now]

- id: add-months
  category: date
  slugs: {excel: add-months-excel, sheets: add-months-google-sheets}
  title: How to Add Months to a Date (EDATE)
  summary: >-
    EDATE shifts a date by a whole number of calendar months and keeps the same day of the month
    when that day exists. It is the clean way to add or subtract months for renewals, billing
    cycles and contract end dates. When the day does not exist in the target month, EDATE lands
    on the last day of that month instead of spilling into the next one.
  problem: >-
    A subscription renews every 3 months from the signup date, and some invoices fall on the
    31st. Adding 90 days drifts off the calendar month, and DATE(YEAR, MONTH+n, DAY) turns
    January 31 plus one month into March 3 instead of February 28.
  excel:
    formula: '=EDATE(A2, B2)'
    explain: >-
      Syntax: `EDATE(start_date, months)`. A2 is the start date and B2 is how many months to move
      (positive forward, negative backward). EDATE returns a date serial, so format the cell as a
      Date. January 31 plus 1 month becomes February 28 (or 29 in a leap year), not March 3.
    notes: >-
      Prefer EDATE over `=DATE(YEAR(A2), MONTH(A2)+B2, DAY(A2))` whenever the day of the month
      might not exist in the target month. The DATE construction rolls overflowing days into the
      next month, so Jan 31 + 1 becomes March 3 in a non-leap year, while EDATE clamps to the
      last day of February. Format the result as a date because EDATE returns a serial number.
      EOMONTH is better when you always want month-end due dates; combine both when a rule is
      "same day next month, else last day of month" which is exactly what EDATE already does.
      Negative months work the same way for going backward.
    alternatives:
      - label: Same day next month
        formula: '=EDATE(A2, 1)'
      - label: Three months earlier
        formula: '=EDATE(A2, -3)'
      - label: DATE construction (rolls over missing days)
        formula: '=DATE(YEAR(A2), MONTH(A2)+B2, DAY(A2))'
      - label: End of the month n months away
        formula: '=EOMONTH(A2, B2)'
    diff: >-
      Google Sheets has the same EDATE and EOMONTH functions with identical month-end clamping.
  sheets:
    formula: '=EDATE(A2, B2)'
    explain: >-
      EDATE works the same way in Google Sheets: it moves A2 by B2 calendar months and clamps to
      the last day of the month when the original day does not exist.
    notes: >-
      In Google Sheets, keep signup or invoice dates as real dates (Format > Number > Date) so
      EDATE can read them. Open-ended ranges such as A2:A work fine inside ARRAYFORMULA when you
      want a whole column of renewal dates: `=ARRAYFORMULA(IF(A2:A="", "", EDATE(A2:A, B2:B)))`.
      Empty cells in the months column are treated as zero, which returns the original date, so
      guard with IF when that is not what you want. EOMONTH is still the better choice for pure
      month-end deadlines. If the result looks like 46081, set Format > Number > Date on the
      formula column.
    alternatives:
      - label: Whole column of renewals
        formula: '=ARRAYFORMULA(IF(A2:A="", "", EDATE(A2:A, B2:B)))'
      - label: Same day next month
        formula: '=EDATE(A2, 1)'
      - label: End of month n months away
        formula: '=EOMONTH(A2, B2)'
    diff: >-
      Excel uses the same EDATE function; fill the formula down or spill it in Microsoft 365
      instead of wrapping it in ARRAYFORMULA.
  example:
    intro: >-
      Start dates and months to add. Row 2 shows a normal mid-month shift; row 3 shows EDATE
      clamping January 31 to February 28 while the DATE construction rolls into March.
    grid:
      - [Start, Months, EDATE result, DATE construction]
      - [2026-01-15, 3]
      - [2026-01-31, 1]
      - [2026-11-01, 2]
      - [2026-03-15, -1]
    checks:
      - cell: C2
        label: EDATE filled down
        excel: '=EDATE(A2, B2)'
        fill: [C2, C3, C4, C5]
        results: [2026-04-15, 2026-02-28, 2027-01-01, 2026-02-15]
      - cell: D2
        label: DATE construction (rollover on missing days)
        excel: '=DATE(YEAR(A2), MONTH(A2)+B2, DAY(A2))'
        fill: [D2, D3, D4, D5]
        results: [2026-04-15, 2026-03-03, 2027-01-01, 2026-02-15]
  steps:
    - Put the start dates in column A and the number of months to move in column B.
    - 'Type `=EDATE(A2, B2)` and fill it down. Format column C as a date.'
    - January 15 plus 3 months is April 15. January 31 plus 1 month is February 28, because February 2026 has no 31st.
    - 'Compare with `=DATE(YEAR(A2), MONTH(A2)+B2, DAY(A2))` on the same row: for January 31 it returns March 3 instead of February 28.'
    - Negative months move backward, so March 15 minus 1 month is February 15.
  errors:
    - error: January 31 plus one month becomes March 3
      cause: The formula used DATE(YEAR, MONTH+1, DAY) instead of EDATE, so the missing day spilled into March.
      fix: Switch to EDATE, which clamps to the last day of February.
    - error: Result shows a number like 46081
      cause: The cell is formatted as a number.
      fix: Format it as a date.
    - error: '#VALUE!'
      cause: The start date is text that looks like a date, or months is non-numeric text.
      fix: Convert the date with DATEVALUE and make sure months is a number.
    - error: Renewal is one day off every other month
      cause: The workbook added a fixed number of days (for example 30 or 90) instead of calendar months.
      fix: Use EDATE with the real month count so month lengths are handled automatically.
  faq:
    - q: What is the difference between EDATE and EOMONTH?
      a: EDATE keeps the same day of the month (or the last day if that day is missing). EOMONTH always returns the last day of the target month.
    - q: How do I add months and then land on the next working day?
      a: 'Wrap EDATE in WORKDAY: =WORKDAY(EDATE(A2, B2)-1, 1) moves to the renewal date and then to the next working day if needed.'
    - q: Does EDATE keep the time portion of a date-time value?
      a: No. EDATE returns a pure date serial with no time. Add the original time back with +MOD(A2,1) if you need it.
  related: [eomonth, workday, date-function, today-now]

- id: month-year
  category: date
  slugs: {excel: month-year-excel, sheets: month-year-google-sheets}
  title: How to Get Month and Year from a Date
  summary: >-
    Pull a month-year label, the month number and the year from a real date so you can group
    invoices, build pivot keys and label charts. TEXT gives a readable "2026-11" or "Nov 2026"
    string; MONTH and YEAR return the numbers; DATE(YEAR, MONTH, 1) gives the first day of that
    month for sorting and range lookups.
  problem: >-
    A sales log has full dates, but the report needs one row per calendar month. Sorting by the
    month name as text puts April before February, and joining YEAR and MONTH with & without
    zero-padding breaks chronological order.
  excel:
    formula: '=TEXT(A2, "yyyy-mm")'
    explain: >-
      Syntax: `TEXT(value, format_text)`. With "yyyy-mm" the date in A2 becomes the text
      2026-11, which sorts correctly as text and works as a SUMIF / COUNTIF key. Use MONTH(A2)
      and YEAR(A2) when you need the numbers, or DATE(YEAR(A2), MONTH(A2), 1) when you need a
      real first-of-month date.
    notes: >-
      Prefer the ISO layout "yyyy-mm" for grouping keys because it sorts in calendar order as
      text. "mmm yyyy" is nicer for chart labels but sorts alphabetically. MONTH returns 1 to 12
      and YEAR returns the four-digit year; neither needs special formatting. When you need a
      value that still behaves like a date (for example as the start of a SUMIFS range), use
      `=DATE(YEAR(A2), MONTH(A2), 1)` and format it as MMM YYYY. In Excel the TEXT format codes
      follow the installation language, so a German Excel expects different letters for year and
      day. If you only want a different look without changing the value, use Format Cells instead
      of TEXT.
    alternatives:
      - label: Month number
        formula: '=MONTH(A2)'
      - label: Year number
        formula: '=YEAR(A2)'
      - label: First day of the month
        formula: '=DATE(YEAR(A2), MONTH(A2), 1)'
      - label: Short month-year label
        formula: '=TEXT(A2, "mmm yyyy")'
    diff: >-
      Google Sheets uses the same TEXT, MONTH, YEAR and DATE functions; English format codes work
      in every Sheets locale.
  sheets:
    formula: '=TEXT(A2, "yyyy-mm")'
    explain: >-
      TEXT with "yyyy-mm" returns the same month-year key in Google Sheets. MONTH, YEAR and
      DATE(YEAR, MONTH, 1) match Excel.
    notes: >-
      Google Sheets always accepts English TEXT codes (yyyy, mm, mmm), whatever the spreadsheet
      locale is; the locale only changes whether month names come back in English or another
      language. For a whole column of keys use
      `=ARRAYFORMULA(IF(A2:A="", "", TEXT(A2:A, "yyyy-mm")))`. Keep a parallel first-of-month
      column with DATE for anything that must stay a real date, because TEXT results cannot be
      fed into date arithmetic without converting them back. If TEXT leaves the value unchanged,
      the cell is text that only looks like a date — wrap it in DATEVALUE first.
    alternatives:
      - label: Whole column of month-year keys
        formula: '=ARRAYFORMULA(IF(A2:A="", "", TEXT(A2:A, "yyyy-mm")))'
      - label: Month number
        formula: '=MONTH(A2)'
      - label: First day of the month
        formula: '=DATE(YEAR(A2), MONTH(A2), 1)'
    diff: >-
      Excel spills TEXT over a range in Microsoft 365 and localises format codes; Sheets uses
      ARRAYFORMULA and always reads English codes.
  example:
    intro: Four invoice dates turned into a month-year key, month number, year and first-of-month date.
    grid:
      - [Invoice date, Month-year, Month, Year, First of month]
      - [2026-01-15]
      - [2026-03-31]
      - [2026-11-01]
      - [2026-12-25]
    checks:
      - cell: B2
        label: yyyy-mm text key
        excel: '=TEXT(A2, "yyyy-mm")'
        fill: [B2, B3, B4, B5]
        results: ['2026-01', '2026-03', '2026-11', '2026-12']
      - cell: C2
        label: month number
        excel: '=MONTH(A2)'
        fill: [C2, C3, C4, C5]
        results: [1, 3, 11, 12]
      - cell: D2
        label: year number
        excel: '=YEAR(A2)'
        fill: [D2, D3, D4, D5]
        results: [2026, 2026, 2026, 2026]
      - cell: E2
        label: first day of month
        excel: '=DATE(YEAR(A2), MONTH(A2), 1)'
        fill: [E2, E3, E4, E5]
        results: [2026-01-01, 2026-03-01, 2026-11-01, 2026-12-01]
  steps:
    - Confirm column A holds real dates (=ISNUMBER(A2) is TRUE).
    - 'Type `=TEXT(A2, "yyyy-mm")` for a sortable month-year key and fill it down.'
    - 'Add `=MONTH(A2)` and `=YEAR(A2)` when you need the numbers for filters or charts.'
    - 'Use `=DATE(YEAR(A2), MONTH(A2), 1)` when the helper column must stay a real date for SUMIFS or pivots.'
    - Group or pivot on the key column; ISO keys keep months in calendar order.
  errors:
    - error: Month names sort as April, August, February
      cause: The key used "mmm yyyy" or the month name alone, which sorts alphabetically.
      fix: Use "yyyy-mm" or a real first-of-month date column for sorting.
    - error: Result shows a serial number when joined to text
      cause: The date was concatenated with & without TEXT.
      fix: 'Wrap it: `="Month "&TEXT(A2, "yyyy-mm")`.'
    - error: TEXT returns the input unchanged
      cause: The cell holds text that looks like a date.
      fix: Convert with DATEVALUE first, then apply TEXT or MONTH.
    - error: Wrong year near New Year
      cause: A fiscal-year rule was expected, but YEAR returns the calendar year.
      fix: Build a fiscal key with IF(MONTH(A2)>=start_month, YEAR(A2)+1, YEAR(A2)) or similar.
  faq:
    - q: Should I use TEXT or MONTH and YEAR for grouping?
      a: Use TEXT("yyyy-mm") for a single readable key. Use MONTH and YEAR when you need the numbers separately, or DATE(YEAR, MONTH, 1) when the helper must remain a date.
    - q: How do I sum amounts by month-year?
      a: 'Add a helper column with =TEXT(A2, "yyyy-mm") and use SUMIF on that column, or pivot on =DATE(YEAR(A2), MONTH(A2), 1).'
    - q: Why is TEXT better than Format Cells for a lookup key?
      a: Format Cells only changes how the value looks; VLOOKUP and SUMIF still see the full date. TEXT returns a real text key that matches across rows in the same month.
  related: [text-function, eomonth, date-function, sum-by-month]

- id: weekday
  category: date
  slugs: {excel: weekday-excel, sheets: weekday-google-sheets}
  title: How to Get the Weekday of a Date (WEEKDAY)
  summary: >-
    WEEKDAY returns a number for the day of the week so you can flag weekends, build workday
    rules and sort by Monday-first calendars. Pair it with TEXT(..., "dddd") when you need the
    weekday name instead of a number. The second argument controls whether the week starts on
    Sunday or Monday.
  problem: >-
    A schedule needs to mark Saturdays and Sundays, or shift a due date when it falls on a
    weekend. Comparing the date formatted as "Saturday" as text is brittle across locales, and
    the default WEEKDAY numbering (Sunday = 1) surprises people who expect Monday = 1.
  excel:
    formula: '=WEEKDAY(A2, 2)'
    explain: >-
      Syntax: `WEEKDAY(serial_number, [return_type])`. With return_type 2, Monday is 1 and Sunday
      is 7, which matches most business calendars. Return_type 1 (the default) makes Sunday 1 and
      Saturday 7. The result is a number; use TEXT(A2, "dddd") when you need the name.
    notes: >-
      Return_type 2 is the usual choice for Monday-to-Friday logic: weekend tests become
      `=WEEKDAY(A2, 2)>=6`. Return_type 1 is the Excel default and matches some US calendars.
      Return_type 11 to 17 mirror the WORKDAY.INTL weekend codes if you need another start day.
      WEEKDAY ignores any time portion of a date-time value. Format the result as a number, not a
      date. For the weekday name use TEXT with "ddd" or "dddd"; those codes follow the Excel
      installation language, so a French Excel may show "lundi" instead of "Monday". To push a
      weekend date to the next Monday, use WORKDAY or a small IF around WEEKDAY.
    alternatives:
      - label: Sunday = 1 (Excel default)
        formula: '=WEEKDAY(A2, 1)'
      - label: Weekday name
        formula: '=TEXT(A2, "dddd")'
      - label: Weekend flag (Mon=1)
        formula: '=IF(WEEKDAY(A2, 2)>=6, "Weekend", "Weekday")'
      - label: Next Monday if weekend
        formula: '=IF(WEEKDAY(A2, 2)>=6, A2+(8-WEEKDAY(A2, 2)), A2)'
    diff: >-
      Google Sheets supports the same WEEKDAY return types and the same TEXT weekday codes.
  sheets:
    formula: '=WEEKDAY(A2, 2)'
    explain: >-
      WEEKDAY in Google Sheets uses the same return_type codes: 2 for Monday = 1 through Sunday =
      7, and 1 for Sunday = 1.
    notes: >-
      Sheets reads English TEXT codes in every locale, but the weekday *names* still follow the
      File > Settings locale, so "dddd" may return a translated name. For a whole column use
      `=ARRAYFORMULA(IF(A2:A="", "", WEEKDAY(A2:A, 2)))`. Weekend highlighting is often easier
      with conditional formatting and a custom formula `=WEEKDAY(A2, 2)>=6` applied to the date
      range. If you only need the name for a label, TEXT is enough; keep WEEKDAY when formulas
      must branch on the number. Empty date cells return 0 from WEEKDAY in some contexts, so
      guard with IF(A2="", "", WEEKDAY(A2, 2)).
    alternatives:
      - label: Whole column of weekday numbers
        formula: '=ARRAYFORMULA(IF(A2:A="", "", WEEKDAY(A2:A, 2)))'
      - label: Weekday name
        formula: '=TEXT(A2, "dddd")'
      - label: Weekend flag
        formula: '=IF(WEEKDAY(A2, 2)>=6, "Weekend", "Weekday")'
    diff: >-
      Excel uses the same WEEKDAY return types; fill down or spill instead of ARRAYFORMULA, and
      remember that TEXT weekday names follow the Excel UI language.
  example:
    intro: >-
      Four dates in late 2026 with WEEKDAY return_type 1 (Sunday = 1), return_type 2 (Monday = 1)
      and the weekday name from TEXT.
    grid:
      - [Date, WEEKDAY type 1, WEEKDAY type 2, Weekday name]
      - [2026-11-01]
      - [2026-11-02]
      - [2026-11-07]
      - [2026-12-25]
    checks:
      - cell: B2
        label: Sunday=1 numbering
        excel: '=WEEKDAY(A2, 1)'
        fill: [B2, B3, B4, B5]
        results: [1, 2, 7, 6]
      - cell: C2
        label: Monday=1 numbering
        excel: '=WEEKDAY(A2, 2)'
        fill: [C2, C3, C4, C5]
        results: [7, 1, 6, 5]
      - cell: D2
        label: weekday name
        excel: '=TEXT(A2, "dddd")'
        fill: [D2, D3, D4, D5]
        results: [Sunday, Monday, Saturday, Friday]
  steps:
    - List the dates in column A as real dates.
    - 'Type `=WEEKDAY(A2, 2)` for Monday-first numbers and fill down.'
    - 'Add `=WEEKDAY(A2, 1)` if you need the Sunday-first numbering for comparison.'
    - 'Use `=TEXT(A2, "dddd")` when you want the name instead of a number.'
    - 'Flag weekends with `=WEEKDAY(A2, 2)>=6`, or move a weekend date with WORKDAY.'
  errors:
    - error: Monday comes back as 2 instead of 1
      cause: The formula used the default return_type 1, where Sunday is 1.
      fix: Pass 2 as the second argument for Monday = 1.
    - error: Weekday name is in another language
      cause: TEXT uses the Excel UI language or the Sheets spreadsheet locale for names.
      fix: Change the locale, or map WEEKDAY numbers to English names with CHOOSE or SWITCH.
    - error: '#VALUE!'
      cause: The cell holds text that only looks like a date.
      fix: Convert it with DATEVALUE before WEEKDAY.
    - error: Weekend test marks Friday as a weekend
      cause: The test used return_type 1 with >=6, which treats Friday (6) and Saturday (7) as the weekend.
      fix: Use return_type 2, where Saturday and Sunday are 6 and 7.
  faq:
    - q: What return_type should I use?
      a: Use 2 when weeks start on Monday (common in business sheets). Use 1 only when you specifically need Sunday = 1.
    - q: How do I get the weekday name instead of a number?
      a: 'Use =TEXT(A2, "dddd") for the full name or "ddd" for the three-letter form.'
    - q: How do I skip weekends when adding days?
      a: Prefer WORKDAY or WORKDAY.INTL over manual WEEKDAY loops; they skip weekends and optional holidays in one call.
  related: [workday, networkdays, text-function, today-now]

- id: weeknum
  category: date
  slugs: {excel: weeknum-excel, sheets: weeknum-google-sheets}
  title: How to Get the Week Number of a Date (WEEKNUM)
  summary: >-
    WEEKNUM returns which week of the year a date falls in. The second argument chooses Sunday-first,
    Monday-first, or ISO week numbering, so the same date can show week 1 or week 53 depending on
    the system you pick. Use it for week-based reports, ISO calendars and week-over-week dashboards.
  problem: >-
    A sales workbook needs a Week column so PivotTables and charts can group by week. Typing the
    week by hand drifts when the year rolls, and teams disagree on whether weeks start on Sunday
    or Monday and whether late December belongs to week 53 or week 1.
  excel:
    formula: '=WEEKNUM(A2, 2)'
    explain: >-
      Syntax: `WEEKNUM(serial_number, [return_type])`. With return_type 2 the week starts on Monday
      and the week that contains January 1 is week 1. Return_type 1 (the default) starts the week
      on Sunday. Return_type 21 follows the ISO-8601 rule (Monday start, week 1 is the first week
      with at least four days in the new year), which matches ISOWEEKNUM.
    notes: >-
      Pick one return_type for the whole workbook and stick to it; mixing 1 and 21 is the usual
      source of off-by-one week charts. Return_type 2 is a good default for Monday-to-Friday
      business sheets that are not strict ISO. When auditors or European partners expect ISO weeks,
      use 21 (or ISOWEEKNUM in Microsoft 365). WEEKNUM ignores any time portion of a date-time
      value. Format the result as a number. Pair with YEAR or a helper like `=YEAR(A2)&"-W"&TEXT(WEEKNUM(A2,21),"00")`
      when you need a unique week key across years. Empty date cells can return 0, so guard with
      IF(A2="", "", WEEKNUM(A2, 2)).
    alternatives:
      - label: Sunday-first week number (Excel default)
        formula: '=WEEKNUM(A2, 1)'
      - label: ISO week number
        formula: '=WEEKNUM(A2, 21)'
      - label: ISOWEEKNUM (Microsoft 365)
        formula: '=ISOWEEKNUM(A2)'
      - label: Year-week key for pivots
        formula: '=YEAR(A2)&"-W"&TEXT(WEEKNUM(A2, 21), "00")'
    diff: >-
      Google Sheets supports the same WEEKNUM return types. ISOWEEKNUM is also available there; use
      ARRAYFORMULA when filling a whole column.
  sheets:
    formula: '=WEEKNUM(A2, 2)'
    explain: >-
      WEEKNUM in Google Sheets uses the same return_type codes: 2 for Monday-start system weeks,
      1 for Sunday-start, and 21 for ISO week numbers.
    notes: >-
      For a whole column use `=ARRAYFORMULA(IF(A2:A="", "", WEEKNUM(A2:A, 2)))`. Sheets also has
      ISOWEEKNUM for the ISO-8601 week, which matches WEEKNUM with return_type 21. File > Settings
      locale does not change WEEKNUM's numbering rules, but it does affect how dates are parsed
      when you type them as text. Keep source values as real dates (Format > Number > Date) so
      week numbers stay stable after locale changes. When building a week label for charts, combine
      YEAR with TEXT around WEEKNUM so week 5 of 2026 does not collide with week 5 of 2027.
    alternatives:
      - label: Whole column of week numbers
        formula: '=ARRAYFORMULA(IF(A2:A="", "", WEEKNUM(A2:A, 2)))'
      - label: ISO week with ISOWEEKNUM
        formula: '=ISOWEEKNUM(A2)'
      - label: Sunday-first week number
        formula: '=WEEKNUM(A2, 1)'
      - label: Year-week key
        formula: '=ARRAYFORMULA(IF(A2:A="", "", YEAR(A2:A)&"-W"&TEXT(WEEKNUM(A2:A, 21), "00")))'
    diff: >-
      Excel uses the same WEEKNUM return types; fill down or spill instead of ARRAYFORMULA, and use
      ISOWEEKNUM in Microsoft 365 as a clearer alias for return_type 21.
  example:
    intro: >-
      Five dates spanning early January, a mid-year Monday, and late December. Columns compare
      return_type 1 (Sunday start), return_type 2 (Monday start) and return_type 21 (ISO).
    grid:
      - [Date, WEEKNUM type 1, WEEKNUM type 2, WEEKNUM type 21 (ISO)]
      - [2026-01-01]
      - [2026-01-04]
      - [2026-01-05]
      - [2026-11-02]
      - [2026-12-28]
    checks:
      - cell: B2
        label: Sunday-first week numbers
        excel: '=WEEKNUM(A2, 1)'
        fill: [B2, B3, B4, B5, B6]
        results: [1, 2, 2, 45, 1]
      - cell: C2
        label: Monday-first system week numbers
        excel: '=WEEKNUM(A2, 2)'
        fill: [C2, C3, C4, C5, C6]
        results: [1, 1, 2, 45, 1]
      - cell: D2
        label: ISO week numbers
        excel: '=WEEKNUM(A2, 21)'
        fill: [D2, D3, D4, D5, D6]
        results: [1, 1, 2, 45, 53]
  steps:
    - List the dates in column A as real dates, not text.
    - 'Type `=WEEKNUM(A2, 2)` for Monday-start system weeks and fill down.'
    - 'Add `=WEEKNUM(A2, 1)` when you need the Sunday-first numbering for comparison.'
    - 'Use `=WEEKNUM(A2, 21)` (or ISOWEEKNUM) when the report must follow ISO-8601 weeks.'
    - 'Build a year-week key with YEAR and TEXT if the same week number appears in more than one year.'
  errors:
    - error: Late December shows week 1 instead of 53
      cause: Return_type 1 or 2 treats the week that contains the next January 1 as week 1 of the new numbering, while ISO (21) keeps week 53 when that week still belongs to the old ISO year.
      fix: Switch to return_type 21 or ISOWEEKNUM when you need ISO week 53 for late December dates such as 2026-12-28.
    - error: Monday and Sunday give different week numbers for the same date
      cause: Return_type 1 starts weeks on Sunday; return_type 2 starts on Monday, so Sunday dates often sit in different week buckets.
      fix: Agree on one return_type for the file and document it next to the Week column header.
    - error: '#VALUE!'
      cause: The cell holds text that only looks like a date.
      fix: Convert it with DATEVALUE or DATE before WEEKNUM.
    - error: Week chart merges two years
      cause: The summary keyed only on WEEKNUM without the year.
      fix: Include YEAR in the grouping key, for example YEAR&"-W"&TEXT(WEEKNUM(...),"00").
  faq:
    - q: What is the difference between WEEKNUM and ISOWEEKNUM?
      a: ISOWEEKNUM always uses the ISO-8601 rule (Monday start, week 1 has at least four days in the new year). WEEKNUM needs return_type 21 to match that; types 1 and 2 use simpler "week containing January 1" rules.
    - q: Which return_type should I use?
      a: Use 2 for typical Monday-first business sheets. Use 21 (or ISOWEEKNUM) when partners expect ISO week numbers. Use 1 only when you specifically need Sunday-first weeks.
    - q: How do I get the week start date from a week number?
      a: Store real dates and group with WEEKNUM, or compute the Monday of the week with a formula based on the date (for example date - WEEKDAY(date, 2) + 1). Avoid reconstructing dates from a week number alone when the year boundary is ambiguous.
  related: [weekday, workday, networkdays, today-now]

- id: text-to-date
  category: date
  slugs: {excel: text-to-date-excel, sheets: text-to-date-google-sheets}
  title: How to Convert Text to a Date (DATEVALUE)
  summary: >-
    DATEVALUE turns a date written as text into a real spreadsheet date so WEEKDAY, EDATE and
    PivotTables can use it. When the text is not in a locale-friendly order, build the date with
    DATE plus LEFT, MID and RIGHT instead. This page shows both patterns with worked results.
  problem: >-
    Exports arrive with dates as plain text ("2026-11-02", "11/02/2026", "20261102"). Sorting,
    filtering and date formulas treat them as text, so month totals and weekday flags come out
    wrong until the values become real dates.
  excel:
    formula: '=DATEVALUE(A2)'
    explain: >-
      Syntax: `DATEVALUE(date_text)`. Excel parses date_text using the Windows/Mac regional date
      order and returns a date serial. Format the result cell as a Date. When the string is an
      unambiguous ISO value such as 2026-11-02, DATEVALUE usually works; for compact digits such as
      20261102, split the parts with DATE.
    notes: >-
      DATEVALUE depends on the workbook locale: `11/02/2026` means 2 November in a US locale and
      11 February in a UK/EU locale. Prefer ISO `yyyy-mm-dd` text when you control the export, or
      parse fixed positions with `=DATE(LEFT(A2,4), MID(A2,5,2), RIGHT(A2,2))` for `yyyymmdd`.
      VALUE can also coerce some date-like text, but DATEVALUE is clearer for date-only strings.
      After converting, Copy > Paste Special > Values if you want to replace the text column.
      Text that LibreOffice or Excel cannot parse returns #VALUE!; fix the pattern before wrapping
      in IFERROR if you need a blank instead.
    alternatives:
      - label: Parse yyyymmdd digits
        formula: '=DATE(LEFT(A2,4), MID(A2,5,2), RIGHT(A2,2))'
      - label: Parse yyyy-mm-dd with DATE parts
        formula: '=DATE(LEFT(A2,4), MID(A2,6,2), RIGHT(A2,2))'
      - label: Coerce with VALUE
        formula: '=VALUE(A2)'
    diff: >-
      Google Sheets DATEVALUE follows the spreadsheet locale under File > Settings, and also
      accepts many ISO strings. ARRAYFORMULA can convert a whole column in one step.
  sheets:
    formula: '=DATEVALUE(A2)'
    explain: >-
      DATEVALUE in Google Sheets converts date text to a date serial using the File > Settings
      locale. Format the result with Format > Number > Date.
    notes: >-
      Set the spreadsheet locale to match the text order before relying on DATEVALUE for
      slash-separated dates. ISO `yyyy-mm-dd` is the safest import format across locales. For a
      whole column use `=ARRAYFORMULA(IF(A2:A="", "", DATEVALUE(A2:A)))`. Compact `yyyymmdd`
      strings still need DATE with LEFT/MID/RIGHT because DATEVALUE does not split bare digits.
      If DATEVALUE returns #VALUE!, check for extra spaces (TRIM first) or a time stamp glued to
      the date; split on space or use REGEXEXTRACT when the pattern is consistent. After a
      successful convert, paste values over the text column when formulas should no longer depend
      on the raw export.
    alternatives:
      - label: Whole column convert
        formula: '=ARRAYFORMULA(IF(A2:A="", "", DATEVALUE(A2:A)))'
      - label: Parse yyyymmdd digits
        formula: '=DATE(LEFT(A2,4), MID(A2,5,2), RIGHT(A2,2))'
      - label: Trim then convert
        formula: '=DATEVALUE(TRIM(A2))'
    diff: >-
      Excel uses the same DATEVALUE function with the OS locale instead of a spreadsheet setting;
      fill the formula down rather than using ARRAYFORMULA.
  example:
    intro: >-
      Mixed text dates. DATEVALUE handles the ISO and month-name forms; the compact yyyymmdd value
      is rebuilt with DATE. Results are shown as calendar dates.
    grid:
      - [Text date, DATEVALUE, DATE from digits]
      - ['2026-11-02']
      - ['02-Nov-2026']
      - ['20261102']
      - ['2026-01-15']
    checks:
      - cell: B2
        label: DATEVALUE on parseable text
        excel: '=DATEVALUE(A2)'
        fill: [B2, B3]
        results: [2026-11-02, 2026-11-02]
      - cell: B5
        label: DATEVALUE on another ISO date
        excel: '=DATEVALUE(A5)'
        result: 2026-01-15
      - cell: C4
        label: DATE parts for yyyymmdd
        excel: '=DATE(LEFT(A4,4), MID(A4,5,2), RIGHT(A4,2))'
        result: 2026-11-02
  steps:
    - Put the text dates in column A. Prefer ISO `yyyy-mm-dd` when you can control the export.
    - 'Type `=DATEVALUE(A2)` and format the result as a Date, then fill down for locale-friendly text.'
    - 'For compact `yyyymmdd` values use `=DATE(LEFT(A2,4), MID(A2,5,2), RIGHT(A2,2))` instead.'
    - Replace the original text with Paste Special > Values once the convert column looks correct.
    - 'Confirm with WEEKDAY or MONTH on the converted cells to prove they are real dates.'
  errors:
    - error: "#VALUE! from DATEVALUE"
      cause: The text order does not match the locale, or the string is bare digits / a non-date value.
      fix: Switch locale, standardize on ISO text, or parse with DATE and LEFT/MID/RIGHT.
    - error: 11/02/2026 becomes February instead of November
      cause: The locale reads dates as DMY while the text was written as MDY (or the reverse).
      fix: Use ISO text, or parse known positions with DATE so month and day cannot swap.
    - error: Converted date looks like 46328
      cause: The cell is still formatted as a number.
      fix: Format it as a Date.
    - error: Leading spaces break the parse
      cause: Imported text includes stray spaces or non-breaking spaces.
      fix: Wrap with TRIM (and SUBSTITUTE for CHAR(160) when needed) before DATEVALUE.
  faq:
    - q: When should I use DATE instead of DATEVALUE?
      a: Use DATE when the year, month and day sit in fixed character positions (for example yyyymmdd) or when slash order is ambiguous across locales. Use DATEVALUE for already locale-friendly or ISO date text.
    - q: Does DATEVALUE keep a time portion?
      a: No. DATEVALUE returns a pure date serial. If the text includes a time, parse the date and time separately or use VALUE on a full date-time string your locale understands.
    - q: How do I convert a whole column in Google Sheets?
      a: 'Use =ARRAYFORMULA(IF(A2:A="", "", DATEVALUE(A2:A))) and format the column as Date.'
  related: [date-function, text-to-number, weekday, text-function]

- id: time-difference
  category: date
  slugs: {excel: time-difference-excel, sheets: time-difference-google-sheets}
  title: How to Calculate the Difference Between Two Times
  summary: >-
    Subtracting two time values returns the elapsed duration as a fraction of a day. Multiply by
    24 for decimal hours, and add 1 when the shift crosses midnight so overnight end times stay
    positive. This page shows same-day and overnight examples with verified hour totals.
  problem: >-
    A timesheet stores clock-in and clock-out times. A simple end-minus-start formula works for
    day shifts but turns negative or wraps oddly when someone works past midnight, and payroll
    needs decimal hours rather than a clock format.
  excel:
    formula: '=IF(B2<A2, B2+1-A2, B2-A2)*24'
    explain: >-
      A2 is the start time and B2 is the end time. When the end is earlier than the start, the
      shift crossed midnight, so adding 1 day before subtracting keeps the duration positive.
      Multiplying by 24 converts the day-fraction into decimal hours for pay calculations.
    notes: >-
      Excel stores times as fractions of a day (06:00 is 0.25, 18:00 is 0.75). Format the raw
      difference as h:mm when you want a duration clock, or multiply by 24 and format as a Number
      for decimal hours. The IF(B2<A2, B2+1-A2, B2-A2) pattern covers overnight shifts without
      needing a separate date column. If start and end include full dates, a plain B2-A2 already
      spans midnight and you only need `*24`. For totals over 24 hours across many rows, sum the
      durations and use the [h]:mm format on the total (see the sum-hours guide). Negative plain
      subtractions usually mean an overnight shift was not adjusted.
    alternatives:
      - label: Same-day duration as time
        formula: '=B2-A2'
      - label: Same-day decimal hours
        formula: '=(B2-A2)*24'
      - label: Overnight-safe duration (day fraction)
        formula: '=IF(B2<A2, B2+1-A2, B2-A2)'
      - label: Minutes instead of hours
        formula: '=IF(B2<A2, B2+1-A2, B2-A2)*1440'
    diff: >-
      Google Sheets uses the same day-fraction arithmetic. Format > Number > Duration is a handy
      display option for the raw difference, and ARRAYFORMULA can fill a whole timesheet column.
  sheets:
    formula: '=IF(B2<A2, B2+1-A2, B2-A2)*24'
    explain: >-
      Same overnight-safe pattern in Google Sheets: adjust across midnight when needed, then
      multiply by 24 for decimal hours.
    notes: >-
      Format start and end columns as Time (Format > Number > Time). For the raw difference,
      Format > Number > Duration shows hours and minutes clearly, including values past 24 hours
      when you sum several days. Whole-column version:
      `=ARRAYFORMULA(IF(A2:A="", "", IF(B2:B<A2:A, B2:B+1-A2:A, B2:B-A2:A)*24))`. If people type
      times as text, coerce with TIMEVALUE first. When both date and time live in the same cell,
      subtract the full date-times and multiply by 24; the midnight IF is only required for
      time-only columns. Pair with SUM on the decimal-hours column for payroll totals.
    alternatives:
      - label: Whole column of decimal hours
        formula: '=ARRAYFORMULA(IF(A2:A="", "", IF(B2:B<A2:A, B2:B+1-A2:A, B2:B-A2:A)*24))'
      - label: Duration display (day fraction)
        formula: '=IF(B2<A2, B2+1-A2, B2-A2)'
      - label: Same-day decimal hours
        formula: '=(B2-A2)*24'
    diff: >-
      Excel uses the same formulas; fill down or spill instead of ARRAYFORMULA, and use a custom
      [h]:mm format when you need elapsed hours above 24 on a total row.
  example:
    intro: >-
      Four shifts: a normal day, an overnight shift, a short morning block, and a zero-length
      edge case. Decimal hours use the overnight-safe formula.
    grid:
      - [Start, End, Plain hours, Overnight-safe hours]
      - ['09:00', '17:30']
      - ['22:00', '06:30']
      - ['08:15', '12:45']
      - ['09:00', '09:00']
    checks:
      - cell: C2
        label: plain (end-start)*24 filled down
        excel: '=(B2-A2)*24'
        fill: [C2, C3, C4, C5]
        results: [8.5, -15.5, 4.5, 0]
      - cell: D2
        label: overnight-safe hours filled down
        excel: '=IF(B2<A2, B2+1-A2, B2-A2)*24'
        fill: [D2, D3, D4, D5]
        results: [8.5, 8.5, 4.5, 0]
  steps:
    - Enter start times in column A and end times in column B as real Time values.
    - 'Type `=(B2-A2)*24` for same-day shifts and format the result as a Number.'
    - 'Switch to `=IF(B2<A2, B2+1-A2, B2-A2)*24` so overnight rows stay positive.'
    - Fill down the timesheet; empty start cells can be guarded with IF(A2="", "", ...).
    - Sum the decimal-hours column for payroll, or keep a Duration-formatted column for display.
  errors:
    - error: Overnight shift shows negative hours
      cause: The formula used plain end-start without adding a day when end < start.
      fix: Use IF(B2<A2, B2+1-A2, B2-A2) before multiplying by 24.
    - error: Result looks like 0.354 or a clock time
      cause: The cell still uses a Time format after you wanted decimal hours, or you forgot *24.
      fix: Multiply by 24 and format as a Number (or keep Time/Duration only for the day-fraction column).
    - error: '#VALUE!'
      cause: Start or end is text that only looks like a time.
      fix: Recode with TIMEVALUE or enter the values as real times.
    - error: Total over several days wraps to a small clock value
      cause: The total cell uses h:mm instead of elapsed-hour formatting.
      fix: Use [h]:mm in Excel or Format > Number > Duration in Sheets on the total (see sum-hours).
  faq:
    - q: Why multiply by 24?
      a: Spreadsheet times are fractions of a 24-hour day, so multiplying the duration by 24 converts that fraction into decimal hours.
    - q: How do I get minutes instead of hours?
      a: Multiply the day-fraction by 1440 (24×60) instead of 24.
    - q: What if the timesheet also has dates?
      a: Store full date-times in start and end, then use =(B2-A2)*24. The midnight adjustment is unnecessary when the date part already moves to the next day.
  related: [sum-hours, weekday, today-now, text-to-date]
