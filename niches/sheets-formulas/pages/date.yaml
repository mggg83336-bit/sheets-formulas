# Dates & times
- id: days-between-dates
  category: date
  launch: true
  slugs: {excel: days-between-dates-excel, sheets: days-between-dates-google-sheets}
  title: How to Calculate Days Between Two Dates
  summary: >-
    Dates are stored as serial numbers, so subtracting one date from another gives the number of
    days between them. This page covers simple subtraction, the DAYS function, counting both the
    start and end day, and why the answer sometimes appears as a date.
  problem: >-
    For each project you know the start and end date and need the duration in days, both
    exclusive (difference) and inclusive (counting both days).
  excel:
    formula: '=B2-A2'
    explain: >-
      Excel stores each date as the number of days since January 1, 1900, so the difference of two
      dates is a number of days.
    notes: >-
      If the result looks like a date (e.g. 1/15/1900), the cell inherited a date format; set it to
      General or Number. DAYS(end, start) gives the same result and makes the order of arguments
      explicit. For whole months or years between dates use DATEDIF, and for working days use
      NETWORKDAYS. If either date includes a time, wrap them in INT to count calendar days only.
    alternatives:
      - label: DAYS function
        formula: '=DAYS(B2, A2)'
      - label: Calendar days when the values include times
        formula: '=INT(B2)-INT(A2)'
    diff: >-
      Excel uses the same subtraction; set the result cell to General if it shows a date.
  sheets:
    formula: '=B2-A2'
    explain: >-
      Google Sheets also stores dates as serial numbers (days since December 30, 1899), so
      subtraction works the same way.
    notes: >-
      In Google Sheets, a result that shows as a date can be fixed with Format > Number > Number.
      Sheets is stricter about dates typed as text: if your dates are left-aligned they are text,
      and subtraction returns #VALUE!. Convert them with DATEVALUE, or check File > Settings >
      Locale, because 03/04/2026 means March 4 in the United States locale and April 3 in the
      United Kingdom locale. DAYS and DATEDIF work as in Excel.
    diff: >-
      The same subtraction works in Google Sheets; if the result shows as a date, use Format >
      Number > Number.
  example:
    intro: Duration of three periods.
    grid:
      - [Start, End, Days (B-A), DAYS, Inclusive]
      - [2026-01-15, 2026-03-02]
      - [2026-02-01, 2026-02-28]
      - [2025-12-20, 2026-01-05]
    checks:
      - cell: C2
        excel: '=B2-A2'
        fill: [C2, C3, C4]
        results: [46, 27, 16]
      - cell: D2
        excel: '=DAYS(B2, A2)'
        fill: [D2, D3, D4]
        results: [46, 27, 16]
      - cell: E2
        label: counts both the start and end day
        excel: '=B2-A2+1'
        fill: [E2, E3, E4]
        results: [47, 28, 17]
  steps:
    - Each date is a whole number behind the scenes (2026-01-15 is 46037).
    - Subtracting gives the gap in days. January 15 to March 2, 2026 is 16 days left in January + 28 in February + 2 in March = 46.
    - Add 1 when both the first and the last day should count, for example for hotel nights vs. days of a trip.
    - DAYS(end, start) does the same subtraction; note that the end date comes first.
  errors:
    - error: Result shows as a date
      cause: The result cell is formatted as a date.
      fix: Format it as General / Number.
    - error: '#VALUE!'
      cause: One of the dates is text, not a real date.
      fix: Convert with DATEVALUE or re-enter it; =ISNUMBER(A2) should be TRUE.
    - error: Negative number
      cause: The start and end dates are reversed.
      fix: Swap the references, or use =ABS(B2-A2).
  faq:
    - q: How do I count only weekdays?
      a: Use NETWORKDAYS(start, end), which excludes Saturdays, Sundays and optional holidays.
    - q: How do I calculate days from a date until today?
      a: Use =TODAY()-A2. The result updates every day.
    - q: How do I calculate the difference in years or months?
      a: 'Use DATEDIF: =DATEDIF(A2, B2, "M") returns complete months and =DATEDIF(A2, B2, "Y") complete years. For a decimal number of years, use =YEARFRAC(A2, B2).'
  related: [networkdays, datedif-age, eomonth, sumifs-between-dates]

- id: datedif-age
  category: date
  launch: true
  slugs: {excel: datedif-age-excel, sheets: datedif-age-google-sheets}
  title: How to Calculate Age with DATEDIF
  summary: >-
    DATEDIF returns the number of complete years, months or days between two dates, which makes
    it the standard way to calculate age from a birth date. This page shows age in years, years
    plus months, and the quirks of this partly hidden function.
  problem: >-
    You have employees' birth dates and need their current age in complete years, plus a "35
    years, 11 months" style label for an HR report.
  excel:
    formula: '=DATEDIF(B2, TODAY(), "Y")'
    explain: >-
      Syntax: `DATEDIF(start_date, end_date, unit)`. "Y" returns complete years between the birth
      date and today.
    notes: >-
      DATEDIF is a legacy function kept for Lotus compatibility: it works in all Excel versions but
      does not appear in autocomplete or the Insert Function dialog, so you have to type it in
      full. Microsoft documents that the "MD" unit can return wrong results, so avoid it and use
      "YM" for months. YEARFRAC is an alternative (`=INT(YEARFRAC(B2, TODAY(), 1))`), but its
      day-count basis can make it off by one around birthdays in leap years.
    alternatives:
      - label: Years and months
        formula: '=DATEDIF(B2, TODAY(), "Y")&" years, "&DATEDIF(B2, TODAY(), "YM")&" months"'
    diff: >-
      Excel supports DATEDIF too, but it is hidden from autocomplete and its "MD" unit is
      documented as unreliable.
  sheets:
    formula: '=DATEDIF(B2, TODAY(), "Y")'
    explain: >-
      Same function and units in Google Sheets.
    notes: >-
      Unlike Excel, Google Sheets lists DATEDIF in autocomplete and documents all units ("Y", "M",
      "D", "MD", "YM", "YD"). To calculate ages for a whole column at once, combine it with
      ARRAYFORMULA and skip empty rows: `=ARRAYFORMULA(IF(B2:B="", "", DATEDIF(B2:B, TODAY(),
      "Y")))`. TODAY() recalculates when the sheet is opened or edited, and you can set
      File > Settings > Calculation to also refresh every hour.
    alternatives:
      - label: Ages for a whole column
        formula: '=ARRAYFORMULA(IF(B2:B="", "", DATEDIF(B2:B, TODAY(), "Y")))'
    diff: >-
      Google Sheets has the same DATEDIF function and shows it in autocomplete.
  example:
    intro: >-
      To make the example reproducible, ages are calculated as of the date in F2 (June 30, 2026).
      In a live sheet use TODAY() instead of $F$2.
    grid:
      - [Name, Birth date, Age, Years and months, null, As of]
      - [Ana, 1990-07-14, null, null, null, 2026-06-30]
      - [Ben, 1985-12-03]
      - [Chloe, 2001-02-28]
    checks:
      - cell: C2
        label: filled down
        excel: '=DATEDIF(B2, $F$2, "Y")'
        fill: [C2, C3, C4]
        results: [35, 40, 25]
      - cell: D2
        label: filled down
        excel: '=DATEDIF(B2, $F$2, "Y")&" years, "&DATEDIF(B2, $F$2, "YM")&" months"'
        fill: [D2, D3, D4]
        results: ['35 years, 11 months', '40 years, 6 months', '25 years, 4 months']
  steps:
    - '"Y" counts complete years. Ana turns 36 on July 14, 2026, so on June 30 she is still 35.'
    - '"YM" counts the complete months after the last full year: from July 14, 2025 to June 30, 2026 is 11 months.'
    - The start date must be earlier than the end date; otherwise DATEDIF returns #NUM!.
    - Replace $F$2 with TODAY() for an age that updates automatically.
  errors:
    - error: '#NUM!'
      cause: The birth date is after the end date (often a typo in the year, or swapped arguments).
      fix: 'Check the order: DATEDIF(earlier date, later date, unit).'
    - error: '#NAME? / formula not suggested (Excel)'
      cause: Excel hides DATEDIF from autocomplete, so it is easy to misspell.
      fix: Type =DATEDIF( in full; it still works.
    - error: '#VALUE!'
      cause: The birth date is text, not a real date.
      fix: Convert with DATEVALUE or re-enter the date.
  faq:
    - q: Why not just use (TODAY()-B2)/365?
      a: Leap years make that slightly wrong around birthdays. DATEDIF counts real calendar years.
    - q: How do I get the age on a specific date?
      a: Put that date in a cell and use it as the second argument, as in the example.
  related: [days-between-dates, eomonth, networkdays]

- id: networkdays
  category: date
  launch: true
  slugs: {excel: networkdays-excel, sheets: networkdays-google-sheets}
  title: How to Count Working Days with NETWORKDAYS
  summary: >-
    NETWORKDAYS counts the working days (Monday to Friday) between two dates, including both
    ends, and can subtract a list of holidays. NETWORKDAYS.INTL handles other weekends. Worked
    example with a real holiday list.
  problem: >-
    For project planning you need the number of business days between start and end dates, minus
    public holidays.
  excel:
    formula: '=NETWORKDAYS(B2, C2, $G$2:$G$4)'
    explain: >-
      Syntax: `NETWORKDAYS(start_date, end_date, [holidays])`. Counts Monday to Friday between B2
      and C2 inclusive, excluding any dates listed in G2:G4.
    notes: >-
      Keep holidays in a separate range or table and lock the reference with $ so you can fill the
      formula down. For a different weekend use NETWORKDAYS.INTL: weekend code 7 means Friday and
      Saturday, 11 means Sunday only, or pass a 7-character string such as "0000011" where 1 marks
      a day off (Monday first). WORKDAY does the reverse calculation: it returns the date that is
      a given number of working days after a start date.
    alternatives:
      - label: Friday-Saturday weekend
        formula: '=NETWORKDAYS.INTL(B2, C2, 7, $G$2:$G$4)'
      - label: Due date 10 working days after the start
        formula: '=WORKDAY(B2, 10, $G$2:$G$4)'
    diff: >-
      Excel has the same NETWORKDAYS, NETWORKDAYS.INTL and WORKDAY functions.
  sheets:
    formula: '=NETWORKDAYS(B2, C2, $G$2:$G$4)'
    explain: >-
      Same function in Google Sheets.
    diff: >-
      Google Sheets has the same NETWORKDAYS, NETWORKDAYS.INTL and WORKDAY functions.
  example:
    intro: Holidays are listed in G2:G4.
    grid:
      - [Project, Start, End, Workdays, Minus holidays, null, Holidays]
      - [Website, 2026-03-02, 2026-03-27, null, null, null, 2026-04-03]
      - [Audit, 2026-04-01, 2026-04-30, null, null, null, 2026-12-25]
      - [Launch, 2026-12-21, 2027-01-08, null, null, null, 2027-01-01]
    checks:
      - cell: D2
        label: filled down
        excel: '=NETWORKDAYS(B2, C2)'
        fill: [D2, D3, D4]
        results: [20, 22, 15]
      - cell: E2
        label: filled down
        excel: '=NETWORKDAYS(B2, C2, $G$2:$G$4)'
        fill: [E2, E3, E4]
        results: [20, 21, 13]
  steps:
    - NETWORKDAYS counts every Monday to Friday from the start date to the end date, including both.
    - March 2 to March 27, 2026 is exactly four Monday-to-Friday weeks, so 20 days.
    - The holiday list removes dates that fall on weekdays inside the period. April 3 removes one day from the Audit; December 25 and January 1 remove two from the Launch.
    - Holidays that fall on a weekend are ignored automatically, so they are never subtracted twice.
  errors:
    - error: '#VALUE!'
      cause: A start, end or holiday value is text instead of a date.
      fix: Convert the cells to real dates.
    - error: Result one day too high or low
      cause: NETWORKDAYS counts both the start and end day.
      fix: Subtract 1 if the start day should not count.
    - error: Holidays not subtracted after filling down
      cause: The holiday range was not locked, so it moved down with each row.
      fix: Use $G$2:$G$4.
  faq:
    - q: Does NETWORKDAYS count the start date?
      a: Yes, both the start and the end date are included if they are working days.
    - q: How do I count working hours?
      a: Multiply the working days by the hours per day, and adjust the first and last day if they are partial.
    - q: How do I count only Mondays, or only weekend days?
      a: 'Use NETWORKDAYS.INTL with a 7-character weekend string where 1 means excluded: =NETWORKDAYS.INTL(B2, C2, "0111111") counts only Mondays, and "1111100" counts only Saturdays and Sundays.'
  related: [days-between-dates, eomonth, datedif-age, sum-hours]

- id: eomonth
  category: date
  launch: true
  slugs: {excel: eomonth-excel, sheets: eomonth-google-sheets}
  title: How to Use EOMONTH (End of Month)
  summary: >-
    EOMONTH returns the last day of a month a given number of months before or after a date. It
    is the easiest way to get month-end dates, end-of-next-month due dates and the first day of
    a month.
  problem: >-
    Invoices are due at the end of the month after they are issued, and a report needs the first
    and last day of each invoice's month.
  excel:
    formula: '=EOMONTH(A2, 0)'
    explain: >-
      Syntax: `EOMONTH(start_date, months)`. 0 returns the last day of the same month, 1 the last
      day of the next month, -1 the last day of the previous month.
    notes: >-
      EOMONTH returns a serial number, so format the cell as a date (Ctrl+1 > Date). The first day
      of a month is the end of the previous month plus one: `=EOMONTH(A2, -1)+1`. To add calendar
      months while keeping the day, use EDATE instead; EDATE(Jan 31, 1) returns Feb 28 because
      February has no 31st. Both functions ignore any time part of the start date.
    alternatives:
      - label: Same day next month
        formula: '=EDATE(A2, 1)'
    diff: >-
      Excel uses the same EOMONTH function; format the result as a date with Ctrl+1.
  sheets:
    formula: '=EOMONTH(A2, 0)'
    explain: >-
      Same function in Google Sheets.
    diff: >-
      Google Sheets uses the same EOMONTH and EDATE functions.
  example:
    intro: Month boundaries and due dates for three invoices.
    grid:
      - [Invoice date, End of month, Due (end of next month), First of month]
      - [2026-01-15]
      - [2026-02-10]
      - [2026-11-30]
    checks:
      - cell: B2
        excel: '=EOMONTH(A2, 0)'
        fill: [B2, B3, B4]
        results: [2026-01-31, 2026-02-28, 2026-11-30]
      - cell: C2
        excel: '=EOMONTH(A2, 1)'
        fill: [C2, C3, C4]
        results: [2026-02-28, 2026-03-31, 2026-12-31]
      - cell: D2
        excel: '=EOMONTH(A2, -1)+1'
        fill: [D2, D3, D4]
        results: [2026-01-01, 2026-02-01, 2026-11-01]
  steps:
    - EOMONTH moves the given number of months from the start date and returns the last day of that month.
    - 'With 0 it stays in the same month: January 15 becomes January 31.'
    - With 1 it moves to the next month and handles month lengths automatically, including February.
    - Going back one month and adding one day gives the first day of the original month.
  errors:
    - error: Result shows a number like 46053
      cause: The cell is not formatted as a date.
      fix: Format it as a date.
    - error: '#VALUE!'
      cause: The start date is text.
      fix: Convert it to a real date.
    - error: Decimal months ignored
      cause: EOMONTH truncates the months argument, so 1.9 is treated as 1.
      fix: Pass whole numbers.
  faq:
    - q: How do I get the number of days in a month?
      a: Use =DAY(EOMONTH(A2, 0)).
    - q: What is the difference between EOMONTH and EDATE?
      a: EOMONTH always returns a month-end date; EDATE keeps the same day number (or the last day if that day does not exist).
    - q: How do I get the last working day of the month?
      a: 'Combine EOMONTH with WORKDAY: =WORKDAY(EOMONTH(A2, 0)+1, -1) starts from the first day of the next month and steps back one working day, skipping weekends. Add a holiday range as the third argument if needed.'
  related: [sum-by-month, days-between-dates, networkdays, sumifs-between-dates]

- id: sum-hours
  category: date
  launch: true
  slugs: {excel: sum-hours-excel, sheets: sum-hours-google-sheets}
  title: How to Sum Hours Over 24
  summary: >-
    When you add up time values, the total resets after 24 hours unless the cell uses an elapsed
    time format. This page shows the [h]:mm format, the duration format in Google Sheets, and
    how to convert the total to decimal hours for pay calculations.
  problem: >-
    Your timesheet adds up a week of daily hours, but the total shows 18:00 instead of 42:00.
  excel:
    formula: '=SUM(B2:B6)'
    explain: >-
      The SUM is correct; the display is the problem. Format the total cell with the custom
      format [h]:mm so hours above 24 are shown.
    notes: >-
      Excel stores time as a fraction of a day (12:00 is 0.5), so 42 hours is 1.75. The regular
      h:mm format shows only the part after the full days, which is why 42 hours appears as 18:00.
      Select the cell, press Ctrl+1, choose Custom and enter [h]:mm. To pay by the hour, convert
      the total to a decimal number with *24 and format that cell as a number, not a time.
    alternatives:
      - label: Display total as text in [h]:mm form
        formula: '=TEXT(SUM(B2:B6), "[h]:mm")'
    diff: >-
      Excel uses the same SUM; apply the custom format [h]:mm (Ctrl+1 > Custom) to the total.
  sheets:
    formula: '=SUM(B2:B6)'
    explain: >-
      In Google Sheets, format the total cell as Format > Number > Duration to show 42:00:00.
    notes: >-
      Google Sheets has a ready-made Duration format (Format > Number > Duration) that shows hours
      beyond 24, so no custom code is needed. If you prefer hours and minutes only, use Format >
      Number > Custom number format and enter [h]:mm. Typing 8:30 into a cell creates a time of
      day, which works for summing; if you need entries above 24 hours, type them as 25:30:00 and
      apply Duration first.
    diff: >-
      In Google Sheets use the same SUM and apply Format > Number > Duration to the total.
  example:
    intro: A week of daily hours. B7 uses the [h]:mm format; C7 converts to decimal hours.
    grid:
      - [Day, Hours, Decimal hours]
      - [Mon, '8:30']
      - [Tue, '9:15']
      - [Wed, '7:45']
      - [Thu, '10:00']
      - [Fri, '6:30']
      - [Total]
    checks:
      - cell: B7
        label: formatted as [h]:mm (shows 18:00 with plain h:mm)
        excel: '=SUM(B2:B6)'
        result: '42:00'
        expect: 1.75
      - cell: C7
        label: decimal hours for pay calculations
        excel: '=SUM(B2:B6)*24'
        result: 42
  steps:
    - Each time is a fraction of a day; 8:30 is 0.354166...
    - 'SUM adds the fractions: 1.75 days, which is 42 hours.'
    - The [h] in the format tells the spreadsheet to show total elapsed hours instead of the hour of the day.
    - Multiplying by 24 converts days to hours, giving 42 for pay and overtime calculations.
  errors:
    - error: Total shows 18:00
      cause: The total cell uses h:mm, which wraps every 24 hours.
      fix: Use [h]:mm (Excel) or Duration (Google Sheets).
    - error: Decimal result shows as a time
      cause: The *24 cell inherited a time format.
      fix: Format it as Number.
    - error: Total is 0
      cause: The hours were typed as text (e.g. "8.30" or "8h30").
      fix: Re-enter them as h:mm, or convert with TIMEVALUE.
  faq:
    - q: How do I calculate pay from hours?
      a: Multiply the decimal hours by the rate, e.g. =SUM(B2:B6)*24*C1.
    - q: How do I show minutes only?
      a: Use the custom format [m] to display the total in minutes.
    - q: How do I calculate hours for a shift that passes midnight?
      a: 'If the end time is smaller than the start time, add 1 day: =MOD(C2-B2, 1) returns the correct duration for both normal and overnight shifts, for example 22:00 to 06:00 gives 8:00.'
  related: [networkdays, days-between-dates, percentage-change]

- id: text-function
  category: date
  slugs: {excel: text-function-excel, sheets: text-function-google-sheets}
  title: How to Format Dates with the TEXT Function
  summary: >-
    TEXT turns a real date into a text string in exactly the layout you choose, such as
    2026-03-05, March 5, 2026 or Thursday. It is the standard way to put a nicely formatted
    date inside a sentence, a file name or a label. Excel and Google Sheets share the TEXT
    syntax, but Excel's format codes depend on the language of your Excel installation, while
    Google Sheets always reads English codes.
  problem: >-
    You join a date to some text with & and get a meaningless serial number like 46086 instead
    of a readable date, or you need a date in one fixed layout (ISO, month name, weekday) for
    an export, a report title or a lookup key, regardless of how the cell itself is formatted.
  excel:
    formula: '=TEXT(A2, "yyyy-mm-dd")'
    explain: >-
      Syntax: `TEXT(value, format_text)`. A2 holds a real date (a serial number behind the
      scenes); the format code "yyyy-mm-dd" returns it as the text 2026-03-05. The result is
      text, so it no longer sorts or calculates like a date.
    notes: >-
      The most useful date codes are yyyy (four-digit year), yy (two-digit year), m or mm
      (month number), mmm (Jan), mmmm (January), d or dd (day number), ddd (Thu) and dddd
      (Thursday). In Excel the codes are localised: a German Excel expects "JJJJ-MM-TT" and a
      French Excel "aaaa-mm-jj", so a workbook built with English codes can show the wrong
      result when it is opened in another language version. If you only want the cell to look
      different, use Format Cells > Number > Custom instead of TEXT, because cell formatting
      keeps the value a real date. In Microsoft 365, TEXT spills over a range:
      `=TEXT(A2:A10, "mmm yyyy")` returns one label per row.
    alternatives:
      - label: Readable date inside a sentence
        formula: '="Due on "&TEXT(A2, "mmmm d, yyyy")'
      - label: Weekday name
        formula: '=TEXT(A2, "dddd")'
      - label: Spill labels for a range (Excel 365)
        formula: '=TEXT(A2:A10, "mmm yyyy")'
    diff: >-
      Google Sheets uses the same TEXT function and the same English codes in every locale; it
      fills a column with ARRAYFORMULA instead of spilling.
  sheets:
    formula: '=TEXT(A2, "yyyy-mm-dd")'
    explain: >-
      The same TEXT syntax works in Google Sheets: A2 must be a real date, and the format code
      decides how the returned text looks.
    notes: >-
      Google Sheets always reads the English format codes (yyyy, mm, mmmm, dddd), whatever the
      spreadsheet locale is, so the formula is portable between accounts. The locale (File >
      Settings) only changes the language of month and weekday names in the result, for example
      "jeudi" instead of "Thursday" for a French locale. To format a whole column at once use
      `=ARRAYFORMULA(IF(A2:A="", "", TEXT(A2:A, "yyyy-mm-dd")))`. When you only want a
      different look, use Format > Number > Custom date and time, which keeps the value a real
      date. If TEXT returns the input unchanged, the cell holds text that only looks like a date;
      convert it with DATEVALUE first.
    alternatives:
      - label: Whole column of ISO dates
        formula: '=ARRAYFORMULA(IF(A2:A="", "", TEXT(A2:A, "yyyy-mm-dd")))'
      - label: Readable date inside a sentence
        formula: '="Due on "&TEXT(A2, "mmmm d, yyyy")'
      - label: Convert a text date first, then format
        formula: '=TEXT(DATEVALUE(A2), "dd mmm yyyy")'
    diff: >-
      Excel expects format codes in the language of the Excel installation and spills over
      ranges; Sheets always uses English codes and needs ARRAYFORMULA for a column.
  example:
    intro: Three real dates in column A turned into four common text layouts.
    grid:
      - [Date, ISO text, Long date, Weekday, Label]
      - [2026-03-05]
      - [2026-12-25]
      - [2026-07-01]
    checks:
      - cell: B2
        label: ISO 8601 layout
        excel: '=TEXT(A2, "yyyy-mm-dd")'
        fill: [B2, B3, B4]
        results: ['2026-03-05', '2026-12-25', '2026-07-01']
      - cell: C2
        label: full month name
        excel: '=TEXT(A2, "mmmm d, yyyy")'
        fill: [C2, C3, C4]
        results: ['March 5, 2026', 'December 25, 2026', 'July 1, 2026']
      - cell: D2
        label: weekday name
        excel: '=TEXT(A2, "dddd")'
        fill: [D2, D3, D4]
        results: [Thursday, Friday, Wednesday]
      - cell: E2
        label: date joined to text
        excel: '="Due "&TEXT(A2, "mmm yyyy")'
        fill: [E2, E3, E4]
        results: [Due Mar 2026, Due Dec 2026, Due Jul 2026]
  steps:
    - Make sure column A holds real dates. =ISNUMBER(A2) should return TRUE.
    - 'In the result cell type `=TEXT(A2, "yyyy-mm-dd")` and press Enter.'
    - 'Swap the format code for the layout you need: "mmmm d, yyyy" for March 5, 2026, "dddd" for the weekday, "mmm yyyy" for Mar 2026.'
    - 'To use the date inside a sentence, join it with &: `="Due "&TEXT(A2, "mmm yyyy")`.'
    - Fill the formula down (or spill it in Excel 365, or wrap it in ARRAYFORMULA in Google Sheets).
  errors:
    - error: Result shows a number like 46086
      cause: The date was joined with & without TEXT, so its serial number was used.
      fix: 'Wrap the date in TEXT: `="Due "&TEXT(A2, "mmm yyyy")`.'
    - error: Wrong or literal letters in the result (for example YYYY-03-05)
      cause: In Excel the format codes follow the installation language, or the code uses a letter Excel does not know.
      fix: Use the codes of your Excel language (for example JJJJ in German Excel), or keep the formatting in Format Cells instead of TEXT.
    - error: TEXT returns the value unchanged
      cause: The cell holds text that looks like a date, not a real date.
      fix: Convert it first with DATEVALUE, for example =TEXT(DATEVALUE(A2), "yyyy-mm-dd").
    - error: Sorting by the result is wrong
      cause: TEXT returns text, so "April" sorts before "March".
      fix: Sort by the original date column, or use the ISO layout yyyy-mm-dd, which sorts correctly as text.
  faq:
    - q: Why does my date turn into a number when I combine it with text?
      a: Dates are stored as serial numbers, and & uses the stored value. Wrap the date in TEXT with a format code to keep it readable.
    - q: Is TEXT the same as changing the cell format?
      a: No. Cell formatting changes only how the value looks and keeps it a real date. TEXT returns a new text value that no longer calculates like a date.
    - q: How do I show the month name only?
      a: 'Use `=TEXT(A2, "mmmm")` for the full name or `=TEXT(A2, "mmm")` for the three-letter abbreviation.'
  related: [days-between-dates, eomonth, datedif-age, networkdays]

- id: date-function
  category: date
  slugs: {excel: date-excel, sheets: date-google-sheets}
  title: How to Use the DATE Function
  summary: >-
    DATE builds a real date from a year, a month and a day number. It is the safest way to put a
    date inside a formula, to rebuild dates from separate columns or from text codes such as
    20260704, and to move a date by whole months or years. Works the same in Excel and Google
    Sheets, with a few Sheets-only helpers.
  problem: >-
    Your export has the year, month and day in three separate columns, or a date written as a code
    like 20260704, and you need a real date that sorts, filters and works with other date
    functions. Typing a date as text inside a formula also breaks when someone opens the file with
    different regional settings.
  excel:
    formula: '=DATE(A2, B2, C2)'
    explain: >-
      Syntax: `DATE(year, month, day)`. It returns the serial number of that date, so format the
      cell as a date (Ctrl+1 > Date). DATE(2026, 3, 15) is March 15, 2026 on every computer,
      whatever the regional date order.
    notes: >-
      DATE rolls over automatically: month 14 becomes February of the next year, and day 0 is the
      last day of the previous month, so `=DATE(A2, B2+1, 0)` returns the month end and
      `=DAY(DATE(A2, B2+1, 0))` the number of days in that month. Always type four-digit years,
      because Excel adds 1900 to any year from 0 to 1899, so DATE(26, 1, 1) means 1926. Excel
      cannot show dates before January 1, 1900. Inside other formulas, prefer DATE over a typed
      date string, for example `=COUNTIFS(A:A, ">="&DATE(2026, 1, 1))`.
    alternatives:
      - label: Same day next month
        formula: '=DATE(YEAR(D2), MONTH(D2)+1, DAY(D2))'
      - label: From a text code like 20260704
        formula: '=DATE(LEFT(F2, 4), MID(F2, 5, 2), RIGHT(F2, 2))'
      - label: Days in the month
        formula: '=DAY(DATE(A2, B2+1, 0))'
    diff: >-
      Google Sheets has the same DATE function and the same roll-over rules, plus TO_DATE and
      ARRAYFORMULA for whole columns.
  sheets:
    formula: '=DATE(A2, B2, C2)'
    explain: >-
      DATE works the same way in Google Sheets: year, month and day become a real date, and month
      or day numbers outside the normal range roll over into the next or previous month.
    notes: >-
      Google Sheets usually formats the result as a date automatically; if you see a number such
      as 46096, use Format > Number > Date. To build a whole column at once, wrap the formula in
      ARRAYFORMULA and leave empty rows blank with IF. TO_DATE turns a serial number back into a
      date without changing the cell format, which is handy after math on dates. Sheets also
      adds 1900 to two-digit years, so type four digits. Unlike Excel, a Google Sheets cell can
      hold dates before 1900, but DATE itself still treats years below 1900 as offsets.
    alternatives:
      - label: Whole column with ARRAYFORMULA
        formula: '=ARRAYFORMULA(IF(A2:A="", "", DATE(A2:A, B2:B, C2:C)))'
      - label: Serial number to date
        formula: '=TO_DATE(46096)'
      - label: From a text code like 20260704
        formula: '=DATE(LEFT(F2, 4), MID(F2, 5, 2), RIGHT(F2, 2))'
    diff: >-
      Excel has no TO_DATE; format the cell as a date instead, and in Microsoft 365 the column
      version spills without ARRAYFORMULA.
  example:
    intro: >-
      Year, month and day numbers in columns A to C, and text date codes in column F. Row 3 uses
      month 14 and row 4 uses day 0 to show how DATE rolls over.
    grid:
      - [Year, Month, Day, Date, Next month, Text code, From code, Days in month]
      - [2026, 3, 15, null, null, '20260704']
      - [2026, 14, 1, null, null, '20261231']
      - [2026, 3, 0, null, null, '20270115']
    checks:
      - cell: D2
        label: filled down
        excel: '=DATE(A2, B2, C2)'
        fill: [D2, D3, D4]
        results: [2026-03-15, 2027-02-01, 2026-02-28]
      - cell: E2
        label: same day one month later
        excel: '=DATE(YEAR(D2), MONTH(D2)+1, DAY(D2))'
        result: 2026-04-15
      - cell: G2
        label: text code to date, filled down
        excel: '=DATE(LEFT(F2, 4), MID(F2, 5, 2), RIGHT(F2, 2))'
        fill: [G2, G3, G4]
        results: [2026-07-04, 2026-12-31, 2027-01-15]
      - cell: H2
        label: days in March 2026
        excel: '=DAY(DATE(A2, B2+1, 0))'
        result: 31
  steps:
    - Put the year, month and day in separate cells, or point DATE at the columns you already have.
    - 'Type `=DATE(A2, B2, C2)` in the first result cell and press Enter.'
    - If the result shows a number, format the cell as a date.
    - Fill the formula down. Month 14 in row 3 rolls into February 2027, and day 0 in row 4 returns the last day of February 2026.
    - 'For text codes, cut the code into pieces with LEFT, MID and RIGHT and pass them to DATE: 20260704 becomes July 4, 2026.'
  errors:
    - error: Result shows a number like 46096
      cause: The cell is formatted as a number, and dates are stored as serial numbers.
      fix: Format the cell as a date.
    - error: The year comes out as 1926
      cause: A two-digit year was used, and years from 0 to 1899 are added to 1900.
      fix: Always pass a four-digit year, for example 2026.
    - error: '#VALUE!'
      cause: One of the arguments is text that cannot be read as a number, such as "March".
      fix: Use the month number, or convert the text first, for example with MONTH(DATEVALUE("1 "&B2&" 2026")).
    - error: '#NUM!'
      cause: The resulting date is before 1900 in Excel, for example a negative year.
      fix: Check the year column for empty or wrong values.
  faq:
    - q: How do I get the first day of the month with DATE?
      a: 'Use day 1: =DATE(YEAR(A2), MONTH(A2), 1).'
    - q: How do I add years to a date?
      a: 'Add to the year part: =DATE(YEAR(A2)+1, MONTH(A2), DAY(A2)). February 29 then rolls to March 1 in a non-leap year.'
    - q: Why use DATE instead of typing "3/15/2026" in a formula?
      a: A typed date string is read according to the regional settings, so it can mean a different date or an error on another computer. DATE always means the same day.
  related: [eomonth, days-between-dates, text-to-date, today-now, sum-by-month]

- id: today-now
  category: date
  slugs: {excel: today-now-excel, sheets: today-now-google-sheets}
  title: How to Use TODAY and NOW
  summary: >-
    TODAY returns the current date and NOW the current date and time. Both update automatically,
    which makes them perfect for countdowns, overdue flags and ages, but useless as a fixed time
    stamp. This page shows both functions, how to freeze the date, and how Excel and Google Sheets
    decide when to update them.
  problem: >-
    You want a task list that shows how many days are left until each deadline and flags overdue
    items, without retyping today's date every morning. You also need a fixed time stamp for
    when a row was entered, which TODAY and NOW cannot give you.
  excel:
    formula: '=TODAY()'
    explain: >-
      TODAY and NOW take no arguments. `=TODAY()` returns today's date with no time part, and
      `=NOW()` returns the date plus the current time, for example 2026-10-31 14:30.
    notes: >-
      Both functions are volatile: Excel recalculates them every time the workbook is opened or
      anything is edited, and when you press F9. Put =TODAY() in one cell and refer to that cell,
      so every formula uses the same date. For a fixed value that never changes, press Ctrl+; to
      type today's date or Ctrl+Shift+; for the current time. NOW uses the clock and time zone of
      your computer. The time part of NOW is `=NOW()-TODAY()`, and `=INT(NOW())` equals TODAY.
    alternatives:
      - label: Days until a due date
        formula: '=B2-TODAY()'
      - label: Current time only
        formula: '=NOW()-TODAY()'
      - label: Date and time as text
        formula: '=TEXT(NOW(), "yyyy-mm-dd hh:mm")'
    diff: >-
      Google Sheets has the same TODAY and NOW, but uses the spreadsheet time zone and lets you
      choose how often they recalculate.
  sheets:
    formula: '=TODAY()'
    explain: >-
      TODAY and NOW work the same way in Google Sheets: TODAY gives the date and NOW the date and
      time, and both update on their own.
    notes: >-
      Google Sheets takes the time from the spreadsheet time zone in File > Settings, not from
      your computer, so check it if NOW looks hours off. In the same Settings dialog, the
      Calculation tab lets you recalculate on change, every minute or every hour, which keeps a
      NOW clock moving even when nobody edits the sheet. Ctrl+; and Ctrl+Shift+; insert a fixed
      date and time, just like in Excel. To compute days left for a whole column at once, use
      ARRAYFORMULA, and TO_DATE turns the result of INT(NOW()) back into a date format.
    alternatives:
      - label: Days left for the whole column
        formula: '=ARRAYFORMULA(IF(B2:B="", "", B2:B-TODAY()))'
      - label: Date part of NOW as a date
        formula: '=TO_DATE(INT(NOW()))'
      - label: Date and time as text
        formula: '=TEXT(NOW(), "yyyy-mm-dd hh:mm")'
    diff: >-
      Excel uses the computer clock and recalculates on every edit or F9; there is no
      every-minute setting and no TO_DATE.
  example:
    intro: >-
      A deadline list. On a live sheet F2 holds =TODAY(); here it is frozen at Saturday,
      October 31, 2026 so the results are reproducible. Column G shows checks that are true on
      any day.
    grid:
      - [Task, Due date, Days left, Status, null, Today, Check]
      - [Invoice, 2026-11-10, null, null, null, 2026-10-31]
      - [Report, 2026-10-25]
      - [Review, 2026-10-31]
    checks:
      - cell: C2
        label: days left, filled down
        excel: '=B2-$F$2'
        fill: [C2, C3, C4]
        results: [10, -6, 0]
      - cell: D2
        label: status, filled down
        excel: '=IF(B2<$F$2, "Overdue", IF(B2=$F$2, "Due today", "Open"))'
        fill: [D2, D3, D4]
        results: [Open, Overdue, Due today]
      - cell: G2
        label: TODAY is a whole number of days
        excel: '=TODAY()=INT(TODAY())'
        result: true
      - cell: G3
        label: the date part of NOW is TODAY
        excel: '=INT(NOW())=TODAY()'
        result: true
      - cell: G4
        label: NOW minus TODAY is the time of day, always under 1
        excel: '=NOW()-TODAY()<1'
        result: true
  steps:
    - Type `=TODAY()` in a spare cell such as F2, so every formula refers to the same date.
    - 'Subtract it from each due date: `=B2-$F$2` gives 10 days left for the invoice, -6 for the overdue report and 0 for the review.'
    - 'Turn the number into a label with IF: past dates are Overdue, today is Due today, later dates are Open.'
    - Use NOW instead of TODAY when the time matters, for example to count hours until a deadline with (B2-NOW())*24.
    - For a time stamp that must never change, type it with Ctrl+; (date) or Ctrl+Shift+; (time) instead of a formula.
  errors:
    - error: The time stamp changes every day
      cause: TODAY and NOW are volatile and always show the current date and time.
      fix: Insert a fixed value with Ctrl+; or copy the cell and paste it as values.
    - error: Days left shows a date like 1/10/1900
      cause: The result cell inherited a date format from the due date.
      fix: Format the days-left cell as Number.
    - error: Comparing a date with NOW() never matches
      cause: NOW includes the time, so it is never equal to a date at midnight.
      fix: Compare with TODAY(), or use INT(NOW()).
    - error: NOW is a few hours off in Google Sheets
      cause: The spreadsheet time zone differs from your own.
      fix: Change it in File > Settings > Time zone.
  faq:
    - q: How do I calculate someone's age from a birth date?
      a: 'Use DATEDIF with TODAY: =DATEDIF(A2, TODAY(), "y") returns full years.'
    - q: Does TODAY update if the file is closed?
      a: No. It updates the next time the file is opened or recalculated, so a printed or exported copy keeps the old date.
    - q: How do I show today's date inside a sentence?
      a: 'Format it with TEXT: ="Report date: "&TEXT(TODAY(), "mmmm d, yyyy").'
  related: [date-function, days-between-dates, datedif-age, workday]

- id: workday
  category: date
  slugs: {excel: workday-excel, sheets: workday-google-sheets}
  title: How to Add Business Days with WORKDAY
  summary: >-
    WORKDAY returns the date that is a given number of working days after (or before) a start
    date, skipping weekends and an optional list of holidays. It is the standard way to compute
    due dates, delivery dates and SLA deadlines. WORKDAY.INTL does the same for other weekends.
  problem: >-
    Orders ship 5 business days after they are placed, and contracts are due 10 working days
    after signing. Adding 5 to the date counts weekends and public holidays, so the due date
    comes out too early.
  excel:
    formula: '=WORKDAY(A2, B2, $F$2:$F$4)'
    explain: >-
      Syntax: `WORKDAY(start_date, days, [holidays])`. It moves forward from A2 by B2 working
      days (Monday to Friday), skipping any dates listed in F2:F4. The start date itself is not
      counted. A negative number of days moves backward.
    notes: >-
      Format the result as a date, because WORKDAY returns a serial number. Keep holidays in their
      own range and lock it with $ so the formula can be filled down. For another weekend use
      WORKDAY.INTL: weekend code 7 means Friday and Saturday, 11 means Sunday only, and a
      7-character string such as "0000011" marks days off with 1, starting on Monday. To count
      the working days between two dates instead, use NETWORKDAYS. If the start date falls on a
      weekend, WORKDAY still counts from it, so a Saturday plus 1 working day is Monday.
    alternatives:
      - label: Friday-Saturday weekend
        formula: '=WORKDAY.INTL(A2, B2, 7, $F$2:$F$4)'
      - label: Three working days before a date
        formula: '=WORKDAY(A2, -3, $F$2:$F$4)'
      - label: Next working day if the date is on a weekend
        formula: '=WORKDAY(A2-1, 1, $F$2:$F$4)'
    diff: >-
      Google Sheets has the same WORKDAY and WORKDAY.INTL functions and can read the holiday list
      from an open-ended range on another sheet.
  sheets:
    formula: '=WORKDAY(A2, B2, $F$2:$F$4)'
    explain: >-
      WORKDAY works the same way in Google Sheets: it skips Saturdays, Sundays and the listed
      holidays, and does not count the start date.
    notes: >-
      In Google Sheets it is convenient to keep public holidays on their own tab and point to an
      open-ended range such as Holidays!A2:A, so new holidays are picked up without editing the
      formula. Empty cells in that range are ignored. WORKDAY.INTL accepts the same weekend codes
      and 7-character strings as in Excel. If the result appears as a number, choose Format >
      Number > Date. Holidays typed as text, for example "Dec 25", are not skipped, so make sure
      the list contains real dates.
    alternatives:
      - label: Holidays on a separate tab
        formula: '=WORKDAY(A2, B2, Holidays!A2:A)'
      - label: Sunday-only weekend with a weekend string
        formula: '=WORKDAY.INTL(A2, B2, "0000001", Holidays!A2:A)'
      - label: Next working day if the date is on a weekend
        formula: '=WORKDAY(A2-1, 1, Holidays!A2:A)'
    diff: >-
      Excel uses the same functions; point the holidays argument at a fixed range or a table
      column instead of an open-ended range.
  example:
    intro: >-
      Start dates and working days to add, with three public holidays in F2:F4 (November 26 and
      December 25, 2026, and January 1, 2027).
    grid:
      - [Start, Days, Due (weekends only), Due (with holidays), null, Holidays]
      - [2026-11-02, 10, null, null, null, 2026-11-26]
      - [2026-11-20, 5, null, null, null, 2026-12-25]
      - [2026-12-18, 7, null, null, null, 2027-01-01]
      - [2026-12-31, -3]
    checks:
      - cell: C2
        label: weekends skipped, filled down
        excel: '=WORKDAY(A2, B2)'
        fill: [C2, C3, C4, C5]
        results: [2026-11-16, 2026-11-27, 2026-12-29, 2026-12-28]
      - cell: D2
        label: weekends and holidays skipped, filled down
        excel: '=WORKDAY(A2, B2, $F$2:$F$4)'
        fill: [D2, D3, D4, D5]
        results: [2026-11-16, 2026-11-30, 2026-12-30, 2026-12-28]
      - cell: E4
        label: Friday-Saturday weekend
        excel: '=WORKDAY.INTL(A4, B4, 7, $F$2:$F$4)'
        result: 2026-12-28
  steps:
    - List the start dates in column A and the number of working days in column B.
    - Put the public holidays in their own range, here F2:F4, as real dates.
    - 'Type `=WORKDAY(A2, B2, $F$2:$F$4)` and fill it down.'
    - Monday, November 2 plus 10 working days is Monday, November 16. Friday, November 20 plus 5 is Friday, November 27, but Thanksgiving on November 26 pushes it to Monday, November 30.
    - A negative number counts backwards, so 3 working days before Thursday, December 31 is Monday, December 28.
  errors:
    - error: The due date ignores a holiday
      cause: The holiday is typed as text, or the holiday range moved when the formula was filled down.
      fix: Enter holidays as real dates and lock the range with $.
    - error: Result shows a number like 46342
      cause: The cell is formatted as a number.
      fix: Format it as a date.
    - error: '#NUM!'
      cause: The weekend code in WORKDAY.INTL is invalid, for example "1111111" with no working days.
      fix: Use a valid code from 1 to 7 or 11 to 17, or a string with at least one 0.
    - error: Due date one day later than expected
      cause: You expected the start date to count as day 1.
      fix: WORKDAY never counts the start date; use B2-1 days if your rule counts it.
  faq:
    - q: What is the difference between WORKDAY and NETWORKDAYS?
      a: WORKDAY returns a date a number of working days away; NETWORKDAYS counts the working days between two dates.
    - q: How do I add working hours instead of days?
      a: Divide the hours by the hours in a working day and pass the whole days to WORKDAY, then add the remaining hours to the start time.
    - q: How do I get the last working day of a month?
      a: '=WORKDAY(EOMONTH(A2, 0)+1, -1) goes to the first day of the next month and steps back one working day.'
  related: [networkdays, eomonth, days-between-dates, today-now]
