# Text formulas
- id: textjoin
  category: text
  launch: true
  slugs: {excel: textjoin-excel, sheets: textjoin-google-sheets}
  title: How to Use TEXTJOIN
  summary: >-
    TEXTJOIN combines text from many cells with a delimiter of your choice and can skip empty
    cells automatically. It is the modern replacement for chains of & or CONCATENATE. This page
    includes a conditional join, listing only the names that meet a condition, in one cell.
  problem: >-
    You need a comma-separated list of team members in one cell, both for everyone and for one
    team only, for example to paste into an email or a report header.
  excel:
    formula: '=TEXTJOIN(", ", TRUE, B2:B7)'
    explain: >-
      Syntax: `TEXTJOIN(delimiter, ignore_empty, text1, [text2], ...)`. Join B2:B7 with ", ",
      skipping empty cells because the second argument is TRUE.
    notes: >-
      TEXTJOIN is available in Excel 2019, 2021, 2024 and Microsoft 365. In Excel 2016 and older
      you have to chain cells with & or use CONCATENATE, neither of which can skip blanks. For a
      conditional list in Microsoft 365, feed FILTER into TEXTJOIN. In Excel 2019, which has
      TEXTJOIN but not FILTER, use `IF(A2:A7="Red", B2:B7, "")` as the text argument and confirm
      with Ctrl+Shift+Enter. A single cell holds at most 32,767 characters.
    alternatives:
      - label: Excel 2019 conditional join (array formula)
        formula: '=TEXTJOIN(", ", TRUE, IF(A2:A7="Red", B2:B7, ""))'
    diff: >-
      Excel uses the identical TEXTJOIN syntax (Excel 2019 and later). Excel has no JOIN function.
  sheets:
    formula: '=TEXTJOIN(", ", TRUE, B2:B7)'
    explain: >-
      Same syntax in Google Sheets.
    notes: >-
      Google Sheets also has the older JOIN function (`=JOIN(", ", B2:B7)`), which does not skip
      empty cells, so TEXTJOIN is usually better. For a conditional join, FILTER works directly
      inside TEXTJOIN. If you use the IF version instead, wrap it in ARRAYFORMULA, otherwise Sheets
      evaluates only the first row: `=ARRAYFORMULA(TEXTJOIN(", ", TRUE, IF(A2:A7="Red", B2:B7,
      "")))`. To join with a line break, use CHAR(10) as the delimiter and turn on text wrapping.
    alternatives:
      - label: Conditional join with IF (needs ARRAYFORMULA in Sheets)
        formula: '=ARRAYFORMULA(TEXTJOIN(", ", TRUE, IF(A2:A7="Red", B2:B7, "")))'
    diff: >-
      Google Sheets uses the same syntax and also has JOIN, which does not skip blanks.
  example:
    intro: Join all members, then only the Red team.
    grid:
      - [Team, Member, null, List]
      - [Red, Ana]
      - [Blue, Ben]
      - [Red, Chloe]
      - [Green, Dev]
      - [Red, Eva]
      - [Blue, Finn]
    checks:
      - cell: D2
        label: everyone
        excel: '=TEXTJOIN(", ", TRUE, B2:B7)'
        result: Ana, Ben, Chloe, Dev, Eva, Finn
      - cell: D3
        label: Red team only
        excel: '=TEXTJOIN(", ", TRUE, FILTER(B2:B7, A2:A7="Red"))'
        array: true
        result: Ana, Chloe, Eva
  steps:
    - 'The delimiter `", "` is placed between items (not after the last one).'
    - '`TRUE` skips empty cells so you never get ", ," gaps. Use FALSE to keep a placeholder for blanks.'
    - '`B2:B7` can be any mix of ranges and single values, e.g. `TEXTJOIN(" ", TRUE, A2, B2, C2)`.'
    - In the conditional version, FILTER first reduces the list to the Red rows and TEXTJOIN joins only those.
  errors:
    - error: '#NAME?'
      cause: Excel 2016 or older does not have TEXTJOIN.
      fix: Use & or CONCATENATE, or open the file in Excel 2019+ / Microsoft 365.
    - error: '#VALUE!'
      cause: The result is longer than 32,767 characters.
      fix: Join fewer cells or split the output across cells.
    - error: Numbers lose their formatting
      cause: TEXTJOIN uses the raw value, so 0.5 stays 0.5 even if the cell shows 50%.
      fix: Format inside the join, e.g. TEXT(C2:C7, "0%").
  faq:
    - q: What is the difference between TEXTJOIN, CONCAT and CONCATENATE?
      a: TEXTJOIN adds a delimiter and can skip blanks. CONCAT joins ranges without a delimiter. CONCATENATE only accepts individual cells.
    - q: How do I join with a line break?
      a: Use CHAR(10) as the delimiter and enable Wrap Text on the cell.
  related: [lookup-multiple-values, split-text, count-unique, trim]

- id: split-text
  category: text
  launch: true
  slugs: {excel: split-text-excel, sheets: split-text-google-sheets}
  title: How to Split Text into Columns with a Formula
  summary: >-
    Split "Name, Department, City" into separate cells with TEXTSPLIT in Excel 365 or SPLIT in
    Google Sheets. A classic formula for older Excel is included, along with the SPLIT quirk that
    splits on every character of the delimiter.
  problem: >-
    Each row has one cell containing several values separated by commas, for example from a form
    export. You want each value in its own column, and you want it to update when the source
    changes, which Text to Columns does not do.
  excel:
    formula: '=TEXTSPLIT(A2, ",")'
    explain: >-
      Syntax: `TEXTSPLIT(text, col_delimiter, [row_delimiter], [ignore_empty], [match_mode],
      [pad_with])`. Split A2 at each comma; the parts spill to the right.
    notes: >-
      TEXTSPLIT is available in Microsoft 365, Excel 2024 and Excel for the web. If your data has a space after
      each comma, split on ", " (comma and space) or wrap the result in TRIM. For several possible
      delimiters pass an array: `TEXTSPLIT(A2, {",",";"})`. In Excel 2021 and older use the
      SUBSTITUTE/REPT formula below; copy it across as many columns as you need parts. For a
      one-off split, Data > Text to Columns is faster but does not update.
    alternatives:
      - label: Any Excel version (copy across; n-th part from the column number)
        formula: '=TRIM(MID(SUBSTITUTE($A2, ",", REPT(" ", 100)), (COLUMN(A1)-1)*100+1, 100))'
    diff: >-
      TEXTSPLIT (Excel 365 / 2024) treats the delimiter as a whole string; older Excel needs the
      SUBSTITUTE/REPT formula.
  sheets:
    formula: '=SPLIT(A2, ",")'
    explain: >-
      Syntax: `SPLIT(text, delimiter, [split_by_each], [remove_empty_text])`. The parts spill to
      the right.
    notes: >-
      Watch the third argument: by default SPLIT treats every character in the delimiter as a
      separate delimiter. `=SPLIT(A2, ", ")` therefore splits on commas AND spaces, breaking "Ana
      Lopez" into two cells. Use `=SPLIT(A2, ", ", FALSE)` to split on the exact text ", ". SPLIT
      also removes empty parts by default (the fourth argument). It turns numeric-looking parts
      into numbers, so a ZIP code like 02134 loses its leading zero; format the output column as
      plain text first if that matters.
    alternatives:
      - label: Split on the exact text ", " (not on each character)
        formula: '=SPLIT(A2, ", ", FALSE)'
      - label: Split a whole column at once
        formula: '=ARRAYFORMULA(IF(A2:A="", "", SPLIT(A2:A, ",")))'
    diff: >-
      By default SPLIT splits on each character of the
      delimiter, so pass FALSE as the third argument to split on a multi-character string.
  example:
    intro: Each cell in column A holds name, department and city.
    grid:
      - [Record, Name, Department, City]
      - ['Ana Lopez,Sales,Madrid']
      - ['Ben Carter,IT,Boston']
      - ['Chloe Wong,Finance,Singapore']
    checks:
      - cell: B2
        label: spills into B2:D2
        excel: '=TEXTSPLIT(A2, ",")'
        sheets: '=SPLIT(A2, ",")'
        spill_cells: [B2, C2, D2]
        spill_results: [Ana Lopez, Sales, Madrid]
      - cell: B3
        label: classic formula, filled across to D3
        excel: '=TRIM(MID(SUBSTITUTE($A3, ",", REPT(" ", 100)), (COLUMN(A1)-1)*100+1, 100))'
        fill: [B3, C3, D3]
        results: [Ben Carter, IT, Boston]
      - cell: B4
        label: classic formula, filled across to D4
        excel: '=TRIM(MID(SUBSTITUTE($A4, ",", REPT(" ", 100)), (COLUMN(A2)-1)*100+1, 100))'
        fill: [B4, C4, D4]
        results: [Chloe Wong, Finance, Singapore]
  steps:
    - 'TEXTSPLIT / SPLIT find every comma and return the pieces between them as separate cells.'
    - The results spill into the cells to the right, so leave enough empty columns.
    - 'The classic formula replaces each comma with 100 spaces, which pushes every part into its own 100-character block.'
    - '`MID(..., (n-1)*100+1, 100)` cuts out block n, where n comes from COLUMN(A1)=1, COLUMN(B1)=2, and so on as you copy right.'
    - TRIM removes the padding spaces, leaving just the value. It works as long as each part is shorter than 100 characters.
  errors:
    - error: Names split in two (Google Sheets)
      cause: SPLIT with a delimiter like ", " splits on each character, including the space.
      fix: Add FALSE as the third argument.
    - error: '#SPILL! / #REF!'
      cause: The cells to the right are not empty.
      fix: Clear them before entering the formula.
    - error: Leading spaces in the parts
      cause: The data uses ", " but you split on ",".
      fix: Split on ", " (with FALSE in Sheets) or wrap the result in TRIM.
  faq:
    - q: How do I split into rows instead of columns?
      a: In Excel 365 use the row delimiter, =TEXTSPLIT(A2, , ","). In Google Sheets use =TRANSPOSE(SPLIT(A2, ",")).
    - q: How do I get only the second part?
      a: Excel 365, =INDEX(TEXTSPLIT(A2, ","), 2); Google Sheets, =INDEX(SPLIT(A2, ","), 2).
  related: [text-before-character, text-after-character, textjoin, trim]

- id: text-before-character
  category: text
  launch: true
  slugs: {excel: text-before-character-excel, sheets: text-before-character-google-sheets}
  title: How to Extract Text Before a Character
  summary: >-
    Get everything before a character such as "@", "-" or a space: the username part of an
    email, a first name, or a product prefix. Excel 365 has TEXTBEFORE; LEFT with FIND works
    everywhere, and Google Sheets can use REGEXEXTRACT.
  problem: >-
    You have a column of email addresses and need the part before the @ sign in a separate
    column.
  excel:
    formula: '=TEXTBEFORE(A2, "@")'
    explain: >-
      Syntax: `TEXTBEFORE(text, delimiter, [instance_num], [match_mode], [match_end],
      [if_not_found])`. Returns the text before the first "@".
    notes: >-
      TEXTBEFORE needs Microsoft 365, Excel 2024 or Excel for the web. Use a negative instance number to
      count from the end: `TEXTBEFORE(A2, ".", -1)` returns everything before the last dot. The
      if_not_found argument avoids #N/A when the character is missing. In any other version use
      LEFT with FIND; FIND returns the position of the character and LEFT takes everything before
      it.
    alternatives:
      - label: Any Excel version
        formula: '=LEFT(A2, FIND("@", A2)-1)'
      - label: Before the LAST occurrence (Microsoft 365)
        formula: '=TEXTBEFORE(A2, ".", -1)'
    diff: >-
      TEXTBEFORE exists only in Excel (Microsoft 365 / 2024); Google Sheets does not have it.
  sheets:
    formula: '=LEFT(A2, FIND("@", A2)-1)'
    explain: >-
      FIND returns the position of "@"; LEFT takes all characters before it.
    notes: >-
      Google Sheets does not have TEXTBEFORE; typing it returns #NAME?. LEFT with FIND is the
      standard replacement. REGEXEXTRACT is the more flexible Sheets option: `^[^@]+` means "from
      the start, every character that is not @". Regular expressions also make it easy to take
      the text before the last occurrence: `=REGEXEXTRACT(A2, "(.*)\.")` is greedy and stops at
      the final dot. Note that REGEXEXTRACT only works on text, so convert numbers with A2&"".
    alternatives:
      - label: REGEXEXTRACT version
        formula: '=REGEXEXTRACT(A2, "^[^@]+")'
      - label: Before the last dot
        formula: '=REGEXEXTRACT(A2, "(.*)\.")'
    diff: >-
      Google Sheets has no TEXTBEFORE, so LEFT with FIND (or REGEXEXTRACT) is the way there.
  example:
    intro: Extract the username before the @.
    grid:
      - [Email, TEXTBEFORE, LEFT + FIND]
      - [ana.lopez@acme.com]
      - [ben@globex.io]
      - [chloe.wong@initech.co]
    checks:
      - cell: B2
        label: Excel 365, filled down
        excel: '=TEXTBEFORE(A2, "@")'
        sheets: '=REGEXEXTRACT(A2, "^[^@]+")'
        fill: [B2, B3, B4]
        results: [ana.lopez, ben, chloe.wong]
      - cell: C2
        label: works everywhere, filled down
        excel: '=LEFT(A2, FIND("@", A2)-1)'
        fill: [C2, C3, C4]
        results: [ana.lopez, ben, chloe.wong]
  steps:
    - '`FIND("@", A2)` returns the position of the @ sign: 10 in ana.lopez@acme.com.'
    - '`-1` excludes the @ itself, so LEFT takes 9 characters.'
    - '`LEFT(A2, 9)` returns ana.lopez.'
    - TEXTBEFORE does the same in one step and can count occurrences from either end.
  errors:
    - error: '#VALUE!'
      cause: FIND did not find the character in that cell (e.g. an empty cell or a value without @).
      fix: 'Wrap in IFERROR, or in Excel 365 use if_not_found: =TEXTBEFORE(A2, "@", , , , "").'
    - error: '#NAME? in Google Sheets'
      cause: TEXTBEFORE is an Excel-only function.
      fix: Use LEFT/FIND or REGEXEXTRACT.
    - error: Wrong part when the character is not unique
      cause: FIND returns the first occurrence.
      fix: Use TEXTBEFORE with -1 (Excel 365) or a greedy regular expression (Google Sheets) for the last occurrence.
  faq:
    - q: Is FIND case-sensitive?
      a: Yes. Use SEARCH for a case-insensitive position; it also supports wildcards.
    - q: How do I get the first word of a cell?
      a: Use a space as the character, =LEFT(A2, FIND(" ", A2&" ")-1). Adding a space to A2 avoids an error for single words.
    - q: How do I get the text before a space, comma or line break?
      a: 'Replace "@" with the character you need: " " for a space, "," for a comma, or CHAR(10) for a line break inside the cell, e.g. =LEFT(A2, FIND(CHAR(10), A2)-1).'
  related: [text-after-character, split-text, trim, contains-text]

- id: text-after-character
  category: text
  launch: true
  slugs: {excel: text-after-character-excel, sheets: text-after-character-google-sheets}
  title: How to Extract Text After a Character
  summary: >-
    Return everything after the first or the last occurrence of a character, for example the
    size code at the end of a SKU or the domain of an email address. Covers TEXTAFTER (Excel 365),
    MID with FIND (all versions) and REGEXEXTRACT (Google Sheets).
  problem: >-
    Product codes look like SKU-RED-XL. You need the part after the first dash (RED-XL) and,
    separately, just the size after the last dash (XL).
  excel:
    formula: '=TEXTAFTER(A2, "-")'
    explain: >-
      Returns the text after the first "-". Use -1 as the third argument to start from the last
      dash instead.
    notes: >-
      TEXTAFTER is available in Microsoft 365, Excel 2024 and Excel for the web. In older versions use MID
      with FIND for the first occurrence. For the last occurrence, the RIGHT/SUBSTITUTE/REPT
      trick works in every version: it pads every dash with 100 spaces, takes the last 100
      characters and trims them, leaving the final part.
    alternatives:
      - label: After the LAST dash (Microsoft 365)
        formula: '=TEXTAFTER(A2, "-", -1)'
      - label: After the first dash, any version
        formula: '=MID(A2, FIND("-", A2)+1, LEN(A2))'
      - label: After the last dash, any version
        formula: '=TRIM(RIGHT(SUBSTITUTE(A2, "-", REPT(" ", 100)), 100))'
    diff: >-
      Excel 365 has TEXTAFTER (use -1 for the last occurrence). Google Sheets does not.
  sheets:
    formula: '=MID(A2, FIND("-", A2)+1, LEN(A2))'
    explain: >-
      FIND locates the first dash; MID returns everything from the next character on.
    notes: >-
      Google Sheets has no TEXTAFTER. Besides MID with FIND, REGEXEXTRACT handles both cases
      neatly: `-(.*)` captures everything after the first dash, and `[^-]+$` matches the last
      group of characters that contains no dash, i.e. everything after the final dash. A third
      option for the last part is `=INDEX(SPLIT(A2, "-"), COUNTA(SPLIT(A2, "-")))`.
    alternatives:
      - label: After the first dash with REGEXEXTRACT
        formula: '=REGEXEXTRACT(A2, "-(.*)")'
      - label: After the last dash with REGEXEXTRACT
        formula: '=REGEXEXTRACT(A2, "[^-]+$")'
    diff: >-
      Google Sheets has no TEXTAFTER; use MID/FIND or REGEXEXTRACT there.
  example:
    intro: Four ways to split the SKU.
    grid:
      - [SKU, TEXTAFTER first, TEXTAFTER last, MID + FIND, RIGHT + SUBSTITUTE]
      - [SKU-RED-XL]
      - [SKU-BLUE-M]
      - [SKU-GREEN-S]
    checks:
      - cell: B2
        label: Excel 365, filled down
        excel: '=TEXTAFTER(A2, "-")'
        sheets: '=REGEXEXTRACT(A2, "-(.*)")'
        fill: [B2, B3, B4]
        results: [RED-XL, BLUE-M, GREEN-S]
      - cell: C2
        label: Excel 365, filled down
        excel: '=TEXTAFTER(A2, "-", -1)'
        sheets: '=REGEXEXTRACT(A2, "[^-]+$")'
        fill: [C2, C3, C4]
        results: [XL, M, S]
      - cell: D2
        label: after first dash, any version
        excel: '=MID(A2, FIND("-", A2)+1, LEN(A2))'
        fill: [D2, D3, D4]
        results: [RED-XL, BLUE-M, GREEN-S]
      - cell: E2
        label: after last dash, any version
        excel: '=TRIM(RIGHT(SUBSTITUTE(A2, "-", REPT(" ", 100)), 100))'
        fill: [E2, E3, E4]
        results: [XL, M, S]
  steps:
    - '`FIND("-", A2)` returns 4, the position of the first dash in SKU-RED-XL.'
    - '`MID(A2, 5, LEN(A2))` starts at the character after the dash and takes up to the full length, which simply means "to the end".'
    - For the last part, SUBSTITUTE turns each dash into 100 spaces; RIGHT(..., 100) grabs the final block, which contains only spaces and "XL".
    - TRIM removes the spaces, leaving XL.
  errors:
    - error: '#VALUE!'
      cause: The character does not occur in the cell.
      fix: Wrap in IFERROR(..., A2) to return the original text, or use TEXTAFTER's if_not_found argument.
    - error: Returns the wrong segment
      cause: FIND always finds the first occurrence.
      fix: Use TEXTAFTER with -1, the RIGHT/SUBSTITUTE trick, or "[^-]+$" in Google Sheets.
    - error: Part longer than 100 characters is cut off
      cause: The REPT(" ", 100) padding is too short.
      fix: Use a larger number such as 500 in both places.
  faq:
    - q: How do I get the domain from an email address?
      a: Use the text after "@", e.g. =MID(A2, FIND("@", A2)+1, LEN(A2)) or =TEXTAFTER(A2, "@").
    - q: How do I get the text after the second dash?
      a: In Excel 365 use =TEXTAFTER(A2, "-", 2). In other versions, nest FIND, e.g. =MID(A2, FIND("-", A2, FIND("-", A2)+1)+1, LEN(A2)).
  related: [text-before-character, split-text, trim, textjoin]

- id: trim
  category: text
  launch: true
  slugs: {excel: trim-excel, sheets: trim-google-sheets}
  title: How to Remove Extra Spaces with TRIM
  summary: >-
    TRIM removes leading and trailing spaces and reduces runs of spaces between words to a single
    space. It fixes failed lookups and duplicate-looking values. This guide also covers the
    non-breaking spaces that TRIM cannot remove on its own.
  problem: >-
    Names imported from a CRM have random extra spaces, so "Ana Lopez" and " Ana  Lopez" are
    treated as different people and lookups fail.
  excel:
    formula: '=TRIM(A2)'
    explain: >-
      Removes spaces at the start and end and leaves single spaces between words.
    notes: >-
      Excel's TRIM only removes the normal space character (code 32). Text copied from web pages
      often contains non-breaking spaces (code 160), which look identical but survive TRIM;
      replace them first with SUBSTITUTE. CLEAN removes non-printing control characters such as
      line feeds from older systems. After cleaning, use Copy > Paste Special > Values to replace
      the original column if you no longer need the formula.
    alternatives:
      - label: Also remove non-breaking spaces and control characters
        formula: '=TRIM(CLEAN(SUBSTITUTE(A2, CHAR(160), " ")))'
    diff: >-
      Excel uses the identical TRIM function.
  sheets:
    formula: '=TRIM(A2)'
    explain: >-
      Same function in Google Sheets.
    notes: >-
      Google Sheets has a menu shortcut that does not need a helper column: select the range and
      choose Data > Data cleanup > Trim whitespace. It edits the cells in place. For a formula
      that cleans a whole column at once, use `=ARRAYFORMULA(TRIM(A2:A))`. To strip every kind of
      whitespace, including non-breaking spaces and tabs, REGEXREPLACE works well:
      `=TRIM(REGEXREPLACE(A2, "\s+", " "))`.
    alternatives:
      - label: Whole column with one formula
        formula: '=ARRAYFORMULA(TRIM(A2:A))'
      - label: Collapse all whitespace characters
        formula: '=TRIM(REGEXREPLACE(A2, "\s+", " "))'
    diff: >-
      Google Sheets uses the same TRIM function and also offers Data > Data cleanup > Trim
      whitespace.
  example:
    intro: The quotes show the hidden spaces in the raw values.
    grid:
      - [Raw name, Trimmed, Length before, Length after]
      - ['  Ana   Lopez ']
      - [' Ben Carter']
      - ['Chloe  Wong  ']
    checks:
      - cell: B2
        label: filled down
        excel: '=TRIM(A2)'
        fill: [B2, B3, B4]
        results: [Ana Lopez, Ben Carter, Chloe Wong]
      - cell: C2
        excel: '=LEN(A2)'
        fill: [C2, C3, C4]
        results: [14, 11, 13]
      - cell: D2
        excel: '=LEN(B2)'
        fill: [D2, D3, D4]
        results: [9, 10, 10]
  steps:
    - TRIM deletes every space before the first character and after the last one.
    - Runs of two or more spaces between words become one space.
    - 'LEN shows the effect: "  Ana   Lopez " has 14 characters, "Ana Lopez" has 9.'
    - 'Use the trimmed column for lookups, or clean the lookup value inside the formula: `VLOOKUP(TRIM(F2), ...)`.'
  errors:
    - error: Spaces still there
      cause: They are non-breaking spaces (CHAR(160)) from web data.
      fix: SUBSTITUTE(A2, CHAR(160), " ") before TRIM.
    - error: Numbers become text
      cause: TRIM always returns text, so trimmed numbers no longer add up.
      fix: Wrap in VALUE, e.g. =VALUE(TRIM(A2)).
    - error: Line breaks remain
      cause: TRIM does not remove line feeds (CHAR(10)).
      fix: Use CLEAN, or SUBSTITUTE(A2, CHAR(10), " ").
  faq:
    - q: Does TRIM remove single spaces between words?
      a: No. It keeps one space between words and only removes extra ones.
    - q: How do I remove all spaces?
      a: Use =SUBSTITUTE(A2, " ", "").
    - q: Why does my lookup still fail after TRIM?
      a: 'Check whether one side is a number and the other text: TRIM always returns text, so a trimmed "102" will not match the number 102. Wrap it in VALUE, or compare with =ISNUMBER() on both sides to see which is which.'
  related: [na-error, text-before-character, split-text, leading-zeros]

- id: leading-zeros
  category: text
  launch: true
  slugs: {excel: leading-zeros-excel, sheets: leading-zeros-google-sheets}
  title: How to Add Leading Zeros
  summary: >-
    Pad numbers with zeros to a fixed length, such as 00042 for employee IDs or ZIP codes. Choose
    between a custom number format (value stays a number) and TEXT or RIGHT formulas (value
    becomes text), and learn how to stop the zeros disappearing in the first place.
  problem: >-
    Employee numbers must always have five digits for an import file, but the sheet shows 7, 42
    and 315 because spreadsheets drop leading zeros from numbers.
  excel:
    formula: '=TEXT(A2, "00000")'
    explain: >-
      Each 0 in the format is a required digit, so the number is padded to five digits. The
      result is text.
    notes: >-
      If you only need the zeros to show, apply a custom number format instead: select the cells,
      press Ctrl+1, choose Custom and type 00000. The cells stay numbers, so they still sort and
      calculate correctly. To keep zeros when typing, format the column as Text first or start
      the entry with an apostrophe ('00042). In Microsoft 365, File > Options > Data > Automatic
      data conversion lets you stop Excel from removing leading zeros when opening CSV files.
    alternatives:
      - label: Padding with RIGHT (works for text IDs too)
        formula: '=RIGHT("00000"&A2, 5)'
    diff: >-
      Excel uses the same TEXT formula. Ctrl+1 > Custom > 00000 applies the display-only format.
  sheets:
    formula: '=TEXT(A2, "00000")'
    explain: >-
      Same formula in Google Sheets.
    notes: >-
      In Google Sheets apply the display-only version via Format > Number > Custom number format
      and enter 00000. When importing a CSV, choose File > Import and untick "Convert text to
      numbers, dates and formulas" so codes like 00042 are kept as text. To pad a whole column at
      once, use `=ARRAYFORMULA(IF(A2:A="", "", TEXT(A2:A, "00000")))`. REPT is useful when the
      length is in another cell: `=REPT("0", 5-LEN(A2))&A2`.
    alternatives:
      - label: Whole column
        formula: '=ARRAYFORMULA(IF(A2:A="", "", TEXT(A2:A, "00000")))'
      - label: Variable length with REPT
        formula: '=REPT("0", 5-LEN(A2))&A2'
    diff: >-
      The same TEXT formula works in Google Sheets; the display-only version is under Format >
      Number > Custom number format.
  example:
    intro: Pad employee numbers to five digits.
    grid:
      - [Employee no., TEXT, RIGHT]
      - [7]
      - [42]
      - [315]
      - [1208]
    checks:
      - cell: B2
        label: filled down
        excel: '=TEXT(A2, "00000")'
        fill: [B2, B3, B4, B5]
        results: ['00007', '00042', '00315', '01208']
      - cell: C2
        label: filled down
        excel: '=RIGHT("00000"&A2, 5)'
        fill: [C2, C3, C4, C5]
        results: ['00007', '00042', '00315', '01208']
  steps:
    - 'TEXT converts the number using the format "00000": every 0 is a digit placeholder that shows 0 if there is no digit.'
    - 'RIGHT version: "00000"&A2 creates "0000042", and RIGHT(..., 5) keeps the last five characters, "00042".'
    - Both results are text. Use a custom number format instead if the column must stay numeric.
    - Numbers longer than five digits are not truncated by TEXT, but RIGHT would cut them, so pick the length to match your longest ID.
  errors:
    - error: Zeros disappear after typing
      cause: The cell is formatted as a number, which has no leading zeros.
      fix: Format as Text before typing, use an apostrophe, or use a custom number format.
    - error: Lookups fail after padding
      cause: The padded value is text and the lookup table contains numbers (or vice versa).
      fix: Pad both sides, or compare with VALUE().
    - error: Zeros lost when the CSV is reopened
      cause: CSV files store no formatting; the app converts 00042 to 42 when opening.
      fix: Import with Data > From Text/CSV (Excel) or untick conversion in File > Import (Sheets) and set the column to Text.
  faq:
    - q: Format or formula, which should I use?
      a: Use a custom number format if the values are numbers you calculate with. Use TEXT/RIGHT if you need text, for example for an export or for joining with other text.
    - q: How do I pad to a variable length?
      a: Use =REPT("0", n-LEN(A2))&A2, where n is the target length.
  related: [trim, textjoin, value-error, na-error]

- id: contains-text
  category: text
  launch: true
  slugs: {excel: contains-text-excel, sheets: contains-text-google-sheets}
  title: How to Check if a Cell Contains Text
  summary: >-
    Test whether a cell contains a word or a substring anywhere inside it, return Yes/No or a
    custom result, and count matching cells. Covers ISNUMBER with SEARCH (case-insensitive), FIND
    (case-sensitive), COUNTIF with wildcards and REGEXMATCH in Google Sheets.
  problem: >-
    You want to flag every product whose description mentions "mouse", regardless of where the
    word appears or how it is capitalised.
  excel:
    formula: '=ISNUMBER(SEARCH("mouse", A2))'
    explain: >-
      SEARCH returns the position of "mouse" (any case) or #VALUE! if it is missing. ISNUMBER
      turns that into TRUE or FALSE.
    notes: >-
      `A2="mouse"` only checks whether the whole cell equals the word, which is a common mistake.
      SEARCH is case-insensitive and supports wildcards; FIND is case-sensitive and does not.
      To check for any of several words, pass an array and add the results:
      `=SUM(--ISNUMBER(SEARCH({"mouse","keyboard"}, A2)))>0`. Note that searching for short words
      also matches inside longer ones ("pad" matches "iPad"); include spaces or punctuation in the
      search term if that matters.
    alternatives:
      - label: Any of several words
        formula: '=SUM(--ISNUMBER(SEARCH({"mouse","keyboard"}, A2)))>0'
    diff: >-
      Excel uses the same ISNUMBER(SEARCH()) formula. REGEXTEST is available only in recent
      Microsoft 365 builds.
  sheets:
    formula: '=ISNUMBER(SEARCH("mouse", A2))'
    explain: >-
      Same formula in Google Sheets.
    notes: >-
      Google Sheets also offers REGEXMATCH, which returns TRUE/FALSE directly. Add (?i) at the
      start of the pattern for a case-insensitive match: `=REGEXMATCH(A2, "(?i)mouse")`. Regular
      expressions make "any of several words" and whole-word matching easy, for example
      `=REGEXMATCH(A2, "(?i)\b(mouse|keyboard)\b")`. REGEXMATCH needs text input, so use A2&"" if
      the cell may contain a number.
    alternatives:
      - label: Case-insensitive REGEXMATCH
        formula: '=REGEXMATCH(A2, "(?i)mouse")'
      - label: Whole words, several options
        formula: '=REGEXMATCH(A2, "(?i)\b(mouse|keyboard)\b")'
    diff: >-
      The same formula works in Google Sheets, where REGEXMATCH(A2, "(?i)mouse") is a shorter
      alternative.
  example:
    intro: Which descriptions mention "mouse"?
    grid:
      - [Description, Contains, Yes or No, Case-sensitive, null, Count]
      - [Wireless Mouse - Black]
      - [USB-C Hub (7-in-1)]
      - [Mouse Pad XL]
      - [Laptop Stand]
    checks:
      - cell: B2
        label: filled down
        excel: '=ISNUMBER(SEARCH("mouse", A2))'
        sheets: '=REGEXMATCH(A2, "(?i)mouse")'
        fill: [B2, B3, B4, B5]
        results: [true, false, true, false]
      - cell: C2
        label: filled down
        excel: '=IF(ISNUMBER(SEARCH("mouse", A2)), "Yes", "No")'
        fill: [C2, C3, C4, C5]
        results: ['Yes', 'No', 'Yes', 'No']
      - cell: D2
        label: FIND is case-sensitive, so lowercase "mouse" is not found
        excel: '=ISNUMBER(FIND("mouse", A2))'
        fill: [D2, D3, D4, D5]
        results: [false, false, false, false]
      - cell: F2
        label: how many cells contain the word
        excel: '=COUNTIF(A2:A5, "*mouse*")'
        result: 2
  steps:
    - '`SEARCH("mouse", A2)` returns 10 for "Wireless Mouse - Black" (the position where the word starts) and #VALUE! when the word is not there.'
    - '`ISNUMBER(...)` converts a position into TRUE and the error into FALSE.'
    - Wrap it in IF to show any text you like instead of TRUE/FALSE.
    - 'COUNTIF with `"*mouse*"` counts cells that contain the word anywhere; the asterisks match any characters before and after.'
  errors:
    - error: Always FALSE
      cause: Using =A2="mouse" checks for an exact full-cell match, or FIND was used with the wrong case.
      fix: Use ISNUMBER(SEARCH(...)).
    - error: '#VALUE! instead of FALSE'
      cause: SEARCH was used without ISNUMBER.
      fix: Wrap SEARCH in ISNUMBER or IFERROR.
    - error: Unexpected matches
      cause: The search term is part of a longer word.
      fix: Search for " pad " with spaces, or use whole-word regular expressions in Google Sheets.
  faq:
    - q: How do I sum values where the description contains a word?
      a: Use SUMIF with wildcards, e.g. =SUMIF(A2:A5, "*mouse*", B2:B5).
    - q: How do I highlight cells that contain a word?
      a: 'Use conditional formatting with a formula rule: =ISNUMBER(SEARCH("mouse", $A2)).'
  related: [countif, text-before-character, sumif, trim]

- id: concatenate
  category: text
  slugs: {excel: concatenate-excel, sheets: concatenate-google-sheets}
  title: How to CONCATENATE Text
  summary: >-
    CONCATENATE (and its modern cousins CONCAT, the & operator, and TEXTJOIN) sticks pieces of
    text into one cell. This page shows the classic CONCATENATE syntax, when to prefer & or
    TEXTJOIN, and how Excel and Google Sheets differ on ranges and empty cells.
  problem: >-
    You have first names in one column and last names in another, and you need a full-name
    column that updates when either part changes — or a label that mixes text with a number
    and a separator.
  excel:
    formula: '=CONCATENATE(A2, " ", B2)'
    explain: >-
      Syntax: `CONCATENATE(text1, [text2], ...)`. Join A2, a space, and B2 into one string.
      Each argument is a single value; CONCATENATE does not accept a multi-cell range.
    notes: >-
      CONCATENATE works in every Excel version still in use, but Microsoft marks it as
      compatibility-only. Prefer `A2 & " " & B2` for two or three pieces, `CONCAT(A2:B2)` when
      you want to join a range without a delimiter (Excel 2019+ / Microsoft 365), and
      `TEXTJOIN(", ", TRUE, A2:A7)` when you need a delimiter and want to skip blanks.
      CONCATENATE turns numbers into their raw values, so format with TEXT first if you need
      currency or dates in the result. A cell can hold at most 32,767 characters.
    alternatives:
      - label: Ampersand (any Excel version)
        formula: '=A2 & " " & B2'
      - label: CONCAT over a range (Excel 2019+ / Microsoft 365)
        formula: '=CONCAT(A2:B2)'
      - label: TEXTJOIN with a delimiter, skipping blanks
        formula: '=TEXTJOIN(" ", TRUE, A2:B2)'
    diff: >-
      Excel's CONCATENATE and CONCAT match Google Sheets. Excel has no JOIN function; use
      TEXTJOIN when you need a delimiter.
  sheets:
    formula: '=CONCATENATE(A2, " ", B2)'
    explain: >-
      Same CONCATENATE syntax in Google Sheets: pass each piece as its own argument.
    notes: >-
      Google Sheets also keeps CONCATENATE for compatibility and prefers CONCAT or & for new
      work. `=CONCAT(A2, B2)` joins two values with no delimiter; for a whole column use
      `=ARRAYFORMULA(A2:A & " " & B2:B)` so every row fills at once. Sheets also has JOIN
      (`=JOIN(", ", A2:A7)`), which inserts a delimiter but does not skip blanks — use
      TEXTJOIN when empty cells would create double commas. Like Excel, CONCATENATE will not
      accept a multi-cell range as one argument; pass cells one by one or switch to CONCAT / &.
    alternatives:
      - label: Ampersand, filled down a column with ARRAYFORMULA
        formula: '=ARRAYFORMULA(IF(A2:A="", "", A2:A & " " & B2:B))'
      - label: JOIN with a delimiter (keeps blanks)
        formula: '=JOIN(", ", A2:A4)'
      - label: TEXTJOIN skipping blanks
        formula: '=TEXTJOIN(", ", TRUE, A2:A4)'
    diff: >-
      Sheets adds JOIN and ARRAYFORMULA for whole-column joins. CONCATENATE still cannot take
      a range as a single argument — use CONCAT, &, JOIN, or TEXTJOIN instead.
  example:
    intro: Build full names, then a mixed label with a product code.
    grid:
      - [First, Last, Full name, Label]
      - [Ana, Lopez]
      - [Ben, Carter]
      - [Chloe, Wong]
      - [1042, RED]
    checks:
      - cell: C2
        label: full name, filled down
        excel: '=CONCATENATE(A2, " ", B2)'
        fill: [C2, C3, C4]
        results: [Ana Lopez, Ben Carter, Chloe Wong]
      - cell: C5
        label: ampersand alternative on the same row
        excel: '=A5 & "-" & B5'
        result: 1042-RED
      - cell: D2
        label: label with fixed text and a name
        excel: '=CONCATENATE("Hello, ", A2, " ", B2, "!")'
        result: 'Hello, Ana Lopez!'
      - cell: D5
        label: CONCAT joins a range with no delimiter
        excel: '=CONCAT(A5:B5)'
        result: 1042RED
  steps:
    - 'Type `=CONCATENATE(` and click the first cell (A2), then type a comma.'
    - 'Add any literal text in quotes — here `" "` for a space — then another comma and the next cell (B2).'
    - Close the parenthesis and press Enter. Fill the formula down the column for the other rows.
    - 'For two or three pieces, `A2 & " " & B2` is shorter and works in every Excel and Sheets version.'
    - When you need a delimiter between many cells and want to skip blanks, switch to TEXTJOIN instead of CONCATENATE.
  errors:
    - error: Numbers or dates look wrong in the result
      cause: CONCATENATE uses the raw value (0.5, a serial date), not the cell's display format.
      fix: 'Wrap with TEXT, e.g. `CONCATENATE(TEXT(C2,"0%"), " complete")` or `TEXT(D2,"yyyy-mm-dd")`.'
    - error: '#VALUE! or a truncated string'
      cause: The joined result is longer than 32,767 characters (Excel cell limit).
      fix: Join fewer pieces, or split the output across several cells.
    - error: Unexpected commas or double spaces
      cause: An argument was blank, or you added a delimiter by hand next to an empty cell.
      fix: Use TEXTJOIN with ignore_empty TRUE, or wrap optional pieces in IF so blanks contribute nothing.
  faq:
    - q: Should I use CONCATENATE, CONCAT, & or TEXTJOIN?
      a: Use & for two or three pieces, CONCAT to join a range with no delimiter, and TEXTJOIN when you need a delimiter and want to skip blanks. Keep CONCATENATE only for older-file compatibility.
    - q: Can CONCATENATE join a whole range like A2:A10?
      a: No. Pass each cell separately, or switch to CONCAT (no delimiter) or TEXTJOIN (with a delimiter). In Google Sheets you can also use JOIN or an ARRAYFORMULA with &.
    - q: How do I add a line break between joined pieces?
      a: 'Use CHAR(10) as the separator, e.g. `=A2 & CHAR(10) & B2`, and turn on Wrap Text for the cell.'
  related: [textjoin, split-text, trim, leading-zeros]

- id: textsplit
  category: text
  slugs: {excel: textsplit-excel}
  title: How to Use the TEXTSPLIT Function
  summary: >-
    TEXTSPLIT is Excel 365 / 2024's formula for splitting one cell into many columns or rows.
    This page covers the full argument list (column and row delimiters, ignore_empty, pad_with),
    a classic formula for older Excel, and the Google Sheets SPLIT equivalent with its
    split-by-each quirk.
  problem: >-
    A column holds values like "Ana Lopez,Sales,Madrid" or multi-line blocks, and you want
    each piece in its own cell — updating automatically when the source changes, which Data >
    Text to Columns does not do.
  excel:
    formula: '=TEXTSPLIT(A2, ",")'
    explain: >-
      Syntax: `TEXTSPLIT(text, col_delimiter, [row_delimiter], [ignore_empty], [match_mode],
      [pad_with])`. Split A2 at each comma; the parts spill across the row.
    notes: >-
      TEXTSPLIT needs Microsoft 365, Excel 2024 or Excel for the web. Pass a row delimiter as
      the third argument to spill down instead of (or as well as) across — e.g.
      `TEXTSPLIT(A2, , CHAR(10))` for line breaks. `ignore_empty` TRUE drops blank pieces from
      double commas. `match_mode` 1 makes the delimiter case-insensitive. `pad_with` fills
      missing pieces when you split into a 2D grid so every row has the same width. For several
      delimiters at once use an array: `TEXTSPLIT(A2, {",",";","|"})`. In Excel 2021 and older,
      use the SUBSTITUTE/REPT formula below, or Data > Text to Columns for a one-off split.
    alternatives:
      - label: Any Excel version (copy across; n-th part from the column number)
        formula: '=TRIM(MID(SUBSTITUTE($A2, ",", REPT(" ", 100)), (COLUMN(A1)-1)*100+1, 100))'
      - label: Split into rows on commas
        formula: '=TEXTSPLIT(A2, , ",")'
    diff: >-
      TEXTSPLIT is Excel-only. Google Sheets uses SPLIT, which by default treats every character
      of the delimiter as a separate split point.
  sheets:
    formula: '=SPLIT(A2, ",")'
    explain: >-
      Syntax: `SPLIT(text, delimiter, [split_by_each], [remove_empty_text])`. Parts spill to
      the right.
    notes: >-
      Google Sheets has no TEXTSPLIT function. Use SPLIT instead, and set the third argument to
      FALSE when the delimiter is more than one character — otherwise `SPLIT(A2, ", ")` also
      splits on spaces and breaks names apart. The fourth argument controls whether empty
      pieces are dropped (default TRUE). SPLIT coerces numeric-looking parts into numbers, so
      leading zeros in ZIP codes disappear unless you format the output as plain text first.
      To split a whole column at once wrap SPLIT in ARRAYFORMULA. For a vertical spill use
      `=TRANSPOSE(SPLIT(A2, ","))`. REGEXEXTRACT / REGEXREPLACE cover patterns SPLIT cannot.
    alternatives:
      - label: Split on the exact text ", " (not each character)
        formula: '=SPLIT(A2, ", ", FALSE)'
      - label: Split into a column instead of a row
        formula: '=TRANSPOSE(SPLIT(A2, ","))'
      - label: Split a whole column at once
        formula: '=ARRAYFORMULA(IF(A2:A="", "", SPLIT(A2:A, ",")))'
    diff: >-
      Sheets uses SPLIT, not TEXTSPLIT. Pass FALSE as the third argument for multi-character
      delimiters, and use TRANSPOSE when you want rows instead of columns.
  example:
    intro: Split comma-separated records; also show the classic formula that works in every Excel.
    grid:
      - [Record, Name, Department, City]
      - ['Ana Lopez,Sales,Madrid']
      - ['Ben Carter,IT,Boston']
      - ['Chloe Wong,Finance,Singapore']
    checks:
      - cell: B2
        label: TEXTSPLIT spills into B2:D2
        excel: '=TEXTSPLIT(A2, ",")'
        sheets: '=SPLIT(A2, ",")'
        spill_cells: [B2, C2, D2]
        spill_results: [Ana Lopez, Sales, Madrid]
        verify: false
        why_unverified: LibreOffice does not implement TEXTSPLIT; Excel 365 / 2024 result shown. Sheets uses SPLIT (also not recalculated here).
      - cell: B3
        label: classic formula, filled across to D3
        excel: '=TRIM(MID(SUBSTITUTE($A3, ",", REPT(" ", 100)), (COLUMN(A1)-1)*100+1, 100))'
        fill: [B3, C3, D3]
        results: [Ben Carter, IT, Boston]
      - cell: B4
        label: classic formula, filled across to D4
        excel: '=TRIM(MID(SUBSTITUTE($A4, ",", REPT(" ", 100)), (COLUMN(A2)-1)*100+1, 100))'
        fill: [B4, C4, D4]
        results: [Chloe Wong, Finance, Singapore]
  steps:
    - 'In Excel 365 type `=TEXTSPLIT(A2, ",")` and press Enter; the parts spill into the cells to the right.'
    - Leave enough empty columns (or rows, if you use a row delimiter) so the spill is not blocked.
    - 'Optional arguments: set ignore_empty to TRUE to drop blank pieces, or pass CHAR(10) as the row delimiter for line breaks.'
    - In older Excel, enter the SUBSTITUTE/REPT formula in B3 and copy it across as many columns as you have parts.
    - 'In Google Sheets use `=SPLIT(A2, ",")`, and add FALSE as the third argument when the delimiter is more than one character.'
  errors:
    - error: '#NAME?'
      cause: TEXTSPLIT is not available in Excel 2021 or older.
      fix: Use the SUBSTITUTE/REPT formula on this page, upgrade to Microsoft 365 / Excel 2024, or use Data > Text to Columns for a static split.
    - error: '#SPILL!'
      cause: A non-empty cell sits inside the spill range.
      fix: Clear the cells to the right (or below) of the formula, then press Enter again.
    - error: Names split on spaces (Google Sheets)
      cause: 'SPLIT with a delimiter like ", " treats every character as a delimiter by default.'
      fix: 'Pass FALSE as the third argument: `=SPLIT(A2, ", ", FALSE)`.'
  faq:
    - q: How is TEXTSPLIT different from Text to Columns?
      a: 'TEXTSPLIT is a live formula: when the source cell changes, the split updates. Text to Columns pastes static values once.'
    - q: How do I get only the second part?
      a: 'Excel 365: `=INDEX(TEXTSPLIT(A2, ","), 2)`. Google Sheets: `=INDEX(SPLIT(A2, ","), 2)`. Older Excel: put the classic formula in column C (the second copy-across cell).'
    - q: Can TEXTSPLIT split on more than one delimiter?
      a: 'Yes — pass an array constant as the column delimiter, e.g. `=TEXTSPLIT(A2, {",",";","|"})`.'
  related: [split-text, text-before-character, text-after-character, textjoin]

- id: left_right_mid
  category: text
  slugs: {excel: left-right-mid-excel, sheets: left-right-mid-google-sheets}
  title: How to Use LEFT, RIGHT and MID
  summary: >-
    LEFT, RIGHT and MID pull a fixed number of characters from the start, end or middle of a
    text string. Combined with FIND or LEN they also extract variable pieces such as everything
    before a dash. The same three functions work in Excel and Google Sheets; Sheets users also
    have REGEXEXTRACT for pattern-based pulls.
  problem: >-
    Codes, phone numbers or full names sit in one column, and you need a prefix, a suffix or
    the middle segment in its own cell — for example the first three letters of a name, the
    last four digits of a phone number, or the characters between two dashes.
  excel:
    formula: '=LEFT(A2, 3)'
    explain: >-
      Syntax: `LEFT(text, [num_chars])`, `RIGHT(text, [num_chars])`,
      `MID(text, start_num, num_chars)`. LEFT returns the first 3 characters of A2.
    notes: >-
      LEFT / RIGHT / MID are available in every Excel version. `num_chars` is optional for LEFT
      and RIGHT (default 1). MID always needs a start position (1 = first character) and a
      length. To take everything before a marker use `LEFT(A2, FIND("-", A2)-1)`; everything
      after the first marker is `MID(A2, FIND("-", A2)+1, LEN(A2))` or, in Microsoft 365,
      TEXTAFTER. LEN counts characters so you can compute dynamic lengths. These functions
      treat numbers as text automatically; if you need a real number wrap the result in VALUE.
      For pattern-based extracts in Microsoft 365, TEXTBEFORE / TEXTAFTER / TEXTSPLIT are often
      clearer.
    alternatives:
      - label: Last 4 characters
        formula: '=RIGHT(A2, 4)'
      - label: Characters 5 to 9 (start at 5, length 5)
        formula: '=MID(A2, 5, 5)'
      - label: Everything before the first dash
        formula: '=LEFT(A2, FIND("-", A2)-1)'
    diff: >-
      Excel and Sheets share the same LEFT / RIGHT / MID syntax. Excel 365 also offers
      TEXTBEFORE / TEXTAFTER; Sheets leans on REGEXEXTRACT for the same jobs.
  sheets:
    formula: '=LEFT(A2, 3)'
    explain: >-
      Same LEFT / RIGHT / MID syntax in Google Sheets as in Excel.
    notes: >-
      LEFT, RIGHT and MID behave the same way in Google Sheets. To fill a whole column at once
      wrap them in ARRAYFORMULA, e.g. `=ARRAYFORMULA(IF(A2:A="", "", LEFT(A2:A, 3)))`. For
      pattern-based extracts Sheets users usually prefer REGEXEXTRACT —
      `=REGEXEXTRACT(A2, "^([^-]+)")` takes everything before the first dash, and
      `=REGEXEXTRACT(A2, "(\d{4})$")` takes the last four digits. FIND and SEARCH work inside
      LEFT/MID exactly as in Excel; SEARCH is case-insensitive. LEN, VALUE and TRIM combine
      with these functions the same way. There is no TEXTBEFORE / TEXTAFTER in Sheets.
    alternatives:
      - label: Whole column of prefixes with ARRAYFORMULA
        formula: '=ARRAYFORMULA(IF(A2:A="", "", LEFT(A2:A, 3)))'
      - label: Everything before the first dash with REGEXEXTRACT
        formula: '=REGEXEXTRACT(A2, "^([^-]+)")'
      - label: Last four digits with REGEXEXTRACT
        formula: '=REGEXEXTRACT(A2, "(\d{4})$")'
    diff: >-
      Sheets matches Excel on LEFT / RIGHT / MID, adds ARRAYFORMULA for whole-column fills, and
      uses REGEXEXTRACT where Excel 365 would use TEXTBEFORE / TEXTAFTER.
  example:
    intro: Pull a prefix, a suffix and a middle segment; then everything before a dash.
    grid:
      - [Value, Left 3, Right 4, Mid 5, Before dash]
      - ['Ana Lopez']
      - [SKU-1042-RED]
      - ['(555) 123-4567']
    checks:
      - cell: B2
        label: first 3 characters, filled down
        excel: '=LEFT(A2, 3)'
        fill: [B2, B3, B4]
        results: [Ana, SKU, '(55']
      - cell: C2
        label: last 4 characters, filled down
        excel: '=RIGHT(A2, 4)'
        fill: [C2, C3, C4]
        results: [opez, '-RED', '4567']
      - cell: D2
        label: 5 characters starting at position 5
        excel: '=MID(A2, 5, 5)'
        result: Lopez
      - cell: E3
        label: everything before the first dash
        excel: '=LEFT(A3, FIND("-", A3)-1)'
        result: SKU
      - cell: E4
        label: last 4 digits via RIGHT (phone)
        excel: '=RIGHT(A4, 4)'
        result: '4567'
  steps:
    - Decide whether you need characters from the start (LEFT), the end (RIGHT) or a position in the middle (MID).
    - 'For LEFT / RIGHT, pass the cell and the number of characters, e.g. `=LEFT(A2, 3)` or `=RIGHT(A2, 4)`.'
    - 'For MID, pass start position and length: `=MID(A2, 5, 5)` returns five characters beginning at character 5.'
    - 'When the cut point depends on a marker, nest FIND: `=LEFT(A2, FIND("-", A2)-1)` stops just before the first dash.'
    - Fill the formula down the column, or in Google Sheets wrap it in ARRAYFORMULA to fill every row at once.
  errors:
    - error: '#VALUE!'
      cause: FIND did not find the marker, so `FIND(...)-1` became invalid, or num_chars was negative.
      fix: 'Wrap with IFERROR, or check the marker exists first: `=IF(ISNUMBER(FIND("-",A2)), LEFT(A2, FIND("-",A2)-1), A2)`.'
    - error: Result looks truncated or includes an extra character
      cause: Off-by-one in the length or start position (forgetting that FIND returns the marker's position).
      fix: Subtract 1 from FIND when using LEFT; add 1 when using MID/RIGHT to start after the marker. Test on one row first.
    - error: Leading zeros disappear
      cause: The extracted piece looks like a number and the cell is formatted as General.
      fix: 'Format the result column as Text, or keep it as text with `="" & LEFT(A2, 3)`.'
  faq:
    - q: What is the difference between LEFT / RIGHT / MID and TEXTBEFORE / TEXTAFTER?
      a: LEFT / RIGHT / MID cut by character count (or with FIND for a marker). TEXTBEFORE / TEXTAFTER (Excel 365) cut by a delimiter string directly and support instance numbers and case options.
    - q: How do I extract text between two dashes?
      a: 'Excel: `=MID(A2, FIND("-",A2)+1, FIND("-",A2, FIND("-",A2)+1)-FIND("-",A2)-1)`. Google Sheets can use `=REGEXEXTRACT(A2, "-([^-]+)-")`.'
    - q: Do LEFT, RIGHT and MID work the same in Google Sheets?
      a: Yes — same argument order and results. Use ARRAYFORMULA to apply them to a whole column, and REGEXEXTRACT when a regular expression is clearer than FIND + MID.
  related: [text-before-character, text-after-character, split-text, trim]

- id: substitute
  category: text
  slugs: {excel: substitute-excel, sheets: substitute-google-sheets}
  title: How to Use the SUBSTITUTE Function
  summary: >-
    SUBSTITUTE replaces every occurrence of a text string with another, or only the N-th
    occurrence when you pass an instance number. It is the right tool when you know the text
    to find (a dash, a word, a typo) rather than a character position. Excel and Google Sheets
    share the same SUBSTITUTE syntax; Sheets also offers REGEXREPLACE for pattern-based swaps.
  problem: >-
    A column holds codes, names or phrases where one piece of text must change everywhere —
    turn dashes into slashes, fix a repeated typo, or swap only the first match — without
    touching surrounding characters the way a position-based REPLACE would.
  excel:
    formula: '=SUBSTITUTE(A2, "-", "/")'
    explain: >-
      Syntax: `SUBSTITUTE(text, old_text, new_text, [instance_num])`. Replace every "-" in A2
      with "/". Omit instance_num to change all matches; pass 1, 2, … to change only that match.
    notes: >-
      SUBSTITUTE is available in every Excel version. Matching is case-sensitive: "SS" will not
      replace "ss". new_text may be empty (`""`) to delete old_text. Nest SUBSTITUTE calls to
      swap several different strings in one formula. For a character-position edit (overwrite
      4 characters starting at position 5) use REPLACE instead. In Microsoft 365, TEXTBEFORE /
      TEXTAFTER / TEXTSPLIT often remove the need to strip delimiters by hand. After a mass
      replace, Copy > Paste Special > Values if you want to freeze the results.
    alternatives:
      - label: Replace only the first match
        formula: '=SUBSTITUTE(A2, "ss", "XX", 1)'
      - label: Delete every dash
        formula: '=SUBSTITUTE(A2, "-", "")'
      - label: Nested — swap two different strings
        formula: '=SUBSTITUTE(SUBSTITUTE(A2, "-", "/"), "_", "-")'
    diff: >-
      Excel and Sheets share SUBSTITUTE. Sheets adds REGEXREPLACE for regular-expression
      replacements; Excel has no built-in regex function.
  sheets:
    formula: '=SUBSTITUTE(A2, "-", "/")'
    explain: >-
      Same SUBSTITUTE syntax in Google Sheets as in Excel.
    notes: >-
      SUBSTITUTE works the same way in Google Sheets, including the optional instance_num
      argument and case-sensitive matching. To fill a whole column at once wrap it in
      ARRAYFORMULA, e.g. `=ARRAYFORMULA(IF(A2:A="", "", SUBSTITUTE(A2:A, "-", "/")))`. For
      pattern-based swaps — digits, optional spaces, word boundaries — use REGEXREPLACE
      instead: `=REGEXREPLACE(A2, "\s+", " ")` collapses runs of whitespace, and
      `=REGEXREPLACE(A2, "[^0-9]", "")` strips non-digits. REGEXREPLACE has no instance_num;
      craft the pattern (or use SUBSTITUTE) when you need only the N-th match. Nested SUBSTITUTE
      still works when you are swapping fixed literal strings.
    alternatives:
      - label: Whole column with ARRAYFORMULA
        formula: '=ARRAYFORMULA(IF(A2:A="", "", SUBSTITUTE(A2:A, "-", "/")))'
      - label: Collapse repeated spaces with REGEXREPLACE
        formula: '=REGEXREPLACE(A2, "\s+", " ")'
      - label: Strip every non-digit with REGEXREPLACE
        formula: '=REGEXREPLACE(A2, "[^0-9]", "")'
    diff: >-
      Sheets matches Excel on SUBSTITUTE, adds ARRAYFORMULA for column fills, and uses
      REGEXREPLACE where Excel has no regex equivalent.
  example:
    intro: Swap every dash for a slash, fix letters in a word, then change only the first match.
    grid:
      - [Text, Find, Replace with, All matches, First only]
      - ['SKU-1042-RED', '-', '/']
      - [banana, a, o]
      - ['Miss Mississippi', ss, XX]
    checks:
      - cell: D2
        label: every dash becomes a slash
        excel: '=SUBSTITUTE(A2, B2, C2)'
        result: SKU/1042/RED
      - cell: D3
        label: every "a" becomes "o"
        excel: '=SUBSTITUTE(A3, B3, C3)'
        result: bonono
      - cell: D4
        label: every "ss" becomes "XX"
        excel: '=SUBSTITUTE(A4, B4, C4)'
        result: 'MiXX MiXXiXXippi'
      - cell: E4
        label: only the first "ss"
        excel: '=SUBSTITUTE(A4, B4, C4, 1)'
        result: 'MiXX Mississippi'
  steps:
    - 'Type `=SUBSTITUTE(` and select the cell that holds the original text (A2).'
    - 'Add the text to find in quotes (or a cell reference), a comma, then the replacement text.'
    - Close the parenthesis and press Enter — every match is replaced.
    - 'To change only the N-th match, pass a fourth argument: `=SUBSTITUTE(A2, "ss", "XX", 1)`.'
    - Nest another SUBSTITUTE when you need to swap more than one different string in the same cell.
  errors:
    - error: Nothing changed
      cause: old_text did not match exactly — wrong case, extra spaces, or a different dash character.
      fix: 'Copy the exact characters from the source cell, or use TRIM / CLEAN first. Matching is case-sensitive.'
    - error: Too many (or the wrong) matches changed
      cause: instance_num was omitted, so every occurrence was replaced.
      fix: Pass the occurrence number you want (1 = first, 2 = second, …), or nest SUBSTITUTE for a more specific swap.
    - error: '#VALUE!'
      cause: instance_num is less than 1, or the formula references an error cell.
      fix: Use a positive integer for instance_num, and wrap with IFERROR if the source may be blank or invalid.
  faq:
    - q: When should I use SUBSTITUTE instead of REPLACE?
      a: Use SUBSTITUTE when you know the text to find. Use REPLACE when you know the starting position and how many characters to overwrite.
    - q: Is SUBSTITUTE case-sensitive?
      a: Yes. "SS" will not replace "ss". In Google Sheets, REGEXREPLACE with a case-insensitive flag `(?i)` can ignore case; in Excel, normalize with UPPER/LOWER first.
    - q: Can I replace several different strings at once?
      a: Nest SUBSTITUTE calls, one per string. In Google Sheets, a single REGEXREPLACE with an alternation pattern can also cover several literals.
  related: [replace_fn, left_right_mid, trim, textsplit]

- id: replace_fn
  category: text
  slugs: {excel: replace-excel, sheets: replace-google-sheets}
  title: How to Use the REPLACE Function
  summary: >-
    REPLACE overwrites a fixed number of characters starting at a known position. It is the
    position-based counterpart to SUBSTITUTE (which finds text by content). The same REPLACE
    function works in Excel and Google Sheets; Sheets users often reach for REGEXREPLACE when
    the cut point is a pattern rather than a character index.
  problem: >-
    You need to overwrite part of a code, mask the middle of a phone number, or insert new
    text at a character position — jobs where counting from the left is clearer than searching
    for a substring.
  excel:
    formula: '=REPLACE(A2, 5, 4, "9999")'
    explain: >-
      Syntax: `REPLACE(old_text, start_num, num_chars, new_text)`. Starting at character 5 of
      A2, overwrite 4 characters with "9999".
    notes: >-
      REPLACE is in every Excel version. start_num is 1-based (1 = first character). num_chars
      may be 0, which inserts new_text without deleting anything. new_text may be longer or
      shorter than num_chars — the rest of the string shifts accordingly. REPLACE is not the
      same as Find & Replace on the ribbon (that searches by content). For content-based swaps
      use SUBSTITUTE. To overwrite from the right, combine with LEN:
      `=REPLACE(A2, LEN(A2)-3, 4, "XXXX")` masks the last four characters. Microsoft 365 also
      has TEXTAFTER / TEXTBEFORE when a delimiter marks the cut instead of a position.
    alternatives:
      - label: Insert without deleting (num_chars = 0)
        formula: '=REPLACE(A2, 5, 0, "-")'
      - label: Mask the last 4 characters
        formula: '=REPLACE(A2, LEN(A2)-3, 4, "XXXX")'
      - label: Mask digits inside a phone number
        formula: '=REPLACE(A2, 2, 3, "***")'
    diff: >-
      Excel and Sheets share REPLACE. Sheets adds REGEXREPLACE for pattern-based overwrites;
      Excel relies on SUBSTITUTE or MID/LEFT/RIGHT assemblies for similar jobs.
  sheets:
    formula: '=REPLACE(A2, 5, 4, "9999")'
    explain: >-
      Same REPLACE syntax in Google Sheets as in Excel.
    notes: >-
      REPLACE behaves the same in Google Sheets: 1-based start_num, num_chars characters
      overwritten, new_text may differ in length. Wrap with ARRAYFORMULA to edit a whole
      column: `=ARRAYFORMULA(IF(A2:A="", "", REPLACE(A2:A, 5, 4, "9999")))`. When the cut
      point is a pattern (e.g. "everything between the first and second dash"), REGEXREPLACE
      is usually clearer than computing FIND positions —
      `=REGEXREPLACE(A2, "^(.{4}).{4}", "$1XXXX")` keeps the first four characters and masks
      the next four. SUBSTITUTE remains better when you know the exact text to swap. There is
      no Excel-style instance_num on REPLACE; position alone decides what changes.
    alternatives:
      - label: Whole column with ARRAYFORMULA
        formula: '=ARRAYFORMULA(IF(A2:A="", "", REPLACE(A2:A, 5, 4, "9999")))'
      - label: Mask 4 characters after a 4-char prefix with REGEXREPLACE
        formula: '=REGEXREPLACE(A2, "^(.{4}).{4}", "$1XXXX")'
      - label: Insert a dash at position 5
        formula: '=REPLACE(A2, 5, 0, "-")'
    diff: >-
      Sheets matches Excel on REPLACE, adds ARRAYFORMULA for column fills, and uses
      REGEXREPLACE when a regular expression marks the edit better than a start index.
  example:
    intro: Overwrite a product code segment, shorten a string mid-way, then mask part of a phone number.
    grid:
      - [Value, Replaced]
      - ['SKU-1042-RED']
      - [ABCDE]
      - ['(555) 123-4567']
    checks:
      - cell: B2
        label: overwrite 4 characters starting at position 5
        excel: '=REPLACE(A2, 5, 4, "9999")'
        result: SKU-9999-RED
      - cell: B3
        label: overwrite 3 characters starting at position 2 with "XY"
        excel: '=REPLACE(A3, 2, 3, "XY")'
        result: AXYE
      - cell: B4
        label: mask the area code digits
        excel: '=REPLACE(A4, 2, 3, "***")'
        result: '(***) 123-4567'
      - cell: C4
        label: mask the local number after the area code
        excel: '=REPLACE(A4, 7, 8, "***-****")'
        result: '(555) ***-****'
  steps:
    - Decide the 1-based start position and how many characters to overwrite.
    - 'Type `=REPLACE(A2, start, length, "new text")` — e.g. `=REPLACE(A2, 5, 4, "9999")`.'
    - Press Enter and check that the characters before start_num stayed the same.
    - Use num_chars 0 when you only want to insert text at that position.
    - Fill down the column, or in Google Sheets wrap REPLACE in ARRAYFORMULA for every row at once.
  errors:
    - error: Wrong characters overwritten
      cause: Off-by-one in start_num (forgetting it is 1-based), or counting visible punctuation differently from the real string.
      fix: Test LEN and MID on the same cell first to confirm positions, then adjust start_num.
    - error: '#VALUE!'
      cause: start_num or num_chars is less than 0, or the source value is an error.
      fix: Use start_num ≥ 1 and num_chars ≥ 0. Wrap with IFERROR when the source may be blank.
    - error: Confused with Find & Replace or SUBSTITUTE
      cause: REPLACE edits by position; ribbon Find & Replace and SUBSTITUTE edit by matching text.
      fix: Switch to SUBSTITUTE when you know the text to find rather than its character index.
  faq:
    - q: What is the difference between REPLACE and SUBSTITUTE?
      a: REPLACE overwrites by start position and length. SUBSTITUTE finds old_text by content and can limit the change to the N-th match.
    - q: Can REPLACE insert text without deleting anything?
      a: 'Yes — set num_chars to 0: `=REPLACE(A2, 5, 0, "-")` inserts a dash before the old 5th character.'
    - q: Does REPLACE work the same in Google Sheets?
      a: Yes for the four-argument form. Use ARRAYFORMULA for whole-column edits, and REGEXREPLACE when a pattern is clearer than a start index.
  related: [substitute, left_right_mid, trim, text-before-character]

- id: extract_numbers
  category: text
  slugs: {excel: extract-numbers-excel, sheets: extract-numbers-google-sheets}
  title: How to Extract Numbers from Text
  summary: >-
    Pull digits out of mixed cells — order IDs, invoice codes, totals buried in phrases —
    with MID / FIND when the layout is fixed, nested SUBSTITUTE when you can strip known
    labels, or a general digits-only formula in Excel 365 and REGEXREPLACE / REGEXEXTRACT in
    Google Sheets.
  problem: >-
    Values like "SKU-1042-RED", "Order #1042" or "Total: 35 units" sit in one column, and you
    need only the numeric part in its own cell for sorting, matching or calculations.
  excel:
    formula: '=MID(A2, FIND("-", A2)+1, FIND("-", A2, FIND("-", A2)+1)-FIND("-", A2)-1)'
    explain: >-
      When the number sits between two dashes, FIND locates each dash and MID returns the
      characters between them — here the `1042` inside `SKU-1042-RED`.
    notes: >-
      Prefer a structure-aware formula when codes follow a pattern: MID + FIND for between
      delimiters, RIGHT/LEFT for a fixed-width suffix or prefix, or SUBSTITUTE to strip a known
      label (`Order #`, `Inv-`). Wrap with VALUE when you need a real number rather than text
      digits. In Microsoft 365 a general "keep every digit" approach is
      `=TEXTJOIN("", TRUE, IF(ISNUMBER(--MID(A2, SEQUENCE(LEN(A2)), 1)), MID(A2, SEQUENCE(LEN(A2)), 1), ""))`
      — it walks each character and joins the ones that are digits. Older Excel can use helper
      columns or Power Query's "Split / Extract" instead. Flash Fill (Data > Flash Fill) also
      works for one-off extractions when the pattern is consistent.
    alternatives:
      - label: Strip a known label with SUBSTITUTE
        formula: '=SUBSTITUTE(SUBSTITUTE(A2, "Order ", ""), "#", "")'
      - label: Excel 365 — keep every digit
        formula: '=TEXTJOIN("", TRUE, IF(ISNUMBER(--MID(A2, SEQUENCE(LEN(A2)), 1)), MID(A2, SEQUENCE(LEN(A2)), 1), ""))'
      - label: Number after a colon
        formula: '=VALUE(TRIM(MID(A2, FIND(":", A2)+1, 3)))'
    diff: >-
      Excel leans on MID/FIND/SUBSTITUTE or Excel 365 dynamic arrays. Google Sheets usually
      solves the same job with one REGEXEXTRACT or REGEXREPLACE call.
  sheets:
    formula: '=REGEXREPLACE(A2, "[^0-9]", "")'
    explain: >-
      REGEXREPLACE removes every character that is not a digit, leaving the number as text —
      e.g. `SKU-1042-RED` becomes `1042`.
    notes: >-
      Google Sheets has no SEQUENCE-based digit walk like Excel 365; REGEXREPLACE and
      REGEXEXTRACT are the native tools. `=REGEXREPLACE(A2, "[^0-9]", "")` keeps every digit
      (and concatenates them if several groups exist). `=REGEXEXTRACT(A2, "\d+")` returns only
      the first run of digits. To keep a decimal point use `[^0-9.]` carefully, or extract with
      `=REGEXEXTRACT(A2, "\d+\.\d+")`. VALUE(...) turns the digit string into a number. MID,
      FIND and SUBSTITUTE work exactly as in Excel when the layout is fixed, and ARRAYFORMULA
      applies any of these across a column:
      `=ARRAYFORMULA(IF(A2:A="", "", REGEXREPLACE(A2:A, "[^0-9]", "")))`.
    alternatives:
      - label: First digit group only
        formula: '=REGEXEXTRACT(A2, "\d+")'
      - label: Whole column of digits-only values
        formula: '=ARRAYFORMULA(IF(A2:A="", "", REGEXREPLACE(A2:A, "[^0-9]", "")))'
      - label: Number between dashes (same as Excel)
        formula: '=MID(A2, FIND("-", A2)+1, FIND("-", A2, FIND("-", A2)+1)-FIND("-", A2)-1)'
    diff: >-
      Sheets prefers REGEXREPLACE / REGEXEXTRACT for general digit extraction; Excel uses
      MID/FIND/SUBSTITUTE or an Excel 365 TEXTJOIN+SEQUENCE formula for the same result.
  example:
    intro: Pull the middle code segment, strip a label, then read a total after a colon.
    grid:
      - [Text, Extracted]
      - ['SKU-1042-RED']
      - ['Order #1042']
      - ['Inv-12-34']
      - ['Total: 35 units']
    checks:
      - cell: B2
        label: digits between the two dashes
        excel: '=MID(A2, FIND("-", A2)+1, FIND("-", A2, FIND("-", A2)+1)-FIND("-", A2)-1)'
        result: '1042'
      - cell: B3
        label: strip the Order label and hash
        excel: '=SUBSTITUTE(SUBSTITUTE(A3, "Order ", ""), "#", "")'
        result: '1042'
      - cell: B4
        label: strip Inv- and remaining dashes
        excel: '=SUBSTITUTE(SUBSTITUTE(A4, "Inv-", ""), "-", "")'
        result: '1234'
      - cell: B5
        label: number after the colon
        excel: '=VALUE(TRIM(MID(A5, FIND(":", A5)+1, 3)))'
        result: 35
      - cell: C2
        label: Sheets digits-only via REGEXREPLACE
        excel: '=MID(A2, 5, 4)'
        sheets: '=REGEXREPLACE(A2, "[^0-9]", "")'
        result: '1042'
        sheets_verify: false
        why_unverified: REGEXREPLACE is Sheets-only; LibreOffice cannot recalculate it. Excel check uses MID for the same digits.
  steps:
    - Look at the source text and decide whether the number sits in a fixed place, between delimiters, or anywhere in the string.
    - 'For between-delimiter codes use MID + FIND, e.g. `=MID(A2, FIND("-",A2)+1, FIND("-",A2,FIND("-",A2)+1)-FIND("-",A2)-1)`.'
    - 'For a known label, strip it with SUBSTITUTE, then VALUE if you need a numeric result.'
    - 'In Excel 365, use the TEXTJOIN + SEQUENCE formula on this page to keep every digit regardless of layout.'
    - 'In Google Sheets, prefer `=REGEXREPLACE(A2, "[^0-9]", "")` or `=REGEXEXTRACT(A2, "\d+")`, and wrap with ARRAYFORMULA for a whole column.'
  errors:
    - error: '#VALUE!'
      cause: FIND did not find the delimiter, or VALUE received a non-numeric string (letters still present).
      fix: 'Wrap FIND with IFERROR, or clean remaining letters with SUBSTITUTE / REGEXREPLACE before VALUE.'
    - error: Wrong digits or missing leading zeros
      cause: VALUE dropped leading zeros, or several digit groups were concatenated when you only wanted the first.
      fix: Keep the result as text (`="" & …`) when zeros matter. In Sheets use REGEXEXTRACT for the first group only.
    - error: "#NAME? in older Excel"
      cause: TEXTJOIN / SEQUENCE need Microsoft 365 or Excel 2021+.
      fix: Use the MID/FIND or SUBSTITUTE patterns on this page, or extract with Power Query / Flash Fill.
  faq:
    - q: How do I extract only the first number when a cell has several?
      a: 'Google Sheets: `=REGEXEXTRACT(A2, "\d+")`. Excel 365: take the first element of a digit-group split, or use TEXTBEFORE/TEXTAFTER around the first non-digit run. Structure-aware MID/FIND is safest when the layout is fixed.'
    - q: How do I keep a decimal point?
      a: 'Sheets: `=REGEXEXTRACT(A2, "\d+\.\d+")` or `=REGEXREPLACE(A2, "[^0-9.]", "")` then VALUE. Excel: strip currency symbols and thousands separators with SUBSTITUTE, then VALUE.'
    - q: Can I convert the extracted digits to a real number?
      a: 'Yes — wrap with VALUE, e.g. `=VALUE(B2)`. Format the cell as Number. Leave it as text when leading zeros must be preserved.'
  related: [substitute, left_right_mid, text-before-character, replace_fn]

- id: len
  category: text
  slugs: {excel: len-excel, sheets: len-google-sheets}
  title: How to Count Characters with LEN
  summary: >-
    LEN returns the number of characters in a cell, including spaces and punctuation. Use it
    to enforce length limits, spot padded IDs, or build formulas that depend on text width.
    Excel and Google Sheets share the same LEN syntax; Sheets fills a whole column with
    ARRAYFORMULA, while Excel 365 can spill LEN across a range.
  problem: >-
    You need to know how long each value is — character limits for imports, codes that must be
    exactly N digits, or helper math that subtracts spaces — without counting by hand.
  excel:
    formula: '=LEN(A2)'
    explain: >-
      Syntax: `LEN(text)`. Returns the character count of A2, counting every letter, digit,
      space and symbol. An empty cell returns 0.
    notes: >-
      LEN is available in every Excel version. It counts spaces, so `"  ab  "` is length 6, not
      2 — wrap with TRIM first when you only want visible characters: `=LEN(TRIM(A2))`. LENB
      counts bytes in double-byte character sets (mostly relevant for East Asian locales); for
      ordinary English text LEN and LENB match. In Microsoft 365 you can spill lengths for a
      column with `=LEN(A2:A10)`. Pair LEN with SUBSTITUTE to count specific characters, e.g.
      `=LEN(A2)-LEN(SUBSTITUTE(A2,"a",""))` for how many times "a" appears. Empty strings and
      blank cells both return 0.
    alternatives:
      - label: Length after trimming spaces
        formula: '=LEN(TRIM(A2))'
      - label: Count how many times a letter appears
        formula: '=LEN(A2)-LEN(SUBSTITUTE(A2,"a",""))'
      - label: Spill lengths for a range (Excel 365)
        formula: '=LEN(A2:A10)'
    diff: >-
      LEN itself is identical in Excel and Sheets. Sheets typically wraps it in ARRAYFORMULA for
      a whole column; Excel 365 can spill LEN over a range without ARRAYFORMULA.
  sheets:
    formula: '=LEN(A2)'
    explain: >-
      Same LEN syntax in Google Sheets as in Excel — character count of A2, spaces included.
    notes: >-
      LEN works the same way in Google Sheets, including spaces and punctuation. To fill an
      entire column at once use ARRAYFORMULA: `=ARRAYFORMULA(IF(A2:A="", "", LEN(A2:A)))`.
      Sheets has no separate LENB for everyday use; LEN already counts each Unicode character
      as one. Combine with TRIM when leading or trailing spaces should not count, and with
      SUBSTITUTE to count occurrences of a character. REGEXREPLACE can strip non-letters before
      LEN when you only want letter counts: `=LEN(REGEXREPLACE(A2, "[^A-Za-z]", ""))`. Blank
      cells return 0, same as Excel.
    alternatives:
      - label: Whole column of lengths
        formula: '=ARRAYFORMULA(IF(A2:A="", "", LEN(A2:A)))'
      - label: Length after trimming spaces
        formula: '=LEN(TRIM(A2))'
      - label: Count letters only with REGEXREPLACE
        formula: '=LEN(REGEXREPLACE(A2, "[^A-Za-z]", ""))'
    diff: >-
      Sheets matches Excel on LEN, adds ARRAYFORMULA for column fills, and can pair LEN with
      REGEXREPLACE when you need letter-only or digit-only counts.
  example:
    intro: Measure raw length, trimmed length, and how many times a letter appears.
    grid:
      - [Text, Length, Trimmed length, Count of a]
      - [Hello]
      - ['  ab  ']
      - [banana]
      - ['']
    checks:
      - cell: B2
        label: characters in Hello
        excel: '=LEN(A2)'
        result: 5
      - cell: B3
        label: spaces count too
        excel: '=LEN(A3)'
        result: 6
      - cell: C3
        label: length after TRIM
        excel: '=LEN(TRIM(A3))'
        result: 2
      - cell: D4
        label: how many times a appears
        excel: '=LEN(A4)-LEN(SUBSTITUTE(A4,"a",""))'
        result: 3
      - cell: B5
        label: empty cell is zero
        excel: '=LEN(A5)'
        result: 0
  steps:
    - 'Click the result cell and type `=LEN(`.'
    - Select the cell whose characters you want to count (A2) and close the parenthesis.
    - Press Enter — the number of characters, including spaces, appears.
    - 'Wrap with TRIM when leading or trailing spaces should be ignored: `=LEN(TRIM(A2))`.'
    - Fill or spill the formula down the column for every row you need to measure.
  errors:
    - error: Length looks too high
      cause: Invisible leading or trailing spaces, or a non-breaking space from a paste, are being counted.
      fix: 'Use `=LEN(TRIM(A2))`, or CLEAN + TRIM for paste junk. Check the cell with ISTEXT if a number was stored as text with padding.'
    - error: 'Result is 0 for a cell that looks filled'
      cause: The cell holds a formula that returned "" , or only spaces that TRIM would remove.
      fix: Inspect the formula bar. Use `=LEN(A2)>0` to test for any characters, including spaces.
    - error: Wrong count for accented or CJK characters
      cause: Confusing LEN (characters) with LENB (bytes) in older double-byte Excel modes.
      fix: Prefer LEN for character counts. LENB is only needed for byte-oriented legacy workflows.
  faq:
    - q: Does LEN count spaces?
      a: Yes. Every space, tab-like character stored as a space, and punctuation mark counts as one character. Use TRIM first when you want the visible-word length only.
    - q: How do I count characters across many rows at once?
      a: 'In Excel 365 enter `=LEN(A2:A100)` and let it spill. In Google Sheets use `=ARRAYFORMULA(LEN(A2:A100))`. Older Excel — fill the formula down.'
    - q: How do I count only digits or only letters?
      a: 'Excel 365: walk characters with MID + SEQUENCE, or strip unwanted ones then LEN. Sheets: `=LEN(REGEXREPLACE(A2,"[^0-9]",""))` for digits, or `[^A-Za-z]` for letters.'
  related: [trim, left_right_mid, substitute, concatenate]

- id: count_words
  category: text
  slugs: {excel: count-words-excel, sheets: count-words-google-sheets}
  title: How to Count Words in a Cell
  summary: >-
    Excel has no built-in WORDCOUNT. The classic approach subtracts the length without spaces
    from the trimmed length, then adds one. Google Sheets can use the same math, or SPLIT the
    cell on spaces and COUNTA the pieces. Both handle blank cells when you guard with TRIM.
  problem: >-
    A notes or title column needs a word count per cell — for limits, summaries or QA — and
    counting manually does not scale.
  excel:
    formula: '=IF(TRIM(A2)="",0,LEN(TRIM(A2))-LEN(SUBSTITUTE(TRIM(A2)," ",""))+1)'
    explain: >-
      TRIM removes leading and trailing spaces. LEN of the trimmed text minus LEN after every
      space is deleted leaves the number of spaces; adding 1 gives the word count. The IF
      returns 0 for blank or all-space cells.
    notes: >-
      This pattern works in every Excel version. It assumes words are separated by single spaces
      after TRIM — repeated internal spaces still inflate the count unless you collapse them
      first (nested SUBSTITUTE, or Flash Fill / Power Query). Punctuation attached to a word
      (`hello,`) still counts as one word, which is usually what you want. For a whole column in
      Microsoft 365 you can spill the same formula, or use TEXTSPLIT and COUNTA:
      `=IF(TRIM(A2)="",0,COUNTA(TEXTSPLIT(TRIM(A2)," ")))`. Helper columns keep the steps
      readable when you audit results. Always TRIM before SUBSTITUTE so leading spaces do not
      create a phantom empty word.
    alternatives:
      - label: Excel 365 — TEXTSPLIT then COUNTA
        formula: '=IF(TRIM(A2)="",0,COUNTA(TEXTSPLIT(TRIM(A2)," ")))'
      - label: Collapse double spaces first
        formula: '=IF(TRIM(A2)="",0,LEN(TRIM(SUBSTITUTE(A2,"  "," ")))-LEN(SUBSTITUTE(TRIM(SUBSTITUTE(A2,"  "," "))," ",""))+1)'
      - label: Characters only (not words)
        formula: '=LEN(TRIM(A2))'
    diff: >-
      Excel typically uses the LEN − SUBSTITUTE pattern or Excel 365 TEXTSPLIT. Google Sheets
      can use the same math, or SPLIT + COUNTA, which is often shorter.
  sheets:
    formula: '=IF(TRIM(A2)="",0,COUNTA(SPLIT(TRIM(A2)," ")))'
    explain: >-
      TRIM the cell, SPLIT on spaces into separate pieces, then COUNTA those pieces. Blank cells
      return 0 via the IF guard.
    notes: >-
      SPLIT + COUNTA is the natural Google Sheets word count and matches the Excel LEN trick on
      clean single-spaced text. SPLIT treats each delimiter break as a piece, so repeated spaces
      can create empty pieces — TRIM the input, and consider `=COUNTA(SPLIT(REGEXREPLACE(TRIM(A2),
      "\s+"," ")," "))` to collapse whitespace first. ARRAYFORMULA can drive a column:
      `=ARRAYFORMULA(IF(TRIM(A2:A)="",0,COUNTA(SPLIT(TRIM(A2:A)," "))))` does not expand SPLIT
      row-by-row the way you might expect, so many Sheets users fill the LEN − SUBSTITUTE formula
      down instead, or use a per-row MAP/LAMBDA in newer Sheets. The LEN − SUBSTITUTE formula
      from the Excel side works unchanged in Sheets when you want identical logic on both
      platforms.
    alternatives:
      - label: Same LEN formula as Excel
        formula: '=IF(TRIM(A2)="",0,LEN(TRIM(A2))-LEN(SUBSTITUTE(TRIM(A2)," ",""))+1)'
      - label: Collapse whitespace then SPLIT
        formula: '=IF(TRIM(A2)="",0,COUNTA(SPLIT(REGEXREPLACE(TRIM(A2),"\s+"," ")," ")))'
      - label: Character count instead
        formula: '=LEN(TRIM(A2))'
    diff: >-
      Sheets prefers SPLIT + COUNTA (or REGEXREPLACE to normalize spaces). Excel uses LEN −
      SUBSTITUTE, or TEXTSPLIT in Microsoft 365. The LEN formula works on both platforms.
  example:
    intro: Count words in phrases, a single word, padded text, and a blank cell.
    grid:
      - [Text, Words]
      - ['one two three']
      - [single]
      - ['  spaced out  ']
      - ['']
    checks:
      - cell: B2
        label: three words
        excel: '=IF(TRIM(A2)="",0,LEN(TRIM(A2))-LEN(SUBSTITUTE(TRIM(A2)," ",""))+1)'
        result: 3
      - cell: B3
        label: one word
        excel: '=IF(TRIM(A3)="",0,LEN(TRIM(A3))-LEN(SUBSTITUTE(TRIM(A3)," ",""))+1)'
        result: 1
      - cell: B4
        label: trimmed spaced out — two words
        excel: '=IF(TRIM(A4)="",0,LEN(TRIM(A4))-LEN(SUBSTITUTE(TRIM(A4)," ",""))+1)'
        result: 2
      - cell: B5
        label: blank is zero
        excel: '=IF(TRIM(A5)="",0,LEN(TRIM(A5))-LEN(SUBSTITUTE(TRIM(A5)," ",""))+1)'
        result: 0
  steps:
    - Prefer a clean source column — TRIM the text or paste values without odd spacing.
    - 'Enter `=IF(TRIM(A2)="",0,LEN(TRIM(A2))-LEN(SUBSTITUTE(TRIM(A2)," ",""))+1)` in Excel (or Sheets).'
    - 'In Google Sheets you can instead use `=IF(TRIM(A2)="",0,COUNTA(SPLIT(TRIM(A2)," ")))`.'
    - Fill the formula down. Spot-check rows that had double spaces or punctuation.
    - 'Optional: collapse repeated spaces with SUBSTITUTE or REGEXREPLACE before counting.'
  errors:
    - error: Count is higher than the words you see
      cause: Repeated internal spaces create extra "gaps" in the LEN − SUBSTITUTE method, or SPLIT produced empty pieces.
      fix: 'Collapse spaces first (`SUBSTITUTE` repeatedly, or `REGEXREPLACE` in Sheets), then recount.'
    - error: Blank cell shows 1
      cause: The IF(TRIM=…) guard was omitted, so LEN of "" − LEN of "" + 1 equals 1.
      fix: 'Always wrap with `IF(TRIM(A2)="",0, …)` so empty and all-space cells return 0.'
    - error: '#NAME? with TEXTSPLIT'
      cause: TEXTSPLIT needs Microsoft 365 or Excel 2021+.
      fix: Use the LEN − SUBSTITUTE formula on this page; it works in older Excel.
  faq:
    - q: Is there a WORDCOUNT function?
      a: Not in Excel. Google Sheets has no dedicated WORDCOUNT either — use SPLIT + COUNTA or the LEN − SUBSTITUTE formula. Some add-ins expose word count, but the formulas here need nothing extra.
    - q: Do hyphenated words count as one or two?
      a: As one, because the separator is a space. `well-known` is a single word to these formulas. Split on `"-"` only if you intentionally want hyphen pieces.
    - q: Can I count words in a whole range?
      a: 'Sum per-row counts, e.g. fill the formula in B2:B100 then `=SUM(B2:B100)`. Joining the range into one cell first is usually harder to audit.'
  related: [len, trim, textsplit, substitute]

- id: change_case
  category: text
  slugs: {excel: change-case-excel, sheets: change-case-google-sheets}
  title: How to Change Case with UPPER LOWER PROPER
  summary: >-
    UPPER converts text to all capitals, LOWER to all lowercase, and PROPER to title case
    (first letter of each word capitalised). Excel and Google Sheets share these three
    functions. Use them to normalise names, codes and labels before matching or display.
  problem: >-
    Imported names and codes arrive in mixed or inconsistent casing — `john SMITH`, `hola` —
    and you need predictable UPPER, lower or Title Case without retyping.
  excel:
    formula: '=PROPER(A2)'
    explain: >-
      `PROPER(A2)` capitalises the first letter of each word and lowercases the rest. Swap in
      `UPPER(A2)` for all caps or `LOWER(A2)` for all lowercase.
    notes: >-
      UPPER, LOWER and PROPER exist in every Excel version and take a single text argument.
      PROPER treats any non-letter as a word break, so `o'brien` becomes `O'Brien`, but
      `mcdonald` becomes `Mcdonald` — it will not preserve internal capitals in brand names.
      For those, keep a correction list or edit manually after PROPER. Numbers and punctuation
      pass through unchanged. In Microsoft 365 you can spill `=UPPER(A2:A100)`. After converting
      a column, Copy > Paste Special > Values if you want to replace the originals. Combine with
      TRIM to clean spaces in the same step: `=PROPER(TRIM(A2))`.
    alternatives:
      - label: All uppercase
        formula: '=UPPER(A2)'
      - label: All lowercase
        formula: '=LOWER(A2)'
      - label: Title case after trimming
        formula: '=PROPER(TRIM(A2))'
    diff: >-
      The three functions match Google Sheets. Sheets often wraps them in ARRAYFORMULA for a
      full column; Excel 365 can spill the same way without ARRAYFORMULA.
  sheets:
    formula: '=PROPER(A2)'
    explain: >-
      Same PROPER, UPPER and LOWER functions as Excel — title case, all caps, or all lowercase.
    notes: >-
      Google Sheets implements UPPER, LOWER and PROPER with the same single-argument behaviour
      as Excel, including PROPER's habit of lowercasing the rest of each word. Fill a column
      with ARRAYFORMULA: `=ARRAYFORMULA(IF(A2:A="", "", PROPER(A2:A)))`. For more control —
      uppercase only the first character of the cell — use a LEFT/RIGHT mix:
      `=UPPER(LEFT(A2,1)) & LOWER(RIGHT(A2, LEN(A2)-1))`. REGEXREPLACE can force custom patterns,
      but PROPER remains the fast path for ordinary names. TRIM inside PROPER still helps when
      imports carry extra spaces. After conversion, paste as values if downstream sheets should
      not depend on live formulas.
    alternatives:
      - label: Whole column to title case
        formula: '=ARRAYFORMULA(IF(A2:A="", "", PROPER(A2:A)))'
      - label: Sentence case (first character only)
        formula: '=UPPER(LEFT(A2,1))&LOWER(RIGHT(A2,LEN(A2)-1))'
      - label: All uppercase for a column
        formula: '=ARRAYFORMULA(IF(A2:A="", "", UPPER(A2:A)))'
    diff: >-
      Sheets matches Excel on UPPER / LOWER / PROPER and commonly uses ARRAYFORMULA for column
      fills. Sentence-case patterns with LEFT/RIGHT/LEN work on both platforms.
  example:
    intro: Turn mixed text into UPPER, lower and Proper forms.
    grid:
      - [Text, UPPER, LOWER, PROPER]
      - ['hello WORLD']
      - ['john smith']
      - ['  maria  ']
    checks:
      - cell: B2
        label: all caps
        excel: '=UPPER(A2)'
        result: HELLO WORLD
      - cell: C2
        label: all lowercase
        excel: '=LOWER(A2)'
        result: hello world
      - cell: D2
        label: title case
        excel: '=PROPER(A2)'
        result: Hello World
      - cell: D3
        label: proper name
        excel: '=PROPER(A3)'
        result: John Smith
      - cell: D4
        label: proper after trim
        excel: '=PROPER(TRIM(A4))'
        result: Maria
  steps:
    - Pick the case you need — UPPER, LOWER or PROPER.
    - 'In the result cell type `=PROPER(A2)` (or UPPER / LOWER) and press Enter.'
    - Fill or spill down the column for every row to normalise.
    - 'Optional: wrap with TRIM, e.g. `=PROPER(TRIM(A2))`, when spaces are messy.'
    - Paste Special > Values over the source column if you want to keep only the converted text.
  errors:
    - error: Brand names lose internal capitals
      cause: PROPER lowercases every letter after the first in each word (`iPhone` → `Iphone`).
      fix: Keep an exceptions list, fix those rows manually, or avoid PROPER for product codes that need exact casing.
    - error: Leading spaces remain after PROPER
      cause: PROPER does not remove spaces; it only changes case.
      fix: 'Use `=PROPER(TRIM(A2))` so spacing and case are fixed together.'
    - error: Formula shows the function name as text
      cause: The cell was formatted as Text before the formula was entered, or an extra space preceded the equals sign.
      fix: Set the format to General, re-enter the formula starting with `=`.
  faq:
    - q: What is the difference between PROPER and UPPER?
      a: UPPER makes every letter capital. PROPER capitalises the first letter of each word and forces the rest to lowercase. LOWER forces everything to lowercase.
    - q: Does PROPER work with accented characters?
      a: Yes in modern Excel and Google Sheets — accented letters are cased correctly in most locales. Always spot-check uncommon scripts.
    - q: Can I change case without a formula?
      a: 'In Excel, flash fill or Power Query can rewrite case. In Sheets, extensions exist, but UPPER/LOWER/PROPER remain the reliable built-in approach.'
  related: [trim, len, substitute, concatenate]
