# Lookup & reference pages. Schema: see niches/sheets-formulas/README.md
- id: vlookup
  category: lookup
  launch: true
  slugs: {excel: vlookup-excel, sheets: vlookup-google-sheets}
  title: How to Use VLOOKUP
  summary: >-
    VLOOKUP finds a value in the first column of a table and returns a value from another
    column in the same row. This guide shows the exact syntax, a worked price-list example,
    why you should almost always use FALSE for an exact match, and how to fix the errors
    people hit most often.
  problem: >-
    You have a product table with IDs in the first column and prices and stock levels in the
    columns to the right. Somewhere else (an order form, a report) you type a product ID and
    want the price to appear automatically instead of scrolling and copying it by hand.
  excel:
    formula: '=VLOOKUP(F2, $A$2:$D$6, 3, FALSE)'
    explain: >-
      Syntax: `VLOOKUP(lookup_value, table_array, col_index_num, [range_lookup])`. Look up F2
      in the first column of A2:D6 and return the value from the 3rd column of that range
      (column C). FALSE means exact match only.
    notes: >-
      In Microsoft 365 and Excel 2021 you can look up a whole list at once:
      `=VLOOKUP(F2:F10, $A$2:$D$6, 3, FALSE)` spills one result per ID. If you are on
      Microsoft 365, XLOOKUP is usually the better choice because it can look left, defaults
      to an exact match and does not break when you insert a column inside the table.
      VLOOKUP is still worth knowing because it works in every Excel version back to the
      1990s and in files you share with people on older versions.
    alternatives:
      - label: Same lookup with XLOOKUP (Microsoft 365 / Excel 2021+)
        formula: '=XLOOKUP(F2, $A$2:$A$6, $C$2:$C$6, "Not found")'
    diff: >-
      Excel's VLOOKUP syntax is identical. In Microsoft 365 a range as the first argument
      spills results automatically, without ARRAYFORMULA.
  sheets:
    formula: '=VLOOKUP(F2, $A$2:$D$6, 3, FALSE)'
    explain: >-
      Syntax: `VLOOKUP(search_key, range, index, [is_sorted])`. Google Sheets names the last
      argument is_sorted, but it behaves the same way: FALSE (or 0) means exact match.
    notes: >-
      Google Sheets uses the same arguments as Excel, but the fourth one is called
      `is_sorted`. To fill a whole column of results with one formula, wrap it in
      ARRAYFORMULA and use an open-ended range, for example
      `=ARRAYFORMULA(IF(F2:F="", "", VLOOKUP(F2:F, $A$2:$D$6, 3, FALSE)))`. The IF part keeps
      empty rows blank instead of showing #N/A. Sheets also has XLOOKUP, so you can look up
      columns to the left without rearranging your data.
    alternatives:
      - label: Fill an entire column with one formula
        formula: '=ARRAYFORMULA(IF(F2:F="", "", VLOOKUP(F2:F, $A$2:$D$6, 3, FALSE)))'
    diff: >-
      Google Sheets uses the same syntax (the last argument is called is_sorted). To return a
      whole column of results, wrap the formula in ARRAYFORMULA.
  example:
    intro: >-
      Product IDs are in column A. The ID to find is typed in F2, and G2 and H2 return its
      price and stock.
    grid:
      - [Product ID, Product, Price, Stock, null, Lookup ID, Price, Stock]
      - [P-101, Wireless Mouse, 24.99, 120, null, P-104]
      - [P-102, USB-C Hub, 39.5, 45]
      - [P-103, Laptop Stand, 32, 0]
      - [P-104, Webcam HD, 54.9, 18]
      - [P-105, Desk Lamp, 27.75, 60]
    checks:
      - cell: G2
        label: price of the ID in F2
        excel: '=VLOOKUP(F2, $A$2:$D$6, 3, FALSE)'
        result: 54.9
      - cell: H2
        label: stock of the same ID
        excel: '=VLOOKUP(F2, $A$2:$D$6, 4, FALSE)'
        result: 18
    note: >-
      The column number counts from the first column of the table range, not from column A of
      the sheet. If your table started in column C, the price would still be column 3 of the
      range.
  steps:
    - '`F2` is the value to find (P-104).'
    - '`$A$2:$D$6` is the table. VLOOKUP always searches the **leftmost** column of this range, so the IDs must be in column A here. The dollar signs keep the range fixed when you copy the formula down.'
    - '`3` tells VLOOKUP to return the value from the third column of the range (Price). Use 4 for Stock.'
    - '`FALSE` forces an exact match. If you leave it out, VLOOKUP assumes the first column is sorted and does an approximate match, which can quietly return the wrong row.'
    - VLOOKUP stops at the first match it finds. If an ID appears twice, only the first row is used.
  errors:
    - error: '#N/A'
      cause: The lookup value is not in the first column, often because of an extra space or because one side is a number and the other is text that looks like a number.
      fix: 'Check the value with `=LEN(F2)`, clean it with TRIM, or convert it with VALUE / TEXT so both sides match. Wrap the formula in IFNA to show a friendly message: `=IFNA(VLOOKUP(...), "Not found")`.'
    - error: '#REF!'
      cause: The column number is larger than the number of columns in the table range (for example 5 for A2:D6).
      fix: Use a column number that exists inside the range, or widen the range.
    - error: Wrong value returned, no error
      cause: The fourth argument was omitted or set to TRUE, so an approximate match was used on unsorted data.
      fix: Always end the formula with FALSE unless you deliberately want a range lookup on sorted data (for example tax brackets).
    - error: Results break after inserting a column
      cause: The column number is a hard-coded 3, so inserting a column inside the table shifts the data but not the number.
      fix: 'Use `MATCH("Price", $A$1:$D$1, 0)` as the column number, or switch to XLOOKUP / INDEX MATCH.'
  faq:
    - q: Can VLOOKUP look to the left?
      a: No. VLOOKUP only searches the first column of the range and returns values to its right. Use XLOOKUP or INDEX with MATCH to return a column on the left.
    - q: Is VLOOKUP case-sensitive?
      a: No. "p-104" and "P-104" are treated as the same value. For a case-sensitive lookup, use INDEX and MATCH with EXACT inside an array formula.
    - q: What is the difference between TRUE and FALSE in VLOOKUP?
      a: FALSE returns only exact matches. TRUE (or leaving the argument out) does an approximate match and requires the first column to be sorted in ascending order; it returns the largest value less than or equal to the lookup value.
    - q: Why does VLOOKUP return 0?
      a: |
        The lookup found a row, and the cell it returned was empty. Excel and Google Sheets turn that empty cell into 0. A missing key is a different result, #N/A. IFERROR and IFNA only replace errors, so they leave the 0 in place. Use the INDEX test or XLOOKUP with a blanked return range, in the section above, when you need a blank cell instead.
  cta: hub
  sections:
    - after: quick
      title: VLOOKUP returns 0 or blank cell
      body: |
        A match and a missing key are different problems. If the ID is not in the first column, VLOOKUP returns [#N/A](../{na-error}/). If the ID is found but the cell you return is empty, VLOOKUP returns 0. [IFERROR](../{iferror}/) and IFNA only replace errors, so they leave that 0 on the sheet.

        An empty cell and a stored 0 are not the same. In the worked example further down, the Laptop Stand has stock 0, and that 0 should stay. Test the source cell with INDEX, which can tell an empty cell from a real zero. LET calculates it once (Microsoft 365, Excel 2021, and Google Sheets):

        ```excel
        =LET(
          src, INDEX($C$2:$C$6, MATCH(F2, $A$2:$A$6, 0)),
          IF(src="", "", src)
        )
        ```

        Without LET, write the test twice:

        ```excel
        =IF(INDEX($C$2:$C$6, MATCH(F2, $A$2:$A$6, 0))="", "", INDEX($C$2:$C$6, MATCH(F2, $A$2:$A$6, 0)))
        ```

        A shorter IF blanks every zero, including a real stock of 0. Use it only when 0 and blank mean the same thing in your sheet:

        ```excel
        =IF(VLOOKUP(F2, $A$2:$D$6, 3, FALSE)=0, "", VLOOKUP(F2, $A$2:$D$6, 3, FALSE))
        ```

        `&""` is a last resort, not a blank. Appending `""` turns the result into text, so a price of 54.9 becomes the text "54.9" and an empty cell becomes the text "0". You still see a zero, and you can no longer sum the column. It is useful only when the next step is text, for example forcing a code to match text with `F2&""`.

        Prefer [XLOOKUP](../{xlookup}/) when the file opens in Microsoft 365, Excel 2021 or later, or Google Sheets. The `if_not_found` argument covers a missing key only. To also keep an empty price blank, and still return a real 0, blank the return range first:

        ```excel
        =XLOOKUP(F2, $A$2:$A$6, IF($C$2:$C$6="", "", $C$2:$C$6), "")
        ```

        The fourth argument `""` is what you show when F2 is not in the list. Use `"Not found"` if you would rather see words than a blank cell.
  related: [xlookup, iferror, na-error, index-match, vlookup-multiple-criteria, vlookup-another-sheet, lookup-multiple-values, xlookup-return-multiple-columns, last-value]

- id: xlookup
  category: lookup
  launch: true
  slugs: {excel: xlookup-excel, sheets: xlookup-google-sheets}
  title: How to Use XLOOKUP
  summary: >-
    XLOOKUP searches one range and returns the matching item from another range. It replaces
    VLOOKUP, HLOOKUP and most INDEX MATCH formulas: it can look left, defaults to an exact
    match, and has a built-in "not found" message. Here is the syntax, a worked example and
    the optional arguments you will actually use.
  problem: >-
    You have an employee table and want to type a name and get the employee ID. The ID column
    is to the left of the name column, so VLOOKUP cannot do it without rearranging the data.
  excel:
    formula: '=XLOOKUP(F2, B2:B6, A2:A6, "Not found")'
    explain: >-
      Syntax: `XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found],
      [match_mode], [search_mode])`. Find F2 in B2:B6 and return the item in the same position
      of A2:A6.
    notes: >-
      XLOOKUP is available in Microsoft 365, Excel 2021, Excel 2024 and Excel for the web. In
      Excel 2019 and older it returns #NAME?, so use INDEX MATCH if the file is shared with
      people on older versions. Useful options: match_mode 2 enables wildcards (* and ?),
      match_mode -1 returns the next smaller item, and search_mode -1 searches from the last
      row up, which gives you the most recent entry when a value appears more than once.
    alternatives:
      - label: Most recent match (search from the bottom)
        formula: '=XLOOKUP(F2, B2:B6, D2:D6, "Not found", 0, -1)'
      - label: Wildcard match (name starts with the text in F2)
        formula: '=XLOOKUP(F2&"*", B2:B6, A2:A6, "Not found", 2)'
    diff: >-
      The syntax is the same in Excel, but XLOOKUP only exists in Microsoft 365, Excel 2021 and
      later; older versions show #NAME?.
  sheets:
    formula: '=XLOOKUP(F2, B2:B6, A2:A6, "Not found")'
    explain: >-
      Syntax in Google Sheets: `XLOOKUP(search_key, lookup_range, result_range,
      [missing_value], [match_mode], [search_mode])`. Arguments work the same as in Excel.
    notes: >-
      Google Sheets added XLOOKUP in 2022, and the argument order matches Excel, so formulas
      copy across unchanged. The lookup range must be a single row or a single column of the
      same size as the result range, otherwise Sheets returns an error saying the ranges have
      mismatched sizes. If you share a sheet with someone who downloads it as .xlsx for an old
      Excel version, XLOOKUP will not work there; INDEX MATCH is the safest choice for that case.
    diff: >-
      Google Sheets supports XLOOKUP with the same argument order, so this formula works
      unchanged there.
  example:
    intro: Look up the employee ID (column A) for the name typed in column F.
    grid:
      - [Employee ID, Name, Department, Salary, null, Name, Employee ID]
      - [E-1001, Ana Lopez, Sales, 58000, null, David Kim]
      - [E-1002, Ben Carter, IT, 72000, null, Zoe Hart]
      - [E-1003, Chloe Wong, Finance, 66000]
      - [E-1004, David Kim, IT, 69500]
      - [E-1005, Emma Novak, Marketing, 61000]
    checks:
      - cell: G2
        label: ID for David Kim (a column to the left)
        excel: '=XLOOKUP(F2, B2:B6, A2:A6, "Not found")'
        result: E-1004
      - cell: G3
        label: a name that is not in the list
        excel: '=XLOOKUP(F3, B2:B6, A2:A6, "Not found")'
        result: Not found
  steps:
    - '`F2` is the value to search for.'
    - '`B2:B6` is where to search. Unlike VLOOKUP, this can be any column, it does not have to be the first one.'
    - '`A2:A6` is what to return. It must have the same number of rows as the search range; here it is to the left, which VLOOKUP cannot do.'
    - '`"Not found"` is returned instead of #N/A when there is no match.'
    - Match mode and search mode are optional. Leaving them out gives an exact match searched from top to bottom, which is what you want most of the time.
  errors:
    - error: '#NAME?'
      cause: Your Excel version does not have XLOOKUP (Excel 2019 or older), or the function name is misspelled.
      fix: Use INDEX MATCH instead, or open the file in Microsoft 365 / Excel for the web.
    - error: '#VALUE!'
      cause: The lookup array and return array have different sizes, for example B2:B6 and A2:A7.
      fix: Make both ranges cover exactly the same rows.
    - error: '#N/A'
      cause: No match and no if_not_found argument, often due to stray spaces or numbers stored as text.
      fix: Add a fourth argument such as "Not found", and clean the data with TRIM or VALUE.
  faq:
    - q: Is XLOOKUP better than VLOOKUP?
      a: In most cases yes. It can return columns to the left, defaults to an exact match, does not break when columns are inserted, and can return several columns at once. VLOOKUP is only better for compatibility with old Excel versions.
    - q: Can XLOOKUP return more than one column?
      a: Yes. Give it a multi-column return range such as C2:D6 and the result spills into adjacent cells.
    - q: Does Google Sheets have XLOOKUP?
      a: Yes. Google Sheets has had XLOOKUP since 2022 with the same arguments as Excel.
  cta: hub
  sections:
    - after: quick
      title: XLOOKUP return blank instead of 0
      body: |
        XLOOKUP returns 0 when it finds the lookup value and the return cell is empty. The `if_not_found` argument does not change that. It only runs when the value is missing, which is the [#N/A](../{na-error}/) case.

        Blank those empty cells and still show a real zero. `IF` on the return range turns blanks into an empty string before XLOOKUP reads them:

        ```excel
        =XLOOKUP(F2, B2:B6, IF(D2:D6="", "", D2:D6), "")
        ```

        A salary of 0 stays 0. The `""` at the end is the missing-name result; use `"Not found"` if you would rather see words. Wrapping the whole formula in [IFERROR](../{iferror}/) also hides #VALUE! and #NAME?, so prefer `if_not_found` or IFNA unless you mean to hide every error.

        To look up on another tab, use the same sheet syntax as [VLOOKUP from another sheet](../{vlookup-another-sheet}/): `'Price List'!B2:B100` as the lookup array and the matching rows of the return column. Several matching rows belong on [lookup multiple values](../{lookup-multiple-values}/). Several columns from one match belong on [return multiple columns](../{xlookup-return-multiple-columns}/).
    - after: quick
      title: XLOOKUP vs VLOOKUP
      body: |
        | | VLOOKUP | XLOOKUP |
        | --- | --- | --- |
        | Direction | First column only, return a column to the right | Any column, including a column to the left |
        | Default match | Approximate if you omit the 4th argument | Exact |
        | Not found | #N/A, unless you wrap IFNA or IFERROR | 4th argument, if_not_found |
        | Empty return cell | 0 | 0, unless the return range replaces blanks with "" |
        | Insert a column | The column index goes stale | The return range still points at the right cells |
        | Where it runs | Every Excel version and Google Sheets | Microsoft 365, Excel 2021 and later, Excel for the web, Google Sheets (since 2022) |

        Use [VLOOKUP](../{vlookup}/) when the file must open in Excel 2019 or older. Otherwise XLOOKUP is the shorter formula. The employee-ID example on this page is a left lookup: the ID sits to the left of the name, which VLOOKUP cannot return without moving the ID column.
  related: [vlookup, iferror, na-error, vlookup-another-sheet, xlookup-return-multiple-columns, lookup-multiple-values, index-match, vlookup-multiple-criteria, last-value]

- id: xlookup-return-multiple-columns
  category: lookup
  launch: true
  slugs: {excel: xlookup-return-multiple-columns-excel, sheets: xlookup-return-multiple-columns-google-sheets}
  title: XLOOKUP to Return Multiple Columns
  summary: >-
    One XLOOKUP can return several columns at once: give it a multi-column return range and the
    results spill across. This page shows how to return adjacent columns, columns in a different
    order, and a whole matching row.
  problem: >-
    For a given employee you want the department and the salary next to each other. Writing one
    lookup per column works, but it is slower to maintain and easy to get out of sync.
  excel:
    formula: '=XLOOKUP(F2, B2:B6, C2:D6)'
    explain: >-
      The return array C2:D6 is two columns wide, so the result spills into G2 and H2.
    notes: >-
      Spilled results need empty cells to the right; if anything is in the way, Excel shows
      #SPILL!. To return columns that are not next to each other, or in a different order,
      build the return array with CHOOSECOLS or HSTACK (Microsoft 365 and Excel 2024). When you copy the
      formula down, lock the ranges with $ so every row looks at the same table.
    alternatives:
      - label: Non-adjacent columns in any order (salary, then ID)
        formula: '=XLOOKUP(F2, B2:B6, CHOOSECOLS(A2:D6, 4, 1))'
      - label: The same with HSTACK
        formula: '=XLOOKUP(F2, B2:B6, HSTACK(D2:D6, A2:A6))'
    diff: >-
      Excel uses the same formula. Curly-brace arrays like {D2:D6, A2:A6} do not work in Excel,
      so use CHOOSECOLS or HSTACK there.
  sheets:
    formula: '=XLOOKUP(F2, B2:B6, C2:D6)'
    explain: >-
      Google Sheets spills the two returned values into G2 and H2 just like Excel.
    notes: >-
      In Google Sheets you can also build the return range with curly braces, which is shorter
      and works in every version of Sheets: `{D2:D6, A2:A6}` puts Salary first and ID second. If
      a spilled result would overwrite existing data, Sheets shows #REF! with the message "Array
      result was not expanded because it would overwrite data", which is the Sheets equivalent of
      Excel's #SPILL!. CHOOSECOLS and HSTACK also exist in Sheets.
    alternatives:
      - label: Non-adjacent columns with curly braces
        formula: '=XLOOKUP(F2, B2:B6, {D2:D6, A2:A6})'
    diff: >-
      Google Sheets uses the same formula. A blocked spill shows #REF! instead of #SPILL!, and
      you can also build the return range with curly braces such as {D2:D6, A2:A6}.
  example:
    intro: Type a name in F2; the department and salary spill into G2:H2.
    grid:
      - [Employee ID, Name, Department, Salary, null, Name, Department, Salary]
      - [E-1001, Ana Lopez, Sales, 58000, null, Chloe Wong]
      - [E-1002, Ben Carter, IT, 72000]
      - [E-1003, Chloe Wong, Finance, 66000]
      - [E-1004, David Kim, IT, 69500]
      - [E-1005, Emma Novak, Marketing, 61000]
    checks:
      - cell: G2
        label: one formula, two results (spills into H2)
        excel: '=XLOOKUP(F2, B2:B6, C2:D6)'
        spill_cells: [G2, H2]
        spill_results: [Finance, 66000]
  steps:
    - XLOOKUP finds the position of F2 in B2:B6 (Chloe Wong is the 3rd item).
    - It returns the 3rd row of the return range. Because C2:D6 has two columns, that row contains two values.
    - The two values spill into G2 and H2. Only G2 contains the formula; H2 shows the spilled result.
    - To return the full record, use A2:D6 as the return range and leave four empty cells to the right.
  errors:
    - error: '#SPILL! (Excel) / #REF! (Google Sheets)'
      cause: A cell in the spill area is not empty.
      fix: Clear the cells to the right of the formula, including cells that contain only a space.
    - error: '#VALUE!'
      cause: The return range has a different number of rows than the lookup range.
      fix: Make the lookup range and the return range start and end on the same rows.
    - error: Only one value appears
      cause: The formula is in an old Excel version or inside a table column that cannot spill (Excel tables do not allow spilled formulas).
      fix: Move the formula outside the Excel Table, or use one XLOOKUP per column.
  faq:
    - q: Can I copy a spilling XLOOKUP down a column?
      a: Yes, as long as each row has enough empty cells to its right. Lock the lookup and return ranges with $ so they do not shift.
    - q: How do I return the columns in a different order?
      a: Wrap the return range in CHOOSECOLS (Excel 365 and Google Sheets), e.g. CHOOSECOLS(A2:D6, 4, 1), or in Google Sheets use {D2:D6, A2:A6}.
  related: [xlookup, vlookup, index-match, lookup-multiple-values]

- id: index-match
  category: lookup
  launch: true
  slugs: {excel: index-match-excel, sheets: index-match-google-sheets}
  title: How to Use INDEX MATCH
  summary: >-
    INDEX MATCH is the classic flexible lookup: MATCH finds the row number and INDEX returns the
    value at that position. It can look left, does not break when columns are inserted, and works
    in every version of Excel and Google Sheets. This guide covers the one-way and two-way forms.
  problem: >-
    You have a table of countries with their ISO code in the last column. You want to type a
    code and get the country name, which sits to the left of the code, and you also want a
    formula that can pick any column by its header.
  excel:
    formula: '=INDEX(A2:A6, MATCH(E2, C2:C6, 0))'
    explain: >-
      MATCH(E2, C2:C6, 0) returns the position of the code in C2:C6. INDEX(A2:A6, position)
      returns the country in that position.
    notes: >-
      INDEX MATCH works in every Excel version, which makes it the safest lookup for workbooks
      shared with people on Excel 2016 or 2019. In Microsoft 365, XMATCH can replace MATCH and
      adds a search-from-the-end mode. Always use 0 as the last MATCH argument for an exact
      match; 1 (the default) assumes sorted data.
    alternatives:
      - label: Microsoft 365 equivalent with XLOOKUP
        formula: '=XLOOKUP(E2, C2:C6, A2:A6)'
    diff: >-
      Excel uses the identical formula, and it works in every Excel version.
  sheets:
    formula: '=INDEX(A2:A6, MATCH(E2, C2:C6, 0))'
    explain: >-
      Same functions and arguments in Google Sheets.
    notes: >-
      INDEX MATCH works identically in Google Sheets. One Sheets-specific trick: INDEX accepts
      the result of FILTER or QUERY as its range, so you can chain it with other array functions
      without ARRAYFORMULA. For multiple criteria, Sheets users often prefer FILTER, which
      returns every match instead of only the first.
    diff: >-
      Google Sheets uses the identical formula.
  example:
    intro: Find the country (column A) for the code in E2, and the capital using the header name.
    grid:
      - [Country, Capital, Code, null, Code, Result]
      - [France, Paris, FR, null, CA]
      - [Japan, Tokyo, JP]
      - [Brazil, Brasília, BR]
      - [Canada, Ottawa, CA]
      - [Kenya, Nairobi, KE]
    checks:
      - cell: F2
        label: country for code CA (left lookup)
        excel: '=INDEX(A2:A6, MATCH(E2, C2:C6, 0))'
        result: Canada
      - cell: F3
        label: two-way lookup, column chosen by its header
        excel: '=INDEX(A2:C6, MATCH(E2, C2:C6, 0), MATCH("Capital", A1:C1, 0))'
        result: Ottawa
  steps:
    - '`MATCH(E2, C2:C6, 0)` searches C2:C6 for "CA" and returns 4, because CA is the 4th item.'
    - '`INDEX(A2:A6, 4)` returns the 4th item of A2:A6: Canada.'
    - 'In the two-way version, INDEX gets a row number and a column number: the second MATCH looks up the header "Capital" in A1:C1 and returns 2.'
    - Because the return column is referenced directly, inserting a new column inside the table does not break the formula.
  errors:
    - error: '#N/A'
      cause: MATCH did not find the value (extra spaces, text vs number) or the last argument was omitted, so MATCH ran an approximate search.
      fix: Use 0 as the third MATCH argument and clean the data with TRIM / VALUE.
    - error: Wrong row returned
      cause: The INDEX range and the MATCH range start on different rows, e.g. A1:A6 vs C2:C6.
      fix: Make both ranges start and end on the same rows.
    - error: '#REF!'
      cause: The row or column number from MATCH is larger than the INDEX range.
      fix: Make the INDEX range at least as large as the ranges searched by MATCH.
  faq:
    - q: Why use INDEX MATCH instead of VLOOKUP?
      a: It can return a column to the left, it does not depend on a hard-coded column number, and it only reads the two columns it needs.
    - q: Is INDEX MATCH faster than XLOOKUP?
      a: The difference is negligible on normal-sized sheets. Choose XLOOKUP for readability in Microsoft 365 and Google Sheets, and INDEX MATCH for compatibility with older Excel.
    - q: When is INDEX MATCH better than VLOOKUP?
      a: |
        When the value you want is to the left of the column you search, or when you do not want a hard-coded column number. The country example on this page looks up the code CA in column C and returns Canada from column A. VLOOKUP cannot do that. See the left-lookup section above.
  cta: hub
  sections:
    - after: quick
      title: INDEX MATCH vs VLOOKUP (left lookup)
      body: |
        [VLOOKUP](../{vlookup}/) searches the first column of its range and can only return a column to the right. INDEX and MATCH split the job, so the column you return can sit to the left of the column you search.

        In the worked example further down, the code is in column C and the country name is in column A. The code typed in E2 is CA. MATCH finds CA in the 4th row of C2:C6, and INDEX returns Canada from A2:A6:

        ```excel
        =INDEX(A2:A6, MATCH(E2, C2:C6, 0))
        ```

        Result: Canada. That is the left lookup. The same idea with [XLOOKUP](../{xlookup}/) is `=XLOOKUP(E2, C2:C6, A2:A6)`. Keep INDEX MATCH when the workbook has to open in older Excel.

        A missing code is [#N/A](../{na-error}/). [IFERROR](../{iferror}/) will hide it, but IFNA is safer, so a wrong range still shows. To return every matching row instead of the first one, use [lookup multiple values](../{lookup-multiple-values}/). For a horizontal table, headers across a row and the values underneath, [HLOOKUP](../{hlookup}/) is the one-direction equivalent of VLOOKUP.
  related: [xlookup, vlookup, lookup-multiple-values, iferror, hlookup, vlookup-multiple-criteria, na-error]

- id: vlookup-multiple-criteria
  category: lookup
  launch: true
  slugs: {excel: vlookup-multiple-criteria-excel, sheets: vlookup-multiple-criteria-google-sheets}
  title: VLOOKUP with Multiple Criteria
  summary: >-
    VLOOKUP only matches one value, but there are three reliable ways to look up a row that must
    match two or more conditions: XLOOKUP with multiplied conditions, INDEX MATCH as an array, and
    VLOOKUP with a helper key. Each is shown below with a worked example.
  problem: >-
    Your sales table has a Region column and a Product column. You need the units for one
    specific region and product, for example West + Apples, but each region appears several times
    and so does each product.
  excel:
    formula: '=XLOOKUP(1, (A2:A7=E2)*(B2:B7=F2), C2:C7)'
    explain: >-
      Each comparison returns TRUE/FALSE for every row. Multiplying them turns TRUE*TRUE into 1,
      so XLOOKUP finds the first row where both conditions are met.
    notes: >-
      The XLOOKUP version needs Microsoft 365 or Excel 2021+. In Excel 2019 and older use the
      INDEX MATCH version and confirm it with Ctrl+Shift+Enter, because those versions have no
      dynamic arrays.
      If you prefer plain VLOOKUP, add a helper column that joins the criteria (for example
      `=A2&"|"&B2`), put it as the first column of the lookup range and search for `E2&"|"&F2`.
      The separator prevents false matches such as "AB"&"C" vs "A"&"BC".
    alternatives:
      - label: INDEX MATCH array version (all Excel versions)
        formula: '=INDEX(C2:C7, MATCH(1, (A2:A7=E2)*(B2:B7=F2), 0))'
      - label: VLOOKUP with a virtual helper column
        formula: '=VLOOKUP(E2&"|"&F2, CHOOSE({1,2}, A2:A7&"|"&B2:B7, C2:C7), 2, FALSE)'
    diff: >-
      In Excel 365 the usual answer is XLOOKUP with multiplied conditions, which returns only the
      first match. FILTER also exists in Excel 365.
  sheets:
    formula: '=FILTER(C2:C7, A2:A7=E2, B2:B7=F2)'
    explain: >-
      FILTER takes one condition per argument and returns every row that meets all of them.
    notes: >-
      In Google Sheets, FILTER is the most natural way to match several criteria because each
      condition is simply another argument, and it works without ARRAYFORMULA. It returns all
      matches, so if duplicates are possible and you only want the first, wrap it in
      `INDEX(..., 1)`. The VLOOKUP helper-key trick also works in Sheets, but the expression
      inside the curly braces must be wrapped in ARRAYFORMULA, otherwise only the first row is
      evaluated.
    alternatives:
      - label: First match only
        formula: '=INDEX(FILTER(C2:C7, A2:A7=E2, B2:B7=F2), 1)'
      - label: VLOOKUP with a virtual helper column
        formula: '=ARRAYFORMULA(VLOOKUP(E2&"|"&F2, {A2:A7&"|"&B2:B7, C2:C7}, 2, FALSE))'
    diff: >-
      FILTER is simpler in Google Sheets: one argument per condition, and it returns every match.
  example:
    intro: Find the units for the region in E2 and the product in F2.
    grid:
      - [Region, Product, Units, null, Region, Product, Units]
      - [East, Apples, 120, null, West, Apples]
      - [East, Pears, 80]
      - [West, Apples, 95]
      - [West, Pears, 60]
      - [North, Apples, 150]
      - [North, Pears, 70]
    checks:
      - cell: G2
        label: XLOOKUP (Excel) / FILTER (Google Sheets)
        excel: '=XLOOKUP(1, (A2:A7=E2)*(B2:B7=F2), C2:C7)'
        sheets: '=FILTER(C2:C7, A2:A7=E2, B2:B7=F2)'
        result: 95
      - cell: G3
        label: INDEX MATCH version
        excel: '=INDEX(C2:C7, MATCH(1, (A2:A7=E2)*(B2:B7=F2), 0))'
        array: true
        result: 95
  steps:
    - '`(A2:A7=E2)` returns {FALSE;FALSE;TRUE;TRUE;FALSE;FALSE}: which rows are West.'
    - '`(B2:B7=F2)` returns {TRUE;FALSE;TRUE;FALSE;TRUE;FALSE}: which rows are Apples.'
    - 'Multiplying the two arrays gives {0;0;1;0;0;0}. Only row 3 of the range meets both conditions.'
    - XLOOKUP (or MATCH) searches that array for 1 and returns the Units from the same position, 95.
    - Add more conditions by multiplying more comparisons, e.g. `*(D2:D7=G2)`.
  errors:
    - error: '#N/A'
      cause: No row meets all conditions, or a criterion has a trailing space.
      fix: 'Check each condition separately (e.g. `=COUNTIFS(A2:A7,E2,B2:B7,F2)` should be at least 1) and use an if_not_found argument. When each value exists on its own but the pair still fails, see [how to fix #N/A](../{na-error}/).'
    - error: '#VALUE!'
      cause: The ranges in the conditions have different sizes.
      fix: Make every range cover the same rows (A2:A7, B2:B7, C2:C7).
    - error: Returns the wrong row in older Excel
      cause: The INDEX MATCH array formula was entered with plain Enter in Excel 2019 or older.
      fix: Re-enter it with Ctrl+Shift+Enter, or use the helper-column method.
  faq:
    - q: Can VLOOKUP itself take two lookup values?
      a: Not directly. Join the criteria into one key (with a helper column or CHOOSE) so VLOOKUP has a single value to search for.
    - q: How do I sum instead of returning the first match?
      a: Use SUMIFS, e.g. =SUMIFS(C2:C7, A2:A7, E2, B2:B7, F2). It adds all matching rows instead of returning one.
    - q: How do I use OR instead of AND between the criteria?
      a: Add the conditions instead of multiplying them, e.g. ((A2:A7="East")+(A2:A7="West"))>0.
  related: [xlookup, index-match, vlookup, na-error, lookup-multiple-values, sumifs, countifs]

- id: vlookup-another-sheet
  category: lookup
  launch: true
  slugs: {excel: vlookup-another-sheet-excel, sheets: vlookup-another-sheet-google-sheets}
  title: VLOOKUP from Another Sheet
  summary: >-
    To look up a value on a different tab, put the sheet name and an exclamation mark in front of
    the range. This guide shows the exact quoting rules for sheet names with spaces, how to point
    at another file, and why the result sometimes turns into #REF!.
  problem: >-
    Your orders are on one tab and the price list lives on a separate tab called "Price List".
    You want each order row to pull its unit price from that tab automatically.
  excel:
    formula: '=VLOOKUP(B2, ''Price List''!$A$2:$C$5, 3, FALSE)'
    explain: >-
      `'Price List'!$A$2:$C$5` means range A2:C5 on the tab named Price List. The single quotes
      are required because the name contains a space.
    notes: >-
      The easiest way to get the reference right is to type `=VLOOKUP(B2,` then click the other
      tab and select the range; Excel writes the quotes for you. To look up from another
      workbook, the reference includes the file name in square brackets, for example
      `'[Prices.xlsx]Price List'!$A$2:$C$5`. While the source file is closed Excel stores the full
      path and shows the last saved values; open it and refresh with Data > Edit Links if values
      look stale.
    alternatives:
      - label: Lookup from another workbook
        formula: '=VLOOKUP(B2, ''[Prices.xlsx]Price List''!$A$2:$C$5, 3, FALSE)'
    diff: >-
      Excel uses the same sheet reference syntax. Another workbook is referenced as
      '[Prices.xlsx]Price List'!A2:C5 rather than with IMPORTRANGE.
  sheets:
    formula: '=VLOOKUP(B2, ''Price List''!$A$2:$C$5, 3, FALSE)'
    explain: >-
      Same syntax in Google Sheets: quote the tab name when it contains spaces or punctuation.
    notes: >-
      To look up from a different Google Sheets file, wrap the range in IMPORTRANGE with the
      file's URL and the range as text. The first time you use IMPORTRANGE with a new file,
      the cell shows #REF! with an "Allow access" button; click it once and the lookup starts
      working. IMPORTRANGE refreshes automatically when the source changes, so there is no
      "Edit Links" step as in Excel, but large imports can slow the sheet down: import only the
      columns you need.
    alternatives:
      - label: Lookup from another Google Sheets file
        formula: '=VLOOKUP(B2, IMPORTRANGE("https://docs.google.com/spreadsheets/d/FILE_ID", "Price List!A2:C5"), 3, FALSE)'
    diff: >-
      Google Sheets uses the same tab reference. For another file, wrap the range in
      IMPORTRANGE("file URL", "Price List!A2:C5") and click Allow access once.
  example:
    intro: The Orders tab (below) looks up each SKU on the Price List tab.
    grid:
      - [Order, SKU, Qty, Unit price]
      - [1001, SKU-03, 2]
      - [1002, SKU-01, 10]
      - [1003, SKU-04, 25]
    other_sheets:
      Price List:
        - [SKU, Description, Unit Price]
        - [SKU-01, Notebook, 3.5]
        - [SKU-02, Pen pack, 4.25]
        - [SKU-03, Stapler, 12]
        - [SKU-04, Folder, 1.8]
    checks:
      - cell: D2
        label: filled down to D4
        excel: '=VLOOKUP(B2, ''Price List''!$A$2:$C$5, 3, FALSE)'
        fill: [D2, D3, D4]
        results: [12, 3.5, 1.8]
  steps:
    - '`B2` is the SKU on the current (Orders) tab.'
    - '`''Price List''!` switches the reference to the other tab. Use quotes whenever the tab name has a space, hyphen or starts with a number; quotes are optional for simple names like Prices!A2:C5.'
    - '`$A$2:$C$5` is locked with dollar signs so it stays the same when you fill the formula down.'
    - '`3, FALSE` returns the third column (Unit Price) with an exact match.'
  errors:
    - error: '#REF!'
      cause: The tab was renamed in a way the formula could not follow, the tab was deleted, or (Google Sheets) IMPORTRANGE access has not been granted yet.
      fix: Re-select the range on the correct tab, or click Allow access on the IMPORTRANGE cell.
    - error: Excel asks you to pick a file / "Update values" dialog
      cause: The tab name in the formula does not exist, so Excel thinks it is an external file.
      fix: Check the spelling of the tab name and the quotes, or build the reference by clicking.
    - error: '#N/A'
      cause: The SKU is not found on the other tab (spaces, different case of codes, number vs text).
      fix: Compare the two values with =B2='Price List'!A2 and clean with TRIM or VALUE.
  faq:
    - q: Do I need quotes around the sheet name?
      a: Only when the name contains spaces or special characters, but quotes never hurt, so 'Prices'!A2:C5 also works.
    - q: Can VLOOKUP search several sheets at once?
      a: Not by itself. Nest lookups with IFNA, e.g. =IFNA(VLOOKUP(B2,Sheet1!A:C,3,FALSE), VLOOKUP(B2,Sheet2!A:C,3,FALSE)), or combine the sheets first (VSTACK in Excel 365 and Google Sheets).
  cta: hub
  sections:
    - after: quick
      title: VLOOKUP from another workbook
      excel: |
        A different file uses the workbook name in square brackets, then the sheet:

        ```excel
        =VLOOKUP(B2, '[Prices.xlsx]Price List'!$A$2:$C$100, 3, FALSE)
        ```

        Quote the whole `[workbook]sheet` name when the sheet name has a space. Lock the table with `$` so filling the formula down does not walk off the price list.

        - **Closed workbook.** Desktop Excel keeps the last saved values for an external link. If the link is broken, the sheet was renamed, or Excel asks you to update values, the lookup returns #N/A or #REF! until you open Prices.xlsx or repair the path. Use Data > Edit Links > Update Values. A formula that names a sheet which is not in any open workbook makes Excel ask you to pick a file.
        - **The path is part of the formula.** After you close the source file, Excel rewrites the reference to include the drive and folder. Moving either file breaks that path. Edit Links is where you point it at the new location.
        - **Excel for the web and Google Sheets** do not calculate a closed .xlsx on your computer. For another Google Sheets file, use IMPORTRANGE, shown on the Sheets version of this guide.

        The same brackets work with [XLOOKUP](../{xlookup}/): one range for the lookup column and one for the prices, both starting with `'[Prices.xlsx]Price List'!`. A #N/A that survives opening the file is usually text versus numbers or stray spaces, covered under [the #N/A error](../{na-error}/).
      sheets: |
        Another Google Sheets file is not a tab name. Wrap the imported range in IMPORTRANGE, then look up inside it:

        ```excel
        =VLOOKUP(B2, IMPORTRANGE("https://docs.google.com/spreadsheets/d/FILE_ID", "Price List!A2:C100"), 3, FALSE)
        ```

        The first time you connect a file, the cell shows #REF! until you click Allow access. Quote `Price List` inside the text because the name has a space. IMPORTRANGE does not read a closed Excel file on your computer.

        [XLOOKUP](../{xlookup}/) can use the same imported range if you wrap IMPORTRANGE once (a named range or a helper sheet keeps the file URL out of every formula). A #N/A after access is allowed is usually text versus numbers or stray spaces: [how to fix #N/A](../{na-error}/).
    - after: quick
      title: VLOOKUP not working between sheets
      excel: |
        Work down this list when the formula was fine on one tab and fails as soon as the range points at another.

        1. **Sheet name with spaces or punctuation.** `Price List` must be quoted: `'Price List'!$A$2:$C$100`. A hyphen, or a name that starts with a number, needs quotes too. A simple name (`Prices!A2:C100`) does not. If Excel opens an Update values dialog, the name in the formula does not match any tab in an open workbook.
        2. **Absolute references.** Filling down without dollar signs shifts the table onto the wrong rows. Lock it: `$A$2:$C$100`. Leave the lookup cell (B2) relative so each order row looks up its own SKU.
        3. **Closed workbook.** If the source file is closed and the result is #N/A, #REF!, or an Update values prompt, open the file or fix the link. Details are in the workbook section above.
        4. **Exact match.** The last argument must be FALSE. Leaving it out runs an approximate match on the other sheet and can return the wrong price with no error.
        5. **Text, spaces, and numbers.** A SKU that looks the same can still fail. [TRIM](../{trim}/) removes ordinary spaces. [How to fix #N/A](../{na-error}/) covers numbers stored as text.
        6. **Column index.** 3 means the third column of the range on the other sheet, counting from the first column of that range, not from column A of the sheet.
      sheets: |
        Work down this list when the formula was fine on one tab and fails as soon as the range points at another.

        1. **Sheet name with spaces or punctuation.** `Price List` must be quoted: `'Price List'!$A$2:$C$100`. A hyphen, or a name that starts with a number, needs quotes too. A simple name (`Prices!A2:C100`) does not.
        2. **Absolute references.** Filling down without dollar signs shifts the table onto the wrong rows. Lock it: `$A$2:$C$100`. Leave the lookup cell (B2) relative so each order row looks up its own SKU.
        3. **Another file.** IMPORTRANGE shows #REF! until you click Allow access. The range text uses the same quoting rules (`"Price List!A2:C100"`). A closed Excel workbook on a PC is not something Sheets can open.
        4. **Exact match.** The last argument must be FALSE. Leaving it out runs an approximate match and can return the wrong price with no error.
        5. **Text, spaces, and numbers.** A SKU that looks the same can still fail. [TRIM](../{trim}/) removes ordinary spaces. [How to fix #N/A](../{na-error}/) covers numbers stored as text.
        6. **Column index.** 3 means the third column of the range on the other sheet, counting from the first column of that range, not from column A of the sheet.
  related: [vlookup, xlookup, na-error, trim, index-match, ref-error]

- id: last-value
  category: lookup
  launch: true
  slugs: {excel: last-value-excel, sheets: last-value-google-sheets}
  title: How to Lookup the Last Value in a Column
  summary: >-
    Need the most recent entry in a log, a running balance or a meter reading? These formulas
    return the last non-empty value in a column, even when there are blank cells in between,
    plus the matching date from the next column.
  problem: >-
    You record a reading every day in column B, sometimes skipping a day. A dashboard cell should
    always show the latest reading and its date without editing the formula when new rows are added.
  excel:
    formula: '=LOOKUP(2, 1/(B2:B100<>""), B2:B100)'
    explain: >-
      1/(B2:B100<>"") gives 1 for filled cells and #DIV/0! for blanks. LOOKUP searches for 2,
      cannot find it, and falls back to the last numeric value, which is the last filled row.
    notes: >-
      This LOOKUP trick works in every Excel version without Ctrl+Shift+Enter and ignores gaps.
      In Microsoft 365 there is a more readable option: `=XLOOKUP(TRUE, B2:B100<>"", B2:B100, ,
      0, -1)` searches from the bottom up. Avoid whole-column references like B:B inside these
      array calculations in big workbooks; a generous fixed range such as B2:B5000 is faster.
    alternatives:
      - label: Microsoft 365 with XLOOKUP (search from the bottom)
        formula: '=XLOOKUP(TRUE, B2:B100<>"", B2:B100, , 0, -1)'
      - label: Microsoft 365 with TAKE and FILTER
        formula: '=TAKE(FILTER(B2:B100, B2:B100<>""), -1)'
    diff: >-
      The classic LOOKUP(2, 1/...) trick works in every Excel version. CHOOSEROWS also exists in Excel 365.
  sheets:
    formula: '=CHOOSEROWS(FILTER(B2:B, B2:B<>""), -1)'
    explain: >-
      FILTER keeps the non-empty cells and CHOOSEROWS with -1 returns the last of them.
    notes: >-
      In Google Sheets, open-ended ranges such as B2:B are normal and grow automatically as you
      add rows. FILTER plus CHOOSEROWS is the clearest way to get the last entry. If you prefer
      a formula that works in very old sheets too, use INDEX with COUNTA, which works as long as
      there are no blank cells in the column. Note that TAKE, which Excel users often reach for,
      does not exist in Google Sheets.
    alternatives:
      - label: INDEX + COUNTA (column without gaps)
        formula: '=INDEX(B2:B, COUNTA(B2:B))'
      - label: Matching date of the last reading
        formula: '=CHOOSEROWS(FILTER(A2:A, B2:B<>""), -1)'
    diff: >-
      FILTER plus CHOOSEROWS is easier to read in Google Sheets and works with open-ended ranges. TAKE is not available in Sheets.
  example:
    intro: Readings with gaps. D2 returns the last reading and D3 the date it was recorded.
    grid:
      - [Date, Reading, null, Latest]
      - [2026-03-02, 412]
      - [2026-03-03, 398]
      - [2026-03-04, null]
      - [2026-03-05, 405]
      - [2026-03-06, 421]
      - [2026-03-07, null]
    checks:
      - cell: D2
        label: last reading
        excel: '=LOOKUP(2, 1/(B2:B7<>""), B2:B7)'
        sheets: '=CHOOSEROWS(FILTER(B2:B7, B2:B7<>""), -1)'
        result: 421
      - cell: D3
        label: date of that reading (format the cell as a date)
        excel: '=LOOKUP(2, 1/(B2:B7<>""), A2:A7)'
        sheets: '=CHOOSEROWS(FILTER(A2:A7, B2:B7<>""), -1)'
        result: 2026-03-06
  steps:
    - '`B2:B7<>""` returns TRUE for filled cells and FALSE for blanks.'
    - '`1/(...)` turns TRUE into 1 and FALSE into a #DIV/0! error.'
    - 'LOOKUP looks for 2 in that array. Because 2 is larger than every value, it returns the position of the last number it can find and skips the errors, so blanks never count.'
    - The third argument decides what to return from that position, B for the reading or A for the date.
  errors:
    - error: Returns 0 or an old value
      cause: Cells that look empty contain a formula returning "" or a space, so they count as filled.
      fix: 'Test with `TRIM(B2:B100)<>""` instead of `B2:B100<>""`, or make the source formulas return truly empty values.'
    - error: '#N/A'
      cause: The whole range is empty.
      fix: Wrap the formula in IFNA, e.g. =IFNA(LOOKUP(2, 1/(B2:B100<>""), B2:B100), "No data").
    - error: Slow workbook
      cause: Whole-column references (B:B) in array calculations evaluate a million rows.
      fix: Use a bounded range like B2:B5000, or an Excel Table column reference.
  faq:
    - q: Does this work with text values?
      a: Yes. The LOOKUP(2, 1/(...)) pattern returns the last non-empty value whether it is a number or text.
    - q: How do I get the last value that meets a condition?
      a: Multiply in the condition, e.g. =LOOKUP(2, 1/((B2:B100<>"")*(C2:C100="Paid")), B2:B100).
  related: [xlookup, index-match, lookup-multiple-values, eomonth]

- id: lookup-multiple-values
  category: lookup
  launch: true
  slugs: {excel: lookup-multiple-values-excel, sheets: lookup-multiple-values-google-sheets}
  title: How to Lookup and Return Multiple Values
  summary: >-
    VLOOKUP and XLOOKUP stop at the first match. When a customer has several orders and you
    need all of them, use FILTER to list every match, or TEXTJOIN to put them in one cell. An
    INDEX/SMALL version for older Excel is included.
  problem: >-
    Your order log lists each order with its customer. For a given customer you want every order
    ID, not just the first one VLOOKUP would return.
  excel:
    formula: '=FILTER(A2:A7, B2:B7=E2, "No orders")'
    explain: >-
      FILTER returns every value in A2:A7 where the customer in B2:B7 equals E2, spilling one
      result per row. The third argument is shown when nothing matches.
    notes: >-
      FILTER needs Microsoft 365 or Excel 2021+. For Excel 2019 and older, use the INDEX/SMALL
      formula below in F2, confirm with Ctrl+Shift+Enter in versions before 365, and copy it down
      as many rows as the largest possible number of matches; extra rows show blank. Add SORT
      around FILTER to order the results, e.g. `=SORT(FILTER(A2:C7, B2:B7=E2), 3, -1)` to sort
      by amount, largest first.
    alternatives:
      - label: All matches in one cell
        formula: '=TEXTJOIN(", ", TRUE, FILTER(A2:A7, B2:B7=E2))'
      - label: Older Excel (copy down; array formula)
        formula: '=IFERROR(INDEX($A$2:$A$7, SMALL(IF($B$2:$B$7=$E$2, ROW($B$2:$B$7)-ROW($B$2)+1), ROWS($F$2:F2))), "")'
    diff: >-
      FILTER works the same in Excel 365 and Excel 2021. Older Excel needs the INDEX/SMALL
      array formula instead.
  sheets:
    formula: '=FILTER(A2:A7, B2:B7=E2)'
    explain: >-
      Google Sheets FILTER takes the range and one or more conditions. It has no "if empty"
      argument, so wrap it in IFERROR or IFNA for a custom message.
    notes: >-
      Google Sheets' FILTER does not have Excel's third if_empty argument; when nothing matches
      it returns #N/A with the message "No matches are found in FILTER evaluation". Use
      `=IFNA(FILTER(A2:A7, B2:B7=E2), "No orders")`. QUERY is a powerful alternative in Sheets:
      it can filter, sort and pick columns in one formula using a SQL-like language, which is
      handy when you need several columns of each matching row.
    alternatives:
      - label: Custom message when nothing matches
        formula: '=IFNA(FILTER(A2:A7, B2:B7=E2), "No orders")'
      - label: QUERY version (orders and amounts, largest first)
        formula: '=QUERY(A2:C7, "select A, C where B = ''"&E2&"'' order by C desc", 0)'
    diff: >-
      Google Sheets' FILTER has no if_empty argument, so use IFNA(FILTER(...), "No orders").
  example:
    intro: All orders for the customer in E2.
    grid:
      - [Order ID, Customer, Amount, null, Customer, Orders, All in one cell]
      - [5001, Acme, 250, null, Acme]
      - [5002, Globex, 120]
      - [5003, Acme, 75]
      - [5004, Initech, 300]
      - [5005, Acme, 180]
      - [5006, Globex, 90]
    checks:
      - cell: F2
        label: spills down to F4
        excel: '=FILTER(A2:A7, B2:B7=E2, "No orders")'
        sheets: '=FILTER(A2:A7, B2:B7=E2)'
        spill_cells: [F2, F3, F4]
        spill_results: [5001, 5003, 5005]
      - cell: G2
        label: joined into one cell
        excel: '=TEXTJOIN(", ", TRUE, FILTER(A2:A7, B2:B7=E2))'
        array: true
        result: 5001, 5003, 5005
  steps:
    - '`B2:B7=E2` is evaluated for every row and returns TRUE for the three Acme rows.'
    - FILTER keeps only the rows of A2:A7 where that test is TRUE and spills them downward.
    - TEXTJOIN joins the filtered list with ", " and TRUE skips empty values.
    - The results update automatically when orders are added inside the range; use a bigger range or an Excel Table to include future rows.
  errors:
    - error: '#CALC! (Excel) / #N/A (Google Sheets)'
      cause: No row matched and no if_empty value was given.
      fix: Use FILTER's third argument in Excel, or IFNA in Google Sheets.
    - error: '#SPILL! / #REF!'
      cause: Cells below the formula are not empty, so the list cannot expand.
      fix: Clear the cells below the formula.
    - error: '#VALUE!'
      cause: The condition range has a different size than the range being filtered.
      fix: Make both ranges cover the same rows.
  faq:
    - q: Can VLOOKUP return multiple matches?
      a: No, VLOOKUP returns only the first match. Use FILTER (Excel 365, Google Sheets) or the INDEX/SMALL array formula in older Excel.
    - q: How do I return the matches across columns instead of down?
      a: Wrap the result in TRANSPOSE, e.g. =TRANSPOSE(FILTER(A2:A7, B2:B7=E2)).
  related: [vlookup-multiple-criteria, textjoin, xlookup, count-unique]

- id: hlookup
  category: lookup
  slugs: {excel: hlookup-excel, sheets: hlookup-google-sheets}
  title: How to Use HLOOKUP
  summary: >-
    HLOOKUP finds a value in the top row of a table and returns the value from a row below it.
    It is the horizontal twin of VLOOKUP and is the natural choice when your months, products or
    years run across the columns. Below are the syntax, a worked monthly report with four
    lookups, and fixes for the errors people hit most often.
  problem: >-
    Your monthly report has the months across row 1 and metrics such as Sales, Costs and Units
    down column A. You want to type a month and a metric and get the matching figure, without
    scrolling across the sheet or rebuilding the table vertically.
  excel:
    formula: '=HLOOKUP(A7, $A$1:$E$4, 2, FALSE)'
    explain: >-
      Syntax: `HLOOKUP(lookup_value, table_array, row_index_num, [range_lookup])`. Look for the
      month in A7 in the first row of A1:E4 and return the value from row 2 of that table (Sales).
      `FALSE` means exact match.
    notes: >-
      HLOOKUP only searches the first row of the table and can only return values from rows below
      it. The row number is counted inside the table, not on the sheet, so row 2 of A1:E4 is sheet
      row 2 only because the table starts in row 1. Always pass FALSE (or 0) as the last argument
      unless the first row is sorted ascending and you really want an approximate match; leaving
      it out means TRUE. In Microsoft 365 and Excel 2021, XLOOKUP is the more flexible
      replacement: `=XLOOKUP(A7, $B$1:$E$1, $B$2:$E$2)` does not need a row number and returns
      a clear "not found" value through its fourth argument.
    alternatives:
      - label: XLOOKUP instead of HLOOKUP (Microsoft 365 / Excel 2021)
        formula: '=XLOOKUP(A7, $B$1:$E$1, $B$2:$E$2, "Not found")'
      - label: INDEX and MATCH in both directions
        formula: '=INDEX($A$1:$E$4, MATCH(B7, $A$1:$A$4, 0), MATCH(A7, $A$1:$E$1, 0))'
    diff: >-
      Excel uses the same HLOOKUP syntax. In Microsoft 365, XLOOKUP is the modern replacement and
      returns a whole column at once without any wrapper.
  sheets:
    formula: '=HLOOKUP(A7, $A$1:$E$4, 2, FALSE)'
    explain: >-
      Same syntax in Google Sheets: `HLOOKUP(search_key, range, index, [is_sorted])`. The last
      argument is called is_sorted; FALSE means exact match.
    notes: >-
      Google Sheets names the arguments differently (search_key, index, is_sorted) but they work
      exactly like Excel's. To look up several months in one go, wrap HLOOKUP in ARRAYFORMULA and
      pass a range as the search key: `=ARRAYFORMULA(HLOOKUP(A7:A9, $A$1:$E$4, 2, FALSE))` fills
      three rows from a single cell. You can also return several rows for one month by passing an
      array of row numbers, `=ARRAYFORMULA(HLOOKUP(A7, $A$1:$E$4, {2;3;4}, FALSE))`. XLOOKUP is
      available in Google Sheets too if you prefer not to count rows.
    alternatives:
      - label: Look up several months at once
        formula: '=ARRAYFORMULA(HLOOKUP(A7:A9, $A$1:$E$4, 2, FALSE))'
      - label: Return Sales, Costs and Units for one month
        formula: '=ARRAYFORMULA(HLOOKUP(A7, $A$1:$E$4, {2;3;4}, FALSE))'
    diff: >-
      Google Sheets uses the same HLOOKUP formula. To return results for several lookup values or
      several rows at once, wrap it in ARRAYFORMULA.
  example:
    intro: A monthly report with months across the top. Rows 7 to 10 hold four lookups; May is not in the table.
    grid:
      - [Metric, Jan, Feb, Mar, Apr]
      - [Sales, 1200, 1450, 980, 1610]
      - [Costs, 700, 820, 650, 900]
      - [Units, 48, 58, 39, 64]
      - [null]
      - [Month, Metric, Result]
      - [Mar, Sales]
      - [Feb, Costs]
      - [Apr, Units]
      - [May, Sales]
    checks:
      - cell: C7
        label: Mar sales (row 2 of the table)
        excel: '=HLOOKUP(A7, $A$1:$E$4, 2, FALSE)'
        result: 980
      - cell: C8
        label: Feb costs (row 3 of the table)
        excel: '=HLOOKUP(A8, $A$1:$E$4, 3, FALSE)'
        result: 820
      - cell: C9
        label: row number found with MATCH
        excel: '=HLOOKUP(A9, $A$1:$E$4, MATCH(B9, $A$1:$A$4, 0), FALSE)'
        result: 64
      - cell: C10
        label: month that is not in the table
        excel: '=IFERROR(HLOOKUP(A10, $A$1:$E$4, 2, FALSE), "Not found")'
        result: Not found
  steps:
    - '`A7` is the value to find. HLOOKUP searches for it only in the first row of the table, A1:E1, and finds Mar in column D.'
    - '`$A$1:$E$4` is the whole table, including the header row and every row you may want to return. The dollar signs keep it fixed when you copy the formula down.'
    - '`2` is the row to return, counted from the top of the table: 1 is the month row, 2 is Sales, 3 is Costs, 4 is Units. Mar sales is 980.'
    - '`FALSE` forces an exact match, so "Mar" must appear exactly (case does not matter).'
    - 'Instead of typing the row number, `MATCH(B9, $A$1:$A$4, 0)` finds which row holds "Units" (row 4), so the formula keeps working if you insert a new metric row.'
    - 'Wrapping the formula in IFERROR replaces the #N/A for May with a friendly "Not found".'
  errors:
    - error: '#N/A'
      cause: The lookup value is not in the first row of the table, or it differs slightly (extra space, number stored as text, "March" vs "Mar").
      fix: Check the header with =LEN(D1) or =EXACT(A7, D1), clean the data with TRIM, and wrap the formula in IFERROR for genuinely missing values.
    - error: '#REF!'
      cause: The row index is larger than the number of rows in the table, e.g. 5 for A1:E4.
      fix: Count rows inside the table, or let MATCH calculate the row number.
    - error: Wrong value returned
      cause: The last argument was left out, so HLOOKUP used an approximate match on an unsorted header row.
      fix: Always add FALSE (or 0) as the fourth argument for exact matches.
    - error: Results shift when the formula is copied
      cause: The table range is relative (A1:E4) and moves down as you fill.
      fix: Lock it with dollar signs, $A$1:$E$4, or press F4 on the reference.
  faq:
    - q: What is the difference between HLOOKUP and VLOOKUP?
      a: VLOOKUP searches the first column and returns a value from a column to the right; HLOOKUP searches the first row and returns a value from a row below. Use the one that matches how your headers are laid out.
    - q: Can HLOOKUP return a value from a row above the lookup row?
      a: No, it only looks down. Use INDEX with MATCH, or XLOOKUP, which can return from any row.
    - q: Is HLOOKUP case-sensitive?
      a: No. "mar" and "Mar" match. For a case-sensitive lookup use INDEX and MATCH with EXACT.
    - q: Should I use XLOOKUP instead of HLOOKUP?
      a: If everyone who opens the file has Microsoft 365, Excel 2021 or Google Sheets, XLOOKUP is easier because it does not need a row number and does not break when rows are inserted. HLOOKUP is still the most compatible choice for older Excel versions.
  related: [vlookup, xlookup, index-match, iferror, na-error]

- id: unique
  category: lookup
  slugs: {excel: unique-excel, sheets: unique-google-sheets}
  title: How to Use the UNIQUE Function
  summary: >-
    UNIQUE returns the distinct values or distinct rows of a range as a live, spilling list. This
    guide explains every argument of UNIQUE, shows how to get unique combinations across two
    columns, how to count distinct entries with COUNTA, and how the function differs between
    Excel and Google Sheets.
  problem: >-
    A sales log repeats the same regions and reps on many rows. You want a list of the regions
    that appear, the distinct region and rep pairs for a summary table, and the number of
    different reps, all updating automatically when new sales are entered.
  excel:
    formula: '=UNIQUE(A2:A9)'
    explain: >-
      Syntax: `UNIQUE(array, [by_col], [exactly_once])`. With only the first argument, UNIQUE
      returns each distinct value of A2:A9 once, in the order it first appears, and spills the
      list into the cells below.
    notes: >-
      UNIQUE is available in Microsoft 365 and Excel 2021 or newer. Pass a multi-column range such
      as A2:B9 and UNIQUE compares whole rows, so you get distinct combinations rather than
      distinct single values. Set `by_col` to TRUE when your data runs across a row and you want
      unique columns. Set `exactly_once` to TRUE to keep only values that occur one time. Combine
      it with other dynamic array functions: `=COUNTA(UNIQUE(B2:B9))` counts distinct reps,
      `=SORT(UNIQUE(A2:A9))` sorts the list, and `=UNIQUE(FILTER(B2:B9, A2:A9="East"))` lists the
      reps of one region only. Refer to the whole spilled list elsewhere with the spill operator,
      for example `=E2#` in a data validation list.
    alternatives:
      - label: Distinct region and rep pairs
        formula: '=UNIQUE(A2:B9)'
      - label: Count distinct reps
        formula: '=COUNTA(UNIQUE(B2:B9))'
      - label: Reps of one region only
        formula: '=UNIQUE(FILTER(B2:B9, A2:A9="East"))'
    diff: >-
      Excel has the same UNIQUE function with the same three arguments in Microsoft 365 and Excel
      2021. Excel 2019 and older do not have it, and Excel needs COUNTA(UNIQUE()) because there is
      no COUNTUNIQUE.
  sheets:
    formula: '=UNIQUE(A2:A9)'
    explain: >-
      Google Sheets uses the same syntax, `UNIQUE(range, [by_column], [exactly_once])`, and
      returns distinct values in first-seen order, expanding into the cells below.
    notes: >-
      Google Sheets has had UNIQUE much longer than Excel and it works in every version, so there
      is no compatibility concern. Two Sheets extras save time: open-ended ranges such as A2:A
      include rows you add later, and COUNTUNIQUE counts distinct values directly without wrapping
      UNIQUE in COUNTA. Because an open-ended range also contains empty rows, combine it with
      FILTER to drop blanks. QUERY can return distinct values together with a count per value,
      which UNIQUE alone cannot do. If the result shows #REF! with "Array result was not expanded",
      clear the cells below the formula.
    alternatives:
      - label: Count distinct reps with COUNTUNIQUE
        formula: '=COUNTUNIQUE(B2:B9)'
      - label: Open-ended range without blanks
        formula: '=UNIQUE(FILTER(A2:A, A2:A<>""))'
      - label: Distinct regions with a count of rows each
        formula: '=QUERY(A2:A9, "select A, count(A) where A is not null group by A", 0)'
    diff: >-
      Google Sheets has the same UNIQUE function, plus COUNTUNIQUE for distinct counts and
      open-ended ranges like A2:A that include new rows automatically.
  example:
    intro: Eight sales rows with repeated regions and reps.
    grid:
      - [Region, Rep, Sales, null, Regions, Pair region, Pair rep, Distinct reps]
      - [East, Ana, 120]
      - [West, Ben, 90]
      - [East, Ana, 75]
      - [North, Cara, 200]
      - [West, Dev, 60]
      - [East, Ben, 150]
      - [North, Cara, 80]
      - [West, Ben, 110]
    checks:
      - cell: E2
        label: distinct regions in first-seen order
        excel: '=UNIQUE(A2:A9)'
        array: true
        spill_cells: [E2, E3, E4]
        spill_results: [East, West, North]
      - cell: F2
        label: distinct region and rep combinations (spills into F2:G6)
        excel: '=UNIQUE(A2:B9)'
        array: true
        spill_cells: [F2, G2, F3, G3, F4, G4, F5, G5, F6, G6]
        spill_results: [East, Ana, West, Ben, North, Cara, West, Dev, East, Ben]
      - cell: H2
        label: number of different reps
        excel: '=COUNTA(UNIQUE(B2:B9))'
        array: true
        result: 4
  steps:
    - '`UNIQUE(A2:A9)` reads the region column top to bottom and keeps the first East, the first West and the first North. Later repeats are skipped, so E2:E4 shows East, West, North.'
    - 'Only E2 contains the formula. The other cells are part of the spill range; select E2 and the blue border shows the whole result.'
    - '`UNIQUE(A2:B9)` compares both columns together. East/Ana appears twice and North/Cara twice, and West/Ben twice, so five distinct pairs remain: East/Ana, West/Ben, North/Cara, West/Dev and East/Ben.'
    - 'Ben counts as a separate pair in West and in East because the combination differs, which is exactly what a region-by-rep summary needs.'
    - '`COUNTA(UNIQUE(B2:B9))` first builds the distinct rep list Ana, Ben, Cara, Dev, then COUNTA counts its four items.'
    - 'Add a new sale at the bottom of the source range (or use an Excel Table or open-ended range) and every result updates without any manual step.'
  errors:
    - error: '#SPILL! (Excel) / #REF! (Google Sheets)'
      cause: Cells in the area where the result needs to expand are not empty, or the formula sits inside an Excel Table.
      fix: Clear the cells below and to the right of the formula, or move it outside the table.
    - error: Unexpected blank or 0 in the list
      cause: The range includes empty cells, which UNIQUE returns as one extra value (shown as 0 in Excel).
      fix: Filter blanks first, e.g. =UNIQUE(FILTER(A2:A100, A2:A100<>"")).
    - error: Near-duplicates still listed twice
      cause: Values differ by a trailing space or invisible character, such as "East" and "East ". UNIQUE is not case-sensitive, but it does treat spaces as different text.
      fix: Clean the source with TRIM, or use =UNIQUE(TRIM(A2:A9)) in Excel 365.
    - error: '#NAME?'
      cause: The workbook is opened in Excel 2019 or older, which has no UNIQUE function.
      fix: Use Microsoft 365 / Excel 2021, or Data > Remove Duplicates on a copy for a static list.
  faq:
    - q: Is UNIQUE case-sensitive?
      a: No. "east" and "East" are treated as the same value, and the first spelling found is the one returned.
    - q: How do I get unique values from two columns combined into one list?
      a: In Excel 365 use =UNIQUE(VSTACK(A2:A9, B2:B9)). In Google Sheets use =UNIQUE({A2:A9; B2:B9}).
    - q: What does the exactly_once argument do?
      a: With TRUE as the third argument, UNIQUE returns only values that occur a single time in the range, which is useful for spotting one-off entries.
  related: [remove-duplicates-formula, count-unique, filter, sort, countif]

- id: filter
  category: lookup
  slugs: {excel: filter-excel, sheets: filter-google-sheets}
  title: How to Use the FILTER Function
  summary: >-
    FILTER returns only the rows of a range that meet your conditions and keeps the result live
    as the data changes. This page covers the syntax, AND and OR conditions, returning whole
    rows, a message for no matches, and the important differences between FILTER in Excel and
    Google Sheets.
  problem: >-
    An order list mixes every region and product. You want separate live views: the orders of
    one region, the large orders of that region, orders that match either of two conditions,
    and every order above a threshold with all of its columns, without copying rows by hand or
    re-applying AutoFilter.
  excel:
    formula: '=FILTER(A2:A8, B2:B8=F2, "No match")'
    explain: >-
      Syntax: `FILTER(array, include, [if_empty])`. Return each value of A2:A8 where the region in
      B2:B8 equals F2. The optional third argument is shown when no row qualifies.
  
    notes: >-
      FILTER needs Microsoft 365 or Excel 2021. Excel accepts only one include argument, so you
      combine several conditions with arithmetic: multiply them for AND,
      `(B2:B8=F2)*(D2:D8>=G2)`, and add them for OR, `(B2:B8="West")+(C2:C8="Ink")`. Each
      condition must be wrapped in its own parentheses and cover the same number of rows as the
      array. Pass a multi-column array such as A2:D8 to return complete rows. Without if_empty,
      a filter with no matches returns #CALC!. Wrap the result in SORT to order it, or in
      COUNTA/ROWS to count matches.
    alternatives:
      - label: Two conditions (AND)
        formula: '=FILTER(A2:A8, (B2:B8=F2)*(D2:D8>=G2), "No match")'
      - label: Either condition (OR)
        formula: '=FILTER(A2:A8, (B2:B8="West")+(C2:C8="Ink"), "No match")'
      - label: Filtered rows sorted by amount, largest first
        formula: '=SORT(FILTER(A2:D8, B2:B8=F2), 4, -1)'
    diff: >-
      Excel's FILTER takes a single include argument (combine conditions with * and +) and has a
      built-in if_empty third argument. It is not available in Excel 2019 or older.
  sheets:
    formula: '=FILTER(A2:A8, B2:B8=F2)'
    explain: >-
      Google Sheets syntax is `FILTER(range, condition1, [condition2, ...])`. Each extra condition
      is another argument, and all of them must be true for a row to be kept.
    notes: >-
      Google Sheets' FILTER is different from Excel's in two ways. First, extra arguments are
      additional conditions joined with AND, so `=FILTER(A2:A8, B2:B8=F2, D2:D8>=G2)` keeps East
      orders of at least 200. The Excel style `(cond1)*(cond2)` also works in Sheets, and OR still
      needs `+`. Second, there is no if_empty argument: when nothing matches, Sheets returns #N/A
      ("No matches are found in FILTER evaluation"), so wrap the formula in IFNA or IFERROR to
      show your own message. Open-ended ranges such as A2:A keep the filter current as rows are
      added, and QUERY is a handy alternative when you also want to pick or sort columns.
    alternatives:
      - label: Two conditions as separate arguments (AND)
        formula: '=FILTER(A2:A8, B2:B8=F2, D2:D8>=G2)'
      - label: Custom message when nothing matches
        formula: '=IFNA(FILTER(A2:A8, B2:B8="South"), "No match")'
      - label: QUERY version with chosen columns
        formula: '=QUERY(A2:D8, "select A, D where B = ''East'' and D >= 200", 0)'
    diff: >-
      Google Sheets' FILTER takes each condition as its own argument (AND) and has no if_empty
      argument, so use IFNA(FILTER(...), "No match") for empty results.
  example:
    intro: Seven orders; F2 holds the region and G2 the minimum amount used by the formulas.
    grid:
      - [Order, Region, Product, Amount, null, Region, Min amount, East orders, East >= 200, West or Ink, South orders]
      - [1001, East, Pens, 120, null, East, 200]
      - [1002, West, Paper, 340]
      - [1003, East, Paper, 260]
      - [1004, North, Pens, 90]
      - [1005, East, Ink, 410]
      - [1006, West, Pens, 150]
      - [1007, North, Paper, 300]
      - []
      - [Orders of 300 or more (all columns)]
    checks:
      - cell: H2
        label: orders in the region typed in F2
        excel: '=FILTER(A2:A8, B2:B8=F2, "No match")'
        sheets: '=FILTER(A2:A8, B2:B8=F2)'
        spill_cells: [H2, H3, H4]
        spill_results: [1001, 1003, 1005]
      - cell: I2
        label: region in F2 AND amount at least G2
        excel: '=FILTER(A2:A8, (B2:B8=F2)*(D2:D8>=G2), "No match")'
        sheets: '=FILTER(A2:A8, (B2:B8=F2)*(D2:D8>=G2))'
        spill_cells: [I2, I3]
        spill_results: [1003, 1005]
      - cell: J2
        label: region West OR product Ink
        excel: '=FILTER(A2:A8, (B2:B8="West")+(C2:C8="Ink"), "No match")'
        sheets: '=FILTER(A2:A8, (B2:B8="West")+(C2:C8="Ink"))'
        spill_cells: [J2, J3, J4]
        spill_results: [1002, 1005, 1006]
      - cell: K2
        label: no South orders, so the fallback text appears
        excel: '=FILTER(A2:A8, B2:B8="South", "No match")'
        sheets: '=IFERROR(FILTER(A2:A8, B2:B8="South"), "No match")'
        array: true
        result: No match
      - cell: A11
        label: whole rows with Amount of 300 or more (spills into A11:D13)
        excel: '=FILTER(A2:D8, D2:D8>=300)'
        spill_cells: [A11, B11, C11, D11, A12, B12, C12, D12, A13, B13, C13, D13]
        spill_results: [1002, West, Paper, 340, 1005, East, Ink, 410, 1007, North, Paper, 300]
  steps:
    - '`B2:B8=F2` is tested on every row and produces TRUE for the three East orders, so H2 spills 1001, 1003 and 1005.'
    - 'For AND, `(B2:B8=F2)*(D2:D8>=G2)` multiplies the two TRUE/FALSE arrays. A row gives 1 only when both are TRUE: 1003 (260) and 1005 (410). Order 1001 is East but only 120, so it drops out.'
    - 'For OR, `(B2:B8="West")+(C2:C8="Ink")` adds the arrays. Any row with a total of 1 or more is kept: 1002 and 1006 (West) and 1005 (Ink).'
    - 'No order is in South, so the include array is all FALSE. Excel shows the if_empty text "No match"; in Google Sheets IFERROR supplies the same message.'
    - '`FILTER(A2:D8, D2:D8>=300)` passes four columns as the array, so each qualifying order comes back as a full row: 1002, 1005 and 1007 fill A11:D13.'
    - 'Change F2 to West or G2 to 100 and every result recalculates immediately, which is the main advantage over AutoFilter.'
  errors:
    - error: '#CALC! (Excel) / #N/A (Google Sheets)'
      cause: No row meets the conditions and no fallback was given.
      fix: Add the if_empty argument in Excel, or wrap the formula in IFNA/IFERROR in Google Sheets.
    - error: '#VALUE!'
      cause: The include range has a different number of rows than the array, e.g. A2:A8 with B2:B9.
      fix: Make every condition cover exactly the same rows as the array.
    - error: '#SPILL! (Excel) / #REF! (Google Sheets)'
      cause: Cells where the results need to go are not empty.
      fix: Clear the cells below and to the right of the formula.
    - error: AND/OR returns the wrong rows
      cause: Conditions were joined with the AND() or OR() functions, which return one single value instead of one result per row.
      fix: Use (cond1)*(cond2) for AND and (cond1)+(cond2) for OR, each in parentheses.
  faq:
    - q: Can FILTER return only some columns?
      a: Yes. Filter just the columns you need, e.g. =FILTER(A2:A8, ...) for one column. In Excel 365 you can also wrap the result in CHOOSECOLS, and in Google Sheets QUERY lets you pick columns by letter.
    - q: Is FILTER case-sensitive?
      a: No. B2:B8="east" matches East. For a case-sensitive test use EXACT, e.g. =FILTER(A2:A8, EXACT(B2:B8, "East")).
    - q: How do I filter values that contain a word?
      a: Use ISNUMBER(SEARCH("pen", C2:C8)) as the condition, which keeps every row whose product contains "pen".
  related: [lookup-multiple-values, unique, sort, vlookup-multiple-criteria, contains-text]

- id: sort
  category: lookup
  slugs: {excel: sort-excel, sheets: sort-google-sheets}
  title: How to Use the SORT Function
  summary: >-
    SORT returns a sorted copy of a range that updates whenever the source changes, so the
    original data never has to be rearranged. This guide shows sorting one column, sorting a
    table by any column in descending order, multi-level sorting, and how the arguments differ
    between Excel and Google Sheets.
  problem: >-
    A score sheet is kept in the order people were added. You want an alphabetical name list,
    a leaderboard sorted by score from highest to lowest, and a view grouped by department with
    the best score first in each group, all without using Data > Sort, which would reorder the
    source rows every time.
  excel:
    formula: '=SORT(A2:C7, 3, -1)'
    explain: >-
      Syntax: `SORT(array, [sort_index], [sort_order], [by_col])`. Sort the table A2:C7 by its
      third column (Score); -1 means descending. The result spills into as many rows and columns
      as the source.
  
    notes: >-
      SORT is available in Microsoft 365 and Excel 2021. Leave out sort_index and sort_order to
      sort by the first column in ascending order. sort_order is 1 for ascending and -1 for
      descending; other values return #VALUE!. For a multi-level sort pass array constants:
      `=SORT(A2:C7, {2,3}, {1,-1})` sorts by Dept A to Z, then by Score high to low. Set the
      fourth argument to TRUE to sort columns left to right instead of rows. When the sort key is
      not part of the result, use SORTBY, e.g. `=SORTBY(A2:A7, C2:C7, -1)` returns only names in
      score order.
    alternatives:
      - label: Multi-level sort (Dept, then Score descending)
        formula: '=SORT(A2:C7, {2,3}, {1,-1})'
      - label: Names only, ordered by score
        formula: '=SORTBY(A2:A7, C2:C7, -1)'
      - label: Top 3 scores (Microsoft 365)
        formula: '=TAKE(SORT(A2:C7, 3, -1), 3)'
    diff: >-
      Excel's SORT uses 1 / -1 for the order and array constants such as {2,3} for multi-level
      sorts. It is not available in Excel 2019 or older.
  sheets:
    formula: '=SORT(A2:C7, 3, FALSE)'
    explain: >-
      Google Sheets syntax is `SORT(range, sort_column, is_ascending, [sort_column2,
      is_ascending2, ...])`. Sort by column 3; FALSE means descending.
    notes: >-
      Google Sheets' SORT uses TRUE/FALSE instead of 1/-1 for the order, and it handles multiple
      sort levels with extra pairs of arguments instead of array constants:
      `=SORT(A2:C7, 2, TRUE, 3, FALSE)` sorts by Dept A to Z, then Score high to low. Do not copy
      the Excel form `=SORT(A2:C7, 3, -1)`: Sheets reads -1 as TRUE and sorts ascending. The
      sort column can also be a range outside the result, such as `=SORT(A2:A7, C2:C7, FALSE)`,
      which returns names in score order, so Sheets needs no SORTBY. For a top-N list combine
      SORT with ARRAY_CONSTRAIN, or use SORTN.
    alternatives:
      - label: Multi-level sort with argument pairs
        formula: '=SORT(A2:C7, 2, TRUE, 3, FALSE)'
      - label: Names only, ordered by score
        formula: '=SORT(A2:A7, C2:C7, FALSE)'
      - label: Top 3 scores with SORTN
        formula: '=SORTN(A2:C7, 3, 0, 3, FALSE)'
    diff: >-
      Google Sheets' SORT uses TRUE/FALSE for the order and extra column/order pairs for
      multi-level sorts; it can sort by an outside range, so SORTBY is not needed.
  example:
    intro: Six people with department and score; the source rows stay in their original order.
    grid:
      - [Name, Dept, Score, null, A to Z, null, Name, Dept, Score]
      - [Mia, Sales, 82]
      - [Leo, Ops, 95]
      - [Zoe, Sales, 77]
      - [Ivan, Ops, 88]
      - [Ana, HR, 91]
      - [Raj, HR, 70]
      - []
      - ['By Dept A to Z, then Score high to low']
    checks:
      - cell: E2
        label: names sorted alphabetically
        excel: '=SORT(A2:A7)'
        spill_cells: [E2, E3, E4, E5, E6, E7]
        spill_results: [Ana, Ivan, Leo, Mia, Raj, Zoe]
      - cell: G2
        label: leaderboard by score, highest first (spills into G2:I7)
        excel: '=SORT(A2:C7, 3, -1)'
        sheets: '=SORT(A2:C7, 3, FALSE)'
        sheets_verify: false
        why_unverified: Google Sheets TRUE/FALSE sort-order syntax; LibreOffice follows Excel (1/-1), and the Excel form of this check is verified
        spill_cells: [G2, H2, I2, G3, H3, I3, G4, H4, I4, G5, H5, I5, G6, H6, I6, G7, H7, I7]
        spill_results: [Leo, Ops, 95, Ana, HR, 91, Ivan, Ops, 88, Mia, Sales, 82, Zoe, Sales, 77, Raj, HR, 70]
      - cell: A10
        label: two sort levels (spills into A10:C15)
        excel: '=SORT(A2:C7, {2,3}, {1,-1})'
        sheets: '=SORT(A2:C7, 2, TRUE, 3, FALSE)'
        sheets_verify: false
        why_unverified: Google Sheets TRUE/FALSE sort-order syntax; LibreOffice follows Excel (1/-1), and the Excel form of this check is verified
        spill_cells: [A10, B10, C10, A11, B11, C11, A12, B12, C12, A13, B13, C13, A14, B14, C14, A15, B15, C15]
        spill_results: [Ana, HR, 91, Raj, HR, 70, Leo, Ops, 95, Ivan, Ops, 88, Mia, Sales, 82, Zoe, Sales, 77]
  steps:
    - '`SORT(A2:A7)` with no other arguments sorts the single name column A to Z: Ana, Ivan, Leo, Mia, Raj, Zoe.'
    - '`SORT(A2:C7, 3, -1)` keeps each row together and orders the rows by the third column of the range, Score, from 95 down to 70. In Google Sheets the same sort is written with FALSE.'
    - 'The sort index counts columns inside the range, not sheet columns. Column 3 of A2:C7 is C; if the range started at B, index 3 would be D.'
    - 'For two levels, Excel takes `{2,3}` and `{1,-1}`: first Dept ascending (HR, Ops, Sales), then Score descending within each department. Google Sheets lists the pairs one after another: 2, TRUE, 3, FALSE.'
    - 'Within HR, Ana (91) comes before Raj (70); within Ops, Leo (95) before Ivan (88); within Sales, Mia (82) before Zoe (77).'
    - 'The source table A2:C7 is never changed. Edit a score and all three sorted views reorder instantly.'
  errors:
    - error: '#VALUE!'
      cause: In Excel, sort_order is something other than 1 or -1, or sort_index is larger than the number of columns in the array.
      fix: Use 1 or -1 for the order and a column number within the range.
    - error: Sorted ascending instead of descending (Google Sheets)
      cause: The Excel form -1 was used. Sheets treats any non-zero number as TRUE, which means ascending.
      fix: Use FALSE (or 0) for descending in Google Sheets.
    - error: '#SPILL! (Excel) / #REF! (Google Sheets)'
      cause: The cells the sorted result needs are not empty.
      fix: Clear the area below and to the right of the formula.
    - error: Numbers sort in the wrong order
      cause: Some values are stored as text, so 100 sorts before 20.
      fix: Convert the text to numbers, e.g. with VALUE or Data > Text to Columns.
  faq:
    - q: How do I sort and remove duplicates at the same time?
      a: Wrap UNIQUE in SORT, e.g. =SORT(UNIQUE(A2:A7)). This works the same way in Excel 365 and Google Sheets.
    - q: Can SORT sort by a column that is not in the result?
      a: Not in Excel; use SORTBY, e.g. =SORTBY(A2:A7, C2:C7, -1). Google Sheets' SORT can, e.g. =SORT(A2:A7, C2:C7, FALSE).
    - q: Does SORT change my original data?
      a: No. It returns a sorted copy in a new place. Use Data > Sort only when you want to rearrange the source rows permanently.
  related: [unique, filter, remove-duplicates-formula, xlookup]

- id: sortby
  category: lookup
  slugs: {excel: sortby-excel}
  title: How to Use the SORTBY Function
  summary: >-
    SORTBY returns a sorted copy of a range, ordered by one or more other ranges that do not have
    to appear in the result. This guide shows how to list names by a sales column you do not want
    to display, how to sort by two keys, how to apply a custom order such as West, East, North,
    and what to use in Google Sheets, which has no SORTBY function.
  problem: >-
    A small sales table holds each rep's name, region, sales and units. Your manager wants a
    plain list of names ranked by sales, without the numbers next to them. You also need a list
    ranked by units with sales as the tie-breaker, and a report grouped by region in a fixed
    business order rather than alphabetically. SORT can only sort by a column that is part of
    its own result, so it cannot do the first and last jobs cleanly. SORTBY can.
  excel:
    formula: '=SORTBY(A2:A7, C2:C7, -1)'
    explain: >-
      Syntax: `SORTBY(array, by_array1, [sort_order1], [by_array2, sort_order2], ...)`. Return
      the names in A2:A7, ordered by the sales figures in C2:C7; -1 means largest first. The
      sales column is used as the key but is not part of the output.
    notes: >-
      SORTBY is available in Microsoft 365 and Excel 2021 or later. Each by_array must be a
      single row or single column with the same number of rows as the array, otherwise the
      result is #VALUE!. Sort orders are 1 (ascending, the default) and -1 (descending). Add
      more key and order pairs for tie-breakers; Excel applies them left to right. The sort is
      stable, so rows with equal keys keep their original order. The key can also be a
      calculated array, which is how you build a custom sort order with MATCH or sort by text
      length with LEN.
    alternatives:
      - label: Units high to low, then sales high to low
        formula: '=SORTBY(A2:A7, D2:D7, -1, C2:C7, -1)'
      - label: Whole table by region A to Z, then sales high to low
        formula: '=SORTBY(A2:C7, B2:B7, 1, C2:C7, -1)'
      - label: Custom region order (West, East, North)
        formula: '=SORTBY(A2:A7, MATCH(B2:B7, {"West","East","North"}, 0), 1)'
      - label: Shortest names first
        formula: '=SORTBY(A2:A7, LEN(A2:A7), 1)'
    diff: >-
      Excel needs SORTBY whenever the sort key is not inside the returned range. In older Excel
      versions without dynamic arrays there is no SORTBY; use Data > Sort or a helper column with
      RANK and INDEX/MATCH instead.
  sheets:
    formula: '=SORT(A2:A7, C2:C7, FALSE)'
    explain: >-
      Google Sheets has no SORTBY. Its SORT function accepts a range outside the result as the
      sort column, so `SORT(A2:A7, C2:C7, FALSE)` returns the names ordered by sales, largest
      first.
    notes: >-
      In Google Sheets each sort key is written as a pair: a column (a number inside the range or
      a separate range of the same height) followed by TRUE for ascending or FALSE for
      descending. Add more pairs for tie-breakers, for example `=SORT(A2:A7, D2:D7, FALSE,
      C2:C7, FALSE)`. A custom order works the same way with MATCH as the key range, wrapped in
      ARRAYFORMULA if needed.
    alternatives:
      - label: Two keys (units, then sales)
        formula: '=SORT(A2:A7, D2:D7, FALSE, C2:C7, FALSE)'
      - label: Custom region order
        formula: '=SORT(A2:A7, MATCH(B2:B7, {"West";"East";"North"}, 0), TRUE)'
    diff: >-
      Google Sheets uses SORT with an outside range instead of SORTBY, and TRUE/FALSE instead of
      1/-1 for the order.
  example:
    intro: Six sales reps with region, sales and units sold. The source rows stay in their original order.
    grid:
      - [Name, Region, Sales, Units, null, By sales, By units, Name, Region, null, null, Custom order]
      - [Mia, East, 820, 14]
      - [Leo, West, 950, 9]
      - [Zoe, East, 770, 21]
      - [Ivan, North, 880, 12]
      - [Ana, West, 910, 17]
      - [Raj, North, 700, 9]
    checks:
      - cell: F2
        label: names ordered by sales, highest first
        excel: '=SORTBY(A2:A7, C2:C7, -1)'
        sheets: '=SORT(A2:A7, C2:C7, FALSE)'
        sheets_verify: false
        why_unverified: Google Sheets SORT with an outside range and TRUE/FALSE order; LibreOffice follows Excel, and the Excel form of this check is verified
        spill_cells: [F2, F3, F4, F5, F6, F7]
        spill_results: [Leo, Ana, Ivan, Mia, Zoe, Raj]
      - cell: G2
        label: names by units (high to low), ties broken by sales
        excel: '=SORTBY(A2:A7, D2:D7, -1, C2:C7, -1)'
        sheets: '=SORT(A2:A7, D2:D7, FALSE, C2:C7, FALSE)'
        sheets_verify: false
        why_unverified: Google Sheets SORT with outside ranges and TRUE/FALSE order; the Excel form of this check is verified
        spill_cells: [G2, G3, G4, G5, G6, G7]
        spill_results: [Zoe, Ana, Mia, Ivan, Leo, Raj]
      - cell: H2
        label: name and region, regions A to Z, sales high to low inside each region
        excel: '=SORTBY(A2:B7, B2:B7, 1, C2:C7, -1)'
        sheets: '=SORT(A2:B7, B2:B7, TRUE, C2:C7, FALSE)'
        sheets_verify: false
        why_unverified: Google Sheets SORT with outside ranges and TRUE/FALSE order; the Excel form of this check is verified
        spill_cells: [H2, I2, H3, I3, H4, I4, H5, I5, H6, I6, H7, I7]
        spill_results: [Mia, East, Zoe, East, Ivan, North, Raj, North, Leo, West, Ana, West]
      - cell: L2
        label: names in a custom region order (West, East, North)
        excel: '=SORTBY(A2:A7, MATCH(B2:B7, {"West","East","North"}, 0), 1)'
        spill_cells: [L2, L3, L4, L5, L6, L7]
        spill_results: [Leo, Ana, Mia, Zoe, Ivan, Raj]
  steps:
    - '`SORTBY(A2:A7, C2:C7, -1)` takes the names as the array and the sales column as the key. Sales from highest to lowest are 950, 910, 880, 820, 770 and 700, so the names come back as Leo, Ana, Ivan, Mia, Zoe, Raj. The sales numbers themselves are not shown.'
    - 'For two keys add a second pair. `SORTBY(A2:A7, D2:D7, -1, C2:C7, -1)` sorts by units first: Zoe 21, Ana 17, Mia 14, Ivan 12. Leo and Raj both sold 9 units, so the second key, sales, decides: Leo (950) comes before Raj (700).'
    - 'The array can have several columns. In H2 the formula returns name and region side by side, ordered by region A to Z and, inside each region, by sales from high to low: East (Mia, Zoe), North (Ivan, Raj), West (Leo, Ana).'
    - 'For an order that is neither alphabetical nor numeric, turn each value into a position with MATCH. `MATCH(B2:B7, {"West","East","North"}, 0)` gives West 1, East 2 and North 3, and SORTBY sorts by those numbers ascending.'
    - 'Every by_array must be exactly as tall as the array (here 6 rows). The source table is never changed, so when a figure changes all four lists reorder immediately.'
  errors:
    - error: '#VALUE!'
      cause: A by_array has a different number of rows than the array, or it is more than one column wide.
      fix: Make every key range the same height as the array, e.g. A2:A7 with C2:C7, and use one column per key.
    - error: '#NAME?'
      cause: The workbook is opened in Excel 2019 or older, which has no SORTBY, or the function is used in Google Sheets.
      fix: Use Microsoft 365 or Excel 2021+. In Google Sheets use SORT with an outside range, e.g. =SORT(A2:A7, C2:C7, FALSE).
    - error: '#SPILL!'
      cause: Cells in the area the result needs already contain data.
      fix: Clear the cells below (and to the right of) the formula.
    - error: '#N/A rows at the top or bottom of a custom order'
      cause: A value in the key range is missing from the MATCH list, so MATCH returns #N/A for that row.
      fix: Add the missing value to the list, or wrap MATCH in IFERROR with a large number to push unknown values to the end.
  faq:
    - q: What is the difference between SORT and SORTBY in Excel?
      a: SORT sorts by a column index inside its own result, e.g. =SORT(A2:C7, 3, -1). SORTBY sorts by separate ranges, so the key does not have to be returned. Use SORTBY to show names only, to sort by a calculated key, or to apply a custom order.
    - q: Is there a SORTBY function in Google Sheets?
      a: No. Google Sheets' SORT already accepts outside ranges as sort columns, so =SORT(A2:A7, C2:C7, FALSE) does the same job as =SORTBY(A2:A7, C2:C7, -1).
    - q: How do I get only the top 3 with SORTBY?
      a: In Microsoft 365 wrap it in TAKE, e.g. =TAKE(SORTBY(A2:A7, C2:C7, -1), 3). In Excel 2021, use =INDEX(SORTBY(A2:A7, C2:C7, -1), SEQUENCE(3)).
  related: [sort, filter, unique, sequence, xlookup]

- id: sequence
  category: lookup
  slugs: {excel: sequence-excel, sheets: sequence-google-sheets}
  title: How to Use the SEQUENCE Function
  summary: >-
    SEQUENCE generates a list or grid of numbers with one formula: row numbers, steps of 10, a
    numbered grid, or a series of dates. This guide covers the four arguments, numbering a list
    that grows, step and start values, two-dimensional grids, and how Excel and Google Sheets
    differ.
  problem: >-
    You keep a task list and want a number column next to it that stays correct when tasks are
    added, without dragging the fill handle every time. You also need a column of round numbers
    (10, 20, 30...), a small numbered grid for a seating plan, and a quick way to add up a
    series without typing it out. SEQUENCE does all of these from one cell.
  excel:
    formula: '=SEQUENCE(COUNTA(A2:A6))'
    explain: >-
      Syntax: `SEQUENCE(rows, [columns], [start], [step])`. COUNTA counts the 5 tasks, so
      SEQUENCE spills 1 to 5 down the column. Columns, start and step all default to 1.
    notes: >-
      SEQUENCE needs Microsoft 365 or Excel 2021 or later. The result spills, so the cells it
      needs must be empty or you get #SPILL!. To keep numbering a list that grows, point COUNTA
      at a whole column (minus the header) or at an Excel Table column, e.g.
      `=SEQUENCE(COUNTA(Tasks[Task]))`. Combine SEQUENCE with dates by adding it to a start date:
      `=DATE(2026,11,2)+SEQUENCE(5,1,0,7)` gives five Mondays a week apart (format the cells as
      dates). SEQUENCE also works inside other functions, for example `=INDEX(list, SEQUENCE(3))`
      returns the first three items.
    alternatives:
      - label: 10, 20, 30, 40, 50 (start 10, step 10)
        formula: '=SEQUENCE(5, 1, 10, 10)'
      - label: Grid of 2 rows by 3 columns
        formula: '=SEQUENCE(2, 3)'
      - label: Five dates one week apart
        formula: '=DATE(2026,11,2)+SEQUENCE(5,1,0,7)'
      - label: Number a list with room to grow
        formula: '=SEQUENCE(COUNTA(A2:A1000))'
    diff: >-
      Excel spills the result and shows #SPILL! when the target cells are not empty. It is not
      available in Excel 2019 or older, where the usual workaround is =ROW()-1 filled down.
  sheets:
    formula: '=SEQUENCE(COUNTA(A2:A))'
    explain: >-
      Same arguments in Google Sheets: `SEQUENCE(rows, [columns], [start], [step])`. The
      open-ended range A2:A counts every task in the column, so the numbering grows as you add
      rows.
    notes: >-
      Google Sheets supports SEQUENCE in every version and accepts open-ended ranges such as
      A2:A, which makes self-extending numbering very easy. If the result would overwrite data,
      Sheets shows #REF! ("Array result was not expanded") instead of #SPILL!. Before SEQUENCE
      existed, the common Sheets pattern was `=ARRAYFORMULA(ROW(A2:A6)-1)`, which you will still
      see in older templates. To number only rows that are filled in a column with gaps, use
      `=ARRAYFORMULA(IF(A2:A="", "", COUNTIFS(A2:A, "<>", ROW(A2:A), "<="&ROW(A2:A))))`.
    alternatives:
      - label: Older ARRAYFORMULA pattern
        formula: '=ARRAYFORMULA(ROW(A2:A6)-1)'
      - label: Five dates one week apart
        formula: '=ARRAYFORMULA(DATE(2026,11,2)+SEQUENCE(5,1,0,7))'
      - label: Number only filled rows (gaps allowed)
        formula: '=ARRAYFORMULA(IF(A2:A="", "", COUNTIFS(A2:A, "<>", ROW(A2:A), "<="&ROW(A2:A))))'
    diff: >-
      Google Sheets has the same SEQUENCE arguments, accepts open-ended ranges such as A2:A, and
      reports blocked output as #REF! rather than #SPILL!.
  example:
    intro: A five-task list in column A. Each formula is typed once in row 2 and spills.
    grid:
      - [Task, No., null, Step 10, null, Grid, null, null, null, Sum 1..10]
      - [Write]
      - [Review]
      - [Test]
      - [Ship]
      - [Docs]
    checks:
      - cell: B2
        label: number the tasks 1 to 5
        excel: '=SEQUENCE(COUNTA(A2:A6))'
        spill_cells: [B2, B3, B4, B5, B6]
        spill_results: [1, 2, 3, 4, 5]
      - cell: D2
        label: start at 10, step by 10
        excel: '=SEQUENCE(5, 1, 10, 10)'
        spill_cells: [D2, D3, D4, D5, D6]
        spill_results: [10, 20, 30, 40, 50]
      - cell: F2
        label: a 2-row by 3-column grid (fills across, then down)
        excel: '=SEQUENCE(2, 3)'
        spill_cells: [F2, G2, H2, F3, G3, H3]
        spill_results: [1, 2, 3, 4, 5, 6]
      - cell: J2
        label: add up 1 to 10 without typing the numbers
        excel: '=SUM(SEQUENCE(10))'
        result: 55
  steps:
    - '`COUNTA(A2:A6)` counts the non-empty task cells, which is 5. `SEQUENCE(5)` then returns 1, 2, 3, 4, 5 into B2:B6.'
    - 'The third and fourth arguments set the first value and the step. `SEQUENCE(5, 1, 10, 10)` returns 5 rows and 1 column starting at 10 and adding 10 each time: 10, 20, 30, 40, 50.'
    - 'With two dimensions SEQUENCE fills across the row first and then moves down. `SEQUENCE(2, 3)` puts 1, 2, 3 in F2:H2 and 4, 5, 6 in F3:H3.'
    - 'SEQUENCE can feed other functions without spilling at all. `SUM(SEQUENCE(10))` adds 1 to 10 and returns 55 in a single cell.'
    - 'Add a task in A7 and widen the COUNTA range (or use A2:A in Google Sheets): the numbering updates by itself, with no fill handle.'
  errors:
    - error: '#SPILL! (Excel) / #REF! (Google Sheets)'
      cause: Something is already typed in the cells the sequence needs.
      fix: Clear the cells below or to the right of the formula, or move the formula.
    - error: '#VALUE!'
      cause: rows or columns is 0, negative or text, for example when COUNTA counts an empty range.
      fix: Make sure the count is at least 1, e.g. =IF(COUNTA(A2:A6)=0, "", SEQUENCE(COUNTA(A2:A6))).
    - error: '#NAME?'
      cause: The file is opened in Excel 2019 or older, which has no SEQUENCE.
      fix: Use =ROW()-1 filled down, or open the file in Microsoft 365, Excel 2021+ or Google Sheets.
    - error: Numbering counts too many rows
      cause: In Google Sheets, A2:A also counts cells that only contain spaces or formulas returning "".
      fix: Count real values only, e.g. =SEQUENCE(COUNTIF(A2:A, "?*")) for text entries.
  faq:
    - q: How do I make a list of dates with SEQUENCE?
      a: Add SEQUENCE to a start date, e.g. =DATE(2026,11,2)+SEQUENCE(7,1,0,1) for seven consecutive days, or use step 7 for weekly dates. Format the cells as dates. In Google Sheets wrap it in ARRAYFORMULA if it does not spill.
    - q: Can SEQUENCE count down?
      a: Yes, use a negative step. =SEQUENCE(5, 1, 5, -1) returns 5, 4, 3, 2, 1 in both Excel and Google Sheets.
    - q: What is the difference between SEQUENCE and ROW?
      a: ROW returns the row number of a cell, so =ROW()-1 must be filled down and breaks when rows move. SEQUENCE builds the whole list from one cell and can set any start, step and number of columns.
  related: [sortby, sort, unique, filter, transpose]

- id: transpose
  category: lookup
  slugs: {excel: transpose-excel, sheets: transpose-google-sheets}
  title: How to Use the TRANSPOSE Formula
  summary: >-
    TRANSPOSE flips a range so rows become columns and columns become rows, and the result stays
    linked to the source. This guide shows the formula in Microsoft 365 and older Excel, how it
    works in Google Sheets, how to transpose only part of a table, and when Paste Special is the
    better choice.
  problem: >-
    Your monthly report has months down the rows and measures (Sales, Cost) across the columns,
    but the dashboard needs the months across the top. Copying and pasting with Paste Special >
    Transpose works once, but it does not update when the numbers change. You want a flipped copy
    that always matches the source table.
  excel:
    formula: '=TRANSPOSE(A1:C4)'
    explain: >-
      Syntax: `TRANSPOSE(array)`. A1:C4 is 4 rows by 3 columns, so the result is 3 rows by 4
      columns. In Microsoft 365 and Excel 2021 it spills automatically from the cell you type it
      in.
    notes: >-
      In Excel 2019 and older, TRANSPOSE is an array formula: first select a range of the
      flipped size (here 3 rows by 4 columns), type `=TRANSPOSE(A1:C4)` and press
      Ctrl+Shift+Enter. If you only press Enter you get just the first value or #VALUE!. Empty
      source cells show as 0 in the result; use `=TRANSPOSE(IF(A1:C4="", "", A1:C4))` to keep
      them blank. Formatting is not copied, so format dates and currency in the result range.
      For a static copy without formulas, use Copy and then Paste Special > Transpose.
    alternatives:
      - label: Keep blank cells blank
        formula: '=TRANSPOSE(IF(A1:C4="", "", A1:C4))'
      - label: Transpose only the months that sold over 100
        formula: '=TRANSPOSE(FILTER(A2:A4, B2:B4>100))'
      - label: Single row from a column (Microsoft 365)
        formula: '=TOROW(A2:A4)'
    diff: >-
      Microsoft 365 spills TRANSPOSE automatically; Excel 2019 and older need a pre-selected
      range and Ctrl+Shift+Enter.
  sheets:
    formula: '=TRANSPOSE(A1:C4)'
    explain: >-
      Google Sheets uses the same `TRANSPOSE(range)` and expands the result automatically from
      the cell you type it in; no special keys are needed.
    notes: >-
      Google Sheets has always expanded TRANSPOSE without Ctrl+Shift+Enter. If cells in the
      target area are not empty, it shows #REF! ("Array result was not expanded because it would
      overwrite data"). Empty source cells stay empty instead of turning into 0. TRANSPOSE is
      often combined with Sheets-only functions: `=TRANSPOSE(SPLIT("Jan,Feb,Mar", ","))` turns a
      comma list into a column, and `=TRANSPOSE(UNIQUE(A2:A))` turns a column of names into a
      header row. To link a transposed range from another file, wrap IMPORTRANGE in TRANSPOSE.
    alternatives:
      - label: Comma list into a column
        formula: '=TRANSPOSE(SPLIT("Jan,Feb,Mar", ","))'
      - label: Unique names as a header row
        formula: '=TRANSPOSE(UNIQUE(A2:A))'
      - label: Transpose a filtered list
        formula: '=TRANSPOSE(FILTER(A2:A4, B2:B4>100))'
    diff: >-
      Google Sheets expands TRANSPOSE automatically in every version and leaves empty source
      cells blank; overlapping data gives #REF! rather than #SPILL!.
  example:
    intro: A 4-row by 3-column report (A1:C4). The formula in E1 returns it flipped to 3 rows by 4 columns.
    grid:
      - [Month, Sales, Cost]
      - [Jan, 120, 80]
      - [Feb, 150, 95]
      - [Mar, 90, 70]
      - []
      - [null, null, null, null, Months over 100]
    checks:
      - cell: E1
        label: whole table flipped (fills E1:H3)
        excel: '=TRANSPOSE(A1:C4)'
        spill_cells: [E1, F1, G1, H1, E2, F2, G2, H2, E3, F3, G3, H3]
        spill_results: [Month, Jan, Feb, Mar, Sales, 120, 150, 90, Cost, 80, 95, 70]
      - cell: F6
        label: only the months with sales over 100, as a row
        excel: '=TRANSPOSE(FILTER(A2:A4, B2:B4>100))'
        spill_cells: [F6, G6]
        spill_results: [Jan, Feb]
      - cell: E8
        label: total sales from the transposed row
        excel: '=SUM(F2:H2)'
        result: 360
  steps:
    - 'Count the source size first: A1:C4 is 4 rows by 3 columns, so the transposed result needs 3 rows by 4 columns (E1:H3).'
    - 'Type `=TRANSPOSE(A1:C4)` in E1. In Microsoft 365, Excel 2021 and Google Sheets it fills E1:H3 on its own. In Excel 2019 or older, select E1:H3 first, type the formula and press Ctrl+Shift+Enter.'
    - 'Row 1 of the source (Month, Sales, Cost) becomes column E, and column A (Month, Jan, Feb, Mar) becomes row 1: Month, Jan, Feb, Mar.'
    - 'The result is linked. Change Feb sales in B3 from 150 to 160 and G2 updates; `=SUM(F2:H2)` in E8 then changes from 360 to 370.'
    - 'To flip only part of the data, filter first: `TRANSPOSE(FILTER(A2:A4, B2:B4>100))` keeps Jan (120) and Feb (150) and returns them across F6:G6.'
  errors:
    - error: '#SPILL! (Excel) / #REF! (Google Sheets)'
      cause: The cells the flipped range needs already contain values.
      fix: Clear the area to the right of and below the formula cell.
    - error: '#VALUE! or only one value appears (Excel 2019 and older)'
      cause: The formula was confirmed with Enter instead of entered as an array formula.
      fix: Select the full output range, type the formula and press Ctrl+Shift+Enter.
    - error: Blank cells show 0
      cause: In Excel TRANSPOSE returns 0 for empty source cells.
      fix: Use =TRANSPOSE(IF(A1:C4="", "", A1:C4)).
    - error: Dates show as numbers
      cause: TRANSPOSE copies values, not number formats.
      fix: Apply a date format to the result range.
  faq:
    - q: How do I transpose without a formula?
      a: Copy the range, right-click the destination and choose Paste Special > Transpose (Excel) or Paste special > Transposed (Google Sheets). The result is static and will not update.
    - q: Can I edit one cell of a TRANSPOSE result?
      a: No. The output belongs to one formula, so editing a single cell gives an error or breaks the spill. Edit the source range instead, or convert the result to values first.
    - q: Does TRANSPOSE work with another sheet?
      a: Yes, e.g. =TRANSPOSE(Report!A1:C4). In Google Sheets you can also transpose data from another file with =TRANSPOSE(IMPORTRANGE(url, "Report!A1:C4")).
  related: [sequence, sortby, filter, unique, sort]
