# Excel & Google Sheets formula help site (structured / programmatic SEO niche)
name: "Sheets Formulas"
category_slug: "formulas"

# Structured content: one YAML entry per formula topic, rendered per platform.
# All files in pages/ are loaded (lookup.yaml, conditional.yaml, ...). Schema: README.md here.
pages_dir: "pages"

# Keyword queue: ordered list of target keywords + URL slugs (see scripts/kwqueue.py).
# Seeded from keywords_300.csv. Add more with:
#   python scripts/kwqueue.py ingest my_keywords.txt      (one keyword per line)
queue_file: "queue.csv"

# Quality gate: a page is only published when its data passes all of these.
# Keywords without real content stay in the queue and are skipped, never stubbed.
quality_gate:
  min_words: 450                 # rendered prose (code blocks excluded)
  min_steps: 3
  min_errors: 2
  min_faq: 2
  min_example_rows: 3
  variant_min_notes_words: 45    # 2nd-platform page needs its own platform notes, else it would be a duplicate
